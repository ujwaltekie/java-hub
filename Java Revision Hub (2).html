 {k:'l2', g:2, no:'2', part:'Lesson 2', t:'Library Classes'},
 {k:'l3', g:2, no:'3', part:'Lesson 3', t:'Arrays (Single Dimensional and Double Dimensional)'},
 {k:'l4', g:2, no:'4', part:'Lesson 4', t:'String Handling'},
 {k:'l5', g:2, no:'5', part:'Lesson 5', t:'User-Defined Methods'},
 {k:'l6', g:2, no:'6', part:'Lesson 6', t:'Class as the Basis of All Computation (Objects and Classes)'},
 {k:'l7', g:2, no:'7', part:'Lesson 7', t:'Constructors'},
 {k:'l8', g:2, no:'8', part:'Lesson 8', t:'Encapsulation and Inheritance'},
];
const LKEY={}; LESSONS.forEach((l,i)=>{ l.i=i; LKEY[l.k]=l; });
const SECS=[{k:'mcq',label:'MCQs',noun:'Question'},{k:'tf',label:'True / False',noun:'Statement'},{k:'predict',label:'Predict output',noun:'Predict'},{k:'theory',label:'Theory',noun:'Theory'},{k:'coding',label:'Coding',noun:'Coding'}];
const SKEY={}; SECS.forEach(s=>SKEY[s.k]=s);
const LVL=['easy','medium','hard'];

const byId={}, secOf={}, byL={};
LESSONS.forEach(l=>{ byL[l.k]={mcq:[],tf:[],predict:[],theory:[],coding:[]}; });
SECS.forEach(s=>DATA[s.k].forEach(it=>{ byId[it.id]=it; secOf[it.id]=s.k; byL[it.l][s.k].push(it); }));
LESSONS.forEach(l=>{ l.total=SECS.reduce((n,s)=>n+byL[l.k][s.k].length,0); });
const TOTAL=LESSONS.reduce((n,l)=>n+l.total,0);
SECS.forEach(s=>{ s.total=DATA[s.k].length; });
// number items inside each lesson+section
LESSONS.forEach(l=>SECS.forEach(s=>byL[l.k][s.k].forEach((it,i)=>{ it.n=i+1; })));

/* ================= persisted state ================= */
const KEY='jrh_state_v1';
let st={star:{},done:{}};
try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); if(o&&o.star&&o.done) st=o; } }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
const starred=()=>Object.keys(st.star).filter(id=>byId[id]&&st.star[id]);
const lessonDone=l=>SECS.reduce((n,s)=>n+byL[l.k][s.k].filter(it=>st.done[it.id]).length,0);

/* ================= session state ================= */
const ans={};
let F={sec:'mcq',lv:'',topic:''}, cur='home', revConfirm=false;

/* ================= cards ================= */
const BADGE={imp:'<span class="chip imp">★ Frequently asked</span>',trick:'<span class="chip hard">Common mistake</span>',
  y24:'<span class="chip yr">ICSE 2024</span>',y25:'<span class="chip yr">ICSE 2025</span>',y26:'<span class="chip yr">ICSE 2026</span>',
  sp25:'<span class="chip yr">Specimen 2025</span>',sample:'<span class="chip yr">Sample paper</span>'};
const LVLCHIP={easy:'<span class="chip easy">Easy</span>',medium:'<span class="chip medium">Medium</span>',hard:'<span class="chip hard">Hard</span>'};

function body(sk,it){
  const id=it.id, num=`<div class="qnum">${SKEY[sk].noun} ${it.n}</div>`;
  if(sk==='mcq'){
    const a=ans[id], done=a!==undefined;
    const opts=it.o.map((o,i)=>{ let c='opt'; if(done){ if(i===it.c) c+=' right'; else if(i===a) c+=' wrong'; }
      return `<button type="button" class="${c}" data-act="opt" data-id="${id}" data-i="${i}"${done?' disabled':''}><span class="l">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`; }).join('');
    const fb=done?`<div class="feedback show ${a===it.c?'ok':'bad'}"><b>${a===it.c?'Correct.':'Not quite.'}</b> ${esc(it.e)}</div>`:'<div class="feedback"></div>';
    return num+`<div class="qtext">${esc(it.q)}</div>`+(it.code?cb(it.code):'')+`<div class="opts">${opts}</div>`+fb;
  }
  if(sk==='tf'){
    const a=ans[id], done=a!==undefined;
    const btn=v=>{ let c='opt'; if(done){ if(v===it.a) c+=' right'; else if(v===a) c+=' wrong'; } return `<button type="button" class="${c}" data-act="tf" data-id="${id}" data-v="${v}"${done?' disabled':''}>${v?'True':'False'}</button>`; };
    const fb=done?`<div class="feedback show ${a===it.a?'ok':'bad'}"><b>${a===it.a?'Correct.':'Not quite.'}</b> ${esc(it.e)}</div>`:'<div class="feedback"></div>';
    return num+`<div class="qtext">${esc(it.s)}</div><div class="tfrow">${btn(true)}${btn(false)}</div>`+fb;
  }
  if(sk==='predict') return num+`<div class="qtext">${esc(it.q)}</div>`+cb(it.code)+`<button type="button" class="reveal" data-act="reveal" data-id="${id}"><span>Reveal answer</span><span class="ch">&#9662;</span></button><div class="answer">${it.a}</div>`;
  if(sk==='theory') return `<button type="button" class="theory-head" data-act="theory" data-id="${id}" aria-expanded="false"><span class="tq"><span class="qnum" style="display:inline;margin-right:8px">Q${it.n}</span>${esc(it.q)}</span><span class="ch">&#9662;</span></button>${it.qc?cb(it.qc):''}<div class="answer">${it.a}</div>`;
  return num+`<div class="qtext">${it.html?it.html:esc(it.q)}</div>`+(it.sol?`<button type="button" class="reveal" data-act="reveal" data-id="${id}"><span>View solution</span><span class="ch">&#9662;</span></button><div class="answer">${cb(it.sol)}</div>`:'');
}
function card(id,showLesson){
  const it=byId[id], sk=secOf[id];
  let chips='';
  if(showLesson) chips+=`<span class="chip src">${LKEY[it.l].part} · ${SKEY[sk].label}</span>`;
  chips+=`<span class="chip topic">${escRaw(it.t)}</span>`+LVLCHIP[it.v];
  if(sk==='coding'||sk==='predict') chips+=(it.tags||[]).map(t=>BADGE[t]||'').join('');
  const dn=!!st.done[id];
  return `<article class="card${dn?' done':''}" data-id="${id}" data-lv="${it.v}" data-t="${attr(it.t)}">
    <div class="chead"><div class="chips">${chips}</div><button type="button" class="star" data-act="star" data-id="${id}" aria-pressed="${st.star[id]?'true':'false'}" aria-label="Star this question" title="Star for later">&#9733;</button></div>
    <div class="cbody">${body(sk,it)}</div>
    <div class="cfoot"><button type="button" class="donebtn" data-act="done" data-id="${id}" aria-pressed="${dn}">${dn?'✓ Done':'Mark done'}</button></div>
  </article>`;
}

/* ================= views ================= */
const flower=(n=10)=>`<svg viewBox="0 0 40 40" aria-hidden="true">${Array.from({length:n},(_,i)=>`<ellipse cx="20" cy="9.5" rx="3" ry="7" fill="${i%2?'#B9A2FF':'#8B6CF0'}" transform="rotate(${i*360/n} 20 20)"/>`).join('')}<circle cx="20" cy="20" r="3" fill="#F6A9F0"/></svg>`;
const petalsSvg=`<svg viewBox="0 0 1000 800" aria-hidden="true">${[0,60,120].map(a=>`<ellipse cx="500" cy="400" rx="170" ry="400" transform="rotate(${a} 500 400)"/>`).join('')}</svg>`;

function nextLesson(){ return LESSONS.find(l=>lessonDone(l)<l.total)||LESSONS[0]; }
function lastLesson(){ try{ const k=localStorage.getItem('jrh_last'); if(k&&LKEY[k]) return k; }catch(e){} return null; }

function renderNav(){
  const n=starred().length, last=lastLesson();
  document.getElementById('nav').innerHTML=
   `<a class="logo" href="#home" aria-label="Code Craft Club, home"><img src="${LOGO}" alt="Code Craft Club" width="42" height="42"></a>`+
   `<a href="#home" class="hide-s"${cur==='home'?' aria-current="page"':''}>Home</a>`+
   `<a href="#lessons" class="hide-s">Lessons</a>`+
   `<a href="#marked"${cur==='marked'?' aria-current="page"':''}>Starred${n?`<span class="badge">${n}</span>`:''}</a>`+
   `<button type="button" class="themebtn" data-act="theme" aria-label="Switch to ${curTheme()==='dark'?'light':'dark'} theme" title="Switch to ${curTheme()==='dark'?'light':'dark'} theme">${curTheme()==='dark'?ICON_SUN:ICON_MOON}</button>`+
   `<a class="cta" href="#${last||'r1'}">${last?'Continue':'Start'}</a>`;
}
function tileHtml(l,i){
  const d=lessonDone(l), c=SKEY;
  const parts=[`${byL[l.k].mcq.length} MCQ`,`${byL[l.k].coding.length?byL[l.k].coding.length+' coding':''}`].filter(Boolean).join(' · ');
  return `<a class="tile c${l.i%6+1}" href="#${l.k}"><span class="go" aria-hidden="true">&rarr;</span>
    <div class="no">${l.no}</div><div class="part">${l.part}</div><h4>${escRaw(l.t)}</h4>
    <div class="cnt">${l.total} questions${parts?' · '+parts:''}</div>
    <div class="prog" title="${d} of ${l.total} done"><i style="width:${Math.round(d/l.total*100)}%"></i></div></a>`;
}
function renderHome(){
  const nx=nextLesson(), nd=lessonDone(nx);
  const lvCount={}; LVL.forEach(v=>{ lvCount[v]=0; SECS.forEach(s=>DATA[s.k].forEach(it=>{ if(it.v===v) lvCount[v]++; })); });
  const maxL=Math.max(...LESSONS.map(l=>l.total));
  const player=`<div class="floatcard player"><div class="art">${nx.no}</div><div class="meta"><small>${nd?'Pick up where you left off':'Up next'}</small><b>${escRaw(nx.t)}</b><div class="pb"><i style="width:${Math.round(nd/nx.total*100)}%"></i></div></div><div class="left">${nx.total-nd} left</div></div>`;
  const g1=LESSONS.filter(l=>l.g===1), g2=LESSONS.filter(l=>l.g===2);
  document.getElementById('app').innerHTML=`
  <header class="hero"><div class="blobs"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
   <div class="wrap">
    <img class="herologo" src="${LOGO}" alt="Code Craft Club" width="104" height="104"><br><span class="eyebrow">ICSE Class X · Computer Applications</span>
    <h1>Your all-in-one<span class="pur">Java Revision</span><span class="pill">Every lesson, every <span class="outline">level</span></span></h1>
    <p class="sub">MCQs, true or false, predict the output, theory and coding sorted lesson by lesson from Class IX basics to inheritance.</p>
    <div class="btns"><a class="btn solid" href="#lessons">Start revising</a><a class="btn line" href="#marked">Starred questions</a></div>
    <div class="mobile-player">${player}</div>
   </div>
   <div class="decor wrap" style="position:absolute;left:0;right:0">
    <div class="floatcard board">${[['MCQs',DATA.mcq.length,'var(--t3)','M'],['Coding',DATA.coding.length,'var(--t1)','C'],['Theory',DATA.theory.length,'var(--t4)','T']].map(r=>`<div class="row"><span class="dot" style="background:${r[2]}">${r[3]}</span>${r[0]}<b>${r[1]}</b></div>`).join('')}</div>
    ${player}
    <div class="floatcard wave"><div class="bars">${LESSONS.map(l=>`<i style="height:${Math.round(18+l.total/maxL*82)}%"></i>`).join('')}</div><div class="knob">${LESSONS.length}</div></div>
   </div>
  </header>
  <section class="sheet" id="lessons"><div class="wrap">
    <div class="intro"><h2>Everything you need,<br><span class="hl">lesson by lesson</span></h2>
     <div><div class="bignum"><div class="faces">${[['E','var(--t3)',lvCount.easy],['M','var(--t2)',lvCount.medium],['H','var(--t6)',lvCount.hard]].map(f=>`<i style="background:${f[1]}" title="${f[2]}">${f[0]}</i>`).join('')}</div><div><b>${TOTAL.toLocaleString()}</b><span>questions across ${LESSONS.length} topics</span></div></div>
     <p class="copy">${lvCount.easy} easy, ${lvCount.medium} medium and ${lvCount.hard} hard. Start gentle, build up, and star anything that trips you. Your stars and progress stay on this device.</p></div></div>
    <div class="kinds">${SECS.map(s=>`<div class="kind"><b>${s.total}</b><span>${s.label}</span></div>`).join('')}</div>
    <div class="group"><h3>Lesson 1 <small>Revision of Class IX Syllabus</small></h3><div class="tiles">${g1.map((l,i)=>tileHtml(l,i)).join('')}</div></div>
    <div class="group"><h3>Lessons 2 – 8 <small>Class X syllabus</small></h3><div class="tiles">${g2.map((l,i)=>tileHtml(l,i+2)).join('')}</div></div>
  </div></section>`;
}

function lessonHeader(l){
  const d=lessonDone(l), pc=SECS.filter(s=>byL[l.k][s.k].length).map(s=>`<span class="pillmeta">${byL[l.k][s.k].length} ${s.label}</span>`).join('');
  return `<a class="back" href="#lessons">&larr; All lessons</a>
   <div class="lhead c${l.i%6+1}"><div class="eyebrow">${l.g===1?'Lesson 1 · Revision of Class IX · ':''}${l.part}</div><h2>${escRaw(l.t)}</h2>
   <div class="meta">${pc}</div><div class="prog"><i id="lprog" style="width:${Math.round(d/l.total*100)}%"></i></div>
   <div class="count" id="ldone" style="margin-top:8px;color:inherit;opacity:.75">${d} of ${l.total} done</div></div>
   <div id="lbody"></div>`;
}
function renderLessonBody(l){
  const pool=byL[l.k][F.sec]||[];
  const topics=[...new Set(pool.map(i=>i.t))];
  const items=pool.filter(i=>(!F.lv||i.v===F.lv)&&(!F.topic||i.t===F.topic));
  const seg=SECS.filter(s=>byL[l.k][s.k].length).map(s=>`<button type="button" role="tab" data-act="sec" data-k="${s.k}" aria-selected="${F.sec===s.k}">${s.label}<span class="n">${byL[l.k][s.k].length}</span></button>`).join('');
  const lv=`<span class="lab">Level</span><button type="button" class="fchip" data-act="lv" data-v="" aria-pressed="${!F.lv}">All</button>`+LVL.map(v=>`<button type="button" class="fchip ${v}" data-act="lv" data-v="${v}" aria-pressed="${F.lv===v}">${v[0].toUpperCase()+v.slice(1)} ${pool.filter(i=>i.v===v).length}</button>`).join('');
  const tp=topics.length>1?`<div class="filters"><span class="lab">Topic</span><div class="topics"><button type="button" class="fchip" data-act="topic" data-t="" aria-pressed="${!F.topic}">All</button>${topics.map(t=>`<button type="button" class="fchip" data-act="topic" data-t="${attr(t)}" aria-pressed="${F.topic===t}">${escRaw(t)} ${pool.filter(i=>i.t===t).length}</button>`).join('')}</div></div>`:'';
  document.getElementById('lbody').innerHTML=`<div class="seg" role="tablist">${seg}</div><div class="filters">${lv}</div>${tp}
   <div class="count">Showing ${items.length} of ${pool.length}</div>
   <div class="list">${items.length?items.map(i=>card(i.id)).join(''):'<div class="rev-empty"><b>No questions here</b>Try a different level or topic.</div>'}</div>`;
  highlightAll(document.getElementById('lbody'));
}
function renderLesson(k){
  const l=LKEY[k];
  try{ localStorage.setItem('jrh_last',k); }catch(e){}
  F={sec:SECS.find(s=>byL[k][s.k].length).k,lv:'',topic:''};
  document.getElementById('app').innerHTML=`<div class="wrap page">${lessonHeader(l)}</div>`;
  renderLessonBody(l);
}
function renderMarked(){
  const ids=starred(); let h=`<div class="wrap page"><a class="back" href="#lessons">&larr; All lessons</a><div class="lhead c4"><div class="eyebrow">Your list</div><h2>Starred questions</h2><div class="meta"><span class="pillmeta">${ids.length} starred</span></div></div>`;
  if(!ids.length) h+=`<div class="rev-empty"><b>Nothing starred yet</b>Tap the star on any question and it will collect here for last-minute revision.</div>`;
  else{
    h+=`<div class="filters" style="margin-top:18px">${revConfirm?`<span class="count" style="margin:0">Remove all ${ids.length} stars?</span><button class="ghost danger" data-act="clearyes">Yes, clear all</button><button class="ghost" data-act="clearno">Cancel</button>`:`<button class="ghost danger" data-act="clearall">Clear all stars</button>`}</div>`;
    LESSONS.forEach(l=>{ const li=ids.filter(id=>byId[id].l===l.k); if(!li.length) return;
      h+=`<div class="sec-label">${l.part}<small>${escRaw(l.t)} · ${li.length}</small></div><div class="list">`+li.sort((a,b)=>SECS.findIndex(s=>s.k===secOf[a])-SECS.findIndex(s=>s.k===secOf[b])||byId[a].n-byId[b].n).map(id=>card(id,true)).join('')+`</div>`; });
  }
  document.getElementById('app').innerHTML=h+'</div>'; highlightAll(document.getElementById('app'));
}

/* ================= routing ================= */
function route(){
  const h=(location.hash||'').replace('#','')||'home';
  revConfirm=false;
  if(LKEY[h]){ cur=h; renderLesson(h); window.scrollTo(0,0); }
  else if(h==='marked'){ cur='marked'; renderMarked(); window.scrollTo(0,0); }
  else { cur='home'; renderHome(); if(h==='lessons'){ const el=document.getElementById('lessons'); if(el) el.scrollIntoView(); } else window.scrollTo(0,0); }
  renderNav();
}
window.addEventListener('hashchange',route);

/* ================= interactions ================= */
function setDone(id,on){ if(on) st.done[id]=1; else delete st.done[id]; save(); syncDone(id); }
function syncDone(id){
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(c=>{ const d=!!st.done[id]; c.classList.toggle('done',d); const b=c.querySelector('.donebtn'); b.setAttribute('aria-pressed',d); b.textContent=d?'✓ Done':'Mark done'; });
  if(LKEY[cur]){ const l=LKEY[cur], d=lessonDone(l); const p=document.getElementById('lprog'); if(p){ p.style.width=Math.round(d/l.total*100)+'%'; document.getElementById('ldone').textContent=d+' of '+l.total+' done'; } }
}
const autoDone=id=>{ if(!st.done[id]) setDone(id,true); };
function refreshCard(id){
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(el=>{
    const t=document.createElement('div'); t.innerHTML=card(id,!!el.querySelector('.chip.src')&&cur==='marked'); const n=t.firstElementChild; el.replaceWith(n); highlightAll(n); });
}
document.addEventListener('click',ev=>{
  const cp=ev.target.closest('.copy-btn');
  if(cp){ const code=cp.closest('.codeblock').querySelector('code').textContent;
    const ok=()=>{ cp.textContent='Copied'; cp.classList.add('copied'); setTimeout(()=>{cp.textContent='Copy';cp.classList.remove('copied');},1400); };
    try{ navigator.clipboard.writeText(code).then(ok).catch(()=>{cp.textContent='Select & copy';}); }catch(e){ cp.textContent='Select & copy'; } return; }
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'theme': toggleTheme(); break;
    case 'star': if(st.star[id]) delete st.star[id]; else st.star[id]=1; save();
      document.querySelectorAll(`.star[data-id="${id}"]`).forEach(s=>s.setAttribute('aria-pressed',st.star[id]?'true':'false')); renderNav(); break;
    case 'done': setDone(id,!st.done[id]); break;
    case 'opt': ans[id]=+el.dataset.i; autoDone(id); refreshCard(id); break;
    case 'tf': ans[id]=el.dataset.v==='true'; autoDone(id); refreshCard(id); break;
    case 'reveal': { const p=el.parentElement.querySelector('.answer'), o=p.classList.toggle('open'); el.classList.toggle('open',o);
      const code=secOf[id]==='coding'; el.querySelector('span').textContent=o?(code?'Hide solution':'Hide answer'):(code?'View solution':'Reveal answer');
      if(o){ highlightAll(p); autoDone(id); } break; }
    case 'theory': { const p=el.parentElement.querySelector('.answer'), o=p.classList.toggle('open'); el.setAttribute('aria-expanded',o?'true':'false'); if(o){ highlightAll(p); autoDone(id); } break; }
    case 'sec': F.sec=el.dataset.k; F.lv=''; F.topic=''; renderLessonBody(LKEY[cur]); break;
    case 'lv': F.lv=el.dataset.v; renderLessonBody(LKEY[cur]); break;
    case 'topic': F.topic=el.dataset.t; renderLessonBody(LKEY[cur]); break;
    case 'clearall': revConfirm=true; renderMarked(); break;
    case 'clearno': revConfirm=false; renderMarked(); break;
    case 'clearyes': st.star={}; save(); revConfirm=false; renderMarked(); renderNav(); break;
  }
});
window.addEventListener('storage',ev=>{ if(ev.key!==KEY||!ev.newValue) return; try{ const o=JSON.parse(ev.newValue); if(o&&o.star&&o.done){ st=o; route(); } }catch(e){} });

route();
})();
</script>
</body>
</html>
