<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Java Revision Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;700;800;900&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9E9EC; --surface:#FFFFFF; --surface-2:#F4F4F6; --ink:#141416; --muted:#55555D; --faint:#8D8D96;
  --line:#DCDCE1; --line-strong:#C4C4CC;
  --nav:#17171A; --nav-ink:#FFFFFF; --nav-mute:#B9B9C2;
  --primary:#7FD6A6; --primary-ink:#0D2B1C; --primary-tint:#DDF4E8; --primary-deep:#1E7B50;
  --pink:#A9E7C5; --pink-ink:#0D2B1C;
  --good:#1C9A60; --good-tint:#DDF3E8; --bad:#D4443C; --bad-tint:#FBE3E1; --warn:#B7791F; --warn-tint:#FBEFD2;
  --star:#F2A81D;
  --t1:#FFD3BC; --t2:#FFF0A6; --t3:#BDEBCF; --t4:#BEE0FF; --t5:#DCCBFF; --t6:#FFC6DC;
  --petal:rgba(20,20,22,.055);
  --code-bg:#17171B; --code-head:#202026; --code-line:#2E2E36; --code-ink:#ECECF1; --code-mute:#9A9AA6;
  --tok-kw:#C9A7FF; --tok-type:#7FD6E6; --tok-str:#9BE0A8; --tok-com:#7C7C8A; --tok-fn:#FFC98B;
  --radius:28px; --shadow:0 1px 2px rgba(20,20,22,.04),0 10px 30px -12px rgba(20,20,22,.14);
  --font:"Red Hat Display",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
  --mono:"Red Hat Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0D; --surface:#17171A; --surface-2:#202024; --ink:#F3F3F6; --muted:#A8A8B1; --faint:#7C7C86;
  --line:#2A2A30; --line-strong:#3B3B44;
  --nav:#26262B; --nav-ink:#FFFFFF; --nav-mute:#B3B3BD;
  --primary:#6CCB97; --primary-ink:#06170E; --primary-tint:#173226; --primary-deep:#8FE0B2;
  --pink:#A9E7C5; --pink-ink:#0D2B1C;
  --good:#46C98B; --good-tint:#15302A; --bad:#FF7A70; --bad-tint:#3A1D1B; --warn:#E8B04A; --warn-tint:#33290F;
  --t1:#4A2D1F; --t2:#463E15; --t3:#1A3A2A; --t4:#1B3350; --t5:#33284F; --t6:#4A2338;
  --petal:rgba(255,255,255,.04);
  --code-bg:#0F0F12; --code-head:#17171B; --code-line:#26262D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --surface:#17171A; --surface-2:#202024; --ink:#F3F3F6; --muted:#A8A8B1; --faint:#7C7C86;
  --line:#2A2A30; --line-strong:#3B3B44;
  --nav:#26262B; --nav-ink:#FFFFFF; --nav-mute:#B3B3BD;
  --primary:#6CCB97; --primary-ink:#06170E; --primary-tint:#173226; --primary-deep:#8FE0B2;
  --pink:#A9E7C5; --pink-ink:#0D2B1C;
  --good:#46C98B; --good-tint:#15302A; --bad:#FF7A70; --bad-tint:#3A1D1B; --warn:#E8B04A; --warn-tint:#33290F;
  --t1:#4A2D1F; --t2:#463E15; --t3:#1A3A2A; --t4:#1B3350; --t5:#33284F; --t6:#4A2338;
  --petal:rgba(255,255,255,.04);
  --code-bg:#0F0F12; --code-head:#17171B; --code-line:#26262D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font-family:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:10px}

/* ---------- floating pill nav ---------- */
.navwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:50;display:flex;justify-content:center;padding-top:12px;pointer-events:none}
.nav{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--nav);color:var(--nav-ink);border-radius:999px;padding:8px 8px 8px 14px;box-shadow:0 14px 34px -14px rgba(0,0,0,.55);max-width:100%}
.nav .logo{display:flex;align-items:center;margin-right:8px;background:none;border:0;padding:0}
.nav .logo img{width:42px;height:42px;border-radius:14px;display:block}
.herologo{width:104px;height:104px;border-radius:28px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5);margin-bottom:6px}
.nav a,.nav .navlink{color:var(--nav-mute);text-decoration:none;font-weight:500;font-size:14.5px;padding:8px 12px;border-radius:999px;background:none;border:0;white-space:nowrap}
.nav a:hover,.nav .navlink:hover,.nav a[aria-current="page"]{color:var(--nav-ink);background:rgba(255,255,255,.1)}
.nav .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--star);color:#1c1300;font-size:11.5px;font-weight:800;margin-left:6px;vertical-align:1px}
.themebtn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--nav-ink);margin:0 4px 0 2px;padding:0;transition:background .15s}
.themebtn:hover{background:rgba(255,255,255,.2)}
.cta{background:var(--pink);color:var(--pink-ink);border:0;border-radius:999px;font-weight:800;font-size:14.5px;padding:12px 20px;text-decoration:none;white-space:nowrap;transition:transform .15s}
.cta:hover{transform:scale(1.04)}
.nav a.cta{background:var(--pink);color:var(--pink-ink);font-weight:800;padding:12px 20px}
.nav a.cta:hover{background:var(--pink);color:var(--pink-ink)}

/* ---------- hero ---------- */
.hero{position:relative;z-index:2;text-align:center;padding:clamp(54px,9vw,110px) 0 clamp(130px,16vw,190px);isolation:isolate}
.blobs{position:absolute;inset:-60px 0 0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.blobs .b1{width:520px;height:520px;left:-120px;top:20px;background:radial-gradient(circle at 40% 40%,#BFEBD0,transparent 70%)}
.blobs .b2{width:560px;height:560px;right:-140px;top:-40px;background:radial-gradient(circle at 50% 50%,#BEE0FF,transparent 70%)}
.blobs .b3{width:480px;height:480px;left:34%;top:300px;background:radial-gradient(circle at 50% 50%,#FFE2C8,transparent 70%);opacity:.5}
:root[data-theme="dark"] .blobs i{opacity:.22}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .blobs i{opacity:.22}}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.hero h1{font-weight:900;font-size:clamp(40px,8.2vw,104px);line-height:.98;letter-spacing:-.035em}
.hero h1 .pur{color:var(--primary-deep);display:block}
.hero h1 .pill{display:inline-block;margin-top:.12em;background:var(--nav);color:var(--nav-ink);border-radius:.26em;padding:.02em .24em .1em;font-size:.84em}
.hero h1 .outline{color:transparent;-webkit-text-stroke:.03em var(--nav-ink);font-weight:800}
.hero .sub{max-width:560px;margin:26px auto 0;font-size:clamp(16px,2vw,19px);font-weight:300;color:var(--ink);line-height:1.6}
.hero .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:800;font-size:15px;padding:15px 30px;text-decoration:none;border:2px solid transparent;transition:transform .15s,background .15s}
.btn.solid{background:var(--primary);color:var(--primary-ink)}
.btn.solid:hover{transform:scale(1.04)}
.btn.line{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--bg)}
.decor{position:absolute;inset:auto 0 clamp(18px,3vw,36px);display:none;pointer-events:none}
.floatcard{position:absolute;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);text-align:left}
.board{left:2%;bottom:0;width:330px;transform:rotate(-8deg);padding:14px;display:grid;gap:8px}
.board .row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:999px;padding:7px 12px 7px 8px;font-weight:700;font-size:14px}
.board .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:#1b1b1f}
.board .row b{margin-left:auto;background:var(--surface);border-radius:999px;padding:2px 10px;font-size:13px}
.player{left:50%;bottom:-6px;transform:translateX(-50%);width:min(430px,44vw);background:var(--nav);color:var(--nav-ink);padding:16px 20px;border-radius:30px;display:flex;gap:14px;align-items:center}
.player .art{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--pink));display:grid;place-items:center;font-weight:900;font-size:19px;color:#1a1030;flex:0 0 auto}
.player .meta{flex:1;min-width:0}
.player b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player small{color:var(--nav-mute);font-size:13px}
.player .pb{height:5px;border-radius:5px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}
.player .pb i{display:block;height:100%;background:var(--pink);border-radius:5px}
.player .left{font-size:14px;color:var(--nav-mute);font-variant-numeric:tabular-nums}
.wave{right:2%;bottom:6px;width:310px;height:150px;transform:rotate(14deg);padding:18px;display:flex;align-items:center;gap:18px}
.wave .bars{flex:1;display:flex;align-items:center;gap:3px;height:70px}
.wave .bars i{flex:1;background:var(--primary);border-radius:3px;min-width:3px}
.wave .knob{width:58px;height:58px;border-radius:50%;background:var(--primary);display:grid;place-items:center;color:var(--primary-ink);font-weight:900;flex:0 0 auto}
@media(min-width:1000px){.decor{display:block;height:0}}
.mobile-player{display:block;margin:34px auto 0;max-width:430px;position:relative}
.mobile-player .player{position:static;transform:none;width:100%}
@media(min-width:1000px){.mobile-player{display:none}}

/* ---------- white sheet ---------- */
.sheet{z-index:1;background:var(--surface);border-radius:56px 56px 0 0;margin-top:-72px;padding-top:clamp(40px,6vw,80px);padding-bottom:80px;position:relative;box-shadow:0 -20px 60px -40px rgba(0,0,0,.25)}
.intro{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:end}
.intro h2{font-weight:900;font-size:clamp(34px,5.4vw,66px);line-height:1;letter-spacing:-.03em}
.intro h2 .hl{display:inline-block;background:var(--primary);color:var(--primary-ink);padding:.02em .22em .08em;transform:rotate(-1.6deg);border:2px dashed rgba(13,43,28,.35);outline:3px solid var(--primary);margin-top:.12em}
.intro .copy{color:var(--muted);font-size:17px;font-weight:300;line-height:1.7}
.bignum{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.bignum b{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1}
.bignum span{display:block;font-size:13px;color:var(--muted);font-weight:500}
.faces{display:flex}.faces i{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);margin-left:-10px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px;color:#1b1b1f}
.faces i:first-child{margin-left:0}
@media(max-width:820px){.intro{grid-template-columns:1fr}}
.kinds{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.kind{background:var(--surface-2);border-radius:20px;padding:14px 20px;min-width:130px;flex:1}
.kind b{display:block;font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.kind span{font-size:13px;color:var(--muted);font-weight:500}

.group{margin-top:clamp(40px,6vw,70px)}
.group h3{font-size:clamp(22px,3vw,30px);font-weight:900;letter-spacing:-.02em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.group h3 small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.tile{position:relative;text-align:left;border:0;border-radius:32px;padding:22px 22px 20px;min-height:220px;display:flex;flex-direction:column;gap:6px;color:var(--ink);text-decoration:none;transition:transform .2s,box-shadow .2s;overflow:hidden}
.tile:hover{transform:translateY(-4px) scale(1.012);box-shadow:var(--shadow)}
.tile .no{font-size:54px;font-weight:900;letter-spacing:-.04em;line-height:1;opacity:.9}
.tile .part{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.tile h4{font-size:19px;font-weight:800;line-height:1.2;letter-spacing:-.01em;margin-top:auto}
.tile .cnt{font-size:13px;font-weight:500;opacity:.75}
.tile .prog{height:6px;border-radius:6px;background:rgba(20,20,22,.12);overflow:hidden;margin-top:8px}
:root[data-theme="dark"] .tile .prog{background:rgba(255,255,255,.14)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile .prog{background:rgba(255,255,255,.14)}}
.tile .prog i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .4s}
.tile .go{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:17px;font-weight:800}
.c1{background:var(--t1)}.c2{background:var(--t2)}.c3{background:var(--t3)}.c4{background:var(--t4)}.c5{background:var(--t5)}.c6{background:var(--t6)}

/* ---------- lesson page ---------- */
.page{padding:28px 0 90px}
.back{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink)}
.back:hover{border-color:var(--ink)}
.lhead{border-radius:40px;padding:clamp(22px,4vw,44px);margin-top:18px;position:relative;overflow:hidden}
.lhead .eyebrow{margin:0 0 10px;opacity:.7;color:var(--ink)}
.lhead h2{font-size:clamp(30px,5.4vw,60px);font-weight:900;line-height:1.02;letter-spacing:-.03em;max-width:880px}
.lhead .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.lhead .pillmeta{background:rgba(255,255,255,.7);color:#141416;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px}
:root[data-theme="dark"] .lhead .pillmeta{background:rgba(255,255,255,.12);color:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lhead .pillmeta{background:rgba(255,255,255,.12);color:var(--ink)}}
.lhead .prog{height:8px;border-radius:8px;background:rgba(20,20,22,.12);margin-top:20px;max-width:420px;overflow:hidden}
:root[data-theme="dark"] .lhead .prog{background:rgba(255,255,255,.14)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lhead .prog{background:rgba(255,255,255,.14)}}
.lhead .prog i{display:block;height:100%;background:var(--ink);border-radius:8px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px;background:var(--surface);border-radius:999px;margin-top:20px;width:max-content;max-width:100%;box-shadow:var(--shadow)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:0;background:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14.5px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--nav);color:var(--nav-ink)}
.seg .n{margin-left:7px;font-size:12.5px;opacity:.7;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.filters .lab{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.fchip{white-space:nowrap;flex:0 0 auto;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.fchip:hover{border-color:var(--ink);color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fchip.easy[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.fchip.medium[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.fchip.hard[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.topics{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.count{font-size:13px;color:var(--faint);font-weight:500;margin-top:14px}

/* ---------- cards ---------- */
.list{display:grid;gap:14px;margin-top:10px}
.card{background:var(--surface);border-radius:var(--radius);padding:22px 22px 18px;box-shadow:var(--shadow);min-width:0;border:2px solid transparent;transition:border-color .2s}
.card.done{border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted);letter-spacing:.01em}
.chip.topic{background:var(--primary-tint);color:var(--primary-deep)}
.chip.easy{background:var(--good-tint);color:var(--good)}.chip.medium{background:var(--warn-tint);color:var(--warn)}.chip.hard{background:var(--bad-tint);color:var(--bad)}
.chip.imp{background:var(--nav);color:var(--nav-ink)}
.chip.yr{background:transparent;border:1px solid var(--line-strong)}
.chip.src{border:1px solid var(--line-strong);background:transparent}
.star{flex:0 0 auto;border:0;background:var(--surface-2);width:38px;height:38px;border-radius:50%;font-size:19px;line-height:1;color:var(--line-strong);transition:transform .15s,color .15s,background .15s}
.star:hover{transform:scale(1.1);color:var(--star)}
.star[aria-pressed="true"]{background:var(--warn-tint);color:var(--star)}
.cbody{margin-top:12px;min-width:0}
.qnum{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.qtext{font-size:17.5px;font-weight:700;line-height:1.5;letter-spacing:-.005em;overflow-wrap:anywhere;margin-bottom:14px}
.qtext p{margin:0 0 10px}.qtext p:last-child{margin:0}
.qtext p,.qtext li,.qtext td,.qtext th{font-weight:400;font-size:16px}
.qtext b{font-weight:800}
.qtext ul,.qtext ol{margin:0 0 10px;padding-left:22px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface-2);font-size:15.5px;font-weight:500;width:100%;transition:border-color .15s,background .15s;min-width:0}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt .l{flex:0 0 26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--line-strong);font-size:12px;font-weight:800;display:grid;place-items:center;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--primary)}
.opt.right{background:var(--good-tint);border-color:var(--good)}.opt.right .l{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad-tint);border-color:var(--bad)}.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.tfrow{display:flex;gap:10px}.tfrow .opt{justify-content:center;font-weight:800;font-size:16px}
.feedback{margin-top:12px;padding:13px 16px;border-radius:18px;font-size:15px;display:none}
.feedback.show{display:block}.feedback.ok{background:var(--good-tint)}.feedback.bad{background:var(--bad-tint)}
.reveal{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--primary);color:var(--primary-ink);font-weight:800;font-size:14.5px;border-radius:999px;padding:10px 20px}
.reveal:hover{filter:brightness(1.08)}
.reveal .ch{transition:transform .2s;font-size:12px}.reveal.open .ch{transform:rotate(180deg)}
.answer{display:none;margin-top:14px;padding:16px 18px;border-radius:22px;background:var(--surface-2);font-size:15.5px;line-height:1.65}
.answer.open{display:block}
.answer p{margin:0 0 10px}.answer p:last-child{margin-bottom:0}
.answer ul,.answer ol{margin:0 0 10px;padding-left:22px}.answer li{margin-bottom:4px}
.answer b{font-weight:800}
.answer .codeblock:first-child{margin-top:0}
.theory-head{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:0;font-size:17.5px;font-weight:700;line-height:1.5;letter-spacing:-.005em}
.theory-head .tq{flex:1;min-width:0;overflow-wrap:anywhere}
.theory-head .ch{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;transition:transform .2s}
.theory-head[aria-expanded="true"] .ch{transform:rotate(180deg);background:var(--primary);color:var(--primary-ink)}
.cfoot{display:flex;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.donebtn{border:1.5px solid var(--line-strong);background:none;color:var(--muted);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.donebtn:hover{border-color:var(--good);color:var(--good)}
.donebtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}

/* ---------- content helpers ---------- */
code.inline{font-family:var(--mono);font-size:.86em;background:var(--primary-tint);color:var(--primary-deep);padding:1px 7px;border-radius:7px;font-weight:500}
.codeblock{background:var(--code-bg);color:var(--code-ink);border-radius:20px;overflow:hidden;margin:12px 0}
.cb-head{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--code-head);border-bottom:1px solid var(--code-line);font-size:11.5px;letter-spacing:.1em;font-weight:700;color:var(--code-mute)}
.cb-lang{letter-spacing:.1em;text-transform:uppercase}
.copy-btn{background:transparent;border:1px solid var(--code-line);color:var(--code-mute);border-radius:999px;padding:3px 12px;font-size:11.5px;font-weight:700}
.copy-btn:hover{color:var(--code-ink);border-color:var(--code-mute)}.copy-btn.copied{color:var(--tok-str);border-color:var(--tok-str)}
.codeblock pre{margin:0;padding:14px 18px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.7;white-space:pre;font-weight:400}
.codeblock pre code{font-family:var(--mono)}
.tok-kw{color:var(--tok-kw);font-weight:500}.tok-type{color:var(--tok-type)}.tok-str{color:var(--tok-str)}.tok-com{color:var(--tok-com);font-style:italic}.tok-fn{color:var(--tok-fn)}
.sample{font-family:var(--mono);font-size:13px;font-weight:400;white-space:pre-wrap;background:var(--surface-2);border:1.5px dashed var(--line-strong);border-radius:16px;padding:12px 16px;margin:8px 0;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto;margin:10px 0 14px;border-radius:16px;border:1px solid var(--line)}
table.ref{border-collapse:collapse;width:100%;font-size:14.5px;font-weight:400}
table.ref th{background:var(--primary-tint);color:var(--primary-deep);text-align:left;padding:9px 14px;font-weight:800;white-space:nowrap}
table.ref td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
.rev-empty{background:var(--surface);border:2px dashed var(--line-strong);border-radius:var(--radius);padding:44px 24px;text-align:center;color:var(--muted);margin-top:20px}
.rev-empty b{display:block;color:var(--ink);font-size:22px;font-weight:900;margin-bottom:6px}
.sec-label{display:flex;align-items:center;gap:12px;margin:34px 0 4px;font-size:20px;font-weight:900;letter-spacing:-.02em}
.sec-label::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.sec-label small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.ghost{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13.5px;color:var(--muted)}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
footer{text-align:center;color:var(--faint);font-size:13px;padding:30px 0 50px;font-weight:500}
.sheet+footer{background:var(--surface);margin-top:-1px}
@media(max-width:640px){
  .nav a.hide-s{display:none}
  .tfrow{flex-direction:column}
  .card{padding:18px 16px 14px;border-radius:24px}
  .qtext,.theory-head{font-size:16.5px}
  .tile{min-height:190px}
  .sheet{border-radius:36px 36px 0 0;margin-top:-56px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const DATA={"mcq":[{"id":"m17hsuvy","l":"r1","t":"OOP principles","v":"easy","q":"Which of the following is NOT a principle of Object Oriented Programming?","o":["Abstraction","Encapsulation","Compilation","Polymorphism"],"c":2,"e":"The principles of OOP are abstraction, encapsulation, inheritance and polymorphism. Compilation is a translation step, not an OOP principle."},{"id":"mfglnjc","l":"r1","t":"Object","v":"easy","q":"In OOP, a real-world entity that has state (attributes) and behaviour (actions) is represented by a(n)","o":["method","object","package","operator"],"c":1,"e":"An object models a real-world entity; its attributes form its state and its methods form its behaviour."},{"id":"m1f22bs6","l":"r1","t":"Encapsulation","v":"easy","q":"Wrapping up of data and the methods that work on that data into a single unit is called","o":["Inheritance","Polymorphism","Encapsulation","Compilation"],"c":2,"e":"Encapsulation binds data and methods together in a class and controls access to the data."},{"id":"m1bldpq3","l":"r1","t":"Abstraction","v":"easy","q":"Showing only the essential features and hiding the background details is known as","o":["Abstraction","Inheritance","Overloading","Message passing"],"c":0,"e":"Abstraction exposes what an object does and hides how it does it."},{"id":"m5wj5w7","l":"r1","t":"Procedural vs OOP","v":"easy","q":"Procedural programming languages such as C and Pascal give more importance to","o":["data","objects","procedures (functions)","classes"],"c":2,"e":"Procedural languages are organised around procedures/functions; OOP is organised around objects (data)."},{"id":"msurp61","l":"r1","t":"Real-life examples","v":"easy","q":"The act of a class 'Vehicle' passing its general properties to 'Bus' and 'Car' is an example of","o":["encapsulation","inheritance","abstraction","data hiding"],"c":1,"e":"Bus and Car acquire the properties of Vehicle, which is inheritance."},{"id":"m1en3vhb","l":"r1","t":"Data hiding","v":"medium","q":"Data hiding in OOP means that","o":["data is deleted after use","data is stored in a file","data of a class cannot be accessed directly from outside the class","data is converted into bytecode"],"c":2,"e":"Data hiding restricts direct access to data; it is reached only through the methods of the class."},{"id":"mdfjkfo","l":"r1","t":"Inheritance","v":"medium","q":"The main advantage of inheritance is","o":["faster compilation","reusability of existing code","less memory for the screen","removal of all methods"],"c":1,"e":"A new class can reuse (and extend) the code of an existing class instead of rewriting it."},{"id":"m9qjiz0","l":"r1","t":"Polymorphism","v":"medium","q":"The word 'polymorphism' literally means","o":["single form","many forms","hidden form","inherited form"],"c":1,"e":"Poly = many, morph = form. One name or interface can take many forms."},{"id":"m1u0wynd","l":"r1","t":"Message passing","v":"medium","q":"In OOP, an object requests another object to perform an action by","o":["inheritance","message passing (calling its method)","compiling it","deleting it"],"c":1,"e":"Objects communicate by sending messages, i.e. by invoking each other's methods."},{"id":"m1ghdn25","l":"r1","t":"Is-a relationship","v":"medium","q":"Which pair shows an 'is-a' relationship suitable for inheritance?","o":["Bus is a Vehicle","Library has Books","Pen has Ink","Student has Marks"],"c":0,"e":"Bus is a kind of Vehicle (is-a). The other pairs show 'has-a' (containment)."},{"id":"m8cjpu0","l":"r1","t":"Data security","v":"medium","q":"Assertion (A): Data in an OOP program is more secure than in a procedural program.\nReason (R): Data hiding does not allow outside functions to access the data of an object directly.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"Procedural data is often global and open to all functions; OOP hides it inside objects, which is why it is safer. R explains A."},{"id":"mxr7gby","l":"r1","t":"Abstraction vs encapsulation","v":"hard","q":"Assertion (A): Abstraction and encapsulation are exactly the same concept.\nReason (R): Abstraction concentrates on the essential features of an object, whereas encapsulation binds data and methods and controls access to them.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":3,"e":"R is true and shows that they differ, so A is false."},{"id":"mm6epbf","l":"r1","t":"Advantages of OOP","v":"hard","q":"Which of the following is NOT an advantage of OOP?","o":["Reusability of code through inheritance","Easier maintenance and modification","A program is always faster than a procedural program","Better data security through data hiding"],"c":2,"e":"OOP gives reusability, security, and easy maintenance but does not guarantee greater execution speed."},{"id":"ms5zjfg","l":"r2","t":"Class","v":"easy","q":"A class in Java is best described as","o":["a physical entity in memory","a blueprint or template for creating objects","a single variable","a type of operator"],"c":1,"e":"A class defines the data members and member methods; objects are created from it."},{"id":"m1b0y09i","l":"r2","t":"new operator","v":"easy","q":"Which keyword is used to create an object of a class?","o":["create","make","new","object"],"c":2,"e":"new allocates memory for the object and calls its constructor."},{"id":"m14hd89g","l":"r2","t":"Data members","v":"easy","q":"The variables declared inside a class to store the state of an object are called","o":["member methods","data members (attributes)","packages","comments"],"c":1,"e":"Data members (instance variables) hold the state of the object."},{"id":"m1vycr8z","l":"r2","t":"Member methods","v":"easy","q":"The functions declared in a class that define the behaviour of its objects are called","o":["data members","tokens","member methods","literals"],"c":2,"e":"Methods such as deposit() or start() are the behaviour of an object."},{"id":"m1is0sv5","l":"r2","t":"Reference variable","v":"easy","q":"In the statement below, s1 is a","o":["class","reference variable that holds the address of the object","keyword","method"],"c":1,"e":"s1 is a reference variable; the object itself is created on the heap by new.","code":"Student s1 = new Student();"},{"id":"m1djj4wk","l":"r2","t":"Characteristics of an object","v":"easy","q":"Which of the following is NOT a characteristic of an object?","o":["State","Behaviour","Identity","Compilation"],"c":3,"e":"The three characteristics are state, behaviour and identity."},{"id":"m1weghfm","l":"r2","t":"NullPointerException","v":"medium","q":"What happens when the following code is executed (Car has a method start())?","o":["it prints nothing","a NullPointerException is thrown at run time","a compile-time error","it creates a new Car automatically"],"c":1,"e":"c refers to no object (null), so calling start() on it throws NullPointerException. The code compiles.","code":"Car c = null;\nc.start();"},{"id":"m19sxqfe","l":"r2","t":"Memory allocation","v":"medium","q":"Memory for the instance variables of an object is allocated when","o":["the class is written","the class is compiled","the new operator is executed","the program is saved"],"c":2,"e":"A class declaration allocates no memory for objects; new does."},{"id":"m171o0qj","l":"r2","t":"Behaviour","v":"medium","q":"Which of the following represents the behaviour of an Account object?","o":["accNo","balance","deposit()","holderName"],"c":2,"e":"deposit() is an action (method); the others are attributes."},{"id":"mv4e6u3","l":"r2","t":"Separate copies","v":"medium","q":"If s1 and s2 are two objects of class Student created with new, then","o":["they share one copy of every instance variable","each has its own copy of the instance variables","s2 cannot have values different from s1","only one object exists"],"c":1,"e":"Every object owns its separate copy of the instance variables."},{"id":"m11ckg3k","l":"r2","t":"Declaration vs creation","v":"medium","q":"Assertion (A): The statement 'Car c;' does not create an object.\nReason (R): An object is created only when the new operator allocates memory for it.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"'Car c;' only declares a reference variable (null/unassigned). new creates the object, so R explains A."},{"id":"ma2usvq","l":"r2","t":"Objects and references","v":"hard","q":"How many objects are created by the statements below?","o":["0","1","2","3"],"c":1,"e":"new executes once, so one object exists; c1 and c2 both refer to it.","code":"Car c1 = new Car();\nCar c2 = c1;"},{"id":"m1duymv1","l":"r2","t":"Default values","v":"hard","q":"Instance variables of type int, boolean and String (not initialised) hold the default values","o":["0, true, \"\"","0, false, null","1, false, null","null, null, null"],"c":1,"e":"Defaults: int is 0, boolean is false and any object/String reference is null."},{"id":"m9l6982","l":"r2","t":"BlueJ","v":"hard","q":"In BlueJ, objects created from a class are shown","o":["in the class diagram as rectangles","as red boxes on the Object Bench","in the Terminal Window only","inside the editor as comments"],"c":1,"e":"BlueJ shows classes in the project window and the objects you create on the Object Bench."},{"id":"mld3mfd","l":"r5a","t":"Bytecode","v":"easy","q":"The Java compiler (javac) translates the source code into","o":["machine code of the computer","bytecode","assembly language","a .java file"],"c":1,"e":"javac produces platform-independent bytecode stored in a .class file."},{"id":"mzpyvvu","l":"r5a","t":"Source file","v":"easy","q":"A Java source file is saved with the extension","o":[".class",".exe",".java",".jvm"],"c":2,"e":"Source code is saved as .java; the compiler creates a .class file."},{"id":"m2z6p8q","l":"r5a","t":"Keywords","v":"easy","q":"Which of the following is a Java keyword?","o":["main","static","System","String"],"c":1,"e":"static is a reserved word. main is a method name; System and String are class names."},{"id":"m3o2ouf","l":"r5a","t":"Tokens","v":"easy","q":"The smallest individual unit of a Java program, which the compiler recognises, is called a","o":["statement","token","block","package"],"c":1,"e":"Tokens are keywords, identifiers, literals, operators and separators."},{"id":"m1sabjdt","l":"r5a","t":"Platform independence","v":"easy","q":"Java is said to be platform independent because","o":["it runs only on Windows","bytecode can run on any machine that has a JVM","it does not need a compiler","it has no keywords"],"c":1,"e":"The same bytecode runs on any platform having a suitable JVM: 'write once, run anywhere'."},{"id":"mksrgzc","l":"r5a","t":"Identifiers","v":"easy","q":"Which of the following is a valid Java identifier?","o":["2marks","total_marks","class","my-var"],"c":1,"e":"An identifier cannot start with a digit, be a keyword, or contain '-'."},{"id":"m14z3uvi","l":"r5a","t":"JVM","v":"medium","q":"JVM stands for","o":["Java Visual Machine","Java Virtual Machine","Java Variable Method","Joint Virtual Memory"],"c":1,"e":"The Java Virtual Machine executes (interprets) the bytecode."},{"id":"m14mwr8j","l":"r5a","t":"Types of errors","v":"medium","q":"A program compiles and runs but gives wrong results because + was typed instead of *. This is a","o":["syntax error","runtime error","logical error","none of these"],"c":2,"e":"Wrong logic with no compiler or run-time failure is a logical error."},{"id":"mznm0qb","l":"r5a","t":"Separators","v":"medium","q":"Which of the following is a separator (punctuator) in Java?","o":["+",";","int","\"abc\""],"c":1,"e":"Separators include ; , ( ) { } [ ]. + is an operator, int a keyword, \"abc\" a literal."},{"id":"m16e73u8","l":"r5a","t":"Invalid identifier","v":"medium","q":"Why is the following statement invalid?","o":["A variable cannot be of type int","An identifier cannot begin with a digit","= cannot be used for assignment","5 is not a valid literal"],"c":1,"e":"2x starts with a digit, so it is not a valid identifier; the compiler reports an error.","code":"int 2x = 5;"},{"id":"m7xa7sa","l":"r5a","t":"Platform independence","v":"medium","q":"Assertion (A): Java is a platform independent language.\nReason (R): The Java compiler produces bytecode that can be executed on any machine having a JVM.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"Bytecode is not tied to any hardware, so R explains A."},{"id":"m11fmjuq","l":"r5a","t":"Compiler and interpreter","v":"hard","q":"Which statement about the execution of a Java program is correct?","o":["It is only compiled, never interpreted","It is compiled to bytecode, and the bytecode is interpreted by the JVM","It is only interpreted from the .java file","It is translated directly into machine code by the editor"],"c":1,"e":"Java uses both: javac compiles to bytecode and the JVM interprets/executes it."},{"id":"m1kahlvn","l":"r5a","t":"Integer division","v":"hard","q":"What are the values of p and q after execution?","o":["p = 2.5, q = 2.5","p = 2, q = 2.5","p = 2, q = 2","p = 3, q = 2.5"],"c":1,"e":"5/2 is integer division, giving 2 for int p. 5/2.0 is a floating-point division, giving 2.5.","code":"int p = 5 / 2;\ndouble q = 5 / 2.0;"},{"id":"mdri60y","l":"r5a","t":"JDK and JRE","v":"hard","q":"Which statement is correct?","o":["JRE contains the compiler javac but no JVM","JDK contains the JRE together with development tools such as javac","JVM contains the JDK","JDK is needed only to run bytecode"],"c":1,"e":"JDK = JRE + development tools (javac, etc.); JRE = JVM + class libraries needed to run programs."},{"id":"m1volwz4","l":"l8","t":"Encapsulation","v":"easy","q":"Encapsulation is the process of","o":["creating a subclass from a class","binding data and methods together and restricting access to the data","using one method name for many tasks","converting bytecode to machine code"],"c":1,"e":"Encapsulation combines data and the methods that use it in one unit (class) and controls access using access specifiers."},{"id":"m1dwjat7","l":"l8","t":"Access specifiers","v":"easy","q":"Which access specifier is the most restrictive?","o":["public","protected","default","private"],"c":3,"e":"private members are accessible only within the class in which they are declared."},{"id":"my6qiru","l":"l8","t":"extends","v":"easy","q":"Which keyword is used to derive a class from an existing class?","o":["implements","extends","inherits","super"],"c":1,"e":"class B extends A makes B a subclass of A."},{"id":"m1axb27b","l":"l8","t":"Terminology","v":"easy","q":"The class whose members are inherited is called the","o":["subclass","derived class","superclass (base class)","child class"],"c":2,"e":"The inherited-from class is the superclass/base/parent; the inheriting class is the subclass/derived/child."},{"id":"mu5o5n8","l":"l8","t":"Default access","v":"easy","q":"If no access specifier is written for a member, its access is","o":["private","public","protected","default (package) access"],"c":3,"e":"No specifier means default access: visible within the same package."},{"id":"myrgif","l":"l8","t":"super keyword","v":"easy","q":"The keyword used to refer to the immediate superclass of a class is","o":["this","super","parent","base"],"c":1,"e":"super refers to the immediate superclass; this refers to the current object."},{"id":"muk2md3","l":"l8","t":"Multiple inheritance","v":"easy","q":"Which type of inheritance is NOT supported through classes in Java?","o":["Single","Multilevel","Hierarchical","Multiple"],"c":3,"e":"A class cannot extend two classes (ambiguity problem). Multiple inheritance is possible only through interfaces."},{"id":"mfqb9u","l":"l8","t":"Object class","v":"easy","q":"The class that is the ultimate superclass of all Java classes is","o":["System","Main","Object","Class"],"c":2,"e":"Every class implicitly extends java.lang.Object unless it extends another class (and then Object is an indirect superclass)."},{"id":"m174toqo","l":"l8","t":"final class","v":"easy","q":"A class declared with the keyword final","o":["cannot be instantiated","cannot be inherited","cannot have methods","cannot have variables"],"c":1,"e":"A final class cannot be extended. Its objects can still be created."},{"id":"m1c0mzsd","l":"l8","t":"is-a","v":"easy","q":"The relationship 'Dog is an Animal' is an example of","o":["has-a relationship","is-a relationship (inheritance)","overloading","encapsulation"],"c":1,"e":"Inheritance models an is-a relationship, so Dog extends Animal."},{"id":"mdxtlpq","l":"l8","t":"Scope of variables","v":"easy","q":"A variable declared inside a method (local variable) can be used","o":["by all classes of the package","by all methods of the class","only inside that method (block) in which it is declared","by the subclasses only"],"c":2,"e":"A local variable's scope is limited to the block/method in which it is declared."},{"id":"m2vi3of","l":"l8","t":"Overriding","v":"easy","q":"A method in a subclass having the same name, parameters and return type as a method in its superclass is said to","o":["overload that method","override that method","hide the class","encapsulate that method"],"c":1,"e":"Same signature in superclass and subclass is method overriding."},{"id":"m1in680","l":"l8","t":"protected","v":"medium","q":"A protected member can be accessed","o":["only in its own class","in its own package and in subclasses (even in other packages)","only in other packages","only by the Object class"],"c":1,"e":"protected = package access plus access in subclasses outside the package."},{"id":"m1e6wheu","l":"l8","t":"Constructor order","v":"medium","q":"When an object of a subclass is created, the order in which constructors execute is","o":["subclass constructor first, then superclass","superclass constructor first, then subclass","only the subclass constructor","order is random"],"c":1,"e":"The superclass part must be initialised first, so the superclass constructor executes before the subclass constructor."},{"id":"mbns7p","l":"l8","t":"super(...)","v":"medium","q":"A call to the superclass constructor using super(...) must be","o":["the last statement of the constructor","the first statement of the constructor","placed inside a method","placed outside the class"],"c":1,"e":"super(...) must be the first statement of a subclass constructor; otherwise a compile-time error occurs."},{"id":"mcc4yy0","l":"l8","t":"Multilevel inheritance","v":"medium","q":"Class B extends A and class C extends B. This is","o":["single inheritance","multilevel inheritance","hierarchical inheritance","multiple inheritance"],"c":1,"e":"A chain A to B to C is multilevel inheritance."},{"id":"mujgp9p","l":"l8","t":"Hierarchical inheritance","v":"medium","q":"When two or more classes (Car, Bus, Truck) inherit from one superclass (Vehicle), it is","o":["multilevel inheritance","multiple inheritance","hierarchical inheritance","single inheritance"],"c":2,"e":"One superclass with several subclasses is hierarchical inheritance."},{"id":"m72qgya","l":"l8","t":"Private members","v":"medium","q":"A private data member of a superclass","o":["can be directly used in the subclass","cannot be accessed directly in the subclass, but can be used via public/protected methods of the superclass","is deleted in the subclass","becomes public in the subclass"],"c":1,"e":"Private members are not accessible by name in the subclass; they can be reached using non-private methods (e.g. getters)."},{"id":"mhjiu21","l":"l8","t":"Data hiding","v":"medium","q":"Assertion (A): Data members are generally declared private to achieve data hiding.\nReason (R): A private member can be accessed only by the methods of the class in which it is declared.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"Private restricts access to the class itself, which is exactly how data hiding is obtained."},{"id":"mpd23ws","l":"l8","t":"final method","v":"medium","q":"What happens when the code below is compiled?","o":["It compiles and runs","Compile-time error because a final method cannot be overridden","Runtime exception","A warning only"],"c":1,"e":"javac reports: f() in B cannot override f() in A; overridden method is final.","code":"class A { final void f() { } }\nclass B extends A { void f() { } }"},{"id":"m1expx65","l":"l8","t":"private access","v":"medium","q":"What happens when the code below is compiled?","o":["Prints 1","Compile-time error: x has private access in A","Prints 0","Runtime error"],"c":1,"e":"private member x of A is not accessible in subclass B by name.","code":"class A { private int x = 1; }\nclass B extends A {\n    void s() { System.out.println(x); }\n}"},{"id":"mf23dtq","l":"l8","t":"Constructor not defined","v":"medium","q":"What happens when the code below is compiled?","o":["Prints B","Compile-time error: constructor A in class A cannot be applied to given types","Runtime error","Prints nothing"],"c":1,"e":"B() implicitly calls super(), but A has no no-argument constructor. B must call super(int) explicitly.","code":"class A { A(int x) { } }\nclass B extends A {\n    B() { System.out.println(\"B\"); }\n}"},{"id":"m1m1ljkj","l":"l8","t":"Overloading vs overriding","v":"medium","q":"Which statement about method overriding is correct?","o":["It needs no inheritance","It needs a superclass-subclass relationship","It is performed in the same class by changing the parameter list","The overriding method must have a different name"],"c":1,"e":"Overriding redefines an inherited method in a subclass using the same signature. Overloading happens in the same class (or with inherited methods) with different parameters."},{"id":"m7y8f8w","l":"l8","t":"Setter","v":"medium","q":"The main purpose of a setter (mutator) method for a private variable is to","o":["read the value of the variable","assign/modify the value of the variable in a controlled way","declare the variable","delete the variable"],"c":1,"e":"A public setter changes the private variable, usually after validating the new value; a getter reads it."},{"id":"m14uopnr","l":"l8","t":"Constructors","v":"medium","q":"Which of the following is NOT inherited by a subclass?","o":["public methods","protected variables","constructors","public variables"],"c":2,"e":"Constructors are not inherited; a subclass calls the superclass constructor via super()."},{"id":"m52zoip","l":"l8","t":"Weaker access","v":"hard","q":"What happens when the code below is compiled?","o":["It compiles; B.hi() overrides A.hi()","Compile-time error: attempting to assign weaker access privileges","Runtime error","A.hi() becomes protected"],"c":1,"e":"An overriding method cannot reduce visibility: public in A cannot become protected in B.","code":"class A { public void hi() { } }\nclass B extends A { protected void hi() { } }"},{"id":"m11hd0uf","l":"l8","t":"Overriding and super","v":"hard","q":"What is the output of the following program?","o":["6 7","7 7","7 6","6 6"],"c":1,"e":"b.f(3) executes B's f: super.f(3) is 6, +1 gives 7. b.f(3,4) is inherited from A and gives 3+4 = 7.","code":"class A {\n    int f(int a) { return a * 2; }\n    int f(int a, int b) { return a + b; }\n}\nclass B extends A {\n    int f(int a) { return super.f(a) + 1; }\n}\n// A and B in main:  B b = new B();\n// System.out.println(b.f(3) + \" \" + b.f(3, 4));"},{"id":"mccje8u","l":"l8","t":"Superclass reference","v":"hard","q":"Assuming this code is in main(), what happens?","o":["Prints only","Compile-time error: cannot find symbol only()","Runtime error","Prints B"],"c":1,"e":"The reference type A decides which methods can be called at compile time; A has no only().","code":"class A { void show() { } }\nclass B extends A { void only() { } }\n// in main:\nA a = new B();\na.only();"},{"id":"me90o6j","l":"l8","t":"super() rule","v":"hard","q":"Assertion (A): In a subclass constructor, the call super(...) must be the first statement.\nReason (R): The superclass part of the object must be initialised before the subclass part.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"Java enforces this to guarantee that the superclass is initialised first. R explains A."},{"id":"mt8xk5n","l":"l8","t":"final","v":"hard","q":"Assertion (A): A class declared as final cannot be extended.\nReason (R): A final method can be overridden in a subclass.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":2,"e":"A is true. R is false: final methods cannot be overridden."},{"id":"m1qe2yye","l":"l2","t":"Packages","v":"easy","q":"Which package is imported automatically in every Java program?","o":["java.util","java.io","java.lang","java.awt"],"c":2,"e":"java.lang (String, Math, wrapper classes, System) is imported by default; java.util and java.io need an import statement."},{"id":"m4s8kiy","l":"l2","t":"Primitive vs wrapper","v":"easy","q":"Which of the following is a primitive data type and NOT a wrapper class?","o":["Integer","Boolean","double","Character"],"c":2,"e":"double is a primitive type (lower case). Double, Integer, Boolean and Character are wrapper classes."},{"id":"mfoo3rt","l":"l2","t":"parseInt","v":"easy","q":"Which method converts the String \"125\" into the int value 125?","o":["Integer.parse()","Integer.parseInt()","Integer.toInt()","Integer.stringToInt()"],"c":1,"e":"Integer.parseInt(String) returns the int value of a numeric string."},{"id":"m1742h3o","l":"l2","t":"Character methods","v":"easy","q":"What is returned by Character.isDigit('7')?","o":["7","true","'7'","1"],"c":1,"e":"isDigit() returns a boolean; '7' is a digit so the result is true."},{"id":"mmmau35","l":"l2","t":"Scanner","v":"easy","q":"The Scanner class used for keyboard input belongs to the package:","o":["java.lang","java.io","java.util","java.text"],"c":2,"e":"Scanner is in java.util, so import java.util.Scanner; or import java.util.*; is needed."},{"id":"m1gemgbf","l":"l2","t":"Char arithmetic","v":"medium","q":"What is the output of the code?","o":["A","C","67","D"],"c":1,"e":"'A' is 65; 65 + 2 = 67 which, cast back to char, is 'C'.","code":"char ch = 'A';\nch = (char)(ch + 2);\nSystem.out.println(ch);"},{"id":"m1diwv76","l":"l2","t":"Autoboxing / unboxing","v":"medium","q":"Which feature(s) of Java does the code use?","o":["Only autoboxing","Only unboxing","Both autoboxing and unboxing","Neither"],"c":2,"e":"Integer a = 5 boxes the int automatically; a + 3 unboxes a to an int. Output is 8.","code":"Integer a = 5;\nint b = a + 3;\nSystem.out.println(b);"},{"id":"m1h5xvuy","l":"l2","t":"Integer constants","v":"medium","q":"The value of Integer.MAX_VALUE is:","o":["32767","2147483647","2147483648","65535"],"c":1,"e":"An int is 32 bits, so the largest value is 2^31 - 1 = 2147483647."},{"id":"m16ml619","l":"l2","t":"Character methods","v":"medium","q":"What is returned by Character.isLetterOrDigit('_')?","o":["true","false","'_'","Compile-time error"],"c":1,"e":"The underscore is neither a letter nor a digit, so the method returns false."},{"id":"mtmgj98","l":"l2","t":"NumberFormatException","v":"medium","q":"Assertion (A): Integer.parseInt(\"12.5\") throws NumberFormatException.\nReason (R): parseInt() accepts only strings that represent a valid int value, so a decimal point is not allowed.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"\"12.5\" is not a valid integer string; hence the exception. Double.parseDouble() should be used for it."},{"id":"m1o0kwt0","l":"l2","t":"Character methods","v":"hard","q":"What is the output of the code?","o":["2","3","4","5"],"c":1,"e":"Only 'A', '1' and 'b' are letters or digits; the space and '#' are not. So c = 3.","code":"String s = \"A1 b#\";\nint c = 0;\nfor (int i = 0; i < s.length(); i++) {\n    char ch = s.charAt(i);\n    if (Character.isLetterOrDigit(ch))\n        c++;\n}\nSystem.out.println(c);"},{"id":"mrxdfxp","l":"l2","t":"Char arithmetic","v":"hard","q":"What is the output of the code?","o":["98 and b","b and b","a1 and b","98 and 98"],"c":0,"e":"'a' + 1 is an int expression (97 + 1 = 98). Casting it to char gives 'b'.","code":"System.out.println('a' + 1);\nSystem.out.println((char)('a' + 1));"},{"id":"m1esv24o","l":"l5","t":"void methods","v":"easy","q":"The return type of a method that does not return any value is:","o":["int","null","void","empty"],"c":2,"e":"A method that returns nothing is declared with return type void."},{"id":"m18wbu9l","l":"l5","t":"Parameters","v":"easy","q":"The variables written in the parameter list of a method definition are called:","o":["Actual parameters","Formal parameters","Global variables","Arguments of main"],"c":1,"e":"Formal parameters appear in the method header; actual parameters are the values supplied in the call."},{"id":"mg6v2ci","l":"l5","t":"return statement","v":"easy","q":"Which keyword is used to send a value back from a method to its caller?","o":["send","back","return","exit"],"c":2,"e":"The return statement sends a value to the calling method and ends the method."},{"id":"mlk0bgs","l":"l5","t":"Pure methods","v":"easy","q":"A method that does not change the state of the object or its arguments is called:","o":["Impure method","Pure method","Static method","Overloaded method"],"c":1,"e":"A pure (accessor) method only reads data; an impure method modifies it."},{"id":"m3z42vw","l":"l5","t":"Prototype","v":"easy","q":"The prototype (signature) of a method consists of:","o":["Only the method name","Return type, method name and parameter list","Method name and body","Access specifier and method body"],"c":1,"e":"The method prototype is the first line of the method: return type, name and parameters, e.g. int sum(int a, int b)."},{"id":"m1i7hjru","l":"l5","t":"Call by value","v":"easy","q":"When a primitive value is passed to a method, a change made to the formal parameter:","o":["Changes the actual parameter too","Does not affect the actual parameter","Causes a compile-time error","Makes the actual parameter null"],"c":1,"e":"Primitives are passed by value: the method works on a copy."},{"id":"mqbfh3q","l":"l5","t":"Call by value","v":"medium","q":"What is the output of the program?","o":["5","10","0","Compile-time error"],"c":0,"e":"Only a copy of x is doubled; x remains 5.","code":"class A {\n    static void change(int a) { a = a * 2; }\n    public static void main(String[] args) {\n        int x = 5;\n        change(x);\n        System.out.println(x);\n    }\n}"},{"id":"m7d4yp7","l":"l5","t":"Passing arrays","v":"medium","q":"What is the output of the program?","o":["1","99","0","Compile-time error"],"c":1,"e":"An array is passed by reference, so the method changes the original array.","code":"class B {\n    static void modify(int[] arr) { arr[0] = 99; }\n    public static void main(String[] args) {\n        int[] n = {1, 2, 3};\n        modify(n);\n        System.out.println(n[0]);\n    }\n}"},{"id":"m10rm9pb","l":"l5","t":"Overloading rules","v":"medium","q":"Which of the following pairs of methods is a valid example of method overloading in one class?","o":["int f(int a) and void f(int b)","int f(int a) and int f(double a)","void f(int a) and int f(int a)","static void f() and void f()"],"c":1,"e":"Overloading needs a different parameter list (number, type or order). Return type alone is not enough."},{"id":"m1uenowa","l":"l5","t":"Static methods","v":"medium","q":"Assertion (A): A static method can be called without creating an object of its class.\nReason (R): A static method belongs to the class and not to any particular object.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"Static members belong to the class, so ClassName.method() works with no object."},{"id":"m1s0hkj0","l":"l5","t":"Non-static methods","v":"medium","q":"main() is static. Which statement correctly calls a non-static method show() of the same class A from main()?","o":["show();","A.show();","new A().show();","A().show();"],"c":2,"e":"A non-static method needs an object, so first create one: new A().show()."},{"id":"mjtzqlz","l":"l5","t":"Overloading","v":"hard","q":"What is the output of the program?","o":["char int double double","int int int double","char int long float","char int Compile-time error"],"c":0,"e":"'a' matches char; 5 matches int; long and float widen to double (no f(long)/f(float) exist). Output: char int double double.","code":"class T {\n    void f(int a)    { System.out.print(\"int \");    }\n    void f(double a) { System.out.print(\"double \"); }\n    void f(char a)   { System.out.print(\"char \");   }\n    public static void main(String[] args) {\n        T t = new T();\n        t.f('a');\n        t.f(5);\n        t.f(5L);\n        t.f(2.5f);\n    }\n}"},{"id":"m1ss29r9","l":"l5","t":"Passing objects","v":"hard","q":"What is the output of the program?","o":["10","11","50","51"],"c":1,"e":"b.v++ changes the original object (10 to 11). Then b is made to refer to a new object, which does not affect x.","code":"class Box {\n    int v;\n    static void inc(Box b) {\n        b.v++;\n        b = new Box();\n        b.v = 50;\n    }\n    public static void main(String[] args) {\n        Box x = new Box();\n        x.v = 10;\n        inc(x);\n        System.out.println(x.v);\n    }\n}"},{"id":"m8obhjs","l":"l5","t":"Methods calling methods","v":"hard","q":"What is the output of the program?","o":["13","25","49","97"],"c":1,"e":"sq(2) = 4; sumSq(4, 3) = 16 + 9 = 25.","code":"class S {\n    static int sq(int n) { return n * n; }\n    static int sumSq(int a, int b) { return sq(a) + sq(b); }\n    public static void main(String[] args) {\n        System.out.println(sumSq(sq(2), 3));\n    }\n}"},{"id":"mybsbf7","l":"l6","t":"Object creation","v":"easy","q":"Which is the correct statement to create an object b of the class Book?","o":["Book b = Book();","Book b = new Book;","Book b = new Book();","new Book b();"],"c":2,"e":"The syntax is ClassName obj = new ClassName();"},{"id":"mxmxge2","l":"l6","t":"Variables","v":"easy","q":"A variable declared inside a class but outside all methods, without the keyword static, is a(n):","o":["Local variable","Instance variable","Class variable","Formal parameter"],"c":1,"e":"Instance variables are declared in the class body and each object gets its own copy."},{"id":"m1u1p79n","l":"l6","t":"null","v":"easy","q":"What is the default value of an instance variable of a class type (for example, Student s;)?","o":["0","\"\"","null","undefined"],"c":2,"e":"Reference variables default to null."},{"id":"m1vsekns","l":"l6","t":"Static members","v":"easy","q":"A static variable of a class is:","o":["Copied into every object","Shared by all the objects of the class","Available only inside main()","Created every time a method is called"],"c":1,"e":"Only one copy of a static variable exists, shared by all objects."},{"id":"m4v7den","l":"l6","t":"Static members","v":"medium","q":"What is the output of the code?","o":["1","2","3","0"],"c":2,"e":"The constructor runs three times and n is a shared static variable, so n = 3.","code":"class A {\n    int x;\n    static int n;\n    A() { n++; }\n    public static void main(String[] args) {\n        new A();\n        new A();\n        A a = new A();\n        System.out.println(A.n);\n    }\n}"},{"id":"m64kb2h","l":"l6","t":"this keyword","v":"medium","q":"The keyword this refers to:","o":["The current class","The current object","The previous object","The super class"],"c":1,"e":"this is a reference to the object on which the method or constructor is being executed."},{"id":"m7u1f2c","l":"l6","t":"this keyword","v":"medium","q":"What is the output of the code?","o":["5","6","10","11"],"c":0,"e":"Inside set(), x is the parameter (it hides the instance variable). Without this.x the instance variable is unchanged, so p.x stays 5.","code":"class P {\n    int x = 5;\n    void set(int x) { x = x + 1; }\n    public static void main(String[] args) {\n        P p = new P();\n        p.set(10);\n        System.out.println(p.x);\n    }\n}"},{"id":"mokwmgh","l":"l6","t":"Instance variables","v":"medium","q":"Assertion (A): Instance variables of two objects of the same class may hold different values.\nReason (R): Every object gets its own separate copy of the instance variables.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"Each object has its own copy of instance variables, so their values are independent."},{"id":"mlavb7w","l":"l6","t":"null","v":"medium","q":"What happens at run time when the following statements are executed?\nStudent s = null;\ns.show();","o":["Compile-time error","NullPointerException","show() prints nothing","s is automatically created"],"c":1,"e":"A method cannot be called through a null reference; a NullPointerException is thrown at run time."},{"id":"m2ziigr","l":"l6","t":"Object reference","v":"hard","q":"What is the output of the code?","o":["true false 9","true true 9","false false 3","true false 3"],"c":0,"e":"b is another reference to the same object as a, so a == b and a.x is 9. c is a different object, so a == c is false.","code":"class Pt {\n    int x, y;\n    public static void main(String[] args) {\n        Pt a = new Pt();\n        a.x = 3;\n        Pt b = a;\n        b.x = 9;\n        Pt c = new Pt();\n        c.x = 3;\n        System.out.println((a == b) + \" \" + (a == c) + \" \" + a.x);\n    }\n}"},{"id":"m160i1ms","l":"l6","t":"Passing and returning objects","v":"hard","q":"What is the output of the code?","o":["0 7","4 0","0 0","4 7"],"c":1,"e":"big() returns the larger object, i.e. b (7 > 4). r refers to b, so b.v becomes 0 and a.v stays 4.","code":"class Q {\n    int v;\n    Q big(Q o) { return v > o.v ? this : o; }\n    public static void main(String[] args) {\n        Q a = new Q(), b = new Q();\n        a.v = 4;\n        b.v = 7;\n        Q r = a.big(b);\n        r.v = 0;\n        System.out.println(a.v + \" \" + b.v);\n    }\n}"},{"id":"md6we42","l":"l7","t":"Constructor basics","v":"easy","q":"A constructor must have the same name as:","o":["The package","The class","The main method","The object"],"c":1,"e":"The constructor name is identical to the class name."},{"id":"mhm1jq","l":"l7","t":"Constructor rules","v":"easy","q":"What is the return type of a constructor?","o":["void","int","The class type","It has no return type, not even void"],"c":3,"e":"A constructor never has a return type; writing void makes it an ordinary method."},{"id":"m1p5san4","l":"l7","t":"Constructor basics","v":"easy","q":"A constructor is invoked automatically when:","o":["The class is compiled","An object is created using new","A method is called","The program ends"],"c":1,"e":"new ClassName(...) calls the matching constructor."},{"id":"mv5uqb5","l":"l7","t":"Default constructor","v":"easy","q":"The compiler supplies a default constructor when:","o":["The class has no constructor","The class has a parameterised constructor","The class has a method of the same name","The class is declared public"],"c":0,"e":"Only if the programmer writes no constructor at all, the compiler adds a no-argument one."},{"id":"m1rpu3ni","l":"l7","t":"Constructor overloading","v":"easy","q":"Defining more than one constructor with different parameter lists in a class is called:","o":["Constructor overriding","Constructor overloading","Constructor chaining only","Method hiding"],"c":1,"e":"Constructors can be overloaded just like methods."},{"id":"m6lzp8k","l":"l7","t":"Constructor rules","v":"easy","q":"Which is a correct constructor of the class Box?","o":["void Box() { }","Box() { }","int Box() { }","box() { }"],"c":1,"e":"Same name as the class (case-sensitive) and no return type."},{"id":"m1w1mvy6","l":"l7","t":"No default constructor","v":"medium","q":"What happens when the code is compiled?","o":["It compiles; x is 0","Compile-time error: no constructor A() exists","Run-time error (NullPointerException)","The compiler supplies a default constructor"],"c":1,"e":"Once a parameterised constructor is written, the compiler does not provide the default one, so new A() fails to compile.","code":"class A {\n    int x;\n    A(int x) { this.x = x; }\n    public static void main(String[] args) {\n        A a = new A();\n    }\n}"},{"id":"m1tszmcc","l":"l7","t":"this()","v":"medium","q":"The call this(...) to another constructor must be:","o":["The last statement of the constructor","The first statement of the constructor","Written inside a method","Written in main() only"],"c":1,"e":"A constructor call using this() must be the first statement in the constructor."},{"id":"mmyo2u5","l":"l7","t":"Default constructor","v":"medium","q":"Assertion (A): If a class contains only a parameterised constructor, the compiler does not supply a default constructor.\nReason (R): The compiler supplies a default constructor only when the class has no constructor at all.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"R is exactly the rule that explains A."},{"id":"m17ejt78","l":"l7","t":"Constructor rules","v":"medium","q":"Assertion (A): A constructor can be declared with the return type void.\nReason (R): A constructor never returns a value.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":3,"e":"A is false: a constructor has no return type at all; with void it becomes an ordinary method. R is true."},{"id":"m1gdrb3l","l":"l7","t":"this()","v":"medium","q":"What is the output of the code?","o":["3","5","8","0"],"c":2,"e":"this() sets a = 5 first; then this.a += 3 gives 8.","code":"class C {\n    int a;\n    C() { a = 5; }\n    C(int a) {\n        this();\n        this.a += a;\n    }\n    public static void main(String[] args) {\n        C c = new C(3);\n        System.out.println(c.a);\n    }\n}"},{"id":"m1nvjryy","l":"l7","t":"Execution order","v":"hard","q":"What is the output of the code?","o":["A3 then B12","B12 then A3","A3 then B4","A1 then B4"],"c":0,"e":"D(int) first calls D(): x = 3, prints A3. Then x = 3 * 4 = 12, prints B12.","code":"class D {\n    int x = 1;\n    D() {\n        x = x + 2;\n        System.out.println(\"A\" + x);\n    }\n    D(int n) {\n        this();\n        x = x * n;\n        System.out.println(\"B\" + x);\n    }\n    public static void main(String[] args) {\n        new D(4);\n    }\n}"},{"id":"mtqace5","l":"l7","t":"Copy constructor","v":"hard","q":"What is the output of the code?","o":["5 5 5","5 6 7","5 6 6","6 7 8"],"c":1,"e":"b is built from a (5 + 1 = 6) and c is built from b (6 + 1 = 7).","code":"class P {\n    int v;\n    P(int v) { this.v = v; }\n    P(P o) { v = o.v + 1; }\n    public static void main(String[] args) {\n        P a = new P(5);\n        P b = new P(a);\n        P c = new P(b);\n        System.out.println(a.v + \" \" + b.v + \" \" + c.v);\n    }\n}"},{"id":"mz8c9e0","l":"l7","t":"Default values","v":"hard","q":"What is the output of the code?","o":["0 \"\" false","0 null false","null null null","0 null true"],"c":1,"e":"Instance variables get default values: int 0, reference null, boolean false.","code":"class E {\n    int x;\n    String s;\n    boolean f;\n    E() { }\n    public static void main(String[] args) {\n        E e = new E();\n        System.out.println(e.x + \" \" + e.s + \" \" + e.f);\n    }\n}"},{"id":"m5wq295","l":"r9","t":"Nested Loops","v":"easy","q":"In a nested loop, which loop completes its iterations faster (changes its counter more often)?","o":["The outer loop","The inner loop","Both change at the same rate","It depends on the data type of the counter"],"c":1,"e":"For every single pass of the outer loop, the inner loop runs through all of its iterations, so the inner counter changes far more often."},{"id":"m1a6h3we","l":"r9","t":"Pattern Printing","v":"easy","q":"While printing a pattern, which statement placed AFTER the inner loop (but inside the outer loop) moves the cursor to the next row?","o":["System.out.print();","System.out.println();","System.out.print(\"\\t\");","continue;"],"c":1,"e":"println() with no argument prints nothing but ends the line. Placed after the inner loop it is executed once per row."},{"id":"m3rpl5o","l":"r9","t":"Pattern Printing","v":"easy","q":"To print a pattern of 6 rows and 4 columns using nested for loops, the outer loop should normally run:","o":["4 times, controlling the columns","6 times, controlling the rows","24 times","10 times"],"c":1,"e":"The outer loop controls the number of rows (6) and the inner loop controls the number of columns (4) in each row."},{"id":"mtac7xf","l":"r9","t":"Counting Iterations","v":"medium","q":"What is the value of c after the code is executed?","o":["16","10","6","4"],"c":1,"e":"The inner loop runs 4, 3, 2 and 1 times for i = 1, 2, 3, 4. Total = 4 + 3 + 2 + 1 = 10.","code":"int c = 0;\nfor (int i = 1; i <= 4; i++)\n    for (int j = i; j <= 4; j++)\n        c++;"},{"id":"mgcoagu","l":"r9","t":"Nested Loops with continue","v":"medium","q":"What is the output of the following code?","o":["1 3 2 6 3 9","1 2 3 2 4 6 3 6 9","1 2 3 4 5 6 7 8 9","2 4 6"],"c":0,"e":"When j == 2, continue skips the print. So for each i only j = 1 and j = 3 are printed: 1 3, 2 6, 3 9. Each value is followed by a space, so the output ends with a trailing space.","code":"for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (j == 2)\n            continue;\n        System.out.print(i * j + \" \");\n    }\n}"},{"id":"mnrbxc3","l":"r9","t":"Nested while loops","v":"medium","q":"What is the value of s after this code executes?","o":["6","14","18","9"],"c":1,"e":"i=1: j = 1,2,3 adds 6; i=2: j = 2,3 adds 5; i=3: j = 3 adds 3. Total = 6 + 5 + 3 = 14.","code":"int s = 0, i = 1;\nwhile (i <= 3) {\n    int j = i;\n    while (j <= 3) {\n        s += j;\n        j++;\n    }\n    i++;\n}"},{"id":"m15up76t","l":"r9","t":"break in nested loops","v":"hard","q":"What is the output of the following code?","o":["21 31 32","11 22 33","12 13 23","21 31 32 41"],"c":0,"e":"break leaves only the INNER loop. When i == j the inner loop stops. i=1: breaks immediately; i=2: prints 21 then breaks at j=2; i=3: prints 31, 32 then breaks at j=3. Output: 21 31 32.","code":"for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (i == j)\n            break;\n        System.out.print(i + \"\" + j + \" \");\n    }\n}"},{"id":"m1qt4ozq","l":"r9","t":"Counting Iterations","v":"hard","q":"How many times does c++ execute?","o":["5","15","31","20"],"c":2,"e":"i takes the values 1, 2, 4, 8, 16 (doubling). The inner loop runs i times for each, so c = 1 + 2 + 4 + 8 + 16 = 31.","code":"int c = 0;\nfor (int i = 1; i <= 20; i *= 2)\n    for (int j = 1; j <= i; j++)\n        c++;"},{"id":"mttqf46","l":"r5b","t":"Scanner Methods","v":"easy","q":"Which statement is used to read a decimal (double) value from a Scanner object sc?","o":["double d = sc.nextDouble();","double d = sc.nextDecimal();","double d = sc.readDouble();","double d = sc.nextFloat;"],"c":0,"e":"nextDouble() reads a double value. There is no nextDecimal() or readDouble() in Scanner, and a method call needs brackets."},{"id":"m4n41g6","l":"r5b","t":"Scanner Methods","v":"easy","q":"Which expression reads a single character typed by the user using Scanner sc?","o":["sc.nextChar()","sc.next().charAt(0)","sc.nextLine().length()","sc.charAt(0)"],"c":1,"e":"Scanner has no nextChar(). We read a word with next() and take its first character with charAt(0)."},{"id":"m1vumq0r","l":"r5b","t":"Importing Scanner","v":"easy","q":"Which statement correctly imports the Scanner class?","o":["import java.io.Scanner;","import java.util.Scanner;","import java.lang.Scanner;","include java.util.Scanner;"],"c":1,"e":"Scanner belongs to the java.util package, so the import is import java.util.Scanner; (or import java.util.*;)."},{"id":"m89m5or","l":"r5b","t":"Scanner Methods","v":"medium","q":"If the user types 10 20 and presses Enter, what is displayed?","o":["1020","30","10 20","Runtime error"],"c":1,"e":"nextInt() reads 10, the next nextInt() skips the space and reads 20. The two ints are added: 30.","code":"Scanner sc = new Scanner(System.in);\nint a = sc.nextInt();\nint b = sc.nextInt();\nSystem.out.println(a + b);"},{"id":"m7pk97p","l":"r5b","t":"nextInt and nextLine","v":"medium","q":"The user types 5, presses Enter, then types Hello and presses Enter. What is displayed?","o":["[Hello]","[]","[5]","[5Hello]"],"c":1,"e":"nextInt() reads 5 but leaves the Enter (newline) in the buffer. nextLine() then reads the rest of that first line, which is empty, so [] is displayed.","code":"Scanner sc = new Scanner(System.in);\nint n = sc.nextInt();\nString s = sc.nextLine();\nSystem.out.println(\"[\" + s + \"]\");"},{"id":"m1rw96ax","l":"r5b","t":"print and println","v":"medium","q":"What is the exact output of the following statements?","o":["AB and C on the same line (ABC)","AB on one line and C on the next line","A, B and C on three separate lines","A on one line and BC on the next line"],"c":1,"e":"print(\"A\") leaves the cursor on the same line, println(\"B\") prints B and moves to the next line, then print(\"C\") starts on that new line. So: AB then C.","code":"System.out.print(\"A\");\nSystem.out.println(\"B\");\nSystem.out.print(\"C\");"},{"id":"mkmy5it","l":"r5b","t":"next and nextLine","v":"hard","q":"The user types Java Programming and presses Enter. What is displayed?","o":["Java|Programming","Java| Programming","Java Programming|","|Java Programming"],"c":1,"e":"next() reads only \"Java\" (stopping at the space). nextLine() then returns the rest of the line including the leading space: \" Programming\".","code":"Scanner sc = new Scanner(System.in);\nString a = sc.next();\nString b = sc.nextLine();\nSystem.out.println(a + \"|\" + b);"},{"id":"miagnf9","l":"r5b","t":"Mixed Input","v":"hard","q":"The user types 4 Hello world and presses Enter. What is displayed?","o":["4Hellow","4Helloworld","4 Hello world","4Hellod"],"c":0,"e":"nextInt() reads 4, next() reads Hello, and next().charAt(0) reads the word world and keeps only its first character w. Printing a + s + c gives 4Hellow.","code":"Scanner sc = new Scanner(System.in);\nint a = sc.nextInt();\nString s = sc.next();\nchar c = sc.next().charAt(0);\nSystem.out.println(a + s + c);"},{"id":"m1e5nag0","l":"r3","t":"Data Types","v":"easy","q":"The range of values that can be stored in a byte variable is:","o":["-128 to 127","-127 to 128","0 to 255","-256 to 255"],"c":0,"e":"byte is an 8-bit signed type, so it stores -2^7 to 2^7 - 1, i.e. -128 to 127."},{"id":"m1sd8rxf","l":"r3","t":"Literals","v":"easy","q":"Which of the following is a float literal?","o":["3.5","3.5f","\"3.5\"","'3.5'"],"c":1,"e":"A decimal literal such as 3.5 is a double by default. Adding the suffix f (or F) makes it a float. \"3.5\" is a String."},{"id":"m1svsouj","l":"r3","t":"char and ASCII","v":"easy","q":"What is the output of the following code?","o":["F","70","D2","Compile-time error"],"c":0,"e":"ch += 2 adds 2 to the ASCII code of D (68) giving 70, and the compound assignment automatically casts the result back to char, which is F.","code":"char ch = 'D';\nch += 2;\nSystem.out.println(ch);"},{"id":"m13p9mjm","l":"r3","t":"char and ASCII","v":"medium","q":"What is the output of the following code?","o":["C","67","A2","65"],"c":1,"e":"In 'A' + 2 the char is promoted to int (65), so the sum 67 is an int and 67 is stored and printed.","code":"int x = 'A' + 2;\nSystem.out.println(x);"},{"id":"mnf95va","l":"r3","t":"Overflow","v":"medium","q":"What is the output of the following code?","o":["2147483648","-2147483648","0","Compile-time error"],"c":1,"e":"2147483647 is the largest int. Adding 1 overflows and wraps around to the smallest int, -2147483648. Java gives no error.","code":"int a = 2147483647;\na = a + 1;\nSystem.out.println(a);"},{"id":"ms5yzbj","l":"r3","t":"Integer Division","v":"hard","q":"What is the output of the following code?","o":["5.0","4.5","4.0","5.5"],"c":1,"e":"10 / 4 is integer division (2, stored as 2.0 later); 10 / 4.0 is 2.5. The sum 2 + 2.5 = 4.5 is assigned to d.","code":"double d = 10 / 4 + 10 / 4.0;\nSystem.out.println(d);"},{"id":"m1c69noy","l":"l4","t":"String Methods","v":"easy","q":"Which String method compares two strings for equality while ignoring the difference between upper and lower case?","o":["equals()","compareTo()","e
