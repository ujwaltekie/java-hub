ng[] args) {\n        int p = 3, q = 7;\n        int[] r = {3, 7};\n        swapVal(p, q);\n        swapArr(r);\n        System.out.println(p + \" \" + q);\n        System.out.println(r[0] + \" \" + r[1]);\n    }\n}","a":"<b>Output:</b><br>3 7<br>7 3<br>The ints are passed by value (not swapped); the array is passed by reference (swapped)."},{"id":"p1260tfx","l":"l5","t":"Overloading","v":"hard","q":"Predict the output.","code":"class Ov {\n    static int calc(int a) { return a * a; }\n    static double calc(double a) { return a / 2; }\n    static int calc(int a, int b) { return a + b; }\n    public static void main(String[] args) {\n        System.out.println(calc(4));\n        System.out.println(calc(4.0));\n        System.out.println(calc(4, 6));\n        System.out.println(calc('A'));\n    }\n}","a":"<b>Output:</b><br>16<br>2.0<br>10<br>4225<br>calc(4.0) uses the double version; 'A' (65) widens to int, so 65 * 65 = 4225."},{"id":"pe2xcpa","l":"l5","t":"Methods calling methods","v":"medium","q":"Predict the output.","code":"class Comb {\n    static int fact(int n) {\n        int f = 1;\n        for (int i = 2; i <= n; i++)\n            f = f * i;\n        return f;\n    }\n    static int comb(int n, int r) {\n        return fact(n) / (fact(r) * fact(n - r));\n    }\n    public static void main(String[] args) {\n        System.out.println(comb(5, 2));\n        System.out.println(fact(0));\n    }\n}","a":"<b>Output:</b><br>10<br>1<br>5C2 = 120 / (2 * 6) = 10; the loop does not run for 0, so fact(0) = 1."},{"id":"p1ur540w","l":"l5","t":"Scope of variables","v":"medium","q":"Predict the output.","code":"class Cnt {\n    static int c = 0;\n    static void hit() {\n        int x = 0;\n        x++;\n        c++;\n        System.out.print(x + \" \" + c + \" \");\n    }\n    public static void main(String[] args) {\n        hit();\n        hit();\n        hit();\n    }\n}","a":"<b>Output:</b> 1 1 1 2 1 3<br>The local x is re-created (0) on every call, but the static c keeps its value between calls."},{"id":"p1tgmj5a","l":"l5","t":"Boolean methods","v":"medium","q":"Predict the output.","code":"class Pal {\n    static String rev(String s) {\n        String r = \"\";\n        for (int i = s.length() - 1; i >= 0; i--)\n            r = r + s.charAt(i);\n        return r;\n    }\n    static boolean pal(String s) { return s.equals(rev(s)); }\n    public static void main(String[] args) {\n        System.out.println(pal(\"level\"));\n        System.out.println(pal(\"Level\"));\n        System.out.println(rev(\"ICSE\"));\n    }\n}","a":"<b>Output:</b><br>true<br>false<br>ESCI<br>equals() is case-sensitive, so \"Level\" is not equal to \"leveL\"."},{"id":"p1fxqwnm","l":"l5","t":"Passing arrays","v":"hard","q":"Predict the output.","code":"class Dbl {\n    static int[] dbl(int[] a) {\n        int[] b = new int[a.length];\n        for (int i = 0; i < a.length; i++)\n            b[i] = a[i] * 2;\n        a[0] = 0;\n        return b;\n    }\n    public static void main(String[] args) {\n        int[] x = {1, 2, 3};\n        int[] y = dbl(x);\n        System.out.println(x[0] + \" \" + y[0] + \" \" + y[2]);\n    }\n}","a":"<b>Output:</b> 0 2 6<br>The method changes the original x[0] to 0 (impure) and returns a new array of doubled values (computed before x[0] was changed)."},{"id":"p1a8gnje","l":"l6","t":"Class with methods","v":"easy","q":"Predict the output.","code":"class Emp {\n    String name;\n    int sal;\n    void set(String n, int s) { name = n; sal = s; }\n    void raise(int p) { sal = sal + sal * p / 100; }\n    void show() { System.out.println(name + \" \" + sal); }\n    public static void main(String[] args) {\n        Emp e = new Emp();\n        e.set(\"Ravi\", 5000);\n        e.raise(10);\n        e.show();\n    }\n}","a":"<b>Output:</b> Ravi 5500<br>raise(10) adds 10% of 5000 (= 500) to the salary."},{"id":"p1at17ew","l":"l6","t":"Object reference","v":"medium","q":"Predict the output.","code":"class Box {\n    int w;\n    public static void main(String[] args) {\n        Box a = new Box();\n        a.w = 5;\n        Box b = a;\n        b.w = 8;\n        System.out.println(a.w);\n        b = new Box();\n        b.w = 1;\n        System.out.println(a.w + \" \" + b.w);\n    }\n}","a":"<b>Output:</b><br>8<br>8 1<br>b = a copies the reference, so changing b.w changes a.w. After b = new Box(), b refers to a different object."},{"id":"p1j5163u","l":"l6","t":"Static counter","v":"medium","q":"Predict the output.","code":"class Item {\n    static int count;\n    int id;\n    Item() { count++; id = count; }\n    public static void main(String[] args) {\n        Item p = new Item();\n        Item q = new Item();\n        Item r = new Item();\n        System.out.println(p.id + \" \" + q.id + \" \" + r.id + \" \" + Item.count);\n    }\n}","a":"<b>Output:</b> 1 2 3 3<br>Each object gets its own id, copied from the shared static count at its creation."},{"id":"p1wts4kj","l":"l6","t":"this keyword","v":"medium","q":"Predict the output.","code":"class Acc {\n    int bal;\n    void dep(int bal) { this.bal = this.bal + bal; }\n    public static void main(String[] args) {\n        Acc a = new Acc();\n        a.dep(500);\n        a.dep(250);\n        System.out.println(a.bal);\n    }\n}","a":"<b>Output:</b> 750<br>this.bal is the instance variable (initially 0) and bal is the parameter: 0 + 500, then 500 + 250."},{"id":"pyv8dye","l":"l6","t":"Passing and returning objects","v":"hard","q":"Predict the output.","code":"class Time {\n    int h, m;\n    Time add(Time t) {\n        Time r = new Time();\n        r.m = m + t.m;\n        r.h = h + t.h + r.m / 60;\n        r.m = r.m % 60;\n        return r;\n    }\n    public static void main(String[] args) {\n        Time a = new Time(), b = new Time();\n        a.h = 2; a.m = 50;\n        b.h = 1; b.m = 30;\n        Time c = a.add(b);\n        System.out.println(c.h + \":\" + c.m);\n    }\n}","a":"<b>Output:</b> 4:20<br>Minutes: 50 + 30 = 80, i.e. 1 hour 20 minutes; hours: 2 + 1 + 1 = 4."},{"id":"p1jwcdye","l":"l7","t":"Constructor overloading","v":"easy","q":"Predict the output.","code":"class Rect {\n    int l, b;\n    Rect() { l = 1; b = 1; }\n    Rect(int s) { l = b = s; }\n    Rect(int l, int b) { this.l = l; this.b = b; }\n    int area() { return l * b; }\n    public static void main(String[] args) {\n        Rect a = new Rect(), b = new Rect(4), c = new Rect(3, 5);\n        System.out.println(a.area() + \" \" + b.area() + \" \" + c.area());\n    }\n}","a":"<b>Output:</b> 1 16 15<br>The constructor is chosen by the number of arguments: 1x1, 4x4 and 3x5."},{"id":"plrwh16","l":"l7","t":"Missing this","v":"medium","q":"Predict the output.","code":"class S {\n    int n;\n    S(int n) { n = n; }\n    public static void main(String[] args) {\n        S s = new S(9);\n        System.out.println(s.n);\n    }\n}","a":"<b>Output:</b> 0<br>n = n assigns the parameter to itself; the instance variable keeps its default value 0. It should be this.n = n."},{"id":"plho16e","l":"l7","t":"Constructor chaining","v":"hard","q":"Predict the output.","code":"class F {\n    F() {\n        this(2);\n        System.out.println(\"zero\");\n    }\n    F(int a) {\n        this(a, 3);\n        System.out.println(\"one \" + a);\n    }\n    F(int a, int b) {\n        System.out.println(\"two \" + (a + b));\n    }\n    public static void main(String[] args) {\n        new F();\n    }\n}","a":"<b>Output:</b><br>two 5<br>one 2<br>zero<br>F() calls F(2), which calls F(2, 3). The innermost body finishes first, then control returns outward."},{"id":"p12udxj1","l":"l7","t":"Copy constructor concept","v":"hard","q":"Predict the output.","code":"class T {\n    int h, m;\n    T(int h, int m) { this.h = h; this.m = m; }\n    T(T t) { h = t.h; m = t.m; }\n    public static void main(String[] args) {\n        T a = new T(2, 30);\n        T b = new T(a);\n        T c = a;\n        b.h = 9;\n        c.m = 45;\n        System.out.println(a.h + \":\" + a.m + \" \" + b.h + \":\" + b.m);\n    }\n}","a":"<b>Output:</b> 2:45 9:30<br>b is a separate copy made by the constructor, while c is only another reference to a, so c.m = 45 changes a."},{"id":"p1gsp4sa","l":"l7","t":"Default values","v":"easy","q":"Predict the output.","code":"class V {\n    int a;\n    double d;\n    char c;\n    V() { c = 'x'; }\n    public static void main(String[] args) {\n        V v = new V();\n        System.out.println(v.a + \" \" + v.d + \" \" + v.c);\n    }\n}","a":"<b>Output:</b> 0 0.0 x<br>a and d take default values (0 and 0.0); c is set by the constructor."},{"id":"pbomot1","l":"l7","t":"this() and static counter","v":"medium","q":"Predict the output.","code":"class W {\n    static int count = 0;\n    String name;\n    W() { this(\"NA\"); }\n    W(String n) {\n        name = n;\n        count++;\n    }\n    public static void main(String[] args) {\n        W a = new W();\n        W b = new W(\"Ravi\");\n        W c = new W();\n        System.out.println(a.name + \" \" + b.name + \" \" + c.name + \" \" + W.count);\n    }\n}","a":"<b>Output:</b> NA Ravi NA 3<br>W() passes \"NA\" to W(String); count is incremented once per object, three times."},{"id":"p1bhco10","l":"r9","t":"Pattern Printing","v":"medium","q":"Predict the exact output.","code":"for (int i = 1; i <= 4; i++) {\n    for (int j = 1; j <= 4; j++) {\n        if (i == j)\n            System.out.print(1);\n        else\n            System.out.print(0);\n    }\n    System.out.println();\n}","a":"<b>Output:</b><br>1000<br>0100<br>0010<br>0001<br>1 is printed only when the row number equals the column number, i.e. along the main diagonal."},{"id":"p3bsxar","l":"r9","t":"Pattern Printing","v":"medium","q":"Predict the exact output.","code":"for (int i = 1; i <= 4; i++) {\n    for (int j = 1; j <= 4 - i; j++)\n        System.out.print(\"-\");\n    for (int j = 1; j <= i; j++)\n        System.out.print(\"*\");\n    System.out.println();\n}","a":"<b>Output:</b><br>---*<br>--**<br>-***<br>****<br>In row i, the first inner loop prints (4 - i) dashes and the second prints i stars, giving a right-aligned triangle."},{"id":"pcbs71k","l":"r9","t":"Counting with continue","v":"hard","q":"Predict the output.","code":"int c = 0, s = 0;\nfor (int i = 1; i <= 4; i++) {\n    for (int j = 1; j <= 4; j++) {\n        if ((i + j) % 3 == 0)\n            continue;\n        c++;\n        s += i * j;\n    }\n}\nSystem.out.println(c + \" \" + s);","a":"<b>Output:</b> 11 71<br>Of the 16 pairs, five have (i + j) divisible by 3: (1,2), (2,1), (2,4), (4,2), (3,3). They are skipped, so c = 11. Their products 2+2+8+8+9 = 29 are missing from the total 100, so s = 71."},{"id":"pletmd3","l":"r9","t":"Nested while loops","v":"medium","q":"Predict the exact output (note the trailing space after each group).","code":"int i = 1;\nwhile (i <= 3) {\n    int j = 3;\n    while (j >= i) {\n        System.out.print(j);\n        j--;\n    }\n    System.out.print(\" \");\n    i++;\n}","a":"<b>Output:</b> 321 32 3 <br>The inner loop counts down from 3 to the current i: 321 for i=1, 32 for i=2, 3 for i=3."},{"id":"pqjvlow","l":"r9","t":"break in nested loops","v":"hard","q":"Predict the exact output.","code":"for (int i = 1; i <= 4; i++) {\n    for (int j = 1; j <= 4; j++) {\n        if (i * j > 8)\n            break;\n        System.out.print(i * j + \" \");\n    }\n    System.out.println();\n}","a":"<b>Output:</b><br>1 2 3 4 <br>2 4 6 8 <br>3 6 <br>4 8 <br>The inner loop is abandoned as soon as i*j exceeds 8 (3x3 = 9 for i=3 and 4x3 = 12 for i=4), but the outer loop continues with the next row."},{"id":"p1eh4kxm","l":"r5b","t":"Scanner Methods","v":"medium","q":"The user types 12 5 and presses Enter. Predict the output.","code":"Scanner sc = new Scanner(System.in);\nint a = sc.nextInt();\nint b = sc.nextInt();\nSystem.out.println(a + b);\nSystem.out.println((a + b) / 2);\nSystem.out.println((a + b) / 2.0);","a":"<b>Output:</b><br>17<br>8<br>8.5<br>17 / 2 is integer division (8), while 17 / 2.0 is floating-point division (8.5)."},{"id":"p1wkzre9","l":"r5b","t":"nextInt and nextLine","v":"hard","q":"The user types 3, Enter, hello, Enter, world, Enter. Predict the output.","code":"Scanner sc = new Scanner(System.in);\nint n = sc.nextInt();\nString s = sc.nextLine();\nString t = sc.nextLine();\nSystem.out.println(n + \"[\" + s + \"][\" + t + \"]\");","a":"<b>Output:</b> 3[][hello]<br>The first nextLine() swallows the leftover newline after 3 and returns an empty string; the second reads hello. The word world is never read."},{"id":"p1rrdmio","l":"r5b","t":"Escape Sequences","v":"medium","q":"Predict the output.","code":"System.out.println(\"Name:\\tRavi\\nClass:\\t\\\"X\\\"\\\\ICSE\");","a":"<b>Output:</b><br>Name:\tRavi<br>Class:\t\"X\"\\ICSE<br>\\t inserts a tab, \\n starts a new line, \\\" prints a double quote and \\\\ prints one backslash."},{"id":"pe4csfz","l":"r5b","t":"print and println","v":"medium","q":"Predict the output.","code":"System.out.print(1 + 2);\nSystem.out.print(\"+\");\nSystem.out.println(1 + 2 + \"=3\");\nSystem.out.print(\"A\" + 'B' + 1);","a":"<b>Output:</b><br>3+3=3<br>AB1<br>1 + 2 is added to 3 first. In 1 + 2 + \"=3\" the addition happens before the string joins, giving 3=3. In \"A\" + 'B' + 1 everything becomes text: AB1."},{"id":"p1hcmurv","l":"r3","t":"char and ASCII","v":"medium","q":"Predict the output.","code":"char c = 'A';\nSystem.out.println(c + 1);\nSystem.out.println((char) (c + 1));\nSystem.out.println(\"\" + c + 1);","a":"<b>Output:</b><br>66<br>B<br>A1<br>c + 1 is an int (65 + 1). Casting it to char gives B. In \"\" + c + 1 the + joins text, so A and 1 are appended as characters."},{"id":"p1exw06i","l":"r3","t":"Type Casting","v":"medium","q":"Predict the output.","code":"double d = 9.99;\nint i = (int) d;\nSystem.out.println(i);\nSystem.out.println(Math.round(d));\nSystem.out.println((int) (d + 0.5));\nSystem.out.println(i / 2);","a":"<b>Output:</b><br>9<br>10<br>10<br>4<br>Casting to int truncates (9). round(9.99) is 10. 9.99 + 0.5 = 10.49 truncates to 10. i / 2 is integer division: 9 / 2 = 4."},{"id":"p12jfmwy","l":"r3","t":"Overflow and Casting","v":"hard","q":"Predict the output.","code":"byte b = (byte) 130;\nSystem.out.println(b);\nSystem.out.println((byte) (127 + 1));\nSystem.out.println(127 + 1);","a":"<b>Output:</b><br>-126<br>-128<br>128<br>A byte holds -128 to 127, so values beyond that wrap around: 130 becomes -126 and 128 becomes -128. Without the cast, 127 + 1 is an ordinary int addition giving 128."},{"id":"pdmwhns","l":"r3","t":"Integer Division","v":"medium","q":"Predict the output.","code":"int a = 7, b = 2;\ndouble r1 = a / b;\ndouble r2 = (double) a / b;\ndouble r3 = (double) (a / b);\nSystem.out.println(r1 + \" \" + r2 + \" \" + r3);\nSystem.out.println(1 / 2 + 1 / 2.0);","a":"<b>Output:</b><br>3.0 3.5 3.0<br>0.5<br>r1 and r3 divide the ints first (3) and only then convert to double. In r2 the cast applies to a before division, so the division is done in double: 3.5. In the last line 1 / 2 = 0 and 1 / 2.0 = 0.5."},{"id":"p1ipun1y","l":"l4","t":"String Methods","v":"medium","q":"Predict the output.","code":"String s = \"  Computer Applications  \";\nSystem.out.println(s.length());\nSystem.out.println(s.trim().length());\nSystem.out.println(s.trim().indexOf(\"App\"));\nSystem.out.println(s.trim().charAt(0));","a":"<b>Output:</b><br>25<br>21<br>9<br>C<br>The string has 2 leading spaces, 21 visible characters and 2 trailing spaces (25 in all). After trim(), \"Computer Applications\" has length 21 and \"App\" begins at index 9."},{"id":"pmv43o0","l":"l4","t":"Immutability","v":"medium","q":"Predict the output.","code":"String s = \"BlueJ\";\nString t = s.concat(\"-IDE\");\ns.toUpperCase();\nSystem.out.println(s);\nSystem.out.println(t);\nSystem.out.println(s.replace('u', 'o'));\nSystem.out.println(s);","a":"<b>Output:</b><br>BlueJ<br>BlueJ-IDE<br>BloeJ<br>BlueJ<br>Methods return new strings and never change s. Only the second line uses the concat result stored in t; replace() in the third line is printed but not stored, so s stays BlueJ."},{"id":"p7bp106","l":"l4","t":"compareTo","v":"hard","q":"Predict the output.","code":"System.out.println(\"Delhi\".compareTo(\"Delhi\"));\nSystem.out.println(\"Mumbai\".compareTo(\"Madras\"));\nSystem.out.println(\"cat\".compareTo(\"catalog\"));\nSystem.out.println(\"A\".compareToIgnoreCase(\"a\"));","a":"<b>Output:</b><br>0<br>20<br>-4<br>0<br>Equal strings give 0. \"Mumbai\" vs \"Madras\" differ first at index 1: 'u' - 'a' = 20. \"cat\" is a prefix of \"catalog\", so the result is the difference of lengths 3 - 7 = -4. compareToIgnoreCase() treats A and a alike: 0."},{"id":"pvcqd22","l":"l4","t":"Loops on Strings","v":"medium","q":"Predict the output.","code":"String w = \"education\";\nint c = 0;\nfor (int i = 0; i < w.length(); i++) {\n    if (\"aeiou\".indexOf(w.charAt(i)) >= 0) {\n        System.out.print(i + \" \");\n        c++;\n    }\n}\nSystem.out.println();\nSystem.out.println(c);","a":"<b>Output:</b><br>0 2 4 6 7 <br>5<br>The loop prints the index of every vowel in education (e, u, a, i, o at 0, 2, 4, 6, 7) and counts them."},{"id":"p18ajkuv","l":"l3","t":"Array Traversal","v":"medium","q":"Predict the output.","code":"int a[] = {1, 2, 3, 4, 5};\nfor (int i = 0; i < a.length / 2; i++) {\n    int t = a[i];\n    a[i] = a[a.length - 1 - i];\n    a[a.length - 1 - i] = t;\n}\nfor (int i = 0; i < a.length; i++)\n    System.out.print(a[i] + \" \");","a":"<b>Output:</b> 5 4 3 2 1 <br>The loop runs only half the length (2 times), swapping the first element with the last and the second with the second-last. The middle element stays, so the array is reversed."},{"id":"p118djta","l":"l3","t":"2D Arrays","v":"hard","q":"Predict the output.","code":"int m[][] = {{2, 4, 6}, {1, 3, 5}, {7, 9, 8}};\nint d = 0, ad = 0, c = 0;\nfor (int i = 0; i < 3; i++) {\n    d += m[i][i];\n    ad += m[i][2 - i];\n    c += m[i][1];\n}\nSystem.out.println(d);\nSystem.out.println(ad);\nSystem.out.println(c);","a":"<b>Output:</b><br>13<br>16<br>16<br>Main diagonal: 2 + 3 + 8 = 13. Other diagonal: 6 + 3 + 7 = 16. Middle column: 4 + 3 + 9 = 16."},{"id":"p1fttjie","l":"l3","t":"Bubble Sort","v":"hard","q":"Predict the output.","code":"int a[] = {7, 3, 5, 1};\nfor (int p = 0; p < a.length - 1; p++) {\n    for (int j = 0; j < a.length - 1 - p; j++) {\n        if (a[j] > a[j + 1]) {\n            int t = a[j];\n            a[j] = a[j + 1];\n            a[j + 1] = t;\n        }\n    }\n    for (int j = 0; j < a.length; j++)\n        System.out.print(a[j] + \" \");\n    System.out.println();\n}","a":"<b>Output:</b><br>3 5 1 7 <br>3 1 5 7 <br>1 3 5 7 <br>Each pass bubbles the largest remaining value to the end: 7 goes to the last place in pass 1, 5 in pass 2 and 3 in pass 3."},{"id":"p60cg65","l":"l3","t":"Array as Parameter","v":"hard","q":"Predict the output.","code":"class T {\n    static void change(int x[]) {\n        x[0] = x[0] * 2;\n    }\n    static void swap(int p, int q) {\n        int t = p;\n        p = q;\n        q = t;\n    }\n    public static void main(String[] args) {\n        int a[] = {5, 6};\n        change(a);\n        swap(a[0], a[1]);\n        System.out.println(a[0] + \" \" + a[1]);\n    }\n}","a":"<b>Output:</b> 10 6<br>An array is passed by reference, so change() doubles the real a[0] (5 becomes 10). swap() receives copies of two int values, so the swap affects only its local variables and a stays unchanged."},{"id":"p16a8xly","l":"r7","t":"Nested if","v":"medium","q":"Predict the output.","code":"int marks = 72, att = 70;\nif (marks >= 60) {\n    if (att >= 75)\n        System.out.println(\"Distinction\");\n    else\n        System.out.println(\"Pass\");\n} else\n    System.out.println(\"Fail\");\nSystem.out.println(\"Done\");","a":"<b>Output:</b><br>Pass<br>Done<br>The outer condition is true. The inner condition (70 &gt;= 75) is false, so the inner else prints Pass. Done is outside the if and is always printed."},{"id":"p142darw","l":"r7","t":"switch fall-through","v":"medium","q":"Predict the value displayed.","code":"int n = 2, sum = 10;\nswitch (n) {\n    case 1: sum += 1;\n    case 2: sum += 2;\n    case 3: sum += 3;\n            break;\n    case 4: sum += 4;\n}\nSystem.out.println(sum);","a":"<b>Output:</b> 15<br>Case 2 matches, so sum becomes 12; with no break there it falls into case 3 (sum becomes 15) and stops at break. Case 1 and case 4 are not executed."},{"id":"p1co32ud","l":"r7","t":"Logical Operators","v":"hard","q":"Predict the output.","code":"int x = 15;\nString r = (x % 3 == 0 && x % 5 == 0) ? \"FizzBuzz\" : (x % 3 == 0 ? \"Fizz\" : \"Buzz\");\nSystem.out.println(r);\nSystem.out.println(x > 10 || 10 / (x - 15) > 1);","a":"<b>Output:</b><br>FizzBuzz<br>true<br>15 is divisible by both 3 and 5, so FizzBuzz is chosen. In the second line, x > 10 is true, so || short-circuits and the division by zero is never evaluated; no exception occurs."},{"id":"p1kmrogr","l":"r6","t":"Math Methods","v":"medium","q":"Predict the output.","code":"System.out.println(Math.pow(2, 10));\nSystem.out.println(Math.sqrt(81) + Math.cbrt(8));\nSystem.out.println(Math.abs(-2.5));\nSystem.out.println(Math.max(3, 7.0));","a":"<b>Output:</b><br>1024.0<br>11.0<br>2.5<br>7.0<br>All of these return double values. In Math.max(3, 7.0) the int 3 is widened to double, so the result is 7.0."},{"id":"p8buzop","l":"r6","t":"ceil floor round","v":"medium","q":"Predict the output.","code":"System.out.println(Math.ceil(7.5) + \" \" + Math.floor(7.5) + \" \" + Math.round(7.5));\nSystem.out.println(Math.ceil(-7.5) + \" \" + Math.floor(-7.5) + \" \" + Math.round(-7.5));","a":"<b>Output:</b><br>8.0 7.0 8<br>-7.0 -8.0 -7<br>ceil and floor return doubles; round returns a whole number (no decimal point). For -7.5 ceil gives -7.0, floor gives -8.0 and round gives -7."},{"id":"p1iy2pac","l":"r6","t":"Nested Math calls","v":"hard","q":"Predict the output.","code":"double x = Math.pow(Math.ceil(Math.sqrt(30)), 2) - Math.floor(Math.cbrt(30));\nSystem.out.println(x);\nint n = (int) Math.sqrt(50);\nSystem.out.println(n * n);","a":"<b>Output:</b><br>33.0<br>49<br>sqrt(30) is about 5.48, ceil makes it 6.0, and 6.0 squared is 36.0. cbrt(30) is about 3.1, floor makes it 3.0. 36.0 - 3.0 = 33.0. (int) Math.sqrt(50) truncates 7.07 to 7, and 7 x 7 = 49."},{"id":"p1yzpvly","l":"r8","t":"for loop","v":"medium","q":"Predict the output.","code":"for (int i = 1, j = 10; i < j; i += 2, j -= 2)\n    System.out.print(i + \",\" + j + \" \");","a":"<b>Output:</b> 1,10 3,8 5,6 <br>Both counters change in each iteration. After 5,6 the next values 7 and 4 make i < j false, so the loop stops."},{"id":"p1upwg7n","l":"r8","t":"Digit extraction","v":"medium","q":"Predict the output.","code":"int n = 2468, s = 0, cnt = 0;\nwhile (n > 0) {\n    s += n % 10;\n    n /= 10;\n    cnt++;\n}\nSystem.out.println(s);\nSystem.out.println(cnt);","a":"<b>Output:</b><br>20<br>4<br>The loop strips one digit per iteration (8, 6, 4, 2). The sum of the digits is 20 and the number of digits is 4."},{"id":"p1nh0tsn","l":"r8","t":"break in do-while","v":"hard","q":"Predict the output.","code":"int k = 1;\ndo {\n    if (k % 4 == 0)\n        break;\n    System.out.print(k + \" \");\n    k++;\n} while (k <= 10);\nSystem.out.println();\nSystem.out.println(k);","a":"<b>Output:</b><br>1 2 3 <br>4<br>The loop prints 1, 2 and 3. When k becomes 4, break leaves the loop immediately, so k keeps the value 4."},{"id":"prjswpe","l":"l7","t":"Default and parameterised constructor","v":"easy","q":"Predict the output.","code":"class Pen {\n    String colour;\n    int price;\n    Pen() {\n        colour = \"blue\";\n        price = 10;\n    }\n    Pen(String c) {\n        colour = c;\n        price = 15;\n    }\n    public static void main(String[] args) {\n        Pen a = new Pen();\n        Pen b = new Pen(\"red\");\n        System.out.println(a.colour + \" \" + a.price);\n        System.out.println(b.colour + \" \" + b.price);\n    }\n}","a":"<b>Output:</b><br>blue 10<br>red 15<br>new Pen() runs the default constructor; new Pen(\"red\") runs the one-argument constructor."},{"id":"pwxh7me","l":"l7","t":"this() order of execution","v":"medium","q":"Predict the output.","code":"class Sig {\n    Sig() {\n        System.out.print(\"A\");\n    }\n    Sig(int n) {\n        this();\n        System.out.print(\"B\" + n);\n    }\n    public static void main(String[] args) {\n        new Sig();\n        new Sig(2);\n        System.out.println();\n    }\n}","a":"<b>Output:</b> AAB2<br>new Sig() prints A. new Sig(2) first runs this(), which prints A, and then prints B2."},{"id":"p1qqytg2","l":"l7","t":"Copy constructor","v":"medium","q":"Predict the output.","code":"class Pt {\n    int x, y;\n    Pt(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n    Pt(Pt p) {\n        x = p.x;\n        y = p.y + 1;\n    }\n    public static void main(String[] args) {\n        Pt a = new Pt(2, 3);\n        Pt b = new Pt(a);\n        b.x = 9;\n        System.out.println(a.x + \" \" + a.y + \" \" + b.x + \" \" + b.y);\n    }\n}","a":"<b>Output:</b> 2 3 9 4<br>The copy constructor makes a separate object with y = 3 + 1 = 4. Changing b.x afterwards does not affect a."},{"id":"pzk0vu6","l":"l7","t":"Reference copy vs new object","v":"hard","q":"Predict the output.","code":"class Box {\n    int v;\n    Box(int v) {\n        this.v = v;\n    }\n    void set(int n) {\n        v = n;\n    }\n    public static void main(String[] args) {\n        Box a = new Box(1);\n        Box b = a;\n        Box c = new Box(1);\n        b.set(7);\n        System.out.println(a.v + \" \" + c.v + \" \" + (a == b) + \" \" + (a == c));\n    }\n}","a":"<b>Output:</b> 7 1 true false<br>b = a copies the reference, so a and b are the same object (v = 7, a == b is true). c was built by the constructor as a separate object, so c.v is still 1 and a == c is false."},{"id":"p1y4fvt1","l":"l7","t":"Object-returning method with counter","v":"hard","q":"Predict the output.","code":"class Fr {\n    int n, d;\n    static int made;\n    Fr(int n, int d) {\n        this.n = n;\n        this.d = d;\n        made++;\n    }\n    Fr add(Fr f) {\n        return new Fr(n * f.d + f.n * d, d * f.d);\n    }\n    public static void main(String[] args) {\n        Fr a = new Fr(1, 2);\n        Fr b = new Fr(1, 3);\n        Fr c = a.add(b);\n        System.out.println(c.n + \"/\" + c.d + \" \" + Fr.made);\n    }\n}","a":"<b>Output:</b> 5/6 3<br>1/2 + 1/3 = (1*3 + 1*2)/(2*3) = 5/6. add() creates a third object through the constructor, so made becomes 3."},{"id":"pzthra6","l":"r9","t":"Repeated row number","v":"easy","q":"Predict the output.","code":"class P1 {\n    public static void main(String[] args) {\n        for (int i = 1; i <= 4; i++) {\n            for (int j = 1; j <= i; j++)\n                System.out.print(i);\n            System.out.println();\n        }\n    }\n}","a":"<b>Output:</b><br>1<br>22<br>333<br>4444<br>Row i prints the digit i exactly i times."},{"id":"p1t2ayca","l":"r9","t":"Right-aligned inverted triangle","v":"medium","q":"Predict the exact output (note the leading spaces).","code":"class P2 {\n    public static void main(String[] args) {\n        for (int i = 1; i <= 3; i++) {\n            for (int s = 1; s < i; s++)\n                System.out.print(\" \");\n            for (int j = i; j <= 3; j++)\n                System.out.print(\"*\");\n            System.out.println();\n        }\n    }\n}","a":"<b>Output:</b><div class=\"sample\">***<br> **<br>  *</div>Row i prints i - 1 spaces and then 4 - i stars."},{"id":"p17upkq","l":"r9","t":"Character loop variables","v":"medium","q":"Predict the output.","code":"class P3 {\n    public static void main(String[] args) {\n        for (char c = 'D'; c >= 'A'; c--) {\n            for (char d = c; d <= 'D'; d++)\n                System.out.print(d);\n            System.out.println();\n        }\n    }\n}","a":"<b>Output:</b><br>D<br>CD<br>BCD<br>ABCD<br>The outer char counts down from D to A. Each row prints from the current letter up to D."},{"id":"pecnvb1","l":"r9","t":"char arithmetic without cast","v":"hard","q":"Predict the output.","code":"class P4 {\n    public static void main(String[] args) {\n        for (int i = 0; i < 3; i++) {\n            for (int j = 0; j < 3; j++)\n                System.out.print(('A' + i + j) + \" \");\n            System.out.println();\n        }\n    }\n}","a":"<b>Output:</b><br>65 66 67<br>66 67 68<br>67 68 69<br>'A' + i + j is an int expression (A = 65), and there is no (char) cast, so numbers are printed instead of letters."},{"id":"p1xb9il2","l":"r9","t":"Nested while with step 2","v":"medium","q":"Predict the output.","code":"class P5 {\n    public static void main(String[] args) {\n        int i = 1;\n        while (i <= 3) {\n            int j = i;\n            while (j <= 3) {\n                System.out.print(j);\n                j += 2;\n            }\n            System.out.println();\n            i++;\n        }\n    }\n}","a":"<b>Output:</b><br>13<br>2<br>3<br>For i = 1, j takes 1 and 3 (then 5 stops it). For i = 2, only 2 (next is 4). For i = 3, only 3."},{"id":"p1xjoxhx","l":"r9","t":"Prime series with nested loops","v":"hard","q":"Predict the output.","code":"class P6 {\n    public static void main(String[] args) {\n        int c = 0;\n        for (int i = 2; i <= 10; i++) {\n            boolean p = true;\n            for (int j = 2; j < i; j++) {\n                if (i % j == 0) {\n                    p = false;\n                    break;\n                }\n            }\n            if (p) {\n                System.out.print(i + \" \");\n                c++;\n            }\n        }\n        System.out.println(\"| \" + c);\n    }\n}","a":"<b>Output:</b> 2 3 5 7 | 4<br>The inner loop looks for a divisor of i. Numbers without one (2, 3, 5, 7) are printed, and c counts them."},{"id":"pcduykc","l":"r8","t":"Recurrence series","v":"medium","q":"Predict the output.","code":"class S1 {\n    public static void main(String[] args) {\n        int a = 2;\n        for (int i = 1; i <= 4; i++) {\n            System.out.print(a + \" \");\n            a = a * 2 + 1;\n        }\n        System.out.println();\n    }\n}","a":"<b>Output:</b> 2 5 11 23<br>Each term is twice the previous term plus 1: 2, 5, 11, 23."},{"id":"p5b3jug","l":"r8","t":"1 + 11 + 111 series","v":"medium","q":"Predict the output.","code":"class S2 {\n    public static void main(String[] args) {\n        int t = 0, s = 0;\n        for (int i = 1; i <= 4; i++) {\n            t = t * 10 + 1;\n            s += t;\n        }\n        System.out.println(t + \" \" + s);\n    }\n}","a":"<b>Output:</b> 1111 1234<br>t takes the values 1, 11, 111, 1111 and s accumulates 1 + 11 + 111 + 1111 = 1234."},{"id":"p1jghmv9","l":"r8","t":"Alternating harmonic series","v":"medium","q":"Predict the output.","code":"class S3 {\n    public static void main(String[] args) {\n        double s = 0;\n        int sign = 1;\n        for (int i = 1; i <= 4; i++) {\n            s += sign * 1.0 / i;\n            sign = -sign;\n        }\n        System.out.printf(\"%.2f%n\", s);\n    }\n}","a":"<b>Output:</b> 0.58<br>s = 1 - 1/2 + 1/3 - 1/4 = 0.5833..., printed to two decimal places."},{"id":"pga1y8u","l":"r8","t":"Tribonacci series","v":"hard","q":"Predict the output.","code":"class S4 {\n    public static void main(String[] args) {\n        int a = 0, b = 1, c = 1;\n        for (int i = 1; i <= 6; i++) {\n            System.out.print(a + \" \");\n            int d = a + b + c;\n            a = b;\n            b = c;\n            c = d;\n        }\n        System.out.println();\n    }\n}","a":"<b>Output:</b> 0 1 1 2 4 7<br>Each new term is the sum of the previous three terms, so the series is 0, 1, 1, 2, 4, 7."},{"id":"p1iv2fip","l":"r3","t":"Type Casting","v":"hard","q":"Predict the output of both statements.","code":"int a = 5, b = 2;\nSystem.out.println(a / b);\nSystem.out.println((double) a / b);","a":"<b>Output:</b> 2 then 2.5<br>a/b is integer division → 2. Casting one operand to double forces real division → 2.5.","tags":["trick"]},{"id":"pwx2ean","l":"r7","t":"Switch fall-through","v":"medium","q":"What gets printed?","code":"int x = 2;\nswitch(x){\n  case 1: System.out.print(\"A\");\n  case 2: System.out.print(\"B\");\n  case 3: System.out.print(\"C\"); break;\n  default: System.out.print(\"D\");\n}","a":"<b>Output:</b> BC<br>Starts at case 2, falls through into case 3, then break stops.","tags":["imp"]},{"id":"p142gamx","l":"l6","t":"Static keyword","v":"medium","q":"What is the final value of count?","code":"class Counter{\n  static int count = 0;\n  Counter(){ count++; }\n}\n// 3 objects of Counter are created","a":"<b>3.</b> A static variable has one shared copy, so every constructor call increments the same variable.","tags":["imp"]},{"id":"p1bz36n","l":"r9","t":"Nested loops","v":"medium","q":"Predict the exact output.","code":"for(int i=1;i<=3;i++){\n  for(int j=1;j<=i;j++){\n    System.out.print(\"*\");\n  }\n  System.out.println();\n}","a":"<b>Output:</b><br>*<br>**<br>***<br>The inner loop's limit depends on the outer counter.","tags":["imp"]},{"id":"pmuexwa","l":"l4","t":"Strings","v":"hard","q":"What does each line print?","code":"String s1 = \"Java\";\nString s2 = new String(\"Java\");\nSystem.out.println(s1 == s2);\nSystem.out.println(s1.equals(s2));","a":"<b>Output:</b> false then true.<br>== compares references (two different objects); equals() compares content. Always use equals() for Strings.","tags":["trick"]},{"id":"p1e900xe","l":"r4","t":"Increment operators","v":"hard","q":"Predict the value of b.","code":"int a = 5;\nint b = a++ + ++a;\nSystem.out.println(b);","a":"<b>12.</b> a++ uses 5 (a becomes 6); ++a makes a 7 and uses 7 → 5 + 7.","tags":["trick"]},{"id":"p16lx46n","l":"l3","t":"Arrays","v":"easy","q":"What happens when this executes?","code":"int arr[] = {4, 8, 1, 9};\nSystem.out.println(arr[4]);","a":"<b>Runtime error:</b> ArrayIndexOutOfBoundsException. Valid indices are 0–3.","tags":[]},{"id":"p4loboe","l":"l5","t":"Method Overloading","v":"hard","q":"Which version runs and what is printed?","code":"void show(int a){ System.out.println(\"int: \"+a); }\nvoid show(double a){ System.out.println(\"double: \"+a); }\n// called as show(5);","a":"<b>int: 5</b> — the exact type match (int) is chosen first.","tags":["trick"]},{"id":"p1lo5y0n","l":"r8","t":"do-while","v":"medium","q":"Give the output and the number of times the loop executes.","code":"int K = 1;\ndo {\n  K += 2;\n  System.out.println(K);\n} while (K <= 6);","a":"<b>Output:</b> 3, 5, 7 (each on a new line). <b>Loop runs 3 times</b> — 7 is printed before 7 <= 6 is checked.","tags":["y26"]},{"id":"pn4xm4b","l":"l4","t":"Strings","v":"easy","q":"Predict the output.","code":"String S = \"GRACIOUS\".substring(4);\nSystem.out.println(S);\nSystem.out.println(\"GLAMOROUS\".endsWith(S));","a":"<b>IOUS</b> then <b>false</b>. substring(4) gives \"IOUS\"; \"GLAMOROUS\" ends with \"ROUS\", not \"IOUS\".","tags":["y26"]},{"id":"p17oup3w","l":"r5a","t":"Logical error","v":"hard","q":"This should print the factorial of 5. Name the error type and fix it.","code":"int p, n = 5, f = 0;\nfor(p = n; p > 0; p--)\n  f *= p;\nSystem.out.println(f);","a":"<b>Logical error</b> — it compiles and runs, but prints 0 because f starts at 0 (anything × 0 = 0). Fix: <b>int f = 1;</b>","tags":["y26","trick"]},{"id":"pqnwmtq","l":"r5a","t":"Compile-time error","v":"hard","q":"Identify the type of error and correct it.","code":"double area(double r, double h){\n  double l, a;\n  a = 22.0 / 7 * r * l;\n  l = Math.sqrt(r*r + h*h);\n  return a;\n}","a":"<b>Compile-time error</b> — variable l is used before it is given a value. Fix: compute <b>l = Math.sqrt(r*r + h*h);</b> first, then <b>a = 22.0/7 * r * l;</b>","tags":["y25","trick"]},{"id":"p9wsymb","l":"r8","t":"Loop with semicolon","v":"hard","q":"What is the output?","code":"int p = 0;\nfor(p = 4; p > 0; p -= 2);\nSystem.out.print(p);\nSystem.out.println(p);","a":"<b>00</b> — the ';' gives the loop an empty body; it stops when p = 0.","tags":["y25","trick"]},{"id":"pm8mcrb","l":"l4","t":"Loops on Strings","v":"easy","q":"Output and number of iterations?","code":"String s = \"JAVA\";\nfor(int i = 0; i < s.length(); i += 2)\n  System.out.println(s.substring(i));","a":"<b>JAVA</b> and <b>VA</b> — the loop runs 2 times (i = 0 and 2).","tags":["y25"]},{"id":"p191j0hi","l":"r6","t":"Math Library","v":"easy","q":"Predict the output.","code":"System.out.println(Math.ceil(6.4) + Math.floor(-1.2));","a":"<b>Output:</b> 5.0<br>Math.ceil(6.4) = 7.0 and Math.floor(-1.2) = -2.0 (floor goes to the lower whole number). 7.0 + (-2.0) = 5.0.","tags":["imp"]},{"id":"p2vwel3","l":"l2","t":"Char Arithmetic","v":"hard","q":"Predict the output.","code":"char ch = 'B';\nchar chr = Character.toLowerCase(ch);\nint n = (int) chr - 10;\nSystem.out.println((char) n + \"\\t\" + chr);","a":"<b>Output:</b> X (tab) b<br>chr = 'b' whose ASCII code is 98. n = 98 - 10 = 88, and (char) 88 is 'X'. A tab separates the two characters.","tags":["imp","trick"]},{"id":"pqhes3h","l":"r8","t":"Loops","v":"medium","q":"What is printed, and how many times does the loop run?","code":"int x = 10;\nwhile (true)\n{\n  System.out.println(x++ * 2);\n  if (x % 3 == 0)\n    break;\n}","a":"<b>Output:</b> 20 and 22 (the loop runs 2 times)<br>x = 10 prints 20, x becomes 11 and 11 % 3 is not 0. x = 11 prints 22, x becomes 12 and 12 % 3 = 0, so break.","tags":["imp"]},{"id":"pst14iw","l":"l4","t":"Strings","v":"hard","q":"Predict both outputs.","code":"String x = \"Galaxy\", y = \"Games\";\nSystem.out.println(x.charAt(0) == y.charAt(0));\nSystem.out.println(x.compareTo(y));","a":"<b>Output:</b> true then -1<br>Both strings start with 'G'. At index 2 the characters are 'l' (108) and 'm' (109). compareTo returns the difference 108 - 109 = -1.","tags":["trick"]},{"id":"p13yq5dp","l":"r5a","t":"Error Finding","v":"medium","q":"Identify the type of error and correct the code.","code":"String x = \"25\";\nint y = Double.parseDouble(x);\ndouble r = Math.sqrt(y);\nSystem.out.println(r);","a":"<b>Syntax (compile-time) error.</b> Double.parseDouble() returns a double, which cannot be stored in an int without a cast.<br>Correction: <code class='inline'>double y = Double.parseDouble(x);</code> The program then prints <b>5.0</b>.","tags":["imp"]},{"id":"p137o9ws","l":"r4","t":"String Concatenation","v":"hard","q":"Predict the output of both statements.","code":"int a = 3;\nSystem.out.println(\" \" + (1 + a));\nSystem.out.println(\" \" + 1 + a);","a":"<b>Output:</b> 4 and then 13 (each with a leading space)<br>In the first line the brackets make 1 + a = 4 first. In the second line the string comes first, so 1 and then 3 are joined to it as text.","tags":["trick"]},{"id":"p1yxurce","l":"r4","t":"Increment Operators","v":"hard","q":"Predict the output.","code":"int a = 8, b = 14;\nint r = --a + b-- + a;\nSystem.out.println(r + \" \" + a + \" \" + b);","a":"<b>Output:</b> 28 7 13<br>--a makes a = 7 and uses 7. b-- uses 14 and then b becomes 13. The last a is now 7. r = 7 + 14 + 7 = 28.","tags":["trick"]},{"id":"plrwal4","l":"l4","t":"Strings","v":"hard","q":"What is printed?","code":"String s = \"I N T E R\";\nString t = s.trim();\nSystem.out.println(t.length());","a":"<b>9</b><br>trim() removes only the spaces at the two ends, and this string has none there. The spaces inside stay, so the length is 5 letters + 4 spaces = 9.","tags":["trick"]},{"id":"p1vyaxaa","l":"r4","t":"Compound Assignment","v":"hard","q":"Predict the output.","code":"int a = 15, b = 10;\na *= ++a / 6 + b++ % 3 + 4;\nSystem.out.println(a + \" \" + b);","a":"<b>Output:</b> 105 11<br>Java reads the left value of a (15) first. Then the right side: ++a makes a = 16, so 16 / 6 = 2; b++ % 3 = 10 % 3 = 1 (b becomes 11); the right side is 2 + 1 + 4 = 7. The result is 15 * 7 = 105.","tags":["trick","imp"]},{"id":"ptyzs38","l":"l5","t":"Method Overloading","v":"hard","q":"What is printed by the three calls?","code":"static void show(int a)    { System.out.print(\"int \"); }\nstatic void show(double a) { System.out.print(\"double \"); }\n// in main:\nshow(5);\nshow(5.0);\nshow('A');","a":"<b>Output:</b> int double int<br>show(5) matches int, show(5.0) matches double. The char 'A' is widened to the nearest matching type, which is int (65), not double.","tags":["trick"]},{"id":"p1qzfrc4","l":"l3","t":"2D Arrays","v":"medium","q":"Predict the output.","code":"int a[][] = {{1, 2, 3}, {4, 5, 6}};\nfor (int r = 0; r < 2; r++)\n{\n  int s = 0;\n  for (int c = 0; c < 3; c++)\n    s += a[r][c];\n  System.out.print(s + \" \");\n}","a":"<b>Output:</b> 6 15<br>The inner loop adds one row at a time: 1 + 2 + 3 = 6 and 4 + 5 + 6 = 15.","tags":["imp"]},{"id":"p1s5kzc6","l":"l2","t":"Char Arithmetic","v":"hard","q":"Predict the output.","code":"char c = 'a';\nc += 2;\nSystem.out.println(c);\nSystem.out.println(c + 1);","a":"<b>Output:</b> c then 100<br>The compound assignment c += 2 casts the result back to char, so c is 'c' (99). In c + 1 the char is promoted to int, which gives 100.","tags":["trick"]},{"id":"p17nmn9d","l":"l4","t":"Strings","v":"easy","q":"Predict the output.","code":"String s = \"ICSE Boards\";\nSystem.out.println(s.substring(5).toUpperCase().charAt(2));","a":"<b>Output:</b> A<br>s.substring(5) is \"Boards\", toUpperCase() makes it \"BOARDS\", and charAt(2) is the third character, 'A'.","tags":["imp"]},{"id":"povowzo","l":"r4","t":"Operators","v":"hard","q":"Predict the final value of x.","code":"int x = 10;\nx = x++ + ++x;\nSystem.out.println(x);","a":"<b>Output: 22</b><br>x++ uses the current value 10 (x becomes 11 right after). ++x then makes x 12 and uses 12. Sum = 10 + 12 = 22, which is stored back into x (overwriting the 12).","tags":["trick"]},{"id":"perlsnx","l":"r8","t":"Loops","v":"medium","q":"Predict the output of this loop.","code":"for(int i = 1; i < 10; i++)\n{\n    System.out.print(i++);\n}","a":"<b>Output: 13579</b><br>Inside the body, i++ prints the current value and THEN increments i again (on top of the loop's own i++). So i effectively increases by 2 every pass: it prints 1,3,5,7,9 and stops once i reaches 10.","tags":["imp"]},{"id":"pav2qws","l":"r7","t":"Conditional Statements","v":"medium","q":"What are the values of x and y after this code runs, if n = 1?","code":"int n = 1, x = 0, y = 0;\nif(n > 0)\n{\n    x = x + 1;\n    y = y + 1;\n}","a":"<b>x = 1, y = 1.</b> Since n = 1 makes the condition (n &gt; 0) true, both statements inside the if-block execute once.","tags":["imp"]},{"id":"puvpkkl","l":"r6","t":"Math Library","v":"easy","q":"Predict both outputs.","code":"double x = 2.9, y = 2.5;\nSystem.out.println(Math.min(Math.floor(x), y));\nSystem.out.println(Math.max(Math.ceil(x), y));","a":"<b>Output: 2.0 then 3.0</b><br>Math.floor(2.9) = 2.0; min(2.0, 2.5) = 2.0. Math.ceil(2.9) = 3.0; max(3.0, 2.5) = 3.0.","tags":["imp"]},{"id":"pw8lwbb","l":"r8","t":"Loops","v":"hard","q":"How many times does this loop print a value, and what is the final value of 'counter' after the loop ends?","code":"int counter = 1;\ndo\n{\n    System.out.println(counter);\n    counter++;\n}\nwhile(counter <= 5);","a":"<b>Prints 5 times (1,2,3,4,5). Final value of counter = 6.</b> The loop keeps incrementing counter until counter becomes 6, at which point 6 &lt;= 5 is false and the loop stops — but counter itself has already become 6 by then.","tags":["trick"]},{"id":"pefg7q5","l":"r4","t":"Operators","v":"hard","q":"Predict the output.","code":"int x = 7, y = 5;\nSystem.out.println(x += x++ + ++y);","a":"<b>Output: 20</b><br>For a compound assignment x += ..., Java reads the current value of x (7) ONCE, right at the start, to use in the final addition. Then it evaluates the right side: x++ returns 7 (x becomes 8 as a side effect), and ++y makes y 6 and returns 6, so the right side totals 7 + 6 = 13. Finally x is set to the value captured at the start PLUS this total: 7 + 13 = 20 — this overwrites the 8 that x briefly held after x++.","tags":["trick"]},{"id":"pu054la","l":"r9","t":"Nested Loops","v":"medium","q":"Predict the exact output.","code":"for(int i = 1; i <= 3; i++)\n{\n    for(int j = 1; j <= i; j++)\n    {\n        System.out.print(j + \" \");\n    }\n    System.out.println();\n}","a":"<b>Output:</b><br>1 <br>1 2 <br>1 2 3 <br>The inner loop's upper limit depends on the outer loop's current counter i — this is the standard nested-loop pattern structure.","tags":["imp"]},{"id":"pyxgnwu","l":"r8","t":"Loops","v":"hard","q":"What is the output? (Look carefully at the punctuation.)","code":"int p = 0;\nfor(p = 4; p > 0; p -= 2);\nSystem.out.print(p);\nSystem.out.println(p);","a":"<b>Output: 00</b><br>The semicolon right after the for(...) gives the loop an EMPTY body — nothing inside it actually runs each pass except the update. The loop silently counts p down to 0 and stops; both print statements then output the final value of p, which is 0.","tags":["trick"]},{"id":"pqhfeuh","l":"r3","t":"Values & Data Types","v":"easy","q":"What is the output?","code":"int a = 97;\nchar b = (char) a;\nSystem.out.println(b);","a":"<b>Output: a</b><br>97 is the ASCII/Unicode value of the lowercase letter 'a'. Explicit casting of an int to char converts the number into the corresponding character.","tags":["imp"]},{"id":"p9v0pz7","l":"r4","t":"Operators","v":"easy","q":"Predict the value of n.","code":"int p = 5, q = 19;\nint n = (q - p) > (p - q) ? (q - p) : (p - q);\nSystem.out.println(n);","a":"<b>Output: 14</b><br>q - p = 14 and p - q = -14. Since 14 &gt; -14 is true, the ternary operator selects (q - p), which is 14.","tags":["imp"]},{"id":"pcbzcy7","l":"r7","t":"Switch","v":"hard","q":"What is printed, and why do cases 'A' and 'B' share one output?","code":"char grade = 'B';\nswitch(grade)\n{\n    case 'A':\n    case 'B':\n        System.out.println(\"Good\");\n        break;\n    case 'C':\n        System.out.println(\"Average\");\n        break;\n    default:\n        System.out.println(\"Invalid\");\n}","a":"<b>Output: Good</b><br>Case 'A' has no statements of its own, so it deliberately falls through into case 'B'. This is a common, INTENTIONAL use of fall-through to group multiple case labels under one action.","tags":["trick"]},{"id":"po291tg","l":"r8","t":"Loops","v":"medium","q":"Predict the value of sum.","code":"int sum = 0;\nfor(int i = 1; i <= 10; i++)\n{\n    if(i % 2 == 0)\n        continue;\n    sum += i;\n}\nSystem.out.println(sum);","a":"<b>Output: 25</b><br>continue skips the rest of the current pass whenever i is even, so only the odd numbers 1,3,5,7,9 get added to sum: 1+3+5+7+9 = 25.","tags":["imp"]},{"id":"ps98fnj","l":"r8","t":"Iterative Constructs","v":"medium","q":"Give the output when a = 6 and b = 4.","code":"for (k = a; k <= a*b; k += a)\n{\n    if (k % b == 0)\n        break;\n}\nSystem.out.println(k);","a":"<b>Output:</b> 12<br>k = 6 gives 6 % 4 = 2, not zero. k = 12 gives 12 % 4 = 0, so the loop breaks and 12 is printed."},{"id":"p1frmlqc","l":"l2","t":"Character Class","v":"medium","q":"Kamal wants to display only the letters in a character array, but the code does not compile. Find the faulty statements and correct them.","code":"char arr[] = {'4', '&', 'a', 'w', 'd'};\nint i;\nfor (i = 0; i < arr.length; i++)\n{\n    if (Character.isLetter(arr))\n        System.out.println(arr);\n}","a":"<b>Error:</b> isLetter(arr) and println(arr) use the whole array instead of one element.<br><b>Correct:</b> <code class=\"inline\">if (Character.isLetter(arr[i]))</code> and <code class=\"inline\">System.out.println(arr[i]);</code><br>Output: a, w, d (one per line)."},{"id":"phzf5p9","l":"r4","t":"Increment and Decrement","v":"easy","q":"Give the output.","code":"int lives = 5;\nSystem.out.println(lives--);\nSystem.out.println(lives);","a":"<b>Output:</b><br>5<br>4<br>Post-decrement uses the value 5 first and reduces it to 4 afterwards."},{"id":"p169sn1o","l":"l3","t":"Arrays","v":"medium","q":"Give the output.","code":"int x[] = {2, 45, 7, 67, 12, 3};\nint i, t = 0;\nfor (i = 0, t = 5; i < 3; i++, t--)\n{\n    System.out.println(x[i] + x[t]);\n}","a":"<b>Output:</b><br>5<br>57<br>74<br>i = 0, t = 5: 2 + 3 = 5. i = 1, t = 4: 45 + 12 = 57. i = 2, t = 3: 7 + 67 = 74."},{"id":"p9ovoky","l":"l8","t":"Scope of Variables","v":"medium","q":"Will this segment run successfully? If not, state the type of error and correct it.","code":"for (int k = 1; k <= 5; k++)\n    System.out.println(k);\nSystem.out.println(k);","a":"<b>No.</b> It is a syntax (compile-time) error.<br>k is declared inside the for statement, so its scope ends with the loop and the last println cannot see it.<br><b>Correct:</b> declare k before the loop: <code class=\"inline\">int k; for (k = 1; k <= 5; k++)</code>."},{"id":"p1tc3d1e","l":"r9","t":"Nested Loops","v":"medium","q":"Give the output.","code":"for (r = 1; r <= 3; r++)\n{\n    for (c = 1; c < r; c++)\n    {\n        System.out.println(r);\n    }\n}","a":"<b>Output:</b><br>2<br>3<br>3<br>For r = 1 the inner loop does not run. r = 2 prints once and r = 3 prints twice."},{"id":"p1k3ida4","l":"l4","t":"String Methods","v":"medium","q":"Give the output.","code":"void encode()\n{\n    String s = \"DICe\";\n    char ch;\n    for (int i = 0; i < 4; i++)\n    {\n        ch = s.charAt(i);\n        if (\"AEIOUaeiou\".indexOf(ch) >= 0)\n            System.out.println(\"@\");\n        else\n            System.out.println(ch);\n    }\n}","a":"<b>Output:</b><br>D<br>@<br>C<br>@<br>Vowels (I and e) are replaced by @."},{"id":"p1robgus","l":"r8","t":"Iterative Constructs","v":"medium","q":"How many times is the loop executed? Give the output.","code":"for (k = 10; k <= 20; k += 4)\n{\n    System.out.println(k);\n    if (k % 3 == 0) continue;\n}","a":"<b>Output:</b><br>10<br>14<br>18<br>The loop executes <b>3 times</b> (k = 10, 14, 18). At k = 22 the condition fails. The continue is the last statement, so it has no effect."},{"id":"p1tb40ga","l":"r4","t":"Operators","v":"medium","q":"Give the output.","code":"int x = 10, y = 15, z = 25;\nSystem.out.println(z != (y % z + x));\nSystem.out.println(x > y || y < z);","a":"<b>Output:</b><br>false<br>true<br>y % z + x = 15 + 10 = 25, so 25 != 25 is false. x > y is false but y < z is true, so || gives true."},{"id":"p17xk8zj","l":"r7","t":"Switch","v":"hard","q":"Give the output when ch = 13 and when ch = 19.","code":"switch (ch)\n{\n    case 13: System.out.println(Math.max(79, 87));\n    case 17: System.out.println(Math.min(-543, -734));\n    default: System.out.println(Math.floor(74.3));\n}","a":"<b>ch = 13:</b> 87, -734, 74.0 (there is no break, so all three lines run).<br><b>ch = 19:</b> 74.0 (no case matches, so default runs)."},{"id":"p1wxnklc","l":"r3","t":"Values and Data Types","v":"hard","q":"Give the output.","code":"System.out.print('A' + \"\" + 'B');\nSystem.out.println('A' + 'B');","a":"<b>Output:</b> AB131<br>The first print joins two characters into a String \"AB\". In the second, 'A' + 'B' is arithmetic: 65 + 66 = 131."},{"id":"p1bbms9d","l":"r9","t":"Nested Loops","v":"medium","q":"Give the output and say which loop controls the number of rows.","code":"for (int i = 1; i <= 3; i++)\n{\n    for (int j = 3; j >= i; j--)\n    {\n        System.out.print(\"*\");\n    }\n    System.out.println();\n}","a":"<b>Output:</b><br>***<br>**<br>*<br>The outer loop (i) controls the number of rows."},{"id":"plnf0bf","l":"r8","t":"Iterative Constructs","v":"medium","q":"The loop below is meant to find the factorial of n but always prints 0. Identify the type of error and correct it.","code":"void factorial(int n)\n{\n    int p = 1, k;\n    for (k = 0; k <= n; k++)\n        p = p * k;\n    System.out.println(p);\n}","a":"<b>Logical error.</b> k starts at 0, so p is multiplied by 0 at once.<br><b>Correct:</b> <code class=\"inline\">for (k = 1; k <= n; k++)</code>."},{"id":"p1ffsmqi","l":"r8","t":"Iterative Constructs","v":"hard","q":"Akshat wants the sum of all two-digit even integers divisible by 3, but the result is wrong. Identify the errors and correct the code.","code":"int a, sum = 0;\nfor (a = 10; a < 999; a++)\n{\n    if (a % 2 == 0 || a % 3 == 0)\n        sum += a;\n}\nSystem.out.println(\"RESULT = \" + sum);","a":"<b>Logical errors:</b> (1) the range should stop at 99, not 998; (2) || should be &amp;&amp; because the number must be divisible by both.<br><b>Correct:</b> <code class=\"inline\">for (a = 10; a <= 99; a++)</code> and <code class=\"inline\">if (a % 2 == 0 &amp;&amp; a % 3 == 0)</code>."},{"id":"p1ct9c4t","l":"r8","t":"Iterative Constructs","v":"hard","q":"Give the output of this while loop, and rewrite it with a for loop so that the output is unchanged.","code":"int i = 1;\nwhile (++i <= 10)\n    System.out.println(i);","a":"<b>Output:</b> 2 3 4 5 6 7 8 9 10 (one per line). i is incremented before it is compared.<br><b>for loop:</b> <code class=\"inline\">for (i = 2; i <= 10; i++) System.out.println(i);</code>"},{"id":"p111gfht","l":"r3","t":"Type Casting","v":"easy","q":"Name the type of type casting in each statement.","code":"double m = 'b';\nchar ch = (char) 68;","a":"<b>(a)</b> Implicit type casting (a char is widened to double automatically).<br><b>(b)</b> Explicit type casting (the cast operator (char) is written by the programmer)."}],"theory":[{"id":"hc5lyk6","l":"r1","t":"Class and object","v":"easy","q":"Define a class and an object. Give one example of each.","a":"<p><b>Class:</b> a template (blueprint) that defines the attributes and behaviour common to a group of similar objects. Example: <b>Student</b>.</p><p><b>Object:</b> an instance of a class with its own state, behaviour and identity. Example: a particular student <b>Ravi</b> of class Student.</p>"},{"id":"hcsb1xc","l":"r1","t":"Procedural vs OOP","v":"medium","q":"Differentiate between procedural programming and object oriented programming.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Procedural programming</th><th>Object oriented programming</th></tr></thead><tbody><tr><td>Emphasis on procedures (functions)</td><td>Emphasis on data (objects)</td></tr><tr><td>Follows the top-down approach</td><td>Follows the bottom-up approach</td></tr><tr><td>Data is global and less secure</td><td>Data is hidden inside objects, so more secure</td></tr><tr><td>Little scope for reuse</td><td>Reuse through inheritance</td></tr><tr><td>Examples: C, Pascal</td><td>Examples: Java, C++</td></tr></tbody></table></div>"},{"id":"h1ppzgil","l":"r1","t":"Encapsulation","v":"medium","q":"What is encapsulation? How does it help in data security? Give a real-life example.","a":"<p>Encapsulation is the process of binding the data (attributes) and the functions (methods) that act on the data into a single unit called a class.</p><p>The data is kept private and can be reached only through the public methods of the class, so outside code cannot change it wrongly. This protects the data.</p><p><b>Example:</b> a medicine capsule holds its contents inside a cover; a bank account balance can be changed only through deposit/withdraw operations.</p>"},{"id":"hzm4t06","l":"r1","t":"Abstraction vs encapsulation","v":"hard","q":"Differentiate between abstraction and encapsulation.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Abstraction</th><th>Encapsulation</th></tr></thead><tbody><tr><td>Shows only the essential features, hides the details</td><td>Binds data and methods into one unit</td></tr><tr><td>Works at the design level (what an object does)</td><td>Works at the implementation level (how data is protected)</td></tr><tr><td>Example: using a TV remote without knowing its circuit</td><td>Example: the circuit and buttons packed inside the remote</td></tr></tbody></table></div>"},{"id":"h1b1gk8u","l":"r1","t":"Inheritance","v":"easy","q":"Define inheritance. State any two advantages of it.","a":"<p>Inheritance is the process by which a class (derived/sub class) acquires the properties and behaviour of another class (base/super class). Example: Car inherits from Vehicle.</p><ul><li>Reusability of code: existing code need not be written again.</li><li>The derived class can add new features, so a program is easier to extend and maintain.</li></ul>"},{"id":"hnccpbo","l":"r1","t":"Polymorphism","v":"medium","q":"What is polymorphism? Explain with a real-life example.","a":"<p>Polymorphism means 'many forms': the same name or operation behaves differently in different situations.</p><p><b>Example:</b> a person is a teacher at school, a son at home and a customer in a shop. In programming, a method area() can compute the area of a circle or of a rectangle depending on the arguments or object.</p>"},{"id":"hcpzjxq","l":"r1","t":"Advantages of OOP","v":"medium","q":"State any four advantages of Object Oriented Programming.","a":"<ol><li>Code reusability through inheritance.</li><li>Data security through encapsulation and data hiding.</li><li>Easy to maintain and modify because programs are divided into objects.</li><li>Models real-world problems naturally (objects, classes).</li><li>Polymorphism gives flexibility.</li></ol><p>(Any four.)</p>"},{"id":"hb12n2c","l":"r2","t":"Class vs object","v":"easy","q":"Differentiate between a class and an object.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Class</th><th>Object</th></tr></thead><tbody><tr><td>Blueprint/template</td><td>Instance of a class</td></tr><tr><td>Logical entity; no memory for data until object creation</td><td>Real entity; occupies memory</td></tr><tr><td>Defined once</td><td>Many can be created from one class</td></tr><tr><td>Example: Car</td><td>Example: a particular red Maruti car</td></tr></tbody></table></div>"},{"id":"hg9qyrg","l":"r2","t":"Characteristics of an object","v":"medium","q":"State the three characteristics of an object. Illustrate each with an object of class Account.","a":"<ul><li><b>State:</b> values of its attributes, e.g. accNo = 101, balance = 5000.</li><li><b>Behaviour:</b> what it can do, i.e. its methods, e.g. deposit(), withdraw().</li><li><b>Identity:</b> a unique name/reference that distinguishes it from other objects, e.g. the reference variable a1.</li></ul>"},{"id":"h13ke03n","l":"r2","t":"Data members and methods","v":"easy","q":"Differentiate between data members and member methods of a class.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Data members</th><th>Member methods</th></tr></thead><tbody><tr><td>Variables that store the state of an object</td><td>Functions that define the behaviour of an object</td></tr><tr><td>Example: int roll;</td><td>Example: void show()</td></tr></tbody></table></div>"},{"id":"h19owccn","l":"r2","t":"Reference variable","v":"medium","q":"Explain the statement Student s1 = new Student();","a":"<div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>Student s1 = new Student();</code></pre></div><ul><li><b>Student s1</b> declares a reference variable s1 of class Student.</li><li><b>new</b> allocates memory for a new Student object.</li><li><b>Student()</b> calls the constructor to initialise the object.</li><li>= stores the address of the new object in s1.</li></ul>"},{"id":"hp2ja0m","l":"r2","t":"Role of new","v":"hard","q":"What is the role of the new operator? What happens if it is not used before calling a method on a reference variable?","a":"<p>new allocates memory for the object, initialises it by calling the constructor and returns its reference.</p><p>If no object has been created, the reference variable holds null (or is unassigned), and calling a method through it causes a NullPointerException at run time (or a compile-time error for an uninitialised local variable).</p>"},{"id":"hindudd","l":"r2","t":"Two references, one object","v":"hard","q":"Explain with an example how two reference variables can refer to the same object.","a":"<div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>Student s1 = new Student();\nStudent s2 = s1;</code></pre></div><p>Only one object is created (by new). The assignment s2 = s1 copies the reference, not the object. So s1 and s2 both point to the same object, and a change made through s2 is also visible through s1.</p>"},{"id":"h11qgbl2","l":"r2","t":"BlueJ","v":"medium","q":"Describe how you would create a class and an object in BlueJ.","a":"<ol><li>Click <b>New Class</b>, type the class name and press OK; a rectangle appears in the project window.</li><li>Double-click it to open the editor, write the data members and methods and click <b>Compile</b>.</li><li>Right-click the compiled class and choose <b>new ClassName()</b>; give an object name. The object appears on the Object Bench.</li></ol>"},{"id":"h148yite","l":"r5a","t":"Features of Java","v":"easy","q":"State any four features of Java.","a":"<ol><li><b>Simple:</b> syntax is easy and free from pointers and operator overloading.</li><li><b>Object oriented:</b> programs are built from classes and objects.</li><li><b>Platform independent / portable:</b> bytecode runs on any system with a JVM.</li><li><b>Secure:</b> no explicit pointers; bytecode is verified before execution.</li><li><b>Robust:</b> strong type checking, exception handling and automatic garbage collection.</li></ol><p>(Any four.)</p>"},{"id":"hzgb0g9","l":"r5a","t":"Bytecode and JVM","v":"medium","q":"What is bytecode? What is the role of the JVM?","a":"<p>Bytecode is the intermediate, machine-independent code produced by the Java compiler and stored in a .class file.</p><p>The JVM (Java Virtual Machine) is software that loads, verifies and executes the bytecode on the host machine by converting it into the machine's instructions. Each platform has its own JVM, which makes Java platform independent.</p>"},{"id":"h1voqaa2","l":"r5a","t":"Compiler vs interpreter","v":"medium","q":"Differentiate between a compiler and an interpreter.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Compiler</th><th>Interpreter</th></tr></thead><tbody><tr><td>Translates the whole program at once</td><td>Translates and executes one statement at a time</td></tr><tr><td>Lists all errors after translation</td><td>Stops at the first error</td></tr><tr><td>Creates an object/bytecode file</td><td>Creates no separate file</td></tr><tr><td>Example: javac</td><td>Example: JVM (executes bytecode)</td></tr></tbody></table></div>"},{"id":"h1vnlgbl","l":"r5a","t":"Tokens","v":"medium","q":"What are tokens? Name any four types with one example each.","a":"<p>Tokens are the smallest individual units of a Java program.</p><ul><li>Keyword: class</li><li>Identifier: total</li><li>Literal: 25</li><li>Operator: +</li><li>Separator: ;</li></ul>"},{"id":"hmh3y65","l":"r5a","t":"Types of errors","v":"medium","q":"Differentiate between syntax error, runtime error and logical error with one example each.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Error</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>Syntax</td><td>Violation of language rules; detected by the compiler</td><td>Missing semicolon</td></tr><tr><td>Runtime</td><td>Occurs while the program is running and stops it</td><td>Division by zero (int)</td></tr><tr><td>Logical</td><td>Program runs but output is wrong</td><td>Using + instead of * in a formula</td></tr></tbody></table></div>"},{"id":"h1xs30s7","l":"r5a","t":"Comments","v":"easy","q":"Name the types of comments in Java. Why are comments used?","a":"<ul><li>Single line: <b>// comment</b></li><li>Multi-line: <b>/* comment */</b></li><li>Documentation: <b>/** comment */</b></li></ul><p>Comments explain the program to the reader and are ignored by the compiler.</p>"},{"id":"h1p42mou","l":"r5a","t":"Identifiers","v":"easy","q":"State any three rules for naming an identifier in Java.","a":"<ul><li>It may contain letters, digits, underscore (_) and dollar ($) only; no spaces or other symbols.</li><li>It must not begin with a digit.</li><li>It must not be a keyword, and it is case sensitive.</li></ul>"},{"id":"h19j8ar3","l":"r5a","t":"Program structure","v":"hard","q":"Explain the basic structure of a Java program with a simple example.","a":"<div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>public class Hello {\n    public static void main(String[] args) {\n        System.out.println(\"Hello\");\n    }\n}</code></pre></div><ul><li>The program is written inside a <b>class</b>, whose name matches the file name.</li><li>Execution starts from the <b>main()</b> method.</li><li>Statements end with a semicolon and blocks are enclosed in braces.</li><li>System.out.println() displays output.</li></ul>"},{"id":"hkzmmj","l":"l8","t":"Encapsulation","v":"easy","q":"Define encapsulation. How does it help in data hiding?","a":"<p>Encapsulation is the binding of data members and the member methods that operate on them into a single unit (class).</p><p>The data members are declared private, so they cannot be accessed directly from outside the class; they are reached only through public methods. This hides the data and protects it from unwanted change.</p>"},{"id":"h1balbse","l":"l8","t":"Data hiding","v":"easy","q":"What is data hiding? How is it achieved in Java?","a":"<p>Data hiding is restricting direct access to the data of a class from outside it, so that the data can be accessed only through the methods of that class.</p><p>It is achieved by declaring the data members private (and giving public getter/setter methods when access is needed).</p>"},{"id":"ha7ep3m","l":"l8","t":"Access specifiers","v":"medium","q":"Explain the visibility of the four access specifiers with the help of a table.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Specifier</th><th>Same class</th><th>Same package</th><th>Subclass (other package)</th><th>Other classes (other package)</th></tr></thead><tbody><tr><td>private</td><td>Yes</td><td>No</td><td>No</td><td>No</td></tr><tr><td>default (none)</td><td>Yes</td><td>Yes</td><td>No</td><td>No</td></tr><tr><td>protected</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td></tr><tr><td>public</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td></tr></tbody></table></div>"},{"id":"h1rwrync","l":"l8","t":"Inheritance","v":"easy","q":"Define inheritance. Give an example with a superclass and a subclass.","a":"<p>Inheritance is the process by which a class (subclass) acquires the data members and methods of another class (superclass), using the keyword <b>extends</b>.</p><p><b>Example:</b> class Employee is the superclass (name, salary); class Manager extends Employee and inherits these, and adds its own member such as allowance.</p>"},{"id":"h1k6xsst","l":"l8","t":"Superclass and subclass","v":"easy","q":"Differentiate between a superclass and a subclass.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Superclass</th><th>Subclass</th></tr></thead><tbody><tr><td>Class whose members are inherited (base/parent class)</td><td>Class that inherits (derived/child class)</td></tr><tr><td>Contains common features</td><td>Contains inherited plus its own specific features</td></tr></tbody></table></div>"},{"id":"hngedy","l":"l8","t":"Types of inheritance","v":"medium","q":"Name and explain the types of inheritance supported by Java classes, with an example of each.","a":"<ul><li><b>Single:</b> one subclass derived from one superclass. Example: B extends A.</li><li><b>Multilevel:</b> a subclass becomes the superclass of another class. Example: A, B extends A, C extends B.</li><li><b>Hierarchical:</b> several subclasses derived from one superclass. Example: Car and Bus extend Vehicle.</li></ul><p>Multiple inheritance (one class with two superclasses) is not supported through classes.</p>"},{"id":"hfehuga","l":"l8","t":"Multiple inheritance","v":"hard","q":"Why does Java not support multiple inheritance through classes?","a":"<p>If a class extended two classes that both have a method with the same signature, the compiler could not decide which one the subclass inherits (ambiguity, the 'diamond problem'). To keep Java simple and unambiguous, a class may extend only one class. Multiple inheritance is achieved through interfaces.</p>"},{"id":"h11ujno5","l":"l8","t":"super keyword","v":"medium","q":"State the uses of the super keyword.","a":"<ul><li>To call the constructor of the immediate superclass: super(arguments); it must be the first statement in the subclass constructor.</li><li>To call an overridden method of the superclass: super.methodName();</li><li>To access a superclass data member hidden by a subclass member of the same name: super.variable.</li></ul>"},{"id":"h1mhwgtr","l":"l8","t":"Constructor order","v":"medium","q":"Explain the order in which constructors execute when an object of a multilevel-derived class C (C extends B, B extends A) is created.","a":"<p>The constructors run from the top of the hierarchy to the bottom: first A's constructor, then B's, and finally C's.</p><p>Each subclass constructor begins by calling its superclass constructor, either explicitly with super(...) or implicitly with super() inserted by the compiler.</p>"},{"id":"hol0awt","l":"l8","t":"Overloading vs overriding","v":"medium","q":"Differentiate between method overloading and method overriding.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Overloading</th><th>Overriding</th></tr></thead><tbody><tr><td>Same method name, different parameter list</td><td>Same name and same parameter list</td></tr><tr><td>In the same class (or inherited methods)</td><td>In the subclass, redefining the superclass method</td></tr><tr><td>Return type alone cannot differentiate</td><td>Return type is the same</td></tr><tr><td>Resolved at compile time</td><td>Resolved at run time</td></tr><tr><td>Inheritance not needed</td><td>Inheritance required</td></tr></tbody></table></div>"},{"id":"hmuexhy","l":"l8","t":"is-a relationship","v":"easy","q":"What is an 'is-a' relationship? Give an example.","a":"<p>An is-a relationship means the subclass is a specialised kind of the superclass. It is implemented using inheritance (extends).</p><p><b>Example:</b> a Teacher is a Person, so class Teacher extends Person. (A Car 'has an' Engine is a has-a relationship, not inheritance.)</p>"},{"id":"h4fp3ei","l":"l8","t":"final keyword","v":"medium","q":"Explain the use of the final keyword in connection with inheritance.","a":"<ul><li><b>final class:</b> cannot be extended, i.e. no subclass can be created.</li><li><b>final method:</b> cannot be overridden in any subclass.</li><li>(A final variable is a constant, whose value cannot be changed.)</li></ul>"},{"id":"htejbde","l":"l8","t":"Object class","v":"medium","q":"What is the Object class? Name one method it provides.","a":"<p>Object (in java.lang) is the topmost class of the Java class hierarchy. Every class either directly extends it (when no extends clause is given) or indirectly through its superclass. Its methods are available to all classes, e.g. toString(), equals().</p>"},{"id":"hf1x9l9","l":"l8","t":"Local vs instance variables","v":"medium","q":"Differentiate between a local variable and an instance variable with respect to scope and visibility.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Local variable</th><th>Instance variable</th></tr></thead><tbody><tr><td>Declared inside a method, constructor or block</td><td>Declared inside the class, outside methods</td></tr><tr><td>Scope limited to that block; destroyed on exit</td><td>Scope is the whole object; lives as long as the object</td></tr><tr><td>No access specifier allowed; no default value</td><td>Can have access specifiers; gets default value</td></tr></tbody></table></div>"},{"id":"h1mg5g1c","l":"l8","t":"Getters and setters","v":"medium","q":"What are getter and setter methods? Why are they used?","a":"<p>A getter (accessor) is a public method that returns the value of a private data member. A setter (mutator) is a public method that assigns a new value to it.</p><p>They are used so that private data can be read or changed only in a controlled manner, for example a setter can reject a negative balance. This supports encapsulation.</p>"},{"id":"h1gj0seu","l":"l8","t":"private vs protected","v":"easy","q":"Differentiate between private and protected members.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>private</th><th>protected</th></tr></thead><tbody><tr><td>Accessible only within the same class</td><td>Accessible in the same package and in subclasses (even in other packages)</td></tr><tr><td>Most restrictive of the four</td><td>Less restrictive than private</td></tr></tbody></table></div>"},{"id":"h1hr00px","l":"l8","t":"Advantages of inheritance","v":"easy","q":"State any four advantages of inheritance.","a":"<ol><li>Reusability: existing code is reused without rewriting.</li><li>Saves time and effort in writing and testing code.</li><li>Easy to extend: new features are added in the subclass.</li><li>Makes maintenance easier, since a change in the superclass is reflected in all subclasses.</li><li>Models real-world is-a relationships and supports run-time polymorphism.</li></ol><p>(Any four.)</p>"},{"id":"hono48w","l":"l8","t":"Private data in subclass","v":"medium","q":"A class Employee has private data members name and salary. Why can the subclass Manager not use them directly? How can Manager access them?","a":"<p>private members are visible only within their own class, so Manager cannot refer to them by name even though Manager inherits from Employee.</p><p>Manager can use them through public (or protected) methods of Employee such as getName() and getSalary(), or if the members were declared protected, directly.</p>"},{"id":"hhrxqwv","l":"l8","t":"public vs private","v":"easy","q":"Differentiate between public and private access specifiers.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>public</th><th>private</th></tr></thead><tbody><tr><td>Accessible from any class</td><td>Accessible only within its own class</td></tr><tr><td>Used for methods that form the interface of a class</td><td>Used for data members to hide data</td></tr></tbody></table></div>"},{"id":"h1ijpemv","l":"l8","t":"super() rules","v":"hard","q":"State the rules for calling the superclass constructor from a subclass constructor.","a":"<ul><li>super(arguments) must be the first statement in the subclass constructor.</li><li>The arguments must match a constructor of the superclass.</li><li>If it is not written, the compiler inserts super() automatically; the superclass must then have a no-argument (default) constructor, otherwise a compile-time error occurs.</li></ul>"},{"id":"h1ydz505","l":"l8","t":"Method overriding","v":"medium","q":"Define method overriding. State two conditions for it.","a":"<p>Method overriding is the redefinition in a subclass of a method already defined in its superclass, with the same name, parameter list and return type.</p><ul><li>There must be an inheritance relationship between the classes.</li><li>The overriding method must not have weaker access than the original, and a final method cannot be overridden.</li></ul>"},{"id":"hxu7g7p","l":"l8","t":"Reusability","v":"easy","q":"Explain the term reusability with respect to inheritance. Give a real-life example.","a":"<p>Reusability means using the code of an existing, tested class to build a new class instead of writing it again. A subclass inherits the superclass members and adds only the new ones.</p><p><b>Example:</b> a new model of a car keeps the features of the earlier model and adds only some new ones.</p>"},{"id":"h1f7su7n","l":"l2","t":"Wrapper classes","v":"easy","q":"What is a wrapper class? Write the wrapper classes for int, double, char and boolean.","a":"<p>A <b>wrapper class</b> wraps a primitive value inside an object so that it can be used where an object is required and gives useful methods (parsing, conversion, constants).</p><ul><li>int - Integer</li><li>double - Double</li><li>char - Character</li><li>boolean - Boolean</li></ul>"},{"id":"h8078c9","l":"l2","t":"Autoboxing / unboxing","v":"easy","q":"Differentiate between autoboxing and unboxing with an example of each.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Autoboxing</th><th>Unboxing</th></tr></thead><tbody><tr><td>Automatic conversion of a primitive into its wrapper object.</td><td>Automatic conversion of a wrapper object into its primitive.</td></tr><tr><td>Integer a = 10;</td><td>int b = a;</td></tr></tbody></table></div>"},{"id":"h1xo6asn","l":"l2","t":"parseInt / toString","v":"medium","q":"Differentiate between Integer.parseInt(String) and Integer.toString(int). Give one example each.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>parseInt()</th><th>toString()</th></tr></thead><tbody><tr><td>Converts a numeric String into an int.</td><td>Converts an int into a String.</td></tr><tr><td>Argument: String; returns int.</td><td>Argument: int; returns String.</td></tr><tr><td>int n = Integer.parseInt(\"84\");</td><td>String s = Integer.toString(84);</td></tr></tbody></table></div>"},{"id":"h10m2s45","l":"l2","t":"Character methods","v":"medium","q":"Write the purpose of each method of the Character class: isLetter(), isDigit(), isLetterOrDigit(), isWhitespace(). Give the return type.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Method</th><th>Purpose</th><th>Returns</th></tr></thead><tbody><tr><td>isLetter(ch)</td><td>Checks whether ch is an alphabet</td><td>boolean</td></tr><tr><td>isDigit(ch)</td><td>Checks whether ch is a digit 0-9</td><td>boolean</td></tr><tr><td>isLetterOrDigit(ch)</td><td>True if ch is a letter or a digit</td><td>boolean</td></tr><tr><td>isWhitespace(ch)</td><td>True for space, tab, newline</td><td>boolean</td></tr></tbody></table></div>"},{"id":"h1p464tl","l":"l2","t":"Packages","v":"easy","q":"What is a package? Name any two packages of Java with one class from each.","a":"<p>A <b>package</b> is a collection of related classes and interfaces grouped under one name; it is brought in with the import statement.</p><ul><li>java.lang - String, Math (imported automatically)</li><li>java.util - Scanner</li></ul>"},{"id":"hpord9u","l":"l2","t":"Primitive vs wrapper","v":"medium","q":"Distinguish between a primitive data type and a wrapper class.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Primitive type</th><th>Wrapper class</th></tr></thead><tbody><tr><td>Not an object; stores the value directly.</td><td>An object holding a value.</td></tr><tr><td>Name starts in lower case (int).</td><td>Name starts in capital (Integer).</td></tr><tr><td>Has no methods; cannot be null.</td><td>Has methods such as parseInt(); can be null.</td></tr></tbody></table></div>"},{"id":"hn0j4s6","l":"l2","t":"NumberFormatException","v":"medium","q":"When does Integer.parseInt() throw a NumberFormatException? Give two examples of such strings.","a":"<p>It is thrown when the String does not contain a valid integer.</p><ul><li>Integer.parseInt(\"12.5\") - decimal point</li><li>Integer.parseInt(\"abc\") - letters (an empty string or a value beyond int range also fails)</li></ul>"},{"id":"h1avpm25","l":"l2","t":"import statement","v":"easy","q":"Explain the difference between import java.util.*; and import java.util.Scanner;.","a":"<ul><li>import java.util.*; makes all classes of the java.util package available.</li><li>import java.util.Scanner; imports only the Scanner class.</li></ul><p>Both allow Scanner to be used; the second is more specific.</p>"},{"id":"h1ubd0x2","l":"l5","t":"Method prototype","v":"easy","q":"What is the prototype (signature) of a method? Write the prototype of a method area() that accepts the radius of a circle as a double and returns the area as a double.","a":"<p>The <b>pr
