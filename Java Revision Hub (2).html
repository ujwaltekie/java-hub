y(45, 'A');"],"c":3,"e":"The arguments must match the parameters in number, order and type: an int first, then a char."},{"id":"m3zn74t","l":"l4","t":"String Methods","v":"easy","q":"Which Java statement converts the word RESPECT to lower case?","o":["\"RESPECT\".tolowercase( );","\"RESPECT\".toLowerCase( );","toLowerCase(\"RESPECT\");","String.toLowerCase(\"RESPECT\");"],"c":1,"e":"toLowerCase() is an instance method of String and Java is case sensitive: tolowercase is not a method."},{"id":"m1yuaiv2","l":"l2","t":"Wrapper Classes","v":"easy","q":"Which of the following are wrapper classes?\n(i) Boolean\n(ii) boolean\n(iii) character\n(iv) Character","o":["(i) and (iv)","(ii) and (iv)","(i) and (iii)","(ii) and (iii)"],"c":0,"e":"Boolean and Character begin with a capital letter and are wrapper classes. boolean is a primitive type and \"character\" is not a Java type."},{"id":"msmsb6a","l":"l2","t":"Wrapper Classes","v":"easy","q":"Converting an object of a wrapper class to its corresponding primitive value is known as:","o":["unboxing","autoboxing","type casting","parsing"],"c":0,"e":"Wrapper to primitive is unboxing. Primitive to wrapper is autoboxing."},{"id":"m1hli1f","l":"l4","t":"String Methods","v":"medium","q":"Which String method never returns a negative value?","o":["indexOf","lastIndexOf","compareTo","length"],"c":3,"e":"indexOf and lastIndexOf return -1 when the search fails and compareTo can be negative. length() is always 0 or more."},{"id":"m1rjbwr9","l":"l2","t":"Wrapper Classes","v":"easy","q":"The method to convert a String to double is:","o":["String.toDouble()","Double.Parsedouble()","Double.parseDouble(String)","Double.parseDouble( )"],"c":2,"e":"The static method is spelled parseDouble and takes the String as its argument."},{"id":"m1ve475t","l":"l3","t":"Arrays","v":"medium","q":"The statement System.out.println(x[x.length]); results in:","o":["a logical error","a syntax error","a run time error","no error"],"c":2,"e":"For an array of length n the valid indices are 0 to n-1, so x[x.length] throws ArrayIndexOutOfBoundsException while the program runs."},{"id":"mo9jd4z","l":"l3","t":"Arrays","v":"easy","q":"Which is a valid array declaration to store the gender (M, F or T) of 80 employees?","o":["char gender = new char[80];","char gender[] = new char[80];","char gender[80];","char gender[80] = new char[ ];"],"c":1,"e":"The size goes in the new expression, not in the declarator, and the variable must be declared as an array."},{"id":"mhrikbb","l":"l3","t":"Arrays","v":"medium","q":"Arrange the statements in the correct order to accept values into the array a[]:\n(i) a[i]=sc.nextInt( );\n(ii) int a[]=new int[10];\n(iii) Scanner sc=new Scanner(System.in);\n(iv) for(i=0;i<10;i++)","o":["(i), (ii), (iii), (iv)","(ii), (iii), (iv), (i)","(iv), (iii), (ii), (i)","(iii), (i), (iv), (ii)"],"c":1,"e":"Create the array, create the Scanner, start the loop, then read each value inside the loop."},{"id":"m16jzjri","l":"l3","t":"Sorting","v":"easy","q":"In bubble sort, during each iteration of the inner loop two adjacent elements are ______ and ______.\n(i) compared\n(ii) swapped\n(iii) selected\n(iv) deleted","o":["(i) and (ii)","(ii) and (iii)","(iii) and (iv)","(ii) and (iv)"],"c":0,"e":"Adjacent elements are compared and, if out of order, swapped."},{"id":"m12506p1","l":"l3","t":"Arrays","v":"easy","q":"What is the highest index of an array with 100 elements?","o":["100","101","99","98"],"c":2,"e":"Indices run from 0 to length-1."},{"id":"m91s3nq","l":"l5","t":"User-Defined Methods","v":"easy","q":"An event manager divides a big event into small tasks and allots each task to a different person. Dividing a program into small methods in the same way is called:","o":["Complexity","Modularity","Reusability","Monolithic"],"c":1,"e":"Breaking a program into independent parts (methods) is modularity."},{"id":"m9rna42","l":"r5b","t":"Input in Java","v":"medium","q":"Raj must accept a phone number of 10 digits using a Scanner method. Which statement should he use?","o":["Ob.nextInt()","Ob.nextDouble()","Ob.nextLong()","Ob.next().charAt(0)"],"c":2,"e":"A 10-digit number exceeds the range of int (about 2.1 billion), so nextLong() is needed."},{"id":"m8x0v5s","l":"l4","t":"String Methods","v":"medium","q":"Raj wants to count the digits of an integer n without using a loop. Which statement works?","o":["String.valueOf(n).length()","Integer.parseInt(n).length()","n.length()","All of the above"],"c":0,"e":"Convert the number to a String with String.valueOf(n) and take its length. n.length() and parseInt(n).length() are invalid."},{"id":"m17nifjs","l":"l4","t":"String Methods","v":"easy","q":"Sham must encode a String S by replacing the letter E with #. Which statement is correct?","o":["S.replace('#','E')","S.replace('E')","S.replace('E','#')","S.replace('#')"],"c":2,"e":"replace(old, new) takes the character to find first and the replacement second."},{"id":"m1ii2yn7","l":"l4","t":"String Methods","v":"medium","q":"When String m is compared to String n with m.compareTo(n), the result is greater than zero. Which is true?","o":["m comes before n in the dictionary.","n comes before m in the dictionary.","m and n are equal.","m and n have the same length."],"c":1,"e":"A positive result means m is lexicographically greater, so n comes first."},{"id":"mdi0ba","l":"l4","t":"String Methods","v":"medium","q":"Which of the following String methods take an integer argument?\n(i) length()  (ii) substring()  (iii) toUpperCase()  (iv) charAt()","o":["Only (ii)","(i) and (iv)","(ii) and (iv)","(iii) and (iv)"],"c":2,"e":"substring(int) and charAt(int) take an int. length() and toUpperCase() take no argument."},{"id":"m10dah1h","l":"r1","t":"OOP Concepts","v":"easy","q":"Assertion (A): The property by which one class acquires the properties of another class is called inheritance.\nReason (R): Inheritance promotes reusability.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"Both statements are true. Reusing the code of an existing class is the main benefit of inheritance, so R explains A."},{"id":"m104onea","l":"l5","t":"User-Defined Methods","v":"medium","q":"Which of the following is NOT true for polymorphism (method overloading)?","o":["All the methods have the same name.","Methods are invoked based on the arguments.","Methods should have the same number and the same type of arguments.","It is a principle of OOP."],"c":2,"e":"Overloaded methods must differ in the number, type or order of parameters. If both were identical it would be a duplicate method."},{"id":"m19cqava","l":"r3","t":"Values and Data Types","v":"medium","q":"Which of the following is a valid initialisation statement?","o":["int x = \"GOOD\";","int y = 45.0/2;","int z = (int) 'x';","int m = false;"],"c":2,"e":"A char can be cast to an int. The others assign a String, a double or a boolean to an int."},{"id":"m7owaco","l":"r3","t":"Escape Sequences","v":"medium","q":"Which statement correctly prints:   Raj said \"Good morning\"","o":["System.out.println(\"Raj said \"Good morning\"\");","System.out.println(\"Raj said \\\\Good morning\\\\\");","System.out.println(\"Raj said \\\"Good morning\\\" \");","System.out.println(\"Raj said Good morning\");"],"c":2,"e":"Double quotes inside a String literal must be written with the escape sequence \\\"."},{"id":"m17nee3j","l":"l3","t":"Arrays","v":"medium","q":"A tray for making ice cubes has 2 rows with 7 cells in each row. Which data structure does it represent?\n(i) A two-dimensional array with 2 rows and 7 columns\n(ii) A one-dimensional array with 14 elements","o":["Both (i) and (ii)","Only (i)","Only (ii)","Neither (i) nor (ii)"],"c":1,"e":"Items arranged in rows and columns form a two-dimensional array."},{"id":"mp3u2xf","l":"r8","t":"Iterative Constructs","v":"easy","q":"A flowchart tests the loop condition first. If it is true the command is executed and control returns to the condition; if false the flow goes to the end. What kind of loop is this?","o":["Entry controlled loop","Exit controlled loop","Multiple branching statement","All of the above"],"c":0,"e":"The condition is checked before the body runs, so it is an entry controlled loop (for or while)."},{"id":"m1s5rwac","l":"l3","t":"Sorting","v":"easy","q":"Four letter cards in the order B, D, A, C are rearranged to the order A, B, C, D. What process is this?","o":["Sorting the list in descending order","Searching the character in the list","Sorting the list in ascending order","None of the above"],"c":2,"e":"The result runs from A to D, which is ascending order."},{"id":"m1pfpxmj","l":"l3","t":"Searching","v":"easy","q":"To find the value 6 in the list 3, 8, 12, 6, 10, 2, each element is compared with 6 one after another starting from the first. Which search is this?","o":["Binary Search","Selection Sort","Bubble Sort","Linear Search"],"c":3,"e":"Checking elements one by one from the start is linear (sequential) search."},{"id":"ml6qd39","l":"l5","t":"User-Defined Methods","v":"easy","q":"A person behaves like a customer in a shopping mall, like a passenger on a bus, like a student in school and like a son at home. Which Java feature does this depict?","o":["Encapsulation","Inheritance","Polymorphism","Data abstraction"],"c":2,"e":"One entity taking many forms depending on the situation is polymorphism, as one method name behaves differently for different arguments."},{"id":"m1jg8bgd","l":"r3","t":"Values and Data Types","v":"easy","q":"Name the data types, in order, of these values: \"The quick brown fox\", 578, '\\n', 51.048053","o":["int, char, double, String","String, int, char, double","char, double, int, String","int, double, char, String"],"c":1,"e":"A string literal is String, 578 is int, '\\n' is char and 51.048053 is double."},{"id":"md7gm55","l":"l3","t":"Arrays","v":"medium","q":"A two-dimensional array of 4 rows and 4 columns holds decimal numbers such as 17.67 and 17.5. How many bytes does it occupy?","o":["96 bytes","128 bytes","12 bytes","24 bytes"],"c":1,"e":"16 elements of type double at 8 bytes each: 16 x 8 = 128 bytes."},{"id":"mgjl79v","l":"r4","t":"Java Expressions","v":"easy","q":"To calculate \"the sum of a and b multiplied by 7\", the correct Java expression is:","o":["a+b*7","7*a+b","(a+b)*7","a+7*b"],"c":2,"e":"Brackets are needed so that the addition is done before the multiplication."},{"id":"mvsf8y6","l":"l3","t":"Arrays","v":"easy","q":"The sum of a[1] and a[3] in int a[]={20,40,60,80,100}; is:","o":["80","100","120","60"],"c":2,"e":"a[1] = 40 and a[3] = 80, so the sum is 120."},{"id":"m61irox","l":"l8","t":"Access Specifiers","v":"easy","q":"Which access specifier is the least restrictive?","o":["private","protected","default","public"],"c":3,"e":"public members can be accessed from anywhere, so it is the least restrictive."},{"id":"m1uz48xn","l":"r6","t":"Math Library","v":"easy","q":"A hotel wants to round off a bill given in decimals to the nearest integer. Which Math method should it use?","o":["Math.round()","Math.pow()","Math.ceil()","Math.abs()"],"c":0,"e":"Math.round() rounds to the nearest whole number."},{"id":"mwd4vyn","l":"l7","t":"Constructors","v":"medium","q":"Assertion (A): A class can have multiple constructors.\nReason (R): Multiple constructors are defined with the same set of arguments.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":2,"e":"A is true (constructor overloading). R is false: the constructors must differ in the number, type or order of parameters."},{"id":"m1lb28v2","l":"l3","t":"Arrays","v":"medium","q":"Assertion (A): An array can store elements of different data types.\nReason (R): An array is a user-defined data type with multiple values of the same data type but a different memory index.","o":["Both (A) and (R) are true and (R) is the correct explanation of (A).","Both (A) and (R) are true but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":3,"e":"A is false: all elements of an array have the same type. R correctly describes an array."},{"id":"m1125n30","l":"r3","t":"Type Casting","v":"medium","q":"Which of the following is an example of explicit type casting?","o":["int amount = 45;","int amount = 24*24;","int amount = Integer.parseInt(\"45\");","int amount = (int) 45.75;"],"c":3,"e":"The cast operator (int) forces a double into an int explicitly. The result is 45."},{"id":"mi88d0q","l":"r6","t":"Math Library","v":"medium","q":"The output of Math.ceil(89.9) + Math.floor(90.5) is:","o":["0.0","180","180.0","180.4"],"c":2,"e":"ceil(89.9) = 90.0 and floor(90.5) = 90.0. Both return double, so the sum is 180.0."},{"id":"m1wyph2a","l":"l4","t":"String Methods","v":"easy","q":"The output of \"TIGER\".indexOf('G') is:","o":["3","2","-1","0"],"c":1,"e":"Counting from 0: T=0, I=1, G=2."},{"id":"m1k36c05","l":"r7","t":"Conditional Statements","v":"hard","q":"Which statement is equivalent to:\nif(a>b) System.out.println(\"Honest\");\nelse System.out.println(\"Sincere\");","o":["a>b ? System.out.println(\"Honest\") : System.out.println(\"Sincere\");","System.out.println(a>b ? \"Honest\" : \"Sincere\");","a>b ? \"Honest\" : \"Sincere\";","a>b : \"Honest\" ? \"Sincere\";"],"c":1,"e":"The ternary operator must produce a value. Here it yields a String that println() prints."},{"id":"m1ej9o7c","l":"l4","t":"String Methods","v":"easy","q":"What are the outputs of \"COP\".equals(\"cop\") and \"COP\".equalsIgnoreCase(\"cop\") respectively?","o":["false, true","true, false","false, false","true, true"],"c":0,"e":"equals() is case sensitive and equalsIgnoreCase() ignores case."},{"id":"m5rt329","l":"l4","t":"String Methods","v":"hard","q":"The output of \"SOLDIER\".compareTo(\"SOLUTE\") is:","o":["-4","-17","17","0"],"c":1,"e":"The first difference is at index 3: 'D' (68) and 'U' (85). 68 - 85 = -17."},{"id":"msvhdco","l":"l3","t":"Arrays","v":"hard","q":"Arrange in descending order of the number of bytes occupied (char is 2 bytes, int 4 bytes, double 8 bytes):\n(i) char x[20]  (ii) int a[4][2]  (iii) double b[6]","o":["(iii), (ii), (i)","(iii), (i), (ii)","(ii), (iii), (i)","(i), (ii), (iii)"],"c":1,"e":"(iii) 6 x 8 = 48, (i) 20 x 2 = 40, (ii) 8 x 4 = 32 bytes."},{"id":"m1ng14hl","l":"l3","t":"Sorting","v":"medium","q":"Bubble sort is applied to {5,1,2,3} to get ascending order. After the first comparison the array is {1,5,2,3}. What is the array after the next comparison?","o":["{1,2,5,3}","{1,5,3,2}","{1,3,5,2}","{1,3,2,5}"],"c":0,"e":"The next pair compared is 5 and 2, which is out of order, so they are swapped."},{"id":"m1d7i7hh","l":"r5a","t":"Introduction to Java","v":"easy","q":"A Java program written in a text editor or an IDE is saved as MyClass.______ . Fill in the blank.","o":["class","exe","bytecode","java"],"c":3,"e":"Source files have the extension .java. The compiler produces a .class file."},{"id":"m1fsqlra","l":"r1","t":"OOP Concepts","v":"easy","q":"Rosy loves animals just like her mother does. Which feature of Java does this depict?","o":["Inheritance","Polymorphism","Class","Abstraction"],"c":0,"e":"A child acquiring a trait from a parent is inheritance."},{"id":"m7h2fw0","l":"r4","t":"Operators","v":"medium","q":"The expression A = 1/3 * 22/7 * r * r * h; compiles but gives a wrong volume. Name the type of error.","o":["Syntax","Runtime","Logical","No error"],"c":2,"e":"1/3 is integer division and equals 0, so A is always 0. The compiler cannot detect this: it is a logical error."},{"id":"m1haz77j","l":"r6","t":"Math Library","v":"easy","q":"The Math method that calculates the hypotenuse from the other two sides is:","o":["sqrt","hypot","ceil","floor"],"c":1,"e":"Math.hypot(a, b) returns the square root of a*a + b*b."},{"id":"mw14ffe","l":"r1","t":"OOP Concepts","v":"easy","q":"A cat says \"Meow\", a duck says \"Quack\", a dog says \"Woof\" and a person says \"Hello\". The same action (speaking) is carried out in different forms. Which OOP concept is this?","o":["Polymorphism","Encapsulation","Inheritance","Object"],"c":0,"e":"One action taking many forms is polymorphism."},{"id":"mkg3nic","l":"r4","t":"Operators","v":"easy","q":"Which operator is used to check whether a number is divisible by another number?","o":["=","==","/","%"],"c":3,"e":"If a % b is 0 then a is divisible by b."},{"id":"m1kfke8","l":"r4","t":"Operators","v":"medium","q":"A student wrote:\nint N = 30;\nif (N % 5 == 0 || N % 3 == 0) System.out.println(\"divisible\"); else System.out.println(\"not divisible\");\nto check whether N is divisible by both 5 and 3. What is logically incorrect?","o":["Should use && instead of ||","Should use = instead of ==","Should use / instead of %","Should use * instead of %"],"c":0,"e":"|| is true if either condition is true. \"Both\" needs &&."},{"id":"mleqghr","l":"r7","t":"Conditional Statements","v":"easy","q":"A statement written with the ternary operator can be converted to:","o":["switch case","if - else","while","for"],"c":1,"e":"condition ? a : b is a short form of if-else."},{"id":"m1rn53vf","l":"r5a","t":"Tokens","v":"easy","q":"Which of the following CANNOT be used as a Java identifier?","o":["roll_no","class","std","div"],"c":1,"e":"class is a keyword."},{"id":"m1awtlm2","l":"r3","t":"Values and Data Types","v":"easy","q":"Which of the following is a valid character literal?","o":["34.5","\"M\"","true","'\\n'"],"c":3,"e":"A char literal is a single character or escape sequence in single quotes."},{"id":"m1ea11fv","l":"r3","t":"Values and Data Types","v":"hard","q":"Which of the following is a valid declaration statement?","o":["int m = 'N';","char m = 10;","int m = Math.sqrt(25);","Integer m = 22.0/7;"],"c":0,"e":"A char value can be stored in an int. Math.sqrt() returns double, which cannot go into an int without a cast, and 22.0/7 is a double, not an Integer."},{"id":"m1ggz9uc","l":"r3","t":"Values and Data Types","v":"easy","q":"Choose the data types, in order, to store \"John\", -87.23 and 'A'.","o":["int, char, String","String, double, char","String, int, char","double, char, String"],"c":1,"e":"\"John\" is a String, -87.23 is a double and 'A' is a char."},{"id":"m1l0xy2b","l":"r9","t":"Nested Loops","v":"easy","q":"for (r=1; r<=3; r++)\n  for (c=1; c<=4; c++)\n    System.out.println(\"*\");\nHow many times does the inner statement execute in total?","o":["4","3","7","12"],"c":3,"e":"3 rows x 4 columns = 12."},{"id":"m6vfihc","l":"r2","t":"Classes and Objects","v":"easy","q":"Clay pots are made using clay moulds. Which Java concept does this picture depict?","o":["Object is a class factory.","Class is a blueprint of an object.","Object behaves like a template.","Class and object are different from each other."],"c":1,"e":"A mould is the design from which many pots (objects) are made, just as a class is the blueprint of its objects."},{"id":"m1fonicq","l":"r3","t":"Values and Data Types","v":"hard","q":"Consider the literals: '5', 10, 5, 'A', '*', '\\n', (int)'a'. Which statement is correct?","o":["3 character literals and 4 integer literals","4 character literals and 3 integer literals","All are character literals","All are integer literals"],"c":1,"e":"'5', 'A', '*', '\\n' are char literals. 10, 5 and (int)'a' are integers."},{"id":"m1ccd67v","l":"r7","t":"Switch","v":"easy","q":"The keyword used to handle all the unmatched cases in a switch construct is:","o":["case","default","break","switch"],"c":1,"e":"default runs when no case matches."},{"id":"mgft78z","l":"r7","t":"Switch","v":"medium","q":"A switch expression CANNOT evaluate to a ______ data type.","o":["int","char","double","byte"],"c":2,"e":"switch accepts int, char, byte, short and String, but not double or long."},{"id":"m153ssii","l":"r7","t":"Switch","v":"easy","q":"What is the result of a missing break statement in a switch-case?","o":["Fall through of the cases","The switch case is not executed","Runtime error","Syntax error"],"c":0,"e":"Execution continues into the next case until a break is met."},{"id":"m16jiyx9","l":"r7","t":"Conditional Statements","v":"easy","q":"Which keyword defines an alternative block when the condition of an if statement fails?","o":["case","default","else","switch"],"c":2,"e":"else runs when the if condition is false."},{"id":"mdt35el","l":"r4","t":"Operators","v":"medium","q":"The output of 7434 % 10 + 7434 / 100 is:","o":["747","78","8","11"],"c":1,"e":"7434 % 10 = 4 and 7434 / 100 = 74 (integer division). 4 + 74 = 78."},{"id":"m1hrrtig","l":"r1","t":"OOP Concepts","v":"easy","q":"Sam makes French fries in an air fryer without knowing how the machine works inside. Which OOP feature is this?","o":["Abstraction","Inheritance","Polymorphism","Method"],"c":0,"e":"Using something through a simple interface while its internal working is hidden is abstraction."},{"id":"m1dc2fpb","l":"r5a","t":"Introduction to Java","v":"easy","q":"Which beginner friendly Java IDE, used in the ICSE syllabus, has a blue bird (a blue jay) as its icon?","o":["JVM","JDK","BlueJ","Java"],"c":2,"e":"BlueJ is the Java IDE whose icon is a blue jay."},{"id":"m1unrate","l":"r2","t":"Classes and Objects","v":"medium","q":"Match each situation with its Java concept:\n1. Object A sends a message to Object B\n2. A capsule that wraps variables and methods together\n3. A class with objects such as a car, a bicycle and a truck\nConcepts: A Encapsulation, B Class and objects, C Message passing","o":["1-C, 2-B, 3-A","1-C, 2-A, 3-B","1-A, 2-B, 3-C","1-B, 2-C, 3-A"],"c":1,"e":"1 is message passing, 2 is encapsulation and 3 is class and objects."},{"id":"m7f1pq","l":"r6","t":"Math Library","v":"medium","q":"What is the output of Math.cbrt(-64)?","o":["-4","-4.0","4.0","4"],"c":1,"e":"The cube root of -64 is -4, and cbrt() returns a double."},{"id":"m1ufotis","l":"r6","t":"Math Library","v":"medium","q":"What is the output?\nfloat a = 15f;\ndouble p = a/3*(Math.pow(2,3));\nSystem.out.println(p);","o":["40.0","5.0","40.0f","40"],"c":0,"e":"a/3 = 5.0 (float), Math.pow(2,3) = 8.0. The product is 40.0 as a double."},{"id":"m1tiunpv","l":"r6","t":"Math Library","v":"easy","q":"A medical store wants the smallest double value that is greater than or equal to the bill. Which method gives it?","o":["Math.round","Math.floor","Math.ceil","Math.random"],"c":2,"e":"Math.ceil() returns the smallest double that is not less than the argument."},{"id":"mxsx9k1","l":"r6","t":"Math Library","v":"easy","q":"To check whether three numbers are a Pythagorean triplet, which Math method can be used to find the third side from the other two?","o":["Math.sqrt","Math.hypot","Math.pow","Math.abs"],"c":1,"e":"Math.hypot(a, b) gives the hypotenuse directly."},{"id":"m564bh1","l":"r8","t":"Iterative Constructs","v":"easy","q":"The outermost lane of a running track is 500 m, the next is 400 m, the next is 300 m and so on, for five lanes. Which Java concept does this repeated pattern correlate with?","o":["if else","switch case","ternary operation","Iteration"],"c":3,"e":"The same step is repeated with a regular change, as in a loop."},{"id":"meez6vz","l":"r4","t":"Operators","v":"medium","q":"Fill in the blank so that S becomes 8:\nS = 7 ___ 5 % 4;","o":["*","/","+","-"],"c":2,"e":"5 % 4 = 1, so 7 + 1 = 8."},{"id":"m1whem4b","l":"r8","t":"Iterative Constructs","v":"easy","q":"To print the series 2, 7, 12, 17, 22, ... n, fill in the blank:\nfor (k = 2; k <= n; ____ ) System.out.println(k);","o":["k+=7","k-=5","k+=2","k+=5"],"c":3,"e":"Each term is 5 more than the previous one."},{"id":"m1sja0aa","l":"r4","t":"Type Casting","v":"hard","q":"What is the output?\nint x = 'a';\nx = x - 32;\nx = x + 4;\nSystem.out.println((char) x);","o":["'A'","'e'","'E'","69"],"c":2,"e":"'a' is 97. 97 - 32 = 65, 65 + 4 = 69 and (char) 69 is 'E'."},{"id":"mi42fav","l":"r3","t":"Type Casting","v":"medium","q":"Which statement performs implicit type casting?\n1. int x = 65;\n2. double z = 'A' + 'a';\n3. char c = 'Q';","o":["1","2","3","Both 1 and 2"],"c":1,"e":"In statement 2 the int result of 'A' + 'a' is automatically widened to double. The others involve no conversion."},{"id":"m1h2xqst","l":"r3","t":"Values and Data Types","v":"hard","q":"Which of the following is a correct declaration statement?","o":["int x = 3.0/4;","double z = 30.5f;","char ch = z","boolean z = True;"],"c":1,"e":"A float can be widened to double. 3.0/4 is a double, the char line lacks a semicolon and the boolean literal is true in lower case."},{"id":"m1o82x0g","l":"r4","t":"Increment and Decrement","v":"hard","q":"What is the output?\nint x = 10;\nint y = x++;\nint z = x + y;\nSystem.out.println(x + y + z);","o":["10","41","43","42"],"c":3,"e":"y = 10 and x becomes 11. z = 11 + 10 = 21. x + y + z = 11 + 10 + 21 = 42."},{"id":"m1osuazj","l":"r4","t":"Logical Operators","v":"easy","q":"What is the output?\nboolean var = !(true && false);\nSystem.out.println(var);","o":["false","true","1","0"],"c":1,"e":"true && false is false and ! makes it true."},{"id":"muqdheq","l":"r4","t":"Compound Assignment","v":"medium","q":"Which expression gives the same result as x *= y + z ?","o":["x = x * y + z","x = x * (y + z)","x = y + z * x","x = x + y * z"],"c":1,"e":"The right side is evaluated completely first: x = x * (y + z)."},{"id":"mnb42lh","l":"r3","t":"Type Casting","v":"hard","q":"What is the value of b after:\nint a = 257;\nbyte b = (byte) a;","o":["257","256","1","0"],"c":2,"e":"A byte holds 8 bits (-128 to 127). 257 wraps around to 257 - 256 = 1."},{"id":"mgh12w3","l":"r9","t":"Nested Loops","v":"easy","q":"A gardener places pots in 3 rows with 6 pots in each row. In a nested loop that prints one pot at a time, how many plants are placed per row and how many rows are there?","o":["6 plants per row and 3 rows","3 plants per row and 6 rows","6 plants per row and 6 rows","3 plants per row and 3 rows"],"c":0,"e":"The outer loop runs for the rows (3) and the inner loop for the plants in a row (6)."},{"id":"mb4ny3y","l":"r8","t":"Iterative Constructs","v":"easy","q":"The PE teacher asks Rosy to dribble a ball 20 times. Which Java concept can be used to display the count of dribbles?","o":["Method","Looping","if","switch"],"c":1,"e":"A fixed number of repetitions is done with a loop."},{"id":"m8ac9kc","l":"r8","t":"Iterative Constructs","v":"easy","q":"Friends at a restaurant order food as often as they like. Which loop suits a situation where the number of repetitions is unknown and the body runs at least once?","o":["ternary","for","while","do...while"],"c":3,"e":"do...while tests the condition after the body, so it always runs once."},{"id":"m331slo","l":"r8","t":"Iterative Constructs","v":"hard","q":"Which for loop is equivalent to this do-while loop?\nk = 10;\ndo { k -= 2; } while (k >= 1);\nSystem.out.println(k);","o":["for(k=10;k>=1;k--) System.out.println(k);","for(k=10;k>=1;k-=2); System.out.println(k);","for(k=10;k<=1;k-=2); System.out.println(k);","for(k=10;k>=1;k+=2); System.out.println(k);"],"c":1,"e":"Both reduce k by 2 until k < 1 and then print the final value (0). The semicolon after the for makes its body empty."},{"id":"m1mua99i","l":"r8","t":"Iterative Constructs","v":"hard","q":"What is the output?\nint k;\nfor (k = 'A'; k < 'Z'; k++);\nSystem.out.println(k);","o":["'Z'","97","'z'","90"],"c":3,"e":"The loop ends with an empty body, and k stops at 90 (the code of 'Z'). k is an int, so 90 is printed."},{"id":"m1dgoexe","l":"r6","t":"Math Library","v":"hard","q":"Which is the correct Java expression for \"z equals m raised to the power n plus the exact product of m and n\"?","o":["z = Math.pow(m, n) + Math.multiplyExact(m, n)","z = Math.pow(m, n) + Math.exactmultiply(m, n)","z = Math.pow(m, n) + Math.exactproduct(m, n)","z = Math.Pow(m, n) + Math.productexact(m, n)"],"c":0,"e":"The method is Math.multiplyExact() and pow must be written in lower case."},{"id":"m1lvwymj","l":"r6","t":"Math Library","v":"hard","q":"Which mathematical expression matches Z = (Math.abs(a) + Math.sqrt(b)) / (a + 2*b); ?","o":["(|a| + sqrt(b)) / (a + 2b)","(|b| + sqrt(a)) / (b + 2a)","(|a| + sqrt(b)) / (a + 2/b)","(|a| + sqrt(b)) / a + 2b"],"c":0,"e":"The numerator is |a| + sqrt(b) and the whole denominator is a + 2b."}],"tf":[{"id":"t1qu1pql","l":"r1","t":"Approach","v":"medium","s":"OOP follows the top-down approach of program design, while procedural programming follows the bottom-up approach.","a":false,"e":"It is the reverse: procedural programming is top-down; OOP is bottom-up (objects are built first and combined)."},{"id":"t14ox6x4","l":"r1","t":"Object and class","v":"easy","s":"An object is an instance of a class.","a":true,"e":"A class is the template; each object created from it is an instance."},{"id":"t1cvbqae","l":"r1","t":"Encapsulation","v":"easy","s":"Encapsulation binds data and the methods that operate on it into a single unit.","a":true,"e":"That is the definition of encapsulation."},{"id":"t1qjyr5","l":"r1","t":"Procedural vs OOP","v":"easy","s":"Procedural programming gives more importance to data than to functions.","a":false,"e":"Procedural programming emphasises functions; OOP gives importance to data (objects)."},{"id":"tsjju4f","l":"r1","t":"Abstraction","v":"easy","s":"Abstraction means hiding the implementation details and showing only essential features.","a":true,"e":"For example, a driver uses the steering wheel without knowing the internal mechanism."},{"id":"tpb2t7c","l":"r1","t":"Reusability","v":"easy","s":"Inheritance helps in reusing code that was written earlier.","a":true,"e":"A derived class inherits members of the base class, so the code need not be rewritten."},{"id":"t1udy9jl","l":"r1","t":"Data hiding","v":"easy","s":"In OOP, the data of an object can be freely accessed by any function in the program.","a":false,"e":"Data is hidden and accessed only through the methods of its own class."},{"id":"t3nm8fh","l":"r1","t":"Polymorphism","v":"medium","s":"Polymorphism means the ability of an entity to take only one form.","a":false,"e":"Polymorphism means many forms (e.g. one method name behaving differently)."},{"id":"tv2rlo7","l":"r2","t":"Class","v":"medium","s":"A class is a physical entity that occupies memory as soon as it is written.","a":false,"e":"A class is only a logical template; memory is allocated for its objects."},{"id":"t1349gz8","l":"r2","t":"Objects","v":"easy","s":"Many objects can be created from a single class.","a":true,"e":"One class is a template for any number of objects."},{"id":"t4adhat","l":"r2","t":"Reference variable","v":"easy","s":"A reference variable of a class holds the address (reference) of an object.","a":true,"e":"It stores a reference to the object, not the object itself."},{"id":"tq3mqcv","l":"r2","t":"Declaration","v":"easy","s":"The statement 'Student s;' creates an object of class Student.","a":false,"e":"It declares a reference variable only; new creates an object."},{"id":"t1gfrxzt","l":"r2","t":"Instance variables","v":"easy","s":"Each object has its own copy of the instance variables of its class.","a":true,"e":"Changing one object's data does not affect another's."},{"id":"t1uj08q7","l":"r2","t":"Behaviour","v":"easy","s":"Member methods define the behaviour of an object.","a":true,"e":"Behaviour is the set of actions the object can perform."},{"id":"tb5ob1e","l":"r2","t":"Identity","v":"medium","s":"Two different objects of the same class can have the same state but still have different identities.","a":true,"e":"Identity distinguishes objects; even identical-looking objects are separate."},{"id":"tpd34jw","l":"r2","t":"BlueJ","v":"medium","s":"In BlueJ, a compiled class can be instantiated by right-clicking it and choosing a constructor.","a":true,"e":"The right-click menu shows 'new ClassName()' options; the object appears on the Object Bench."},{"id":"tcxgnvu","l":"r5a","t":"Compilation","v":"easy","s":"The Java compiler converts the source code directly into the machine code of the computer.","a":false,"e":"It converts source code into bytecode, which the JVM executes."},{"id":"t1kihmdw","l":"r5a","t":"Case sensitivity","v":"easy","s":"Java is a case sensitive language.","a":true,"e":"Sum, sum and SUM are three different identifiers."},{"id":"tb0zrxm","l":"r5a","t":"Keywords","v":"easy","s":"A keyword can be used as an identifier in Java.","a":false,"e":"Keywords are reserved and have fixed meanings."},{"id":"t2ilnb5","l":"r5a","t":"Comments","v":"easy","s":"// is used to write a multi-line comment in Java.","a":false,"e":"// is a single-line comment; /* ... */ is multi-line."},{"id":"t1crgr24","l":"r5a","t":"JVM","v":"hard","s":"The JVM is platform dependent although the bytecode is platform independent.","a":true,"e":"A separate JVM exists for each platform; this is what lets the same bytecode run everywhere."},{"id":"t1pevh0o","l":"r5a","t":"main method","v":"easy","s":"Execution of a Java application starts from the main() method.","a":true,"e":"The JVM looks for public static void main(String[] args) to begin execution."},{"id":"t1km90fq","l":"r5a","t":"Logical errors","v":"medium","s":"A logical error is detected by the compiler.","a":false,"e":"The compiler detects syntax errors; logical errors give wrong output and are found by testing."},{"id":"tt3a7ny","l":"r5a","t":".class file","v":"easy","s":"A .class file contains bytecode.","a":true,"e":"Compiling Test.java creates Test.class that contains the bytecode."},{"id":"tj0d0nb","l":"l8","t":"Private members","v":"easy","s":"A subclass can directly access the private data members of its superclass.","a":false,"e":"private members are accessible only inside their own class."},{"id":"teho2qz","l":"l8","t":"Subclass","v":"easy","s":"A subclass can have its own members in addition to the inherited members.","a":true,"e":"The subclass extends the superclass with additional data and methods."},{"id":"t1qfpowx","l":"l8","t":"Multiple inheritance","v":"easy","s":"Java supports multiple inheritance by allowing a class to extend two classes.","a":false,"e":"A class can extend only one class. Multiple inheritance is achieved through interfaces."},{"id":"tx9vqi7","l":"l8","t":"final method","v":"easy","s":"A method declared final cannot be overridden by a subclass.","a":true,"e":"final prevents overriding (and a final class prevents inheritance)."},{"id":"tledqgi","l":"l8","t":"super()","v":"easy","s":"If super(...) is used in a constructor, it must be the first statement.","a":true,"e":"Otherwise the compiler reports 'call to super must be first statement'."},{"id":"tboajd6","l":"l8","t":"Constructors","v":"medium","s":"Constructors of a superclass are inherited by its subclass.","a":false,"e":"Constructors are not inherited; the subclass invokes them using super()."},{"id":"thyo9at","l":"l8","t":"Polymorphism type","v":"hard","s":"Method overriding is an example of compile-time polymorphism.","a":false,"e":"Overriding is resolved at run time (run-time polymorphism); overloading is compile-time polymorphism."},{"id":"t1fmgubb","l":"l8","t":"Default access","v":"medium","s":"A member with default access is accessible by all classes of the same package.","a":true,"e":"Default (package) access limits visibility to the package."},{"id":"ttty7zl","l":"l8","t":"Object class","v":"medium","s":"Every class in Java directly or indirectly inherits from the Object class.","a":true,"e":"A class with no extends clause directly extends Object."},{"id":"t1mbwqoq","l":"l8","t":"protected","v":"medium","s":"A protected member of a class can be accessed in a subclass that is in a different package.","a":true,"e":"protected allows access in subclasses even outside the package."},{"id":"t5v97oa","l":"l8","t":"Local variables","v":"hard","s":"A local variable can be declared with the access specifier private.","a":false,"e":"Access specifiers apply to class members, not to local variables."},{"id":"txbwhmb","l":"l8","t":"Overriding rules","v":"hard","s":"An overriding method may have weaker (more restrictive) access than the overridden method.","a":false,"e":"The overriding method must have the same or wider access; public cannot become protected."},{"id":"tfmnipo","l":"l8","t":"Getters and setters","v":"medium","s":"Declaring data members private and giving public getter and setter methods is a good example of encapsulation.","a":true,"e":"Data is hidden and accessed only through controlled methods."},{"id":"t1cltw39","l":"l8","t":"Implicit super()","v":"hard","s":"If a subclass constructor does not call super(...) explicitly, the compiler inserts a call to the no-argument constructor of the superclass.","a":true,"e":"If the superclass lacks that constructor, a compile-time error results."},{"id":"tgyy5w0","l":"l2","t":"Character methods","v":"easy","s":"Character.isLetter(ch) returns true when ch holds a digit.","a":false,"e":"isLetter() is true only for alphabets; digits are tested with isDigit()."},{"id":"t1iec6jo","l":"l2","t":"parseInt","v":"easy","s":"Integer.parseInt(\"25\") returns a primitive int value.","a":true,"e":"parseInt returns int, whereas Integer.valueOf(\"25\") returns an Integer object."},{"id":"t1cngah1","l":"l2","t":"Packages","v":"easy","s":"The java.lang package must be imported explicitly before using the Math class.","a":false,"e":"java.lang is imported automatically."},{"id":"t1u69qjy","l":"l2","t":"Primitive vs wrapper","v":"medium","s":"A wrapper class object can hold null, but a primitive variable cannot.","a":true,"e":"Wrapper variables are references, so null is allowed; primitives always hold a value."},{"id":"te3npjp","l":"l2","t":"Character methods","v":"easy","s":"Character.toUpperCase('a') returns the char value 'A'.","a":true,"e":"toUpperCase(char) returns a char; non-letters are returned unchanged."},{"id":"t7uny9n","l":"l2","t":"Integer constants","v":"hard","s":"In an int variable, Integer.MAX_VALUE + 1 gives 2147483648.","a":false,"e":"The value overflows and wraps around to Integer.MIN_VALUE = -2147483648."},{"id":"t14xar1h","l":"l5","t":"return statement","v":"medium","s":"A void method may contain the statement return; without any value.","a":true,"e":"It simply ends the method early."},{"id":"tps6gzx","l":"l5","t":"Overloading rules","v":"easy","s":"Two methods can be overloaded by changing only their return types.","a":false,"e":"The parameter lists must differ; the return type alone is not enough."},{"id":"t1e59eoh","l":"l5","t":"Call by reference","v":"easy","s":"When an array is passed to a method, changes made to its elements inside the method are reflected in the original array.","a":true,"e":"The reference is copied, so both refer to the same array."},{"id":"t13bunba","l":"l5","t":"Static methods","v":"medium","s":"A static method can call a non-static method of the same class directly, without an object.","a":false,"e":"A non-static method needs an object."},{"id":"t1df4gu7","l":"l5","t":"Parameters","v":"easy","s":"The actual and formal parameters must have the same names.","a":false,"e":"Only the number, order and compatible types matter."},{"id":"t1q71ykd","l":"l5","t":"return statement","v":"medium","s":"In a single call, a method can return two values by executing two return statements.","a":false,"e":"The first return ends the method; a method returns at most one value."},{"id":"tnpt5eh","l":"l5","t":"Scope","v":"easy","s":"A local variable declared in one method can be used in another method of the same class.","a":false,"e":"Its scope is limited to the block/method in which it is declared."},{"id":"tu46txh","l":"l6","t":"Class and object","v":"easy","s":"A class occupies memory as soon as it is declared, even if no object is created.","a":false,"e":"Memory for instance variables is allocated only when an object is created."},{"id":"t1ufz8wa","l":"l6","t":"Static members","v":"easy","s":"A static variable has only one copy irrespective of the number of objects created.","a":true,"e":"It belongs to the class and is shared by all objects."},{"id":"t16hrrfn","l":"l6","t":"this keyword","v":"medium","s":"The keyword this can be used inside a static method.","a":false,"e":"A static method is not called on an object, so there is no current object (this)."},{"id":"t1vlxfg3","l":"l6","t":"Variables","v":"medium","s":"Instance variables get a default value if not initialised, whereas local variables must be initialised before use.","a":true,"e":"Instance variables: 0, 0.0, false, '\\u0000' or null. Local variables have no default value."},{"id":"t7upj87","l":"l6","t":"Object creation","v":"easy","s":"Two objects of the same class occupy the same memory location.","a":false,"e":"Every new creates a separate object with its own memory."},{"id":"t175hoc3","l":"l6","t":"Static members","v":"easy","s":"A static member can be accessed using the class name, e.g. Counter.count.","a":true,"e":"No object is required for static members."},{"id":"t1qunz8d","l":"l7","t":"Constructor rules","v":"medium","s":"A constructor can be called explicitly through an object like an ordinary method, e.g. obj.Box().","a":false,"e":"It is invoked only at object creation (or by this())."},{"id":"t22vfjc","l":"l7","t":"Constructor basics","v":"easy","s":"A constructor can take parameters.","a":true,"e":"Such a constructor is called a parameterised constructor."},{"id":"t1nf2hux","l":"l7","t":"Constructor overloading","v":"easy","s":"A class can have more than one constructor.","a":true,"e":"As long as their parameter lists differ."},{"id":"t16hfss2","l":"l7","t":"Constructor rules","v":"medium","s":"A constructor can be declared static.","a":false,"e":"A constructor works on a new object, so it cannot be static."},{"id":"t1gqbql8","l":"l7","t":"Default constructor","v":"medium","s":"If a class has only a parameterised constructor, the statement new Box(); causes a compile-time error.","a":true,"e":"No default constructor is supplied by the compiler in this case."},{"id":"t1jacnwz","l":"l7","t":"Constructor rules","v":"easy","s":"A constructor can return a value using the statement return value;","a":false,"e":"A constructor has no return type and cannot return a value."},{"id":"tp1dhbf","l":"l7","t":"this()","v":"hard","s":"The statement this(...) can be written anywhere inside a constructor.","a":false,"e":"It must be the first statement."},{"id":"tem9cm6","l":"r9","t":"Nested Loops","v":"easy","s":"In Java, the inner for loop may reuse the same counter variable name as the outer for loop (for example, both declared as int i) without any error.","a":false,"e":"The outer variable i is still in scope inside the inner loop, so declaring int i again gives a compile-time error (\"variable i is already defined\"). Use different names such as i and j."},{"id":"t1iguqqf","l":"r9","t":"Counting Iterations","v":"medium","s":"If the outer loop runs 5 times and the inner loop independently runs 3 times for every outer pass, the innermost statement executes 15 times.","a":true,"e":"Total executions = outer iterations x inner iterations = 5 x 3 = 15."},{"id":"t1ajcbr0","l":"r9","t":"break in nested loops","v":"medium","s":"A break statement written inside the inner loop terminates both the inner and the outer loop.","a":false,"e":"break terminates only the loop in which it is written (the innermost enclosing loop). The outer loop carries on with its next iteration."},{"id":"tebbp1z","l":"r9","t":"Pattern Printing","v":"easy","s":"System.out.println(); with empty brackets is used in pattern programs only to move the cursor to the next line.","a":true,"e":"It prints no characters; it just ends the current line, which is how a new row of the pattern is started."},{"id":"t1cfgr1e","l":"r5b","t":"Scanner Methods","v":"easy","s":"Scanner has a method nextChar() that reads a single character.","a":false,"e":"There is no nextChar(). A character is read using sc.next().charAt(0)."},{"id":"trubz40","l":"r5b","t":"nextInt and nextLine","v":"medium","s":"The Enter-key problem that appears when nextLine() follows nextInt() also appears when nextLine() follows nextDouble().","a":true,"e":"Both nextInt() and nextDouble() read only the number and leave the newline character in the input, which the following nextLine() consumes as an empty line."},{"id":"tr1nimz","l":"r5b","t":"BlueJ I/O","v":"easy","s":"In BlueJ, values typed for a Scanner object are entered in the Terminal Window.","a":true,"e":"BlueJ opens a Terminal Window for System.in input and System.out output."},{"id":"t1o8wt1m","l":"r5b","t":"nextInt and nextLine","v":"medium","s":"After sc.nextInt() reads 25, the Enter key pressed by the user is also removed from the input.","a":false,"e":"nextInt() reads only the digits. The newline produced by pressing Enter stays in the buffer, which is why a following nextLine() returns an empty string."},{"id":"t40dlm","l":"r3","t":"Data Types","v":"medium","s":"The value 3000000000 can be stored in an int variable.","a":false,"e":"The largest int is 2147483647, so 3000000000 is too big for an int. A long (written 3000000000L) is needed."},{"id":"t15a17vy","l":"r3","t":"char and ASCII","v":"easy","s":"The statement char c = 65; is valid and stores the character 'A'.","a":true,"e":"An int constant within the range of char can be assigned to a char. 65 is the Unicode/ASCII code of A."},{"id":"tk98hnb","l":"r3","t":"char and ASCII","v":"easy","s":"The ASCII code of the character 'a' is greater than the ASCII code of the character 'A'.","a":true,"e":"'a' has code 97 and 'A' has code 65: lower-case letters have codes 32 higher than upper-case ones."},{"id":"t19wjyld","l":"r3","t":"Constants","v":"easy","s":"A variable declared with the keyword final can be given a new value later in the program.","a":false,"e":"final makes a variable a constant: it is assigned once and any later assignment is a compile-time error."},{"id":"t1au4ule","l":"l4","t":"String Basics","v":"easy","s":"The empty string \"\" has a length of 0.","a":true,"e":"An empty string contains no characters, so length() returns 0."},{"id":"t1f8yzro","l":"l4","t":"== vs equals","v":"medium","s":"If a = new String(\"hi\") and b = new String(\"hi\"), then a == b is true.","a":false,"e":"new always creates a separate object, so == (which compares references) is false. a.equals(b) is true."},{"id":"tps650l","l":"l4","t":"String Methods","v":"easy","s":"indexOf() returns -1 when the character or substring being searched is not present in the string.","a":true,"e":"-1 is the \"not found\" value, which is commonly used in vowel-checking programs such as \"aeiou\".indexOf(ch) >= 0."},{"id":"t1ytbzj5","l":"l4","t":"compareTo","v":"medium","s":"The compareTo() method returns a boolean value.","a":false,"e":"compareTo() returns an int: 0 if the strings are equal, a negative value if the first is smaller and a positive value if it is greater."},{"id":"t1u7l7cy","l":"l4","t":"String Methods","v":"medium","s":"s.substring(2, 5) returns the characters at index positions 2, 3 and 4 of s.","a":true,"e":"substring(begin, end) includes begin but excludes end, so it returns end - begin = 3 characters."},{"id":"t18gxz6n","l":"l4","t":"Immutability","v":"medium","s":"The statement s.replace('a', 'b'); changes the characters of s itself when s is a String.","a":false,"e":"Strings are immutable. replace() returns a new string; unless that result is assigned (s = s.replace(...)), s is unchanged."},{"id":"tir16er","l":"l3","t":"Array Basics","v":"easy","s":"For an array a, the number of elements is obtained by writing a.length().","a":false,"e":"For arrays, length is a field and is written without brackets: a.length. (length() with brackets belongs to String.)"},{"id":"t1k1ib27","l":"l3","t":"Binary Search","v":"medium","s":"Binary search on a sorted array of 1000 elements needs at most about 10 comparisons.","a":true,"e":"Each comparison halves the search range: 2^10 = 1024 > 1000, so about 10 steps are enough."},{"id":"tcidi5x","l":"l3","t":"Selection Sort","v":"medium","s":"Selection sort on an array of n elements needs n - 1 passes.","a":true,"e":"After n - 1 passes the first n - 1 positions hold their final values, so the last element is automatically in place."},{"id":"t1afcvz1","l":"l3","t":"Arrays and References","v":"medium","s":"The statement int b[] = a; (where a is an int array) creates a second, separate copy of the array.","a":false,"e":"Only the reference is copied, so a and b refer to the same array. To copy the elements, a loop is needed."},{"id":"t1267k6t","l":"r7","t":"if-else","v":"easy","s":"An else block can be written without any if statement before it.","a":false,"e":"else is always part of an if statement and must follow an if (or an if block). A lone else is a compile-time error."},{"id":"t1lpsr9w","l":"r7","t":"if-else-if ladder","v":"easy","s":"In an if-else-if ladder, once one condition is found true, the remaining conditions are not tested.","a":true,"e":"The first true condition runs its block and control jumps past the whole ladder."},{"id":"t1omt7f0","l":"r7","t":"if statement","v":"medium","s":"The statement if (1) { ... } is valid in Java because 1 is treated as true.","a":false,"e":"Java does not treat integers as booleans. The condition must be a boolean expression such as x > 0."},{"id":"t1cq1ioz","l":"r7","t":"switch","v":"medium","s":"Two case labels in the same switch statement may have the same constant value.","a":false,"e":"Duplicate case labels give a compile-time error because Java could not decide which block to run."},{"id":"tn40r3a","l":"r6","t":"Math.sqrt","v":"medium","s":"Math.pow(x, 0.5) gives the same result as Math.sqrt(x) for positive x.","a":true,"e":"Raising to the power 0.5 is the same as taking the square root."},{"id":"t1wi1yni","l":"r6","t":"Math.cbrt","v":"medium","s":"Math.cbrt(-8) returns NaN because the cube root of a negative number is not defined.","a":false,"e":"A negative number has a real cube root: Math.cbrt(-8) is -2.0. Only Math.sqrt() of a negative number gives NaN."},{"id":"t1rwybuq","l":"r6","t":"Math.random","v":"hard","s":"The expression (int)(Math.random() * 10) can produce any whole number from 0 to 9.","a":true,"e":"Math.random() gives a value from 0.0 up to (but not including) 1.0, so multiplying by 10 gives 0.0 up to 9.999... and the cast truncates it to 0 to 9."},{"id":"tq477tn","l":"r8","t":"for loop","v":"easy","s":"The loop for (int i = 0; i < 5; i++) executes its body 5 times.","a":true,"e":"i takes the values 0, 1, 2, 3 and 4."},{"id":"t1wxr4gu","l":"r8","t":"Infinite loop","v":"medium","s":"If the condition is omitted in for ( ; ; ), Java treats it as false and the loop never runs.","a":false,"e":"A missing condition is treated as true, so for ( ; ; ) is an infinite loop unless a break is used."},{"id":"t1xmhjx1","l":"r8","t":"Scope","v":"medium","s":"A counter declared in the initialisation part of a for loop, such as int i, can still be used after the loop ends.","a":false,"e":"Such a variable is local to the for statement. Using it after the loop gives a compile-time error unless it was declared before the loop."},{"id":"t1e2fvsc","l":"l7","t":"Constructor overloading","v":"medium","s":"Two constructors of the same class may have the same parameter types in the same order if their parameter names are different.","a":false,"e":"Parameter names are ignored when constructors are compared. Only the number, types and order of parameters make constructors different."},{"id":"t979shj","l":"l7","t":"Copy constructor","v":"easy","s":"The parameter of a copy constructor must be an object of the same class.","a":true,"e":"A copy constructor, e.g. Time(Time t), takes an object of its own class and copies its data members into the new object."},{"id":"t1mxsslp","l":"l7","t":"this()","v":"medium","s":"The call this(5) can be written inside an ordinary method to invoke a constructor of the class.","a":false,"e":"this(...) can be used only as the first statement of another constructor. A constructor cannot be called from an ordinary method."},{"id":"t15elo2e","l":"l7","t":"Default constructor","v":"medium","s":"The default constructor supplied by the compiler sets int members to 0, boolean members to false and object references to null.","a":true,"e":"The compiler-supplied default constructor leaves the instance variables at their default values: 0 for numbers, false for boolean and null for references."},{"id":"t1f0i2y2","l":"l5","t":"Method Overloading","v":"medium","s":"Two overloaded methods can differ only in the names of their parameters, keeping the types and count identical.","a":false,"e":"Parameter names are not part of the signature — only the number, type and order of parameter types matter. Same types with different names is a duplicate method, not a valid overload."},{"id":"tfm5kb4","l":"r3","t":"Data Types","v":"easy","s":"char in Java is a 16-bit unsigned Unicode character.","a":true,"e":"Unlike C/C++, Java's char is 2 bytes and Unicode-based."},{"id":"t1herlh8","l":"l3","t":"Arrays","v":"easy","s":"Array indices in Java start from 1.","a":false,"e":"Indices start at 0; the last valid index is length − 1."},{"id":"tmpocxr","l":"r2","t":"OOP Basics","v":"easy","s":"A static method can directly access non-static (instance) variables of its class.","a":false,"e":"Static methods need an object reference to reach instance members."},{"id":"tqaq46l","l":"l4","t":"Strings","v":"easy","s":"Strings in Java are mutable — their content can be changed after creation.","a":false,"e":"String objects are immutable; methods like toUpperCase() return a new String."},{"id":"t1nz5m35","l":"r8","t":"Loops","v":"easy","s":"A do-while loop always executes its body at least once, even if the condition is false.","a":true,"e":"The condition is checked AFTER the body (exit-controlled loop)."},{"id":"t1g48clw","l":"r7","t":"Control Statements","v":"easy","s":"Omitting 'break' in a switch case causes a compile-time error.","a":false,"e":"It is legal; execution just 'falls through' into the next case."},{"id":"tciujjk","l":"l7","t":"Constructors","v":"easy","s":"A constructor can be declared with a return type of void.","a":false,"e":"Constructors have no return type; adding void makes it an ordinary method."},{"id":"t1hr4i2o","l":"r6","t":"Math Library","v":"easy","s":"Math.random() can return exactly 1.0.","a":false,"e":"Range is 0.0 (inclusive) to 1.0 (exclusive)."},{"id":"t15hr78k","l":"r5a","t":"Java Basics","v":"easy","s":"Java is a case-sensitive programming language.","a":true,"e":"'Total' and 'total' are different identifiers."},{"id":"t3be8pt","l":"r5a","t":"Java Basics","v":"easy","s":"A single .java file can contain more than one public class.","a":false,"e":"Only ONE public class is allowed per file, and its name must match the file name."},{"id":"t169zdl8","l":"r5a","t":"Java Basics","v":"easy","s":"Comments are ignored by the compiler and do not affect execution.","a":true,"e":"// and /* */ are for human readers only."},{"id":"t1fk7owf","l":"r2","t":"OOP Basics","v":"easy","s":"The 'this' keyword can refer to the current object's instance variables.","a":true,"e":"e.g. this.name = name; separates the instance variable from the parameter."},{"id":"tpqx5wx","l":"l3","t":"Arrays","v":"easy","s":"The size of an array can be changed after it has been created.","a":false,"e":"Arrays are fixed in size once created."},{"id":"t9hw6fe","l":"r4","t":"Operators","v":"easy","s":"Integer division of two int operands always gives an int result.","a":true,"e":"5/2 = 2; the fractional part is discarded unless an operand is a double."},{"id":"t1vuktyq","l":"l5","t":"Methods","v":"easy","s":"The 'void' keyword means that a method returns a value.","a":false,"e":"void means the method returns NOTHING."},{"id":"te669xw","l":"l5","t":"Method Overloading","v":"easy","s":"Two methods can be overloaded if they differ only in return type.","a":false,"e":"The number, type or order of parameters must differ."},{"id":"t8s04x1","l":"r8","t":"Loops","v":"easy","s":"In a for loop, the initialisation runs only once, before the loop begins.","a":true,"e":"for(init; condition; update) — init runs a single time."},{"id":"t14gdzur","l":"l8","t":"Access Specifiers","v":"easy","s":"The default (no keyword) access level is more restrictive than private.","a":false,"e":"private is the MOST restrictive (class only)."},{"id":"tthxyxc","l":"l4","t":"Strings","v":"easy","s":"String methods such as toUpperCase() change the original String in place.","a":false,"e":"They return a NEW String; the original is unchanged unless reassigned."},{"id":"tsinmuo","l":"r6","t":"Math Library","v":"easy","s":"Math.floor() rounds a decimal number down to the nearest whole number.","a":true,"e":"Math.floor(4.8) = 4.0 and Math.floor(-4.2) = -5.0 (towards negative infinity)."},{"id":"t1poo2ug","l":"r4","t":"Operators","v":"easy","s":"For objects, the == operator compares their actual content.","a":false,"e":"== compares references; use equals() to compare String content."},{"id":"t12msqjh","l":"r3","t":"Data Types","v":"easy","s":"The byte data type occupies 1 byte (8 bits) in Java.","a":true,"e":"Range −128 to 127."},{"id":"trfrglb","l":"r8","t":"Loops","v":"easy","s":"A while loop checks its condition before executing the body the first time.","a":true,"e":"It is entry-controlled; the body may never execute."},{"id":"tstmdrk","l":"l6","t":"Static","v":"easy","s":"A static variable is created afresh for every new object of a class.","a":false,"e":"Only ONE copy exists, shared by all objects."},{"id":"t144t2e6","l":"r5a","t":"Java Basics","v":"easy","s":"The main method must be written as  public static void main(String args[]).","a":true,"e":"This signature lets the JVM find the entry point."},{"id":"t1n7rtlm","l":"l3","t":"Arrays","v":"easy","s":"A single Java array can hold values of different data types.","a":false,"e":"Arrays are homogeneous."},{"id":"t1pnxvud","l":"r5b","t":"Input in Java","v":"easy","s":"Scanner's nextInt() can correctly read the value 4.5.","a":false,"e":"It throws InputMismatchException; use nextDouble()."},{"id":"tumk5w4","l":"l3","t":"Sorting & Searching","v":"easy","s":"Both Bubble Sort and Selection Sort arrange elements in a defined order.","a":true,"e":"They use different techniques for the same job."},{"id":"t1n9okuw","l":"l3","t":"Sorting & Searching","v":"easy","s":"Binary Search always works correctly even if the array is unsorted.","a":false,"e":"Binary Search needs a sorted array."},{"id":"t193187m","l":"l7","t":"Constructors","v":"easy","s":"A constructor must be declared with the return type void.","a":false,"e":"A constructor has no return type at all, not even void. Adding void turns it into an ordinary method."},{"id":"tduxstk","l":"l4","t":"Strings","v":"easy","s":"The method trim() removes every space from a string, including the spaces between words.","a":false,"e":"trim() removes only the leading and trailing spaces. Spaces inside the string stay, so \"I N T\".trim() is still 5 characters long."},{"id":"tfgxi54","l":"r6","t":"Math Library","v":"easy","s":"Math.round(x) always returns a value of type double.","a":false,"e":"Math.round(double) returns a long and Math.round(float) returns an int. Math.ceil(), Math.floor() and Math.rint() are the ones that return double."},{"id":"t1vip8gk","l":"r7","t":"Control Statements","v":"easy","s":"A switch statement in Java can be used with a boolean expression.","a":false,"e":"switch works with byte, short, int, char, String and wrapper types. A boolean or a floating point expression is not allowed."},{"id":"t1su4kdw","l":"l5","t":"Methods","v":"easy","s":"If an array is passed to a method and the method changes one of its elements, the change is visible in the calling method.","a":true,"e":"The reference to the array is passed, so the method works on the same array object as the caller."},{"id":"t1tx969a","l":"l4","t":"Strings","v":"easy","s":"The charAt() method can be used to change a character inside a String.","a":false,"e":"charAt() only reads a character. A String is immutable, so a changed string has to be built as a new object."},{"id":"t1noyntw","l":"l7","t":"Constructors","v":"easy","s":"If a class has no constructor, the compiler supplies a default constructor.","a":true,"e":"The default constructor has no parameters and initialises the instance variables to their default values."},{"id":"t119xk4z","l":"r6","t":"Math Library","v":"easy","s":"Math.ceil(-2.5) returns -2.0.","a":true,"e":"ceil() gives the smallest whole number that is not less than the argument. On the number line the nearest whole number to the right of -2.5 is -2.0."},{"id":"t3j6z7d","l":"l3","t":"Sorting","v":"easy","s":"Bubble sort works by repeatedly comparing and swapping adjacent elements.","a":true,"e":"In each pass neighbouring elements that are out of order are swapped, so the largest remaining value moves to the end."},{"id":"txmysnr","l":"r3","t":"Data Types","v":"easy","s":"The expression 'A' + 1 gives the character 'B' without any type casting.","a":false,"e":"char + int is promoted to int, so the result is 66. To get 'B' you need (char)('A' + 1)."},{"id":"t19dov9o","l":"l5","t":"Scope","v":"easy","s":"A variable declared inside a method can be used by every other method of the class.","a":false,"e":"A local variable is visible only inside the block in which it is declared. Instance variables are the ones shared across methods."},{"id":"t1vta8kq","l":"r8","t":"Loops","v":"medium","s":"In for(int i = 0; i < 5; i++); { System.out.println(i); } the block runs once for every value of i.","a":false,"e":"The semicolon after the header is an empty loop body. The loop only counts, and the block that follows is a separate statement (here it would not even compile because i is out of scope)."},{"id":"t1yl21yc","l":"l2","t":"Wrapper Classes","v":"easy","s":"Integer.parseInt(\"12.5\") returns 12.","a":false,"e":"The text 12.5 is not a valid integer, so parseInt throws a NumberFormatException at run time. Use Double.parseDouble() for such text."},{"id":"t1wvyxxq","l":"l3","t":"Arrays","v":"easy","s":"The array int a[][] = new int[3][4]; has 12 elements.","a":true,"e":"3 rows multiplied by 4 columns gives 12 elements, all initialised to 0."},{"id":"tot1em3","l":"l3","t":"Sorting & Searching","v":"easy","s":"Linear search needs the array to be sorted, but binary search does not.","a":false,"e":"It is the other way round. Binary search needs a sorted array; linear search works on any array."},{"id":"tetch54","l":"r3","t":"Values & Data Types","v":"easy","s":"An identifier in Java can begin with a digit.","a":false,"e":"An identifier must begin with a letter, underscore (_) or dollar sign ($) — never a digit."},{"id":"t1ggcwsf","l":"r3","t":"Values & Data Types","v":"easy","s":"A char literal in Java is written within single quotes, e.g. 'A'.","a":true,"e":"Single quotes are used for a single character (char); double quotes are used for a String."},{"id":"t1mxyfzo","l":"r3","t":"Values & Data Types","v":"easy","s":"The keyword used to declare a constant value in Java is 'const'.","a":false,"e":"Java reserves the word 'const' but does not use it — constants are declared using 'final'."},{"id":"tjpw9mv","l":"r3","t":"Type Casting","v":"easy","s":"Implicit (widening) type conversion in Java may result in loss of data.","a":false,"e":"Implicit conversion always moves from a smaller to a larger type, so no data is lost. Explicit (narrowing) conversion is the one that can lose data."},{"id":"t111amz","l":"r4","t":"Operators","v":"easy","s":"The expression 5 / 2 evaluates to 2.5 in Java.","a":false,"e":"Both operands are int, so Java performs integer division, truncating the decimal part: 5 / 2 = 2."},{"id":"t19epv5u","l":"r4","t":"Operators","v":"easy","s":"The ternary operator in Java requires exactly three operands.","a":true,"e":"condition ? value1 : value2 — three operands make it the only ternary (three-operand) operator in Java."},{"id":"thnv0bs","l":"r4","t":"Operators","v":"easy","s":"The '=' symbol is a relational operator in Java.","a":false,"e":"'=' is the assignment operator. '==' is the relational (equality) operator."},{"id":"t1ti71on","l":"r4","t":"Operators","v":"easy","s":"Logical operators such as && and || can only be used with boolean operands/expressions.","a":true,"e":"&&, || and ! operate on boolean values and always produce a boolean result."},{"id":"t3yigpx","l":"r5b","t":"Input in Java","v":"easy","s":"The Scanner class belongs to the java.util package.","a":true,"e":"Scanner must be imported using 'import java.util.Scanner;' or 'import java.util.*;'."},{"id":"to4nlf0","l":"r5b","t":"Input in Java","v":"easy","s":"Scanner's nextInt() method can correctly read a decimal value such as 4.5.","a":false,"e":"nextInt() expects a whole number and throws an InputMismatchException on decimal input — nextDouble() should be used instead."},{"id":"t1y14rsq","l":"r5b","t":"Input in Java","v":"easy","s":"The Scanner class must be imported from the java.util package before it can be used.","a":true,"e":"A program must include 'import java.util.Scanner;' or 'import java.util.*;' before creating a Scanner object."},{"id":"thlqyrb","l":"r5b","t":"Input in Java","v":"easy","s":"Scanner's next() method can correctly read a full sentence containing multiple words separated by spaces.","a":false,"e":"next() stops reading at the first space — only nextLine() reads a complete line including all its spaces."},{"id":"t1xgdkgr","l":"r6","t":"Math Library","v":"easy","s":"Math.floor() always rounds a decimal number up to the next whole number.","a":false,"e":"Math.floor() rounds DOWN towards negative infinity. Math.ceil() is the one that rounds up."},{"id":"t1bhb14q","l":"r6","t":"Math Library","v":"easy","s":"Math.pow(x, y) returns a value of type double.","a":true,"e":"Regardless of whether x and y are int or double, Math.pow() always returns a double."},{"id":"tglrcv2","l":"r7","t":"Conditional Statements","v":"easy","s":"The 'default' case in a switch statement must always be written as the last case.","a":false,"e":"'default' can be placed anywhere inside a switch block — though writing it last is a common and recommended style, Java does not require it."},{"id":"t1ncpkae","l":"r7","t":"Conditional Statements","v":"easy","s":"A switch statement in Java can test floating-point (double) values directly.","a":false,"e":"switch only works with int, char, byte, short, String and enum — not with float or double."},{"id":"t16l99dj","l":"r7","t":"Conditional Statements","v":"easy","s":"Omitting 'break' at the end of a switch case is a compile-time error.","a":false,"e":"It is legal Java — execution simply 'falls through' into the next case at runtime, though it is often an unintended mistake."},{"id":"t16crxt7","l":"r8","t":"Iterative Constructs","v":"easy","s":"A while loop is an entry-controlled loop.","a":true,"e":"The condition of a while loop is tested BEFORE the body executes, so the body may run zero times."},{"id":"td2euc9","l":"r8","t":"Iterative Constructs","v":"easy","s":"A do-while loop always executes its body at least once.","a":true,"e":"Because the condition is tested AFTER the body in a do-while loop, the body is guaranteed to run at least one time."},{"id":"t9t3wh5","l":"r8","t":"Iterative Constructs","v":"easy","s":"The initialisation part of a for loop executes once for every iteration of the loop.","a":false,"e":"The initialisation executes only ONCE, right before the loop begins. Only the condition and update run repeatedly."},{"id":"t1xoyyd7","l":"r8","t":"Iterative Constructs","v":"easy","s":"The 'continue' statement terminates the loop completely.","a":false,"e":"'continue' only skips the rest of the current iteration; the loop itself keeps running. 'break' is the one that terminates a loop completely."},{"id":"txp6cgq","l":"r8","t":"Iterative Constructs","v":"easy","s":"It is possible to have more than one update expression in the update part of a for loop, separated by commas.","a":true,"e":"Java allows multiple comma-separated statements in the initialisation and update sections of a for loop, e.g. for(int i=0, j=10; i<j; i++, j--)."},{"id":"t1mnfxj8","l":"r9","t":"Nested Loops","v":"easy","s":"In a nested loop, the inner loop completes ALL of its iterations for every single iteration of the outer loop.","a":true,"e":"This is exactly how nested loops work, and is the basis of most pattern-printing programs."},{"id":"tx5c9rl","l":"r9","t":"Nested Loops","v":"easy","s":"Nested loops can only be made using two 'for' loops; a 'for' loop and a 'while' loop cannot be nested together.","a":false,"e":"Any combination of for, while and do-while loops can be nested inside one another."},{"id":"t7ljgi","l":"r3","t":"Escape Sequences","v":"easy","s":"The escape sequence \\\\ represents a single backslash character.","a":true,"e":"Since backslash itself begins an escape sequence, writing two backslashes \\\\ is needed to represent one literal backslash."},{"id":"tb70his","l":"r3","t":"Values & Data Types","v":"easy","s":"A literal is a type of token in Java.","a":true,"e":"The main types of tokens are keywords, identifiers, literals, operators and separators — literal is one of them."},{"id":"tj0oqdj","l":"r4","t":"Operators","v":"easy","s":"The expression (q-p)>(p-q) ? (q-p) : (p-q) always evaluates to the larger of the two differences.","a":true,"e":"This is the classic 'absolute difference' idiom using the ternary operator — it compares the two differences and picks whichever is larger."},{"id":"t93lp6v","l":"r6","t":"Math Library","v":"medium","s":"Math.sqrt() and Math.cbrt() both accept and return values of type double.","a":true,"e":"Both methods take a double argument and return a double result — sqrt() for square roots, cbrt() for cube roots (which also works correctly for negative numbers, unlike sqrt())."}],"predict":[{"id":"pbmn5zz","l":"r2","t":"Reference sharing","v":"medium","q":"What is the output of the program?","code":"class Car {\n    int speed;\n    Car(int s) { speed = s; }\n    void accelerate() { speed += 10; }\n    public static void main(String[] args) {\n        Car c1 = new Car(40);\n        Car c2 = c1;\n        c2.accelerate();\n        System.out.println(c1.speed + \" \" + c2.speed);\n    }\n}","a":"<b>Output:</b> 50 50<br>c2 = c1 copies the reference, so both refer to the same object; accelerate() through c2 changes the one shared speed from 40 to 50."},{"id":"p1cvhjmu","l":"r2","t":"== on objects","v":"hard","q":"What is the output of the program?","code":"class Student {\n    String name; int roll;\n    Student(String n, int r) { name = n; roll = r; }\n    public static void main(String[] args) {\n        Student s1 = new Student(\"Ravi\", 5);\n        Student s2 = new Student(\"Ravi\", 5);\n        System.out.println(s1 == s2);\n        s2 = s1;\n        System.out.println(s1 == s2);\n    }\n}","a":"<b>Output:</b><br>false<br>true<br>== compares references. s1 and s2 first refer to two different objects, so false. After s2 = s1 both refer to the same object, so true."},{"id":"p142ei3i","l":"r2","t":"Default values","v":"medium","q":"What is the output of the program?","code":"class Account {\n    int bal; String name; boolean active; double rate;\n    public static void main(String[] args) {\n        Account ac = new Account();\n        System.out.println(ac.bal + \" \" + ac.name + \" \" + ac.active + \" \" + ac.rate);\n    }\n}","a":"<b>Output:</b> 0 null false 0.0<br>Instance variables get default values: int 0, String (reference) null, boolean false, double 0.0."},{"id":"p19531qf","l":"r5a","t":"String concatenation","v":"medium","q":"What is the output of the program?","code":"class T {\n    public static void main(String[] args) {\n        System.out.println(\"A\" + 1 + 2);\n        System.out.println(1 + 2 + \"A\");\n    }\n}","a":"<b>Output:</b><br>A12<br>3A<br>Evaluation is left to right. \"A\" + 1 gives the String \"A1\", then + 2 gives \"A12\". In 1 + 2 + \"A\", 1 + 2 is added first (3), then joined with \"A\"."},{"id":"pib91qc","l":"r5a","t":"Comments","v":"easy","q":"What is the output of the program?","code":"class T {\n    public static void main(String[] args) {\n        int x = 5; // x = 10;\n        /* x = 20; */\n        System.out.println(x);\n    }\n}","a":"<b>Output:</b> 5<br>Both assignments are inside comments, which the compiler ignores, so x stays 5."},{"id":"pc6dxq5","l":"r5a","t":"char arithmetic","v":"hard","q":"What is the output of the program?","code":"class T {\n    public static void main(String[] args) {\n        char c = 'A';\n        c++;\n        System.out.println(c);\n        System.out.println(c + 1);\n    }\n}","a":"<b>Output:</b><br>B<br>67<br>c++ makes c = 'B' (printed as a char). c + 1 is an int expression: 66 + 1 = 67."},{"id":"pmrwbw7","l":"r5a","t":"Integer division","v":"medium","q":"What is the output of the program?","code":"class T {\n    public static void main(String[] args) {\n        int a = 7;\n        double d = a / 2;\n        System.out.println(d);\n        System.out.println(a / 2.0);\n    }\n}","a":"<b>Output:</b><br>3.0<br>3.5<br>a / 2 is integer division (3), which is then widened to 3.0 when stored in d. a / 2.0 is floating-point division, giving 3.5."},{"id":"pe9kmti","l":"l8","t":"Constructor order","v":"medium","q":"What is the output of the program?","code":"class A { A() { System.out.println(\"A\"); } }\nclass B extends A { B() { System.out.println(\"B\"); } }\nclass C extends B {\n    C() { System.out.println(\"C\"); }\n    public static void main(String[] args) { new C(); }\n}","a":"<b>Output:</b><br>A<br>B<br>C<br>Constructors execute from the top of the hierarchy: C() calls B() implicitly, which calls A() first; A prints, then B, then C."},{"id":"pw5louc","l":"l8","t":"super(args)","v":"medium","q":"What is the output of the program?","code":"class Parent {\n    Parent(int x) { System.out.println(\"Parent \" + x); }\n}\nclass Child extends Parent {\n    Child() { super(5); System.out.println(\"Child\"); }\n    public static void main(String[] args) { new Child(); }\n}","a":"<b>Output:</b><br>Parent 5<br>Child<br>super(5) is the first statement and runs Parent(int) first; then the rest of Child() executes."},{"id":"p1xkp0oh","l":"l8","t":"Overriding with super","v":"medium","q":"What is the output of the program?","code":"class Animal {\n    void sound() { System.out.println(\"Animal sound\"); }\n}\nclass Dog extends Animal {\n    void sound() { super.sound(); System.out.println(\"Bark\"); }\n    public static void main(String[] args) {\n        Animal x = new Dog();\n        x.sound();\n    }\n}","a":"<b>Output:</b><br>Animal sound<br>Bark<br>The object is a Dog, so Dog's overridden sound() runs; it first calls super.sound() (prints Animal sound) and then prints Bark."},{"id":"pxrvnlz","l":"l8","t":"Field vs method via reference","v":"hard","q":"What is the output of the program?","code":"class P {\n    int x = 10;\n    int get() { return x; }\n}\nclass Q extends P {\n    int x = 20;\n    int get() { return x; }\n    public static void main(String[] args) {\n        P p = new Q();\n        System.out.println(p.x + \" \" + p.get());\n    }\n}","a":"<b>Output:</b> 10 20<br>Variables are not overridden: p.x uses the reference type P, giving 10. The method get() is overridden, so Q's version runs and returns Q's x, 20."},{"id":"ptzdd8y","l":"l8","t":"Overload resolution","v":"hard","q":"What is the output of the program?","code":"class A {\n    void f(int a) { System.out.println(\"A int\"); }\n}\nclass B extends A {\n    void f(double a) { System.out.println(\"B double\"); }\n    public static void main(String[] args) {\n        B b = new B();\n        b.f(5);\n        b.f(5.0);\n    }\n}","a":"<b>Output:</b><br>A int<br>B double<br>f(double) in B does not override f(int) of A (different parameters): it overloads it. f(5) matches the inherited f(int) exactly; f(5.0) can only match f(double)."},{"id":"p1i9j7mn","l":"l8","t":"Multilevel with protected","v":"hard","q":"What is the output of the program?","code":"class A {\n    protected int v = 1;\n    void inc() { v++; }\n}\nclass B extends A {\n    void inc() { v += 2; super.inc(); }\n}\nclass C extends B {\n    public static void main(String[] args) {\n        C c = new C();\n        c.inc();\n        System.out.println(c.v);\n    }\n}","a":"<b>Output:</b> 4<br>c.inc() runs B's inc(): v becomes 3, then super.inc() (A's) increments it to 4. The protected variable v is inherited by C."},{"id":"pelorgb","l":"l8","t":"Constructor selection","v":"hard","q":"What is the output of the program?","code":"class Parent {\n    Parent() { System.out.println(\"P0\"); }\n    Parent(int a) { System.out.println(\"P1\"); }\n}\nclass Child extends Parent {\n    Child() { System.out.println(\"C0\"); }\n    Child(int a) { super(a); System.out.println(\"C1\"); }\n    public static void main(String[] args) {\n        new Child();\n        new Child(3);\n    }\n}","a":"<b>Output:</b><br>P0<br>C0<br>P1<br>C1<br>new Child() implicitly calls Parent(), then prints C0. new Child(3) calls super(a), i.e. Parent(int), then prints C1."},{"id":"p93ei02","l":"l8","t":"super with variable","v":"medium","q":"What is the output of the program?","code":"class P {\n    int x = 10;\n    void show() { System.out.println(x); }\n}\nclass Q extends P {\n    int x = 20;\n    void show() { System.out.println(x + \" \" + super.x); }\n    public static void main(String[] args) { new Q().show(); }\n}","a":"<b>Output:</b> 20 10<br>Inside Q, x is Q's own variable (20), which hides P's x. super.x refers to the superclass variable (10)."},{"id":"pbcvfmp","l":"l2","t":"Character methods","v":"medium","q":"What is printed?","code":"String s = \"Java9 Is Fun!\";\nint u = 0, l = 0, d = 0, o = 0;\nfor (int i = 0; i < s.length(); i++) {\n    char ch = s.charAt(i);\n    if (Character.isUpperCase(ch)) u++;\n    else if (Character.isLowerCase(ch)) l++;\n    else if (Character.isDigit(ch)) d++;\n    else o++;\n}\nSystem.out.println(u + \" \" + l + \" \" + d + \" \" + o);","a":"<b>Output:</b> 3 6 1 3<br>Upper: J, I, F; lower: a, v, a, s, u, n; digit: 9; others: two spaces and '!'."},{"id":"pidcsby","l":"l2","t":"parseInt","v":"easy","q":"Predict the output.","code":"String a = \"45\", b = \"15\";\nSystem.out.println(a + b);\nSystem.out.println(Integer.parseInt(a) + Integer.parseInt(b));","a":"<b>Output:</b><br>4515<br>60<br>The + on Strings joins them; after parseInt the + adds numbers."},{"id":"p13c5xse","l":"l2","t":"Autoboxing / unboxing","v":"medium","q":"Predict the output.","code":"Integer x = 100;\nInteger y = 100;\nint z = x + y;\ndouble d = Double.parseDouble(\"2.5\") * 2;\nSystem.out.println(z + \" \" + d);","a":"<b>Output:</b> 200 5.0<br>x and y are unboxed for the addition; parseDouble gives 2.5, and 2.5 * 2 is the double 5.0."},{"id":"pis6d9t","l":"l2","t":"Char arithmetic","v":"hard","q":"Predict the output.","code":"char c = 'm';\nSystem.out.println(Character.toUpperCase(c));\nSystem.out.println(c - 'a');\nSystem.out.println((char)(c + 1));\nSystem.out.println(c + 1);","a":"<b>Output:</b><br>M<br>12<br>n<br>110<br>'m' = 109, 'a' = 97, so c - 'a' = 12; c + 1 is the int 110, while the cast gives 'n'."},{"id":"p1pbm52l","l":"l2","t":"Integer constants","v":"hard","q":"Predict the output.","code":"int max = Integer.MAX_VALUE;\nmax = max + 1;\nSystem.out.println(max);\nSystem.out.println(Integer.MIN_VALUE);","a":"<b>Output:</b><br>-2147483648<br>-2147483648<br>Adding 1 to the largest int overflows and wraps to the smallest int."},{"id":"p1t28jee","l":"l5","t":"Call by value vs reference","v":"medium","q":"Predict the output.","code":"class Swap {\n    static void swapVal(int a, int b) { int t = a; a = b; b = t; }\n    static void swapArr(int[] x) { int t = x[0]; x[0] = x[1]; x[1] = t; }\n    public static void main(Stri
