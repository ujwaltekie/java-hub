qualsIgnoreCase()","contains()"],"c":2,"e":"equalsIgnoreCase() returns true when both strings have the same characters regardless of case, e.g. \"Java\".equalsIgnoreCase(\"JAVA\") is true."},{"id":"m19h0h0d","l":"l4","t":"String Methods","v":"easy","q":"What does \"BlueJ\".charAt(2) return?","o":["'B'","'l'","'u'","'e'"],"c":2,"e":"Indexing starts at 0: B(0) l(1) u(2) e(3) J(4). So charAt(2) is u."},{"id":"m1v35lnn","l":"l4","t":"String Methods","v":"easy","q":"What is the return type of the String method indexOf()?","o":["char","String","boolean","int"],"c":3,"e":"indexOf() returns the position of the first occurrence as an int, or -1 if not found."},{"id":"mzjalr1","l":"l4","t":"indexOf and lastIndexOf","v":"medium","q":"What is the output of the following code?","o":["3 10","3 9","2 10","3 11"],"c":0,"e":"In \"programming\": p0 r1 o2 g3 r4 a5 m6 m7 i8 n9 g10. The first g is at 3 and the last g is at 10.","code":"String s = \"programming\";\nSystem.out.println(s.indexOf('g') + \" \" + s.lastIndexOf('g'));"},{"id":"mvobpoo","l":"l4","t":"Immutability","v":"medium","q":"What is the output of the following code?","o":["HELLO WORLD","Hello World","Hello","HELLO"],"c":2,"e":"Strings are immutable. concat() and toUpperCase() return new strings, but those results are thrown away, so s still holds Hello.","code":"String s = \"Hello\";\ns.concat(\" World\");\ns.toUpperCase();\nSystem.out.println(s);"},{"id":"m1o6d66w","l":"l4","t":"compareTo","v":"medium","q":"What is the output of the following code?","o":["-1","1","0","-97"],"c":0,"e":"compareTo() returns the difference of the first pair of differing characters: 'a' - 'b' = 97 - 98 = -1.","code":"System.out.println(\"apple\".compareTo(\"banana\"));"},{"id":"m1qo1cvf","l":"l4","t":"== vs equals","v":"hard","q":"What is the output of the following code?","o":["true true","false true","false false","true false"],"c":1,"e":"new String(\"ICSE\") creates a separate object, so a == b (reference comparison) is false. equals() compares the characters, so it is true.","code":"String a = new String(\"ICSE\");\nString b = \"ICSE\";\nSystem.out.println(a == b);\nSystem.out.println(a.equals(b));"},{"id":"m1wbezkb","l":"l4","t":"String Methods","v":"hard","q":"What is the output of the following code?","o":["ucan4","uca-14","ucan-1","ucan5"],"c":0,"e":"\"Education\": E0 d1 u2 c3 a4 t5 i6 o7 n8. substring(2,5) = \"uca\", the last character is n, and the pair a, t (indexes 4 and 5) means indexOf(\"at\") is 4. Result: uca + n + 4 = ucan4.","code":"String s = \"Education\";\nSystem.out.println(s.substring(2, 5) + s.charAt(s.length() - 1) + s.indexOf(\"at\"));"},{"id":"m1fbyfmc","l":"l3","t":"Array Declaration","v":"easy","q":"Which of the following correctly declares and creates an integer array of 5 elements?","o":["int a = new int[5];","int a[5];","int[] a = new int(5);","int[] a = new int[5];"],"c":3,"e":"The size is given in square brackets after new int. int a[5] is C-style and is not allowed, and new int(5) uses the wrong brackets."},{"id":"m11ndbp","l":"l3","t":"Default Values","v":"easy","q":"What is the default value of every element of the array double d[] = new double[4];?","o":["0","0.0","null","undefined"],"c":1,"e":"Numeric arrays are filled with zero of their type. For double the default is 0.0 (int gives 0, boolean false, String null)."},{"id":"m1nqh6fx","l":"l3","t":"Array Elements","v":"medium","q":"What is the output of the following code?","o":["24","31","23","39"],"c":0,"e":"a.length - 2 = 3, so a[3] = 16; a[1] = 8. The sum 16 + 8 = 24.","code":"int a[] = {4, 8, 15, 16, 23};\nSystem.out.println(a[a.length - 2] + a[1]);"},{"id":"m1stc70x","l":"l3","t":"Array Traversal","v":"medium","q":"What is the value of s after the loop?","o":["12","8","14","23"],"c":0,"e":"i takes 0, 2, 4, so s = a[0] + a[2] + a[4] = 3 + 4 + 5 = 12.","code":"int a[] = {3, 1, 4, 1, 5, 9};\nint s = 0;\nfor (int i = 0; i < a.length; i += 2)\n    s += a[i];"},{"id":"m1ahc2v2","l":"l3","t":"Arrays and References","v":"hard","q":"What is the output of the following code?","o":["10","99","20","Compile-time error"],"c":1,"e":"b = a does not copy the array: both variables refer to the same array object. Changing b[0] therefore also changes a[0].","code":"int a[] = {10, 20, 30};\nint b[] = a;\nb[0] = 99;\nSystem.out.println(a[0]);"},{"id":"m1d21dp2","l":"l3","t":"2D Arrays","v":"hard","q":"What is the output of the following code?","o":["7","6","5","9"],"c":0,"e":"m[i][j] is 1 on the diagonal and i + j elsewhere. m[2][1] = 3, m[1][2] = 3 and m[0][0] = 1, so the sum is 7.","code":"int m[][] = new int[3][3];\nfor (int i = 0; i < 3; i++)\n    for (int j = 0; j < 3; j++)\n        m[i][j] = (i == j) ? 1 : i + j;\nSystem.out.println(m[2][1] + m[1][2] + m[0][0]);"},{"id":"mvbqwr4","l":"r7","t":"switch","v":"easy","q":"In a switch statement, the block that executes when none of the case labels matches the expression is the:","o":["else block","default block","final block","break block"],"c":1,"e":"default is the catch-all label of switch, similar to the last else of an if-else-if ladder."},{"id":"m3hv4ms","l":"r7","t":"if statement","v":"easy","q":"Which of the following is a valid condition in Java?","o":["if (x = 5)","if (x == 5)","if x == 5","if (x := 5)"],"c":1,"e":"The condition must be a boolean expression in brackets. == compares; a single = is assignment, which is not allowed here for an int x."},{"id":"m1x6yceh","l":"r7","t":"Ternary Operator","v":"easy","q":"Which of the following is the correct syntax of the conditional (ternary) operator?","o":["condition ? exp1 : exp2","condition : exp1 ? exp2","condition ? exp1 ; exp2","if condition ? exp1 : exp2"],"c":0,"e":"If the condition is true, exp1 is evaluated, otherwise exp2."},{"id":"m15bo3x2","l":"r7","t":"switch","v":"medium","q":"What is the output of the following code?","o":["Good","GoodFair","Fair","GoodFairPoor"],"c":1,"e":"Case B matches and prints Good. There is no break, so execution falls through into case C, prints Fair and then meets break.","code":"char grade = 'B';\nswitch (grade) {\n    case 'A': System.out.print(\"Excellent\");\n    case 'B': System.out.print(\"Good\");\n    case 'C': System.out.print(\"Fair\");\n              break;\n    default:  System.out.print(\"Poor\");\n}"},{"id":"m1adf5b5","l":"r7","t":"Dangling else","v":"medium","q":"What is the output of the following code?","o":["A","B","AB","Nothing is printed"],"c":1,"e":"An else always belongs to the nearest preceding if. Here it pairs with if (y < 5). x > 3 is true, y < 5 is false, so the else part prints B.","code":"int x = 5, y = 10;\nif (x > 3)\n    if (y < 5)\n        System.out.print(\"A\");\n    else\n        System.out.print(\"B\");"},{"id":"mraryvd","l":"r7","t":"Ternary Operator","v":"medium","q":"What is the value of r after the code is executed?","o":["A","B","C","D"],"c":2,"e":"m >= 90 is false, m >= 75 is false, m >= 60 is true, so the result is \"C\".","code":"int m = 65;\nString r = m >= 90 ? \"A\" : m >= 75 ? \"B\" : m >= 60 ? \"C\" : \"D\";\nSystem.out.println(r);"},{"id":"majb146","l":"r7","t":"switch","v":"hard","q":"What is the output of the following code?","o":["Other","OtherWed","OtherWedFri","Wed"],"c":1,"e":"No case equals 4, so control jumps to default and prints Other. default has no break, so it falls through into case 3, prints Wed and meets break.","code":"int d = 4;\nswitch (d) {\n    case 1: System.out.print(\"Mon\");\n    case 2: System.out.print(\"Tue\");\n    default: System.out.print(\"Other\");\n    case 3: System.out.print(\"Wed\");\n            break;\n    case 5: System.out.print(\"Fri\");\n}"},{"id":"m1msnm94","l":"r7","t":"Logical Operators","v":"hard","q":"What is the output of the following code?","o":["5 10","5 11","5 12","6 11"],"c":1,"e":"a > 3 is true, so the || operator short-circuits and b++ > 5 is NOT evaluated; b stays 10. The if body then makes b = 11.","code":"int a = 5, b = 10;\nif (a > 3 || b++ > 5)\n    b += 1;\nSystem.out.println(a + \" \" + b);"},{"id":"m10n2wiw","l":"r6","t":"Math.pow","v":"easy","q":"What is the output of the following statement?","o":["25","25.0","10","7.0"],"c":1,"e":"Math.pow() returns a double, so 5 raised to the power 2 is displayed as 25.0.","code":"System.out.println(Math.pow(5, 2));"},{"id":"m1dx7cm4","l":"r6","t":"Math.ceil","v":"easy","q":"Which Math method returns the smallest whole number that is greater than or equal to its argument?","o":["Math.floor()","Math.ceil()","Math.round()","Math.rint()"],"c":1,"e":"ceil() rounds up (towards positive infinity), e.g. Math.ceil(4.1) is 5.0."},{"id":"m1y30eat","l":"r6","t":"Return types","v":"medium","q":"What happens when the statement int r = Math.pow(2, 3); is compiled?","o":["r becomes 8","r becomes 8.0","Compile-time error: possible lossy conversion from double to int","Run-time error"],"c":2,"e":"Math.pow() returns a double, which cannot be assigned to an int without a cast. Write int r = (int) Math.pow(2, 3);"},{"id":"m11hgjbn","l":"r6","t":"Nested Math calls","v":"medium","q":"What is the output of the following statement?","o":["6.0","7.0","7","6.32"],"c":1,"e":"sqrt(40) is about 6.32, and ceil() rounds it up to 7.0 (a double).","code":"System.out.println(Math.ceil(Math.sqrt(40)));"},{"id":"m170w8wq","l":"r6","t":"Math.round","v":"medium","q":"What is the output of the following statement?","o":["0","1","5","-1"],"c":1,"e":"Math.round(2.5) is 3 and Math.round(-2.5) is -2 (round(x) is floor(x + 0.5)). 3 + (-2) = 1, a long value.","code":"System.out.println(Math.round(2.5) + Math.round(-2.5));"},{"id":"mbf36g0","l":"r6","t":"Nested Math calls","v":"hard","q":"What is the output of the following statement?","o":["-6.0","-5.0","-7.0","-6"],"c":0,"e":"floor(-3.2) = -4.0, ceil(-3.8) = -3.0 and abs(-1) = 1 (int). The sum is -4.0 + (-3.0) + 1 = -6.0, a double.","code":"System.out.println(Math.floor(-3.2) + Math.ceil(-3.8) + Math.abs(-1));"},{"id":"miqd2to","l":"r8","t":"for loop","v":"easy","q":"In a for loop, the update expression (such as i++) is executed:","o":["Before the first iteration only","After every execution of the loop body","Only once, when the loop ends","Before the condition is tested for the first time"],"c":1,"e":"The order is: initialise once, test the condition, execute the body, execute the update, then test again."},{"id":"mo0ooe9","l":"r8","t":"for loop","v":"easy","q":"What is the output of the following code?","o":["4","5","10","6"],"c":1,"e":"i takes the values 0, 2, 4, 6, 8, so the body runs 5 times.","code":"int c = 0;\nfor (int i = 0; i < 10; i += 2)\n    c++;\nSystem.out.println(c);"},{"id":"mlhlq7j","l":"r8","t":"while loop","v":"medium","q":"What is the output of the following code?","o":["22","28","19","10"],"c":0,"e":"i takes 1, 4, 7, 10, so s = 1 + 4 + 7 + 10 = 22.","code":"int i = 1, s = 0;\nwhile (i <= 10) {\n    s += i;\n    i += 3;\n}\nSystem.out.println(s);"},{"id":"milur43","l":"r8","t":"Counting down","v":"medium","q":"What is the output of the following code?","o":["10 7 4 1","10 7 4 1 -2","7 4 1","10 7 4"],"c":0,"e":"i goes 10, 7, 4, 1; the next value, -2, fails the test i > 0. Each number is followed by a space.","code":"for (int i = 10; i > 0; i -= 3)\n    System.out.print(i + \" \");"},{"id":"mg7dxd1","l":"r8","t":"break and continue","v":"hard","q":"What is the value of c after the loop?","o":["49","36","64","13"],"c":0,"e":"Even numbers are skipped by continue. Odd i = 1, 3, ..., 13 are added (49) and when i reaches 15 the break stops the loop. 1+3+5+7+9+11+13 = 49.","code":"int c = 0;\nfor (int i = 1; i <= 20; i++) {\n    if (i % 2 == 0)\n        continue;\n    if (i > 13)\n        break;\n    c += i;\n}\nSystem.out.println(c);"},{"id":"m1xq07a7","l":"r8","t":"do-while","v":"hard","q":"What is the output of the following code?","o":["20","24","23","25"],"c":1,"e":"x runs 5 to 6, 11 to 12, 17 to 18, 23 to 24 (add 5, then add 1 because the odd value never triggers continue). The test 24 < 20 fails, so the loop ends with x = 24.","code":"int x = 0;\ndo {\n    x += 5;\n    if (x % 2 == 0)\n        continue;\n    x++;\n} while (x < 20);\nSystem.out.println(x);"},{"id":"mbkuzlj","l":"l7","t":"Purpose of a constructor","v":"easy","q":"The main purpose of a constructor is to","o":["destroy an object after use","initialise the data members of an object when it is created","return a value to the calling method","declare the class variables"],"c":1,"e":"A constructor runs automatically at the time of object creation and gives the instance variables their initial values."},{"id":"m2oy7ow","l":"l7","t":"Number of constructors","v":"easy","q":"How many constructors can a class have?","o":["Only one","At most two","Any number, provided their parameter lists differ","Any number, provided their names differ"],"c":2,"e":"Constructors can be overloaded. All of them carry the class name, so they must differ in the number, type or order of parameters."},{"id":"m1vauszz","l":"l7","t":"Copy constructor","v":"easy","q":"A constructor such as Book(Book b), which receives an object of its own class as the argument, is called a","o":["default constructor","copy constructor","static constructor","private constructor"],"c":1,"e":"A constructor whose parameter is an object of the same class and which copies the data of that object is a copy constructor."},{"id":"ma4xrze","l":"l7","t":"Constructor overloading rules","v":"medium","q":"Which pair of constructors CANNOT be written together in the same class Box?","o":["Box(int a) and Box(double a)","Box(int a, int b) and Box(int b, int a)","Box() and Box(int a)","Box(int a, double b) and Box(double a, int b)"],"c":1,"e":"Parameter names do not matter. Box(int a, int b) and Box(int b, int a) have the same signature (int, int), so the compiler reports a duplicate constructor."},{"id":"m1maa8v","l":"l7","t":"Static counter in constructor","v":"medium","q":"What is the output of the following code?","o":["1 3","3 3","3 1","1 1"],"c":1,"e":"count is shared by all objects and is incremented once per constructor call, so it ends at 3. The third object copies that value into its own id, which is also 3.","code":"class Item {\n    static int count;\n    int id;\n    Item() {\n        count++;\n        id = count;\n    }\n    public static void main(String[] args) {\n        new Item();\n        new Item();\n        Item c = new Item();\n        System.out.println(c.id + \" \" + Item.count);\n    }\n}"},{"id":"m46ys3b","l":"l7","t":"Argument order","v":"medium","q":"The class Student has only the constructor Student(String n, int r). What happens when the following code is compiled?","o":["Student object with name 7 and roll Raj is created","Compile-time error: the arguments do not match any constructor","Run-time error","Compiles and sets name and roll to default values"],"c":1,"e":"The argument types must match the parameter types in the same order. (int, String) matches no constructor, so compilation fails.","code":"class Student {\n    String name;\n    int roll;\n    Student(String n, int r) {\n        name = n;\n        roll = r;\n    }\n    public static void main(String[] args) {\n        Student s = new Student(7, \"Raj\");\n    }\n}"},{"id":"m4r6bqk","l":"l7","t":"Overload resolution","v":"hard","q":"What is the output of the following code?","o":["int double int double","int double double double","int double int int","compile-time error"],"c":0,"e":"A char widens to int, so P('A') uses P(int). A long cannot be narrowed to int but can widen to double, so P(7L) uses P(double).","code":"class P {\n    P(int a) {\n        System.out.print(\"int \");\n    }\n    P(double a) {\n        System.out.print(\"double \");\n    }\n    public static void main(String[] args) {\n        new P(5);\n        new P(5.0);\n        new P('A');\n        new P(7L);\n    }\n}"},{"id":"m6enhhi","l":"l7","t":"Local variable vs this","v":"hard","q":"What is the output of the following code?","o":["11 8","5 8","11 3","5 3"],"c":1,"e":"In T() the local x is changed, not the instance variable, so a.x stays 5. In T(int x), this.x = 3 + 5 = 8.","code":"class T {\n    int x = 5;\n    T() {\n        int x = 10;\n        x++;\n    }\n    T(int x) {\n        this.x = x + this.x;\n    }\n    public static void main(String[] args) {\n        T a = new T();\n        T b = new T(3);\n        System.out.println(a.x + \" \" + b.x);\n    }\n}"},{"id":"m15sldx0","l":"r9","t":"Pattern logic","v":"easy","q":"In a nested loop program that prints a pattern, the inner loop usually controls the","o":["number of rows","number of characters printed in one row","value of n","type of the pattern"],"c":1,"e":"The outer loop selects the row; the inner loop prints the elements (columns) of that row."},{"id":"mwegfd0","l":"r9","t":"Spaces in a pyramid","v":"easy","q":"In a centred pyramid of n rows, how many leading spaces are printed before the stars in row i (1 <= i <= n)?","o":["i","n","n - i","n + i"],"c":2,"e":"The first row needs the most spaces (n - 1) and the last row needs none (n - n = 0), so row i needs n - i spaces."},{"id":"m1oaudx5","l":"r9","t":"Counting iterations","v":"medium","q":"What is the output of the following code?","o":["16","10","6","8"],"c":1,"e":"The inner loop runs 4, 3, 2 and 1 times for i = 1 to 4, so c = 4 + 3 + 2 + 1 = 10.","code":"int c = 0;\nfor (int i = 1; i <= 4; i++)\n    for (int j = i; j <= 4; j++)\n        c++;\nSystem.out.println(c);"},{"id":"m1lnxvkb","l":"r9","t":"Diagonal pattern","v":"medium","q":"What is the output of the following code? (In the options the rows are separated by a space.)","o":["*-- -*- --*","*** --- ---","--* -*- *--","*-- *-- *--"],"c":0,"e":"A star is printed only when the row number equals the column number, so the star moves along the main diagonal.","code":"for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (i == j)\n            System.out.print(\"*\");\n        else\n            System.out.print(\"-\");\n    }\n    System.out.println();\n}"},{"id":"m1jzaxhs","l":"r9","t":"Semicolon after inner loop","v":"hard","q":"What is the output of the following code?","o":["122333","123","234","111"],"c":2,"e":"The semicolon gives the inner loop an empty body, so it only advances j. When it stops, j = i + 1, and that value is printed once per outer iteration.","code":"int j;\nfor (int i = 1; i <= 3; i++) {\n    for (j = 1; j <= i; j++);\n    System.out.print(j);\n}"},{"id":"mhozfku","l":"r9","t":"break and continue together","v":"hard","q":"What is the output of the following code?","o":["1234","121324","12","112233"],"c":1,"e":"For each i the inner loop stops when j > i and skips j when i + j is odd. Printed: i=1: 1; i=2: 2; i=3: 1 3; i=4: 2 4, giving 121324.","code":"for (int i = 1; i <= 4; i++) {\n    for (int j = 1; j <= 4; j++) {\n        if (j > i)\n            break;\n        if ((i + j) % 2 == 1)\n            continue;\n        System.out.print(j);\n    }\n}"},{"id":"muri9a3","l":"r8","t":"Harmonic series","v":"easy","q":"To find S = 1 + 1/2 + 1/3 + ... + 1/n correctly, the term inside the loop (counter i, double s) should be written as","o":["1 / i","1.0 / i","i / 1","(int) 1 / i"],"c":1,"e":"1 / i is integer division and gives 0 for i > 1. Using 1.0 makes the division floating point."},{"id":"m13m0lxb","l":"r8","t":"Series of squares","v":"easy","q":"Which statement correctly adds the square of the counter i to s (s is an int) in the series 1² + 2² + ... + n²?","o":["s = s + i ^ 2;","s = s + Math.pow(i, 2);","s = s + i * i;","s = i * i;"],"c":2,"e":"^ is the XOR operator in Java, Math.pow returns a double (lossy assignment to int), and s = i * i overwrites the sum. s = s + i * i accumulates correctly."},{"id":"m1giutvy","l":"r8","t":"Alternating series","v":"medium","q":"What is the output of the following code?","o":["15","3","-3","9"],"c":1,"e":"s = 1 - 2 + 3 - 4 + 5 = 3.","code":"int s = 0;\nfor (int i = 1; i <= 5; i++) {\n    if (i % 2 == 0)\n        s -= i;\n    else\n        s += i;\n}\nSystem.out.println(s);"},{"id":"m141rv65","l":"r8","t":"Integer division in a series","v":"medium","q":"What is the output of the following code?","o":["0.0","1.0","1.75","2.0"],"c":0,"e":"i and (i + 1) are both int, so i / (i + 1) is integer division and gives 0 every time. The sum is converted to double only when printed: 0.0.","code":"double s = 0;\nfor (int i = 1; i <= 3; i++)\n    s += i / (i + 1);\nSystem.out.println(s);"},{"id":"minggi9","l":"r8","t":"Two variables in for","v":"hard","q":"What is the output of the following code?","o":["18","27","9","24"],"c":0,"e":"The pairs (i, j) are (1,10), (3,9), (5,8); at (7,7) the condition i < j fails. s = 9 + 6 + 3 = 18.","code":"int s = 0;\nfor (int i = 1, j = 10; i < j; i += 2, j--)\n    s += j - i;\nSystem.out.println(s);"},{"id":"m9rea2i","l":"r2","t":"Objects","v":"easy","q":"In the statement Student s = new Student(); what is 's'?","o":["A class","An object reference variable","A method","A constructor"],"c":1,"e":"'s' holds the reference (address) of the Student object created by new. It is a reference variable, not the object itself."},{"id":"me6x2sj","l":"r3","t":"Data Types","v":"easy","q":"The size of a double value in Java is:","o":["2 bytes","4 bytes","8 bytes","16 bytes"],"c":2,"e":"double is a 64-bit (8 byte) data type. float is 4 bytes and char is 2 bytes."},{"id":"m1jqqn97","l":"r5b","t":"Input in Java","v":"easy","q":"Which statement correctly reads one whole word (up to the next space) using a Scanner object sc?","o":["sc.next()","sc.nextLine()","sc.nextWord()","sc.read()"],"c":0,"e":"next() stops at whitespace. nextLine() reads the entire line, and nextWord() and read() do not exist in Scanner."},{"id":"m13ap09","l":"r3","t":"Data Types","v":"easy","q":"Which declaration of a character variable is correct?","o":["char c = \"A\";","char c = 'A';","Char c = 'A';","character c = 'A';"],"c":1,"e":"A char literal uses single quotes. Double quotes make a String, and Char/character are not Java types."},{"id":"mf08sy5","l":"r3","t":"Data Types","v":"easy","q":"What is the default value of a boolean instance variable?","o":["true","false","0","null"],"c":1,"e":"Instance variables get default values. boolean defaults to false, numeric types to 0 and references to null."},{"id":"m1rtudgc","l":"r4","t":"Operators","v":"easy","q":"Which of the following is a unary operator?","o":["*","/","++","%"],"c":2,"e":"++ works on a single operand. *, / and % each need two operands, so they are binary operators."},{"id":"m533rnc","l":"r4","t":"Operators","v":"easy","q":"What is the output of System.out.println(25 / 4);","o":["6.25","6","7","6.0"],"c":1,"e":"Both operands are int, so integer division is done and the fractional part is dropped. 25 / 4 = 6."},{"id":"mh330on","l":"r8","t":"Loops","v":"easy","q":"Which loop checks its condition only after executing the body once?","o":["for","while","do-while","None of these"],"c":2,"e":"do-while is an exit-controlled loop, so its body always runs at least once. for and while are entry-controlled."},{"id":"m1f6iwme","l":"r8","t":"Loops","v":"easy","q":"Which statement ends the current loop immediately and transfers control to the statement after it?","o":["continue","skip","break","pass"],"c":2,"e":"break terminates the loop. continue only skips the rest of the current iteration."},{"id":"m1bx2hor","l":"r8","t":"Loops","v":"medium","q":"What does for( ; ; ) { } represent?","o":["A syntax error","An infinite loop","A loop that never runs","A loop that runs once"],"c":1,"e":"With no condition, the loop test is treated as always true, so the loop never stops unless a break or return is used."},{"id":"m1twdao4","l":"l5","t":"Methods","v":"easy","q":"A method that does not return any value must have the return type:","o":["null","void","int","empty"],"c":1,"e":"void marks a method that returns nothing."},{"id":"mj2nebk","l":"l3","t":"Arrays","v":"easy","q":"What is the index of the last element of int a[] = new int[10];","o":["10","9","11","0"],"c":1,"e":"Indexing starts at 0, so the valid indices are 0 to 9."},{"id":"m5ynvvq","l":"l3","t":"Arrays","v":"easy","q":"Which statement declares a 2D array with 3 rows and 4 columns?","o":["int a[3][4];","int a[][] = new int[3][4];","int a = new int[3,4];","int[3][4] a;"],"c":1,"e":"The size is given only on the right side, with new: int a[][] = new int[3][4];"},{"id":"mrs7c3l","l":"l2","t":"Wrapper Classes","v":"easy","q":"Which of the following is NOT a wrapper class?","o":["Integer","Double","Character","String"],"c":3,"e":"String is an ordinary class for text. The wrapper classes are Byte, Short, Integer, Long, Float, Double, Character and Boolean."},{"id":"mw2n0fv","l":"l4","t":"Strings","v":"easy","q":"Which String method gives the number of characters in a string?","o":["size()","length()","count()","len()"],"c":1,"e":"String uses length() with brackets. length without brackets belongs to arrays."},{"id":"m1d5ozah","l":"l2","t":"Packages","v":"easy","q":"Which statement imports every class of the java.util package?","o":["import java.util.*;","import java.util;","include java.util.*;","using java.util.*;"],"c":0,"e":"import java.util.*; uses * as a wildcard for all classes in the package."},{"id":"m1v4lets","l":"r6","t":"Math Library","v":"easy","q":"What is the output of System.out.println(Math.sqrt(49));","o":["7","7.0","49.0","Error"],"c":1,"e":"Math.sqrt() returns a double, so the result prints as 7.0."},{"id":"m1jl253m","l":"l3","t":"Arrays","v":"easy","q":"What is the default value of every element of int a[] = new int[3];","o":["null","1","0","Garbage value"],"c":2,"e":"Array elements are initialised automatically. int elements become 0."},{"id":"mvioyjn","l":"l4","t":"Strings","v":"medium","q":"What is the output?\nString s = \"Computer\";\nSystem.out.println(s.substring(3, 6));","o":["put","pute","mpu","uter"],"c":0,"e":"substring(3, 6) takes characters from index 3 up to, but not including, index 6. Indices 3, 4, 5 are p, u, t."},{"id":"m1fe0cxo","l":"l4","t":"Strings","v":"medium","q":"What is the output of System.out.println(\"Banana\".lastIndexOf('a'));","o":["1","3","5","6"],"c":2,"e":"lastIndexOf() searches from the right. The last 'a' in Banana is at index 5 (B0 a1 n2 a3 n4 a5)."},{"id":"mvf7mnz","l":"l4","t":"Strings","v":"hard","q":"What is the output of System.out.println(\"ICSE\".compareTo(\"ICSC\"));","o":["2","-2","0","1"],"c":0,"e":"The first two characters match, then 'S' = 'S'. At the last position 'E' (69) is compared with 'C' (67). compareTo returns 69 - 67 = 2."},{"id":"m1q3c3pm","l":"l4","t":"Strings","v":"medium","q":"What is the output of System.out.println(\"Hi\".equals(\"hi\") + \" \" + \"Hi\".equalsIgnoreCase(\"hi\"));","o":["true true","false true","false false","true false"],"c":1,"e":"equals() is case sensitive, so it gives false. equalsIgnoreCase() ignores case, so it gives true."},{"id":"mdw53c5","l":"l4","t":"Strings","v":"medium","q":"What does \"  Java  \".trim().length() return?","o":["8","6","4","2"],"c":2,"e":"trim() removes the spaces at both ends, leaving \"Java\", which has 4 characters."},{"id":"mn77yd4","l":"l4","t":"Strings","v":"hard","q":"What happens when \"JAVA\".charAt(4) is executed?","o":["It returns '\\0'","It returns a space","A runtime error (StringIndexOutOfBoundsException)","A compile-time error"],"c":2,"e":"Valid indices of \"JAVA\" are 0 to 3. An index of 4 is outside the string, so an exception occurs while the program runs."},{"id":"mmxw8e4","l":"l4","t":"Strings","v":"easy","q":"What is the return type of the String method endsWith()?","o":["int","String","boolean","char"],"c":2,"e":"startsWith() and endsWith() answer a yes/no question, so they return boolean."},{"id":"m1haibbk","l":"l4","t":"Strings","v":"medium","q":"What is the value of x?\nint x = \"Java\".length() * 2 + \"Hello\".indexOf('l');","o":["10","11","8","12"],"c":0,"e":"\"Java\".length() = 4, so 4 * 2 = 8. \"Hello\".indexOf('l') = 2. Total = 10."},{"id":"m1itg3i5","l":"r4","t":"String Concatenation","v":"hard","q":"What is the output of System.out.println(1 + 2 + \"3\" + 4 + 5);","o":["12345","3345","339","15"],"c":1,"e":"Evaluation goes left to right. 1 + 2 = 3 (numbers), then 3 + \"3\" = \"33\" (string), after that 4 and 5 are simply joined: \"3345\"."},{"id":"mhtpe0t","l":"l2","t":"Character Class","v":"medium","q":"What is the output of System.out.println(Character.isLetterOrDigit('_'));","o":["true","false","Error","_"],"c":1,"e":"An underscore is neither a letter nor a digit, so the method returns false."},{"id":"m1lt4nfk","l":"l2","t":"Character Class","v":"medium","q":"What is the output of System.out.println(Character.toUpperCase('5'));","o":["5","Error","53","null"],"c":0,"e":"toUpperCase() leaves characters that have no upper case unchanged. The digit character '5' is returned as it is."},{"id":"mhn63dd","l":"r6","t":"Math Library","v":"medium","q":"What is the output of System.out.println(Math.max(Math.min(5, 9), Math.abs(-3)));","o":["9","5","3","-3"],"c":1,"e":"Math.min(5, 9) = 5 and Math.abs(-3) = 3. Math.max(5, 3) = 5."},{"id":"m2g5t51","l":"r6","t":"Math Library","v":"medium","q":"What is the output of System.out.println(Math.pow(2, 3) + Math.sqrt(16));","o":["12","12.0","11.0","24.0"],"c":1,"e":"Math.pow(2, 3) = 8.0 and Math.sqrt(16) = 4.0. Adding two doubles gives 12.0."},{"id":"m11tt9gv","l":"r6","t":"Math Library","v":"medium","q":"What is the output of System.out.println(Math.cbrt(27) + Math.ceil(2.1));","o":["5.0","6.0","6","5.1"],"c":1,"e":"Math.cbrt(27) = 3.0 and Math.ceil(2.1) = 3.0. Their sum is 6.0."},{"id":"mz10s1o","l":"r6","t":"Math Library","v":"hard","q":"What is the return type of Math.round(3.6)?","o":["int","long","double","float"],"c":1,"e":"For a double argument Math.round() returns a long. Only Math.round(float) returns an int."},{"id":"m1icbkgs","l":"r6","t":"Math Library","v":"hard","q":"What is the output of System.out.println(Math.abs(-7.5) + Math.rint(2.5));","o":["10.0","9.5","9.0","10.5"],"c":1,"e":"Math.abs(-7.5) = 7.5. Math.rint(2.5) rounds a tie to the nearest EVEN integer, which is 2.0. The sum is 9.5."},{"id":"mje4emn","l":"r6","t":"Math Library","v":"medium","q":"Math.random() returns a value that is:","o":["An int between 0 and 1","A double that is at least 0.0 and less than 1.0","A double between 0 and 100","An int that is at least 0"],"c":1,"e":"Math.random() gives a double in the range 0.0 <= value < 1.0. It can never return exactly 1.0."},{"id":"m1qtbph0","l":"r4","t":"Operators","v":"hard","q":"What are the values of a and b?\nint a = 5, b = 2;\na += b++ * 2;","o":["a = 9, b = 3","a = 11, b = 3","a = 9, b = 2","a = 10, b = 3"],"c":0,"e":"b++ uses the old value 2, so b++ * 2 = 4 and then b becomes 3. a = 5 + 4 = 9."},{"id":"m3dzuj4","l":"r4","t":"Operators","v":"hard","q":"What is the final value of x?\nint x = 7;\nx = x++ + x--;","o":["14","15","16","13"],"c":1,"e":"x++ gives 7 and makes x = 8. x-- then gives 8 and makes x = 7. The sum 7 + 8 = 15 is assigned to x, overwriting 7."},{"id":"m1j1nsab","l":"r4","t":"Operators","v":"medium","q":"What is the value of r?\nboolean r = (5 > 3) && (2 > 4) || (1 < 2);","o":["true","false","Error","null"],"c":0,"e":"&& has higher precedence than ||. (true && false) = false, and false || true = true."},{"id":"mvv4wmb","l":"r4","t":"Operators","v":"hard","q":"What is the output?\nint a = 10;\nSystem.out.println(a > 5 ? a < 8 ? \"X\" : \"Y\" : \"Z\");","o":["X","Y","Z","Error"],"c":1,"e":"a > 5 is true, so the inner conditional is evaluated. a < 8 is false, so it gives \"Y\"."},{"id":"m1b28ku5","l":"r4","t":"Operators","v":"hard","q":"What is the output of System.out.println(17 % -5);","o":["-2","2","3","-3"],"c":1,"e":"In Java the sign of a remainder follows the dividend (17). 17 = (-3 * -5) + 2, so the result is 2."},{"id":"m1dsljfk","l":"r4","t":"Operators","v":"medium","q":"What is the output of System.out.println(7 / 2 + 7 % 2 + 7 / 2.0);","o":["7.5","7.0","6.5","8.5"],"c":0,"e":"7 / 2 = 3, 7 % 2 = 1 and 7 / 2.0 = 3.5. Sum: 3 + 1 + 3.5 = 7.5."},{"id":"m1w1ay3c","l":"r7","t":"Control Statements","v":"medium","q":"What is the output?\nint x = 3;\nswitch (x) {\n  case 3: System.out.print(\"C\");\n  case 4: System.out.print(\"D\"); break;\n  case 5: System.out.print(\"E\");\n}","o":["C","CD","CDE","D"],"c":1,"e":"Control enters at case 3 and, with no break, falls through into case 4. The break after D stops it, so CD is printed."},{"id":"mfyjt1h","l":"r8","t":"Loops","v":"easy","q":"What is the output?\nfor (int i = 1; i <= 10; i += 3)\n  System.out.print(i + \" \");","o":["1 4 7 10","1 4 7","4 7 10","1 3 6 9"],"c":0,"e":"i takes the values 1, 4, 7 and 10. The next value 13 fails the condition."},{"id":"m1weffad","l":"r8","t":"Loops","v":"hard","q":"What is the output?\nint i = 5;\nwhile (i-- > 0)\n  System.out.print(i);","o":["54321","43210","4321","543210"],"c":1,"e":"The condition compares the old value and then decrements. For 5 it prints 4, then 3, 2, 1, 0. When i is 0 the test 0 > 0 is false, but i has already become -1."},{"id":"m19r64w8","l":"r8","t":"Loops","v":"medium","q":"What is the output?\nfor (int i = 1; i <= 10; i++) {\n  if (i % 3 == 0) continue;\n  System.out.print(i);\n}","o":["12457810","369","12345678910","1245789"],"c":0,"e":"Multiples of 3 (3, 6, 9) are skipped by continue. All other numbers from 1 to 10 are printed with no separator."},{"id":"m14wkaao","l":"r8","t":"Loops","v":"medium","q":"What is the value of s?\nint s = 0;\nfor (int i = 1; i <= 5; i++)\n  s += i * i;","o":["15","30","55","225"],"c":2,"e":"s = 1 + 4 + 9 + 16 + 25 = 55, the sum of the squares of 1 to 5."},{"id":"m10iupkg","l":"r9","t":"Nested Loops","v":"medium","q":"How many times does count++ execute?\nint count = 0;\nfor (int i = 1; i <= 3; i++)\n  for (int j = 1; j <= i; j++)\n    count++;","o":["3","6","9","12"],"c":1,"e":"The inner loop runs 1, 2 and 3 times for i = 1, 2, 3. Total = 1 + 2 + 3 = 6."},{"id":"m6wxzyu","l":"r8","t":"Loops","v":"medium","q":"What is the output?\nint x = 10;\ndo {\n  System.out.print(x);\n  x++;\n} while (x < 10);","o":["Nothing is printed","10","10 11","Error"],"c":1,"e":"The body runs once before the condition is checked. It prints 10, then x < 10 (11 < 10) is false and the loop ends."},{"id":"m1a4r8ou","l":"l3","t":"Sorting","v":"medium","q":"An array is {5, 2, 8, 1}. What is it after ONE complete pass of bubble sort (ascending)?","o":["2 5 1 8","1 2 5 8","2 5 8 1","5 2 1 8"],"c":0,"e":"Compare 5,2 and swap to get 2 5 8 1. Compare 5,8 and leave. Compare 8,1 and swap to get 2 5 1 8. The largest value has moved to the end."},{"id":"mjextoc","l":"l3","t":"Sorting","v":"medium","q":"An array is {64, 25, 12, 22, 11}. What is it after the FIRST pass of selection sort (ascending)?","o":["11 25 12 22 64","11 12 22 25 64","25 64 12 22 11","11 64 25 12 22"],"c":0,"e":"The smallest element, 11, is found and swapped with the element at position 0 (64). Result: 11 25 12 22 64."},{"id":"mv1xm5z","l":"l3","t":"Sorting","v":"easy","q":"Which technique repeatedly finds the smallest element and places it at the front of the unsorted part?","o":["Bubble sort","Selection sort","Binary search","Linear search"],"c":1,"e":"That is the definition of selection sort. Bubble sort swaps adjacent elements instead."},{"id":"mqhhr98","l":"l3","t":"Searching","v":"medium","q":"In a binary search on {2, 4, 6, 8, 10, 12, 14} for the key 12, which element is compared first?","o":["2","8","12","14"],"c":1,"e":"low = 0, high = 6, so mid = (0 + 6) / 2 = 3, which holds 8. Since 12 > 8 the search moves to the right half."},{"id":"mpwxrm","l":"l3","t":"Searching","v":"hard","q":"A sorted array has 100 elements. About how many comparisons does binary search need at most?","o":["7","10","50","100"],"c":0,"e":"Each step halves the range. log2(100) is about 6.6, so at most 7 comparisons are needed."},{"id":"m15uyvll","l":"l3","t":"Arrays","v":"medium","q":"For int a[][] = new int[3][4]; what do a.length and a[0].length give?","o":["3 and 4","4 and 3","12 and 3","3 and 3"],"c":0,"e":"a.length is the number of rows (3). a[0].length is the number of columns in row 0 (4)."},{"id":"m1ejt4t3","l":"l3","t":"Arrays","v":"easy","q":"For int m[][] = {{1, 2}, {3, 4}}; what is m[1][0] + m[0][1]?","o":["4","5","6","3"],"c":1,"e":"m[1][0] = 3 and m[0][1] = 2, so the sum is 5."},{"id":"mh48jjv","l":"l3","t":"Arrays","v":"medium","q":"What happens when this code runs?\nint a[] = new int[3];\nSystem.out.println(a[3]);","o":["Prints 0","Prints null","Runtime exception (ArrayIndexOutOfBoundsException)","Compile-time error"],"c":2,"e":"Valid indices are 0 to 2. Index 3 is outside the array, and Java reports this while the program is running."},{"id":"mfhmzmx","l":"l3","t":"Arrays","v":"hard","q":"What is the output?\nString arr[] = new String[2];\nSystem.out.println(arr[0]);","o":["An empty line","null","0","Error"],"c":1,"e":"Elements of an array of objects start as null, so the word null is printed."},{"id":"m1sg5l65","l":"l7","t":"Constructors","v":"easy","q":"Which statement about a constructor is true?","o":["It has the same name as the class and no return type","It must return an int","It is called manually like any other method","It can be declared static"],"c":0,"e":"A constructor carries the class name, has no return type (not even void) and runs automatically when an object is created."},{"id":"mr7r9b2","l":"l7","t":"Constructors","v":"hard","q":"A class defines ONLY a parameterised constructor. What happens with new Student() (no arguments)?","o":["It works using the default constructor","A compile-time error","A runtime error","An object with null fields is created"],"c":1,"e":"The compiler supplies a default constructor only when the class has no constructor at all. Once one is written, new Student() has nothing to match."},{"id":"m17dbvl6","l":"l5","t":"Method Overloading","v":"medium","q":"Which pair of methods is a valid overload in the same class?","o":["int f(int a) and void f(int b)","void f(int a) and void f(double a)","int f() and void f()","void f(int a, int b) and void f(int x, int y)"],"c":1,"e":"Overloaded methods must differ in the number, type or order of parameters. A different return type or different parameter names is not enough."},{"id":"mduy929","l":"l5","t":"Methods","v":"medium","q":"What is the output?\nstatic void change(int x) { x = 20; }\n...\nint n = 5;\nchange(n);\nSystem.out.println(n);","o":["20","5","0","Error"],"c":1,"e":"Primitive values are passed by value. The method changes only its own copy x, so n is still 5."},{"id":"m1rhrvv2","l":"l5","t":"Methods","v":"hard","q":"What is b[0] after this code?\nstatic void f(int a[]) { a[0] = 99; }\n...\nint b[] = {1, 2};\nf(b);\nSystem.out.println(b[0]);","o":["1","2","99","Error"],"c":2,"e":"An array is an object, so its reference is copied into the method. Both names point to the same array and the change shows up in the caller."},{"id":"m1ciag8n","l":"l5","t":"Methods","v":"medium","q":"A method that changes the value of an instance variable of the object is called:","o":["Pure method","Impure method","Constant method","Default method"],"c":1,"e":"A pure method only uses its arguments and returns a value. One that changes the object's state is impure."},{"id":"mbu9hoa","l":"l5","t":"Scope","v":"medium","q":"A variable declared in the header of a for loop, such as for (int i = 0; ...), can be used:","o":["Anywhere in main()","Only inside that loop","Anywhere in the class","Anywhere in the package"],"c":1,"e":"Its scope ends with the loop. Using i after the loop gives a compile-time error."},{"id":"my7ggrq","l":"l2","t":"Wrapper Classes","v":"easy","q":"What is the output of System.out.println(Integer.parseInt(\"45\") + 5);","o":["455","50","45.5","Error"],"c":1,"e":"parseInt converts the text \"45\" into the number 45, so the + is real addition: 50."},{"id":"mk9xzjp","l":"l2","t":"Wrapper Classes","v":"medium","q":"What is the output of System.out.println(Integer.toString(25).length());","o":["25","2","1","Error"],"c":1,"e":"Integer.toString(25) gives the String \"25\", which has 2 characters."},{"id":"mq1ydh1","l":"r4","t":"Arrange the Code","v":"medium","q":"Arrange the statements so that a and b are swapped using a third variable t.\nvoid swap(int a, int b) {\n  (1) a = b;\n  (2) b = t;\n  (3) int t = 0;\n  (4) t = a;\n}","o":["(3)(4)(1)(2)","(4)(3)(1)(2)","(3)(1)(4)(2)","(1)(3)(4)(2)"],"c":0,"e":"Declare t, save a into t, copy b into a, then put the saved value into b: int t = 0; t = a; a = b; b = t;"},{"id":"m1k9ap99","l":"r4","t":"Arrange the Code","v":"medium","q":"Arrange the statements to display the reverse of num = 57.\nvoid reverse() {\n  int num = 57;\n  (1) System.out.println(sd * 10 + fd);\n  (2) int fd = num / 10;\n  (3) int sd = num - 10 * fd;\n}","o":["(2)(3)(1)","(3)(2)(1)","(1)(2)(3)","(2)(1)(3)"],"c":0,"e":"fd = 5 comes first, sd = 57 - 50 = 7 uses fd, and the print statement needs both. It prints 7 * 10 + 5 = 75."},{"id":"m1qpewor","l":"r4","t":"Arrange the Code","v":"hard","q":"Arrange the loop body so that it generates the Fibonacci series.\nfor (int i = 0; i < 10; i++) {\n  (1) b = c;\n  (2) a = b;\n  (3) c = a + b;\n  System.out.println(c);\n}","o":["(2)(1)(3)","(1)(2)(3)","(3)(2)(1)","(1)(3)(2)"],"c":0,"e":"a must take the old b before b takes c. Then c = a + b gives the next term: a = b; b = c; c = a + b;"},{"id":"m1sswuwa","l":"r5a","t":"Errors","v":"medium","q":"double avg = a + b / 2;  The programmer wanted the average of a and b. What type of error is this?","o":["Syntax error","Runtime error","Logical error","No error"],"c":2,"e":"The code compiles and runs, but the formula is wrong. It should be (a + b) / 2. A wrong result from a valid program is a logical error."},{"id":"m11fvg3e","l":"l3","t":"Searching","v":"hard","q":"Assertion (A): Binary search can be applied on an unsorted array.\nReason (R): Binary search compares the key with the middle element.","o":["Both (A) and (R) are true, and (R) is the correct explanation of (A).","Both (A) and (R) are true, but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":3,"e":"(A) is false: binary search needs a sorted array. (R) is true: it does compare the key with the middle element."},{"id":"mrkbin","l":"l4","t":"Strings","v":"hard","q":"Assertion (A): String objects in Java are immutable.\nReason (R): Any change to a String creates a new String object.","o":["Both (A) and (R) are true, and (R) is the correct explanation of (A).","Both (A) and (R) are true, but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"Both are true, and (R) explains (A): an existing String is never altered, so every change produces a new object."},{"id":"m17t1pca","l":"l7","t":"Constructors","v":"hard","q":"Assertion (A): The constructor of a class can be overloaded.\nReason (R): A constructor has no return type.","o":["Both (A) and (R) are true, and (R) is the correct explanation of (A).","Both (A) and (R) are true, but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":1,"e":"Both are true. A constructor can be overloaded because different parameter lists are allowed, not because it has no return type, so (R) does not explain (A)."},{"id":"m1jqfg0h","l":"r6","t":"Math Library","v":"hard","q":"Assertion (A): Math.ceil(5.2) returns 6.0.\nReason (R): Math.ceil() returns the smallest whole number, as a double, that is not less than the argument.","o":["Both (A) and (R) are true, and (R) is the correct explanation of (A).","Both (A) and (R) are true, but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"Both are true and (R) explains (A): the smallest whole number not less than 5.2 is 6, returned as the double 6.0."},{"id":"m6q19ei","l":"r8","t":"Loops","v":"hard","q":"Assertion (A): A do-while loop executes at least once.\nReason (R): The condition of a do-while loop is checked after the loop body.","o":["Both (A) and (R) are true, and (R) is the correct explanation of (A).","Both (A) and (R) are true, but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":0,"e":"Both are true and (R) is the reason: the body runs first, then the test is made."},{"id":"mb5w3ji","l":"l3","t":"Arrays","v":"hard","q":"Assertion (A): An array index in Java can be negative.\nReason (R): Array indices start from 0.","o":["Both (A) and (R) are true, and (R) is the correct explanation of (A).","Both (A) and (R) are true, but (R) is not the correct explanation of (A).","(A) is true and (R) is false.","(A) is false and (R) is true."],"c":3,"e":"(A) is false: a negative index causes ArrayIndexOutOfBoundsException. (R) is true: the first index is 0."},{"id":"m1d8whtt","l":"r3","t":"Data Types","v":"medium","q":"Which of the following occupies 2 bytes of storage?","o":["25","\"AM\"","35.2","'A'"],"c":3,"e":"'A' is a char (2 bytes). 25 is an int (4 bytes), 35.2 is a double (8 bytes) and \"AM\" is a String of two chars (4 bytes of character data)."},{"id":"mn79m4j","l":"l8","t":"Access Specifiers","v":"medium","q":"Which of the following is NOT an access specifier in Java?","o":["private","protected","package","public"],"c":2,"e":"The access levels are private, protected, public (and default when nothing is written). 'package' is only used to declare a package."},{"id":"mb28ys8","l":"r6","t":"Math Library","v":"medium","q":"The output of Math.pow(36, 6/5) is:","o":["36.0","1.0","73.71","6.0"],"c":0,"e":"6/5 is integer division = 1 (not 1.2), so it becomes Math.pow(36, 1) = 36.0. pow() always returns a double."},{"id":"m1roikx6","l":"l2","t":"Char Arithmetic","v":"medium","q":"What is the output of System.out.println(Character.toUpperCase('b') + 2);","o":["66","100","68","98"],"c":2,"e":"toUpperCase('b') gives 'B' (ASCII 66). A char inside arithmetic is promoted to int, so 66 + 2 = 68 — not the letter 'D'."},{"id":"mut1tje","l":"l2","t":"Char Arithmetic","v":"medium","q":"System.out.println('Z' + 32);  displays:","o":["z","Z","122","154"],"c":2,"e":"'Z' is 90; 90 + 32 = 122, printed as a number (an int), not as the letter 'z'."},{"id":"m1neoolw","l":"r4","t":"String Concatenation","v":"medium","q":"Output of System.out.println(1 + 2 + \"A\" + 1 + 2);","o":["3A12","12A12","3A3","12A3"],"c":0,"e":"Left to right: 1 + 2 = 3 (numeric). Then \"A\" turns everything after it into text, so 1 and 2 are appended: \"3A12\"."},{"id":"mi2hjdl","l":"r4","t":"String Concatenation","v":"medium","q":"Output of System.out.println('a' + 'b' + \"c\");","o":["abc","195c","ab99","19599"],"c":1,"e":"'a' + 'b' are two chars, so they are ADDED numerically: 97 + 98 = 195. Only then is \"c\" joined → \"195c\"."},{"id":"mk5nj0m","l":"l3","t":"Arrays & Memory","v":"easy","q":"How many bytes does  double x[] = {2.5, 4.5, 5.5, 6.4};  occupy?","o":["16","4","8","32"],"c":3,"e":"4 elements × 8 bytes (double) = 32 bytes."},{"id":"m1vglrxg","l":"l3","t":"Arrays & Memory","v":"medium","q":"Sales of 5 salesmen for 5 products are stored in a 2D int array. How many bytes does the array occupy?","o":["25","200","50","100"],"c":3,"e":"5 × 5 = 25 elements; each int is 4 bytes → 100 bytes."},{"id":"m1qepzuy","l":"r4","t":"Operators","v":"medium","q":"The output of 42 / 6 % 2 is:","o":["1","10","2","0"],"c":0,"e":"/ and % have equal precedence and associate left to right: (42/6) % 2 = 7 % 2 = 1."},{"id":"m99x1bi","l":"r6","t":"Math Library","v":"medium","q":"Output of Math.max(-7, Math.min(-5, -4))","o":["-5","-4","-7","Error"],"c":0,"e":"Inner: min(-5,-4) = -5 (−5 is smaller than −4). Outer: max(-7,-5) = -5."},{"id":"movuboq","l":"r8","t":"Loops","v":"medium","q":"Which of these is an infinite loop?","o":["for(int i=1; i<=10; i++)","for(int i=2; i!=0; i-=3)","for(int i=5; i<=5; i++)","for(int i=1; i>=1; i--)"],"c":1,"e":"In the second loop i takes 2, −1, −4 … and jumps over 0, so i != 0 is always true. The other loops stop after 10, 1 and 1 iterations."},{"id":"m1w2iw5j","l":"r8","t":"Loops","v":"hard","q":"What is printed?","o":["42","4200","0 (new line) 0","00"],"c":3,"e":"The ';' right after the for makes its body empty; the loop ends with p = 0. print(p) then println(p) show 0 and 0 on the same line: 00.","code":"int p = 0;\nfor(p = 4; p > 0; p -= 2);\nSystem.out.print(p);\nSystem.out.println(p);"},{"id":"mx3juvp","l":"l5","t":"Method Overloading","v":"medium","q":"Which pair of methods causes a compile-time error in the same class?","o":["void test(int a, int b) and void test(double a, double b)","void test(int a, double b) and void test(double a, int b)","void test(int a, double b) and void test(int a)","void test(int a) and int test(int a)"],"c":3,"e":"Overloading depends on the parameter list. Same name + same parameters with a different return type = duplicate method → compile-time error."},{"id":"mz0c71h","l":"l2","t":"Wrapper Classes","v":"medium","q":"Which statement converts the String \"25\" to the double 25.0?","o":["Double.Parsedouble(\"25\")","Double.parse(\"25\")","Double.parseDouble(\"25\")","Double.parseDouble(25)"],"c":2,"e":"The method is parseDouble (exact spelling — Java is case-sensitive) and it takes a String argument."},{"id":"mmivmi8","l":"l4","t":"Strings","v":"medium","q":"Output of \"ANGER\".compareTo(\"ANGEL\")","o":["3","-6","6","0"],"c":2,"e":"The first difference is at index 4: 'R'(82) − 'L'(76) = 6. compareTo() returns the character difference, not just −1/0/1."},{"id":"m12w8ia0","l":"l4","t":"Strings","v":"medium","q":"To extract NOW from \"ACKNOWLEDGEMENT\" we write substring(3, ___). Fill the blank.","o":["6","7","5","8"],"c":0,"e":"N is at index 3 and W at index 5. The end index is EXCLUSIVE, so use 5 + 1 = 6."},{"id":"m12oluwj","l":"l4","t":"Strings","v":"medium","q":"What is the output?","o":["da","d*a","ti","t*i"],"c":1,"e":"a[1] = \"Aditi\" → charAt(1) = 'd'. a[2] = \"Anant\" → charAt(2) = 'a'. \"*\" is a String, so + concatenates → d*a.","code":"String a[] = {\"Atasi\",\"Aditi\",\"Anant\",\"Amit\",\"Ahana\"};\nSystem.out.println(a[1].charAt(1) + \"*\" + a[2].charAt(2));"},{"id":"mmveo95","l":"r4","t":"Operators","v":"medium","q":"Assertion (A): The result of the Java expression 3 + 7/2 is 6.\nReason (R): According to the hierarchy of operators, addition is done first followed by division.","o":["(A) is true and (R) is false.","(A) is false and (R) is true.","Both (A) and (R) are true and (R) is a correct explanation of (A).","Both (A) and (R) are true and (R) is not a correct explanation of (A)."],"c":0,"e":"7/2 = 3 (integer division, higher precedence), 3 + 3 = 6 → A is true. R is false: division happens BEFORE addition."},{"id":"mk5ffs9","l":"l4","t":"Strings","v":"medium","q":"Assertion (A): The substring() method modifies the original String.\nReason (R): The substring() method can extract part of a String starting from a specific index.","o":["(A) is true and (R) is false.","(A) is false and (R) is true.","Both (A) and (R) are true and (R) is a correct explanation of (A).","Both (A) and (R) are true and (R) is not a correct explanation of (A)."],"c":1,"e":"Strings are immutable: substring() returns a NEW String and never changes the original → A false, R true."},{"id":"mkjjrf3","l":"r7","t":"Switch","v":"medium","q":"Assertion (A): In a switch statement, break avoids fall through.\nReason (R): break helps to execute only one case at a time.","o":["(A) is true and (R) is false.","(A) is false and (R) is true.","Both (A) and (R) are true and (R) is a correct explanation of (A).","Both (A) and (R) are true and (R) is not a correct explanation of (A)."],"c":2,"e":"Without break, control falls into the next case. break stops that, so only the matched case runs — R correctly explains A."},{"id":"mux4ltv","l":"r7","t":"Ternary","v":"medium","q":"Which is the correct ternary form of the given if-else?","o":["z = a > b ? 35 : 25;","z = a > b ? 25 : 35;","z = a > b : 35 ? 25;","z = a > b : 25 ? 35;"],"c":1,"e":"Format: condition ? value_if_true : value_if_false.","code":"if(a > b) z = 25;\nelse z = 35;"},{"id":"m1f68hem","l":"r4","t":"Increment/Decrement","v":"hard","q":"What is the final value of a?","o":["10","12","11","5"],"c":0,"e":"a++ yields 5 (a becomes 6 briefly), 5 × 2 = 10 is assigned back to a, overwriting the 6.","code":"int a = 5;\na = a++ * 2;\nSystem.out.println(a);"},{"id":"m16tu0lr","l":"r6","t":"Math Library","v":"medium","q":"Math.round(-4.5) returns:","o":["-5","-4","-4.0","-5.0"],"c":1,"e":"round(x) = floor(x + 0.5): floor(−4.0) = −4. Ties go towards positive infinity, so −4.5 → −4 (but 4.5 → 5). It returns a long, so no decimal point."},{"id":"m1h7aw2p","l":"r6","t":"Math Library","v":"medium","q":"Math.ceil(-4.2) returns:","o":["-5.0","-4.0","-4","-5"],"c":1,"e":"ceil() moves towards the larger value: −4.2 → −4.0 (a double)."},{"id":"mkf072x","l":"r6","t":"Math Library","v":"medium","q":"Math.sqrt(-4) gives:","o":["-2.0","2.0","NaN","Compile-time error"],"c":2,"e":"The square root of a negative number is undefined → NaN (Not a Number). No error is thrown."},{"id":"m1kn89rf","l":"l2","t":"Char Arithmetic","v":"hard","q":"What is printed?","o":["67","C","A2","Error"],"c":1,"e":"Compound assignment (+=) silently casts the result back to char: 'A'(65)+2 = 67 → 'C'.","code":"char c = 'A';\nc += 2;\nSystem.out.println(c);"},{"id":"mlaz2x4","l":"l4","t":"String Immutability","v":"hard","q":"What is printed?","o":["Hello World","Hello","World","Error"],"c":1,"e":"Strings are immutable. concat() returns a NEW String that is discarded here. To keep it: s = s.concat(\" World\");","code":"String s = \"Hello\";\ns.concat(\" World\");\nSystem.out.println(s);"},{"id":"m3smoes","l":"l4","t":"Strings","v":"medium","q":"\"Mississippi\".lastIndexOf('s') returns:","o":["2","3","5","6"],"c":3,"e":"Indices: M0 i1 s2 s3 i4 s5 s6 i7 p8 p9 i10. The last 's' is at index 6 (indexOf('s') would give 2)."},{"id":"m1bsbzre","l":"r5a","t":"Errors","v":"medium","q":"\"hello\".charAt(5) causes:","o":["Syntax error","Logical error","Runtime error (StringIndexOutOfBoundsException)","It returns a space"],"c":2,"e":"Valid indices are 0–4. The code compiles fine but fails while running."},{"id":"m1tw9o1x","l":"l3","t":"Arrays","v":"medium","q":"The index (subscript) of the last element of an array ar[] is:","o":["ar.length()","ar[].length","ar.length() - 1","ar.length - 1"],"c":3,"e":"For arrays, length is a property (no brackets). Indexing starts at 0, so last index = length − 1."},{"id":"mt7wzmv","l":"l3","t":"Arrays","v":"medium","q":"int arr[][] = new int[3][4];  What is the value of arr[0].length?","o":["3","4","12","0"],"c":1,"e":"arr.length = number of rows (3); arr[0].length = number of columns in row 0 (4)."},{"id":"me6ubjk","l":"l3","t":"Searching","v":"medium","q":"In Binary Search, if low = 0 and high = 9, the first value of mid is:","o":["4","5","4.5","9"],"c":0,"e":"mid = (0 + 9) / 2 = 4 because integer division truncates."},{"id":"miyk5pa","l":"l3","t":"Sorting","v":"medium","q":"After ONE pass of Bubble Sort (ascending) on {5, 1, 4, 2}, the array becomes:","o":["1 2 4 5","1 4 2 5","1 5 4 2","2 1 4 5"],"c":1,"e":"Adjacent swaps: 5↔1, 5↔4, 5↔2 → 1 4 2 5. The largest value reaches the end after pass 1, but the array is NOT yet fully sorted."},{"id":"mck83cl","l":"l3","t":"Sorting","v":"medium","q":"After ONE pass of Selection Sort (ascending) on {29, 10, 14, 37, 13}, the array is:","o":["10 14 29 37 13","10 29 14 37 13","13 10 14 37 29","10 13 14 29 37"],"c":1,"e":"Find the minimum (10) and swap it with the first element (29): 10 29 14 37 13."},{"id":"m1jd3gdj","l":"l7","t":"Constructors","v":"medium","q":"A class Box has ONLY the constructor Box(int a). What happens with  Box b = new Box();","o":["Object created with default values","Compile-time error","Runtime error","Object created with a = 0"],"c":1,"e":"Once you write any constructor, Java stops supplying the default no-argument constructor, so new Box() finds no match."},{"id":"m1fvb33u","l":"l7","t":"Constructors","v":"medium","q":"Inside class Box a member is written as  void Box(){ ... }  It is:","o":["A constructor","An ordinary method","A syntax error","A destructor"],"c":1,"e":"A constructor has NO return type. Adding 'void' makes it an ordinary method that happens to be named Box."},{"id":"m8vg6y2","l":"l6","t":"Static","v":"medium","q":"Which of these CANNOT be accessed directly from a static method?","o":["A static variable","A non-static (instance) variable","A local variable","Another static method"],"c":1,"e":"Static methods belong to the class, not an object, so they need an object reference to reach instance members."},{"id":"m1k24tcz","l":"l2","t":"Wrapper Classes","v":"medium","q":"Integer.parseInt(\"12.5\") results in:","o":["12","12.5","NumberFormatException at run time","Compile-time error"],"c":2,"e":"\"12.5\" is not a valid int string, so the program compiles but fails when it runs."},{"id":"m1f17prx","l":"r3","t":"Type Conversion","v":"hard","q":"What is printed?","o":["2.5","2.0","2","3.0"],"c":1,"e":"x / 2 is integer division (=2) evaluated BEFORE assignment; the 2 is then widened to 2.0.","code":"int x = 5;\ndouble y = x / 2;\nSystem.out.println(y);"},{"id":"m930k0w","l":"r4","t":"Logical Operators","v":"hard","q":"What is the value of a afterwards?","o":["5","6","4","11"],"c":0,"e":"|| is short-circuit: (a > 3) is already true, so the right operand (++a > 10) is never evaluated.","code":"int a = 5;\nboolean b = (a > 3) || (++a > 10);"},{"id":"mop72rb","l":"r7","t":"Ternary","v":"hard","q":"What is the value of c?","o":["5","10","100","200"],"c":2,"e":"a > b is false → evaluate the second ternary: b > 8 is true → 100.","code":"int a = 5, b = 10;\nint c = a > b ? a : b > 8 ? 100 : 200;"},{"id":"m13fhyvb","l":"r7","t":"Switch","v":"hard","q":"What is the output?","o":["D","DB","DBC","B"],"c":1,"e":"No case matches 5, so default runs (D). It has no break, so control falls into case 2 (B), where break stops it.","code":"int x = 5;\nswitch(x){\n  case 1: System.out.print(\"A\");\n  default: System.out.print(\"D\");\n  case 2: System.out.print(\"B\"); break;\n  case 3: System.out.print(\"C\");\n}"},{"id":"m1e7yksi","l":"r8","t":"Loops","v":"hard","q":"How many times does the loop body execute?","o":["2","3","4","Infinite"],"c":1,"e":"k becomes 3, 5, 7. After printing 7 the condition 7 <= 6 fails → 3 times. A do-while always runs once first.","code":"int k = 1;\ndo {\n  k += 2;\n  System.out.println(k);\n} while(k <= 6);"},{"id":"m1m7atww","l":"l5","t":"Scope","v":"hard","q":"This code:","o":["Prints 3","Prints 2","Gives a compile-time error","Prints 0"],"c":2,"e":"i is declared inside the for statement so it does not exist after the loop; the compiler reports an error.","code":"for(int i = 0; i < 3; i++){ }\nSystem.out.println(i);"},{"id":"m1sugw6d","l":"l5","t":"Methods","v":"medium","q":"Given  void show(){ ... }  the statement System.out.println(obj.show()); results in:","o":["Prints null","Prints nothing","Compile-time error","Prints 0"],"c":2,"e":"A void method returns nothing, so there is no value for println to print — the compiler rejects it."},{"id":"msnyine","l":"l5","t":"Methods","v":"hard","q":"What is printed?","o":["10","5","0","Error"],"c":1,"e":"Primitives are passed by value — the method doubles its own copy; the caller's a is untouched.","code":"void change(int n){ n = n * 2; }\n// in main:\nint a = 5;\nchange(a);\nSystem.out.println(a);"},{"id":"my2jmpg","l":"l2","t":"Char Arithmetic","v":"medium","q":"Output of System.out.println('5' + 1);","o":["6","51","54","Error"],"c":2,"e":"'5' is the character with ASCII 53, so 53 + 1 = 54 — not the digit 5 + 1."},{"id":"m137jozw","l":"r6","t":"Math Library","v":"medium","q":"Math.floor(-7.5) returns:","o":["-7.0","-8.0","-8","-7"],"c":1,"e":"floor() moves towards the smaller value: −7.5 → −8.0 (a double). Students often assume it just drops the decimal."},{"id":"m4jantc","l":"r2","t":"Objects","v":"easy","q":"In the statement  Game cricket = new Game();  which is TRUE?","o":["Game is an object of the cricket class","new creates the object Game","Game is a class and cricket is an object","Game and cricket are both objects"],"c":2,"e":"Left type = class (Game); variable name = object reference (cricket); 'new' creates the object."},{"id":"m15gmv9r","l":"r3","t":"Values & Data Types","v":"medium","q":"Which of the following is NOT a valid primitive data type in Java?","o":["byte","float","string","char"],"c":2,"e":"'string' is not a data type at all in Java — the class name is 'String' with a capital S, and it is not primitive. Primitives: byte, short, int, long, float, double, char, boolean."},{"id":"m1h58aey","l":"r3","t":"Values & Data Types","v":"medium","q":"The default value of a float variable (instance variable) in Java is:","o":["0","0.0","0.0f","0.0d"],"c":2,"e":"A float field defaults to 0.0f — the 'f' suffix marks it as a float literal, not a double."},{"id":"mk0m4d","l":"r3","t":"Values & Data Types","v":"medium","q":"Which of these is a valid boolean literal in Java?","o":["False","'false'","\"false\"","false"],"c":3,"e":"Boolean literals are the keywords true and false written WITHOUT quotes and in lowercase. 'false' and \"false\" are char/String literals, and False is not a Java keyword at all."},{"id":"m1vs46ae","l":"r3","t":"Values & Data Types","v":"medium","q":"char in Java occupies:","o":["1 byte","2 bytes","4 bytes","8 bytes"],"c":1,"e":"Unlike C/C++, Java's char is 2 bytes (16-bit) because it stores a Unicode character, not just ASCII."},{"id":"m6ak6at","l":"r3","t":"Values & Data Types","v":"medium","q":"Which keyword is used to declare a constant in Java?","o":["const","final","static","constant"],"c":1,"e":"Java uses 'final' to declare a constant, e.g. final int RATE = 5;. 'const' is a reserved word but is NOT usable for this purpose."},{"id":"mrpl3pq","l":"r3","t":"Values & Data Types","v":"easy","q":"A class in Java is an example of a ___ data type.","o":["Primitive","System-defined","User-defined","Literal"],"c":2,"e":"A class is a user-defined (non-primitive/reference) data type created by the programmer; it is not one of Java's eight built-in primitives."},{"id":"movvmna","l":"r5a","t":"Tokens","v":"easy","q":"Identify the type of token '25' in the statement int x = 25;","o":["Keyword","Identifier","Literal","Operator"],"c":2,"e":"25 is a literal — a fixed constant value appearing directly in the code."},{"id":"my5pzqz","l":"r5a","t":"Tokens","v":"easy","q":"Which of the following is NOT a Java keyword?","o":["static","String","int","class"],"c":1,"e":"String is a built-in CLASS name, not a reserved keyword — it can technically even be shadowed, unlike true keywords such as static, int and class."},{"id":"m1afrsun","l":"r5a","t":"Tokens","v":"easy","q":"Which of the following is a valid identifier in Java?","o":["2total","my-var","_total","class"],"c":2,"e":"_total starts with an underscore, which is allowed. '2total' starts with a digit (invalid), 'my-var' has a hyphen (invalid), and 'class' is a reserved keyword (invalid)."},{"id":"m80wez","l":"r3","t":"Escape Sequences","v":"easy","q":"What does the escape sequence \\t represent?","o":["New line","Tab space","Backslash","Single quote"],"c":1,"e":"\\t inserts a horizontal tab. \\n is new line, \\\\ is a literal backslash, and \\' is a single quote."},{"id":"m1ywj36p","l":"r3","t":"Escape Sequences","v":"easy","q":"Which escape sequence is used to print a double quote inside a String?","o":["\\\"","\\'","\\\\","\\dq"],"c":0,"e":"\\\" inserts a literal double-quote character without ending the String."},{"id":"m14c3gry","l":"r3","t":"Type Casting","v":"medium","q":"int x = (int) 32.8; is an example of ___ typecasting.","o":["Implicit","Automatic","Explicit","Coercion"],"c":2,"e":"Writing (int) in front of the value is explicit (manual) typecasting — the programmer forces the conversion. 'Coercion' refers to automatic (implicit) conversion, not this."},{"id":"m1xefw4o","l":"r3","t":"Type Casting","v":"medium","q":"What is the output of System.out.println((int) 9.8);","o":["10","9.8","9","10.0"],"c":2,"e":"Explicit casting of a double to int TRUNCATES the decimal part; it does not round. 9.8 becomes 9."},{"id":"mxn2p9m","l":"r3","t":"Type Casting","v":"easy","q":"Widening (implicit) type conversion happens when a value is assigned from:","o":["A larger type to a smaller type","A smaller type to a larger type","String to int directly","double to float"],"c":1,"e":"Implicit (widening) conversion happens automatically when moving from a smaller to a larger type, e.g. int to double, without any data loss."},{"id":"m1vio9gn","l":"r4","t":"Operators","v":"easy","q":"What is the value of 17 % 4 in Java?","o":["4.25","1","4","0"],"c":1,"e":"% is the modulus (remainder) operator: 17 ÷ 4 = 4 remainder 1."},{"id":"m1r5ykj3","l":"r4","t":"Operators","v":"medium","q":"Identify the operator '==' in Java:","o":["Assignment operator","Relational (equal to) operator","Unary operator","Logical operator"],"c":1,"e":"'==' tests whether two values are equal and returns a boolean — it is a relational operator, not to be confused with the assignment operator '='."},{"id":"m1f6lfv","l":"r4","t":"Operators","v":"easy","q":"Which of the following is a ternary operator in Java?","o":["&&","? :","++","instanceof"],"c":1,"e":"The conditional (ternary) operator ? : is the only Java operator that takes three operands."},{"id":"my9bkou","l":"r4","t":"Operators","v":"medium","q":"What is the output of: int a=10, b=3, c=0; c = b % a;","o":["10","0","3","0.3"],"c":2,"e":"c = b % a = 3 % 10. Since 3 is smaller than 10, dividing 3 by 10 gives a remainder of 3 itself."},{"id":"m1lsw0j4","l":"r4","t":"Operators","v":"easy","q":"What is the value of x after: int x = 5; x += 3;","o":["5","3","8","53"],"c":2,"e":"+= is a compound assignment operator: x = x + 3 = 5 + 3 = 8."},{"id":"m1sc63yq","l":"r4","t":"Operators","v":"hard","q":"Evaluate: int x = x++ + ++x; when x = 10 initially. What is the final value of x?","o":["21","22","20","23"],"c":1,"e":"x++ uses 10 (x becomes 11); ++x then makes x 12 and uses 12. Sum = 10 + 12 = 22, which is assigned back to x, overwriting the 12.","code":"int x = 10;\nx = x++ + ++x;\nSystem.out.println(x);"},{"id":"m1xctaa8","l":"r4","t":"Operators","v":"hard","q":"Given y = 5; evaluate: y += y++ + ++y + --y;  What is the final value of y?","o":["21","22","23","24"],"c":2,"e":"For a compound assignment, Java reads the starting value of y (5) once, to use in the final addition. Then the right side is evaluated left to right: y++ returns 5 (y becomes 6); ++y makes y 7 and returns 7; --y makes y 6 and returns 6. Right-side total = 5 + 7 + 6 = 18. Finally y is set to the starting value plus this total: 5 + 18 = 23.","code":"int y = 5;\ny += y++ + ++y + --y;\nSystem.out.println(y);"},{"id":"m1nf1qgr","l":"r4","t":"Operators","v":"easy","q":"Which of the following has the HIGHEST precedence?","o":["Addition (+)","Multiplication (*)","Parentheses ( )","Assignment (=)"],"c":2,"e":"Parentheses are always evaluated first — they override every other precedence rule."},{"id":"m1fc3p9p","l":"r3","t":"Data Types","v":"medium","q":"Which data type cannot be used in a Java switch-case construct?","o":["int","char","double","byte"],"c":2,"e":"switch works with int, char, byte, short, String and enum — but NOT with float or double (real/floating values)."},{"id":"m1t8sexx","l":"r5b","t":"Input in Java","v":"medium","q":"Which Scanner method is used to input an integer value?","o":["nextInteger()","nextInt()","inputInt()","getInt()"],"c":1,"e":"The correct, case-sensitive method name is nextInt(). 'nextInteger()' does not exist and is a common spelling trap."},{"id":"m46z2im","l":"r5b","t":"Input in Java","v":"medium","q":"Which Scanner method should be used to accept a full line of text that may contain spaces?","o":["next()","nextLine()","nextWord()","readLine()"],"c":1,"e":"next() stops reading at the first space. nextLine() reads the entire line including spaces. readLine() is not a method of the Scanner class at all — it is a common trap option."},{"id":"meztu9l","l":"r5b","t":"Input in Java","v":"medium","q":"What will Scanner's next() method return if the user types 'Good Morning' and presses Enter?","o":["Good Morning","Good","Morning","An error, since it contains a space"],"c":1,"e":"next() reads only a single token and stops at the first space, so it returns just 'Good' — the rest ('Morning') remains unread in the buffer for the next input call."},{"id":"m1lbxtl3","l":"r5b","t":"Input in Java","v":"medium","q":"Which Scanner object creation statement correctly sets up keyboard input?","o":["Scanner sc = new Scanner(System.out);","Scanner sc = new Scanner(System.in);","Scanner sc = Scanner.new(System.in);","Scanner sc = new Scanner();"],"c":1,"e":"System.in represents the standard input stream (the keyboard) and must be passed to the Scanner constructor; System.out is for output, not input."},{"id":"m968nyg","l":"r6","t":"Math Library","v":"easy","q":"Which method returns the square root of a number?","o":["Math.sqrt()","Math.pow()","Math.cbrt()","Math.abs()"],"c":0,"e":"Math.sqrt(x) returns the square root of x as a double. Math.cbrt() is for cube roots."},{"id":"m30aldi","l":"r6","t":"Math Library","v":"medium","q":"Which method of the Math class is used to find the natural logarithm of a number q?","o":["Math.ln(q)","Math.log(q)","Math.logarithm(q)","Math.exp(q)"],"c":1,"e":"The correct syntax is Math.log(q), which returns the natural (base-e) logarithm as a double. Math.exp(q) is the opposite operation — it returns e raised to the power q."},{"id":"mkuet7q","l":"r6","t":"Math Library","v":"medium","q":"Which Math method would you use to find the value of e raised to the power p (i.e. the exponent of p)?","o":["Math.pow(e,p)","Math.exponent(p)","Math.exp(p)","Math.power(p)"],"c":2,"e":"Math.exp(p) returns Euler's number e raised to the power p, as a double. It is distinct from Math.pow(x,y), which raises x to the power y."},{"id":"m1yjguxq","l":"r6","t":"Math Library","v":"medium","q":"Which of the following Math methods returns the value as a LONG (an integer value), not a double?","o":["Math.ceil()","Math.sqrt()","Math.floor()","Math.round()"],"c":3,"e":"Math.round() is the odd one out — it returns a long (or int for a float input), rounding to the nearest whole number. ceil(), floor() and sqrt() all return a double."},{"id":"m1rhr5x9","l":"r6","t":"Math Library","v":"medium","q":"What is the output of Math.ceil(-13.5)?","o":["-13.0","-14.0","13.0","14.0"],"c":0,"e":"ceil() rounds UP towards positive infinity. -13.5 moves to -13.0 (not -14.0, which would be floor())."},{"id":"mn4mpbb","l":"r6","t":"Math Library","v":"medium","q":"What is the output of Math.pow(Math.sqrt(4), 2)?","o":["2.0","4.0","3.0","8.0"],"c":1,"e":"Math.sqrt(4) = 2.0 first; then Math.pow(2.0, 2) = 4.0."},{"id":"mlmu94v","l":"r6","t":"Math Library","v":"easy","q":"Math.random() generates a random value of data type:","o":["int","double","float","long"],"c":1,"e":"Math.random() always returns a double between 0.0 (inclusive) and 1.0 (exclusive)."},{"id":"m1td7efl","l":"r6","t":"Math Library","v":"medium","q":"What does Math.rint() return?","o":["The absolute value","The closest double value that is a whole number","A random integer","The remainder"],"c":1,"e":"Math.rint() rounds its double argument to the nearest whole-number value but still RETURNS a double (unlike round(), which returns a long)."},{"id":"m9f45rj","l":"r7","t":"Conditional Statements","v":"easy","q":"Which statement is OPTIONAL in a switch-case construct?","o":["switch","case","default","break (inside the last case)"],"c":2,"e":"Neither 'default' nor every 'break' is compulsory for the switch to compile — 'default' may be entirely left out; when it is missing and no case matches, nothing executes."},{"id":"mbnxmaq","l":"r7","t":"Conditional Statements","v":"easy","q":"Which jump statement is used inside a switch block to stop execution and exit?","o":["continue","break","return","goto"],"c":1,"e":"break terminates the switch block immediately, preventing fall-through into subsequent cases."},{"id":"mpuekdf","l":"r7","t":"Conditional Statements","v":"medium","q":"Which of these statements about switch in Java is FALSE?","o":["It checks for equality between the input and case labels","It supports floating-point constants as case labels","break is used to exit the switch block","Case labels must be unique"],"c":1,"e":"switch does NOT support floating-point (float/double) constants as case labels — only int, char, byte, short, String or enum values are allowed."},{"id":"m1371hl3","l":"r7","t":"Conditional Statements","v":"medium","q":"int a=30; contains which type of error?","o":["Syntax error","Runtime error","Logical error","No error"],"c":3,"e":"This is a perfectly valid declaration and initialisation statement — there is no error of any kind."},{"id":"m1k53qjt","l":"r5a","t":"Errors","v":"medium","q":"What type of error, if any, is present in: system.out.print(\"Hello\");","o":["Logical error","Runtime error","Syntax error","No error"],"c":2,"e":"Java is case-sensitive; the correct class name is 'System' with a capital S. Using lowercase 'system' causes a compile-time (syntax) error."},{"id":"m17ysy02","l":"r8","t":"Iterative Constructs","v":"easy","q":"Which loop is used when the exact number of iterations is known in advance?","o":["while","do-while","for","None of these"],"c":2,"e":"The for loop bundles initialisation, condition and update in one line, making it ideal for a known/fixed number of repetitions."},{"id":"mzl5wcr","l":"r8","t":"Iterative Constructs","v":"medium","q":"Which loop(s) execute their body at least once, even if the condition is false at the start?","o":["while","for","do-while","All of these"],"c":2,"e":"Only the do-while loop is exit-controlled, so it always executes its body once before testing the condition."},{"id":"m2pd37y","l":"r8","t":"Iterative Constructs","v":"easy","q":"___ loop is an endless (infinite) loop.","o":["for(int i=0;i<10;i++)","Empty","Infinite","All of the above"],"c":2,"e":"An infinite loop is one whose terminating condition never becomes false, so it runs endlessly, e.g. while(true){ }."},{"id":"myn64k6","l":"r8","t":"Iterative Constructs","v":"easy","q":"When one loop is written inside the body of another loop, it is called a:","o":["Empty loop","Infinite loop","Nested loop","None of these"],"c":2,"e":"A loop inside another loop is a nested loop — commonly used for pattern printing and working with rows/columns."},{"id":"m1izht67","l":"r8","t":"Iterative Constructs","v":"easy","q":"Which statement skips the remaining code in the current iteration and moves directly to the next iteration?","o":["break","continue","return","exit"],"c":1,"e":"continue skips only the rest of the CURRENT pass; the loop itself keeps running, unlike break which stops the loop entirely."},{"id":"m7ezatl","l":"r8","t":"Iterative Constructs","v":"easy","q":"How many times will this loop execute?  int i=1; do{ System.out.print(i); i++; }while(i<=5);","o":["4","5","6","Infinite"],"c":1,"e":"i takes the values 1,2,3,4,5 — the loop body runs once for each, so 5 times in total, and stops once i becomes 6."},{"id":"m5pa1dv","l":"r8","t":"Iterative Constructs","v":"medium","q":"for(int i = 2; i != 0; i -= 3) is an example of:","o":["A normal finite loop","An infinite loop, since i jumps over 0","A compile-time error","A loop that runs exactly once"],"c":1,"e":"i takes the values 2, -1, -4, -7 … and never becomes exactly 0, so the condition i != 0 stays true forever — the loop never terminates."},{"id":"m8a7hxo","l":"r9","t":"Nested Loops","v":"easy","q":"In a nested loop where the outer loop runs 3 times and the inner loop runs 4 times on every pass, how many times does the innermost statement execute in total?","o":["3","4","7","12"],"c":3,"e":"Total executions = outer iterations × inner iterations per pass = 3 × 4 = 12."},{"id":"m7anpb1","l":"r3","t":"Values & Data Types","v":"medium","q":"Assertion (A): Identifiers in Java can contain spaces.\nReason (R): Spaces are allowed in identifiers to improve the readability and clarity of the code.","o":["(A) is true and (R) is false.","(A) is false and (R) is true.","Both (A) and (R) are true and (R) is a correct explanation of (A).","Both (A) and (R) are true and (R) is not a correct explanation of (A)."],"c":3,"e":"Both parts are false: Java identifiers CANNOT contain spaces at all, and there is no such readability justification — the reason given is simply untrue."},{"id":"mi5vy5w","l":"r7","t":"Conditional Statements","v":"medium","q":"Assertion (A): In Java, 'import' allows classes from other packages to be used without specifying their fully qualified names.\nReason (R): An entire package can be imported using a wildcard '*', giving access to all classes within that package.","o":["(A) is true and (R) is false.","(A) is false and (R) is true.","Both (A) and (R) are true and (R) is a correct explanation of (A).","Both (A) and (R) are true and (R) is not a correct explanation of (A)."],"c":2,"e":"Both statements are factually correct, and the reason correctly explains why the import statement works the way it does."},{"id":"mjhzpmb","l":"r4","t":"Operators","v":"easy","q":"Which of these operators has only ONE operand?","o":["Binary operator","Ternary operator","Unary operator","Relational operator"],"c":2,"e":"A unary operator (such as ++, --, unary - or !) acts on a single operand, unlike binary (two operands) or ternary (three operands) operators."},{"id":"m1m02vcw","l":"r8","t":"Iterative Constructs","v":"medium","q":"Rewrite int x=1; do{ System.out.println(x); x=x+2; }while(x<=5); as a for loop. Which is correct?","o":["for(int x=1; x<=5; x+=2) System.out.println(x);","for(int x=1; x<5; x+=2) System.out.println(x);","for(int x=1; x<=5; x+=2){ System.out.println(x); x+=2; }","for(x=1; x<=5; x++) System.out.println(x);"],"c":0,"e":"The do-while initialises x=1, tests x<=5, and updates by +2 each time — a for loop combining all three in the same order is: for(int x=1; x<=5; x+=2){ ... }"},{"id":"mkpysaa","l":"l5","t":"User-Defined Methods","v":"medium","q":"What is the type of error, if any, when two methods in a class have the same method signature?","o":["Runtime error","Logical error","Syntax error","No error"],"c":2,"e":"Two methods with the same name and the same parameter types are a duplicate definition. The compiler reports it, so it is a syntax (compile-time) error."},{"id":"mo14alj","l":"l5","t":"User-Defined Methods","v":"easy","q":"The advantages of user-defined methods are:\n(i) Reusability\n(ii) Complexity\n(iii) Modularity","o":["Only (i)","(ii) and (iii)","Only (iii)","(i) and (iii)"],"c":3,"e":"Methods let a program be split into small parts (modularity) that can be called again and again (reusability). They reduce complexity, they do not add it."},{"id":"mam7t0k","l":"l5","t":"User-Defined Methods","v":"easy","q":"The parameters that receive the values passed by the calling statement are called ______ parameters.","o":["actual","formal","reference","class"],"c":1,"e":"Formal parameters appear in the method header and receive the values of the actual parameters."},{"id":"mngsw9v","l":"l5","t":"User-Defined Methods","v":"medium","q":"Which of the following is a valid method prototype?","o":["public int perform (int a; int b)","public perform (int a, int b)","public int perform (int a, int b)","public perform int (int a, int b)"],"c":2,"e":"A prototype has the form: access specifier, return type, name, then the parameter list with commas between parameters."},{"id":"m1ukremz","l":"l5","t":"User-Defined Methods","v":"medium","q":"Which statement correctly calls the method with the prototype int display(int a, char ch)?","o":["int m = display('A', 45);","int m = display( );","int m = display(A, 45);","int m = displa
