ototype</b> is the first line of a method which gives its return type, name and the list of parameters (with types).</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>double area(double r)</code></pre></div>"},{"id":"h1gh1ccw","l":"l5","t":"Call by value / reference","v":"medium","q":"Differentiate between call by value and call by reference.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Call by value</th><th>Call by reference</th></tr></thead><tbody><tr><td>Primitive values are passed.</td><td>Objects/arrays (their reference) are passed.</td></tr><tr><td>A copy of the value is passed.</td><td>The address of the object is passed.</td></tr><tr><td>Change in formal parameter does not affect the actual parameter.</td><td>Change inside the method affects the original object/array.</td></tr></tbody></table></div>"},{"id":"h19q7sd1","l":"l5","t":"Pure and impure methods","v":"medium","q":"Differentiate between pure and impure methods with an example of each.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Pure method</th><th>Impure method</th></tr></thead><tbody><tr><td>Does not modify the object's data or the arguments.</td><td>Modifies the data members or the arguments.</td></tr><tr><td>Usually returns a value.</td><td>May or may not return a value.</td></tr><tr><td>int getSalary() { return sal; }</td><td>void raise(int p) { sal = sal + sal * p / 100; }</td></tr></tbody></table></div>"},{"id":"h1woomgz","l":"l5","t":"Method overloading","v":"easy","q":"What is method overloading? State two ways in which methods can be overloaded.","a":"<p><b>Method overloading</b> is defining more than one method with the same name in a class but with different parameter lists. Methods differ in:</p><ul><li>the number of parameters, or</li><li>the data types (or their order) of the parameters.</li></ul><p>The return type alone cannot distinguish overloaded methods.</p>"},{"id":"hc237xe","l":"l5","t":"Static vs non-static","v":"medium","q":"Differentiate between a static method and a non-static method.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Static method</th><th>Non-static method</th></tr></thead><tbody><tr><td>Declared with the keyword static.</td><td>Declared without static.</td></tr><tr><td>Called using the class name, no object needed.</td><td>Called using an object of the class.</td></tr><tr><td>Can access only static members directly.</td><td>Can access static and non-static members.</td></tr></tbody></table></div>"},{"id":"h12tx0cn","l":"l5","t":"Actual vs formal parameters","v":"easy","q":"What are actual and formal parameters? Identify them in: int r = sum(a, b); and int sum(int x, int y).","a":"<ul><li><b>Actual parameters</b> are the values/variables passed in the method call: a, b.</li><li><b>Formal parameters</b> are the variables in the method definition which receive them: x, y.</li></ul>"},{"id":"h1as6sk5","l":"l5","t":"Scope of variables","v":"medium","q":"What is the scope of a variable? Explain the scope of a local variable and an instance variable.","a":"<p>The <b>scope</b> of a variable is the part of the program where it can be used.</p><ul><li><b>Local variable</b>: declared inside a method/block (or as a parameter); usable only in that method/block and lost when it ends.</li><li><b>Instance variable</b>: declared in the class outside all methods; usable by all non-static methods of the class and exists as long as the object does.</li></ul>"},{"id":"h1wzhqkl","l":"l5","t":"void and return","v":"medium","q":"State the significance of the return type void and of the return statement in a method.","a":"<ul><li><b>void</b> means the method returns no value to the caller; it only performs an action (such as printing).</li><li>The <b>return</b> statement sends one value back to the calling method and transfers control back to it.</li><li>A non-void method must return a value of its return type on every path; a void method may use return; only to exit early.</li></ul>"},{"id":"hysw8dd","l":"l6","t":"Class and object","v":"easy","q":"Define a class and an object. How is an object created?","a":"<p>A <b>class</b> is a blueprint (template) that describes the data members and member methods common to a group of similar things. An <b>object</b> is an instance of a class having its own state (values of data) and behaviour.</p><p>An object is created with the <b>new</b> operator: Student s = new Student();</p>"},{"id":"hl6zvs5","l":"l6","t":"Class vs object","v":"medium","q":"Distinguish between a class and an object.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Class</th><th>Object</th></tr></thead><tbody><tr><td>A blueprint or template.</td><td>An instance of a class.</td></tr><tr><td>Defined once using the keyword class.</td><td>Created using the new operator; many can be made.</td></tr><tr><td>No memory for instance data until an object is created.</td><td>Occupies memory for its own instance variables.</td></tr></tbody></table></div>"},{"id":"hw0x8l3","l":"l6","t":"Instance vs static variables","v":"medium","q":"Differentiate between an instance variable and a class (static) variable.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Instance variable</th><th>Class (static) variable</th></tr></thead><tbody><tr><td>Declared without static.</td><td>Declared with the keyword static.</td></tr><tr><td>Every object has its own copy.</td><td>One copy shared by all objects.</td></tr><tr><td>Accessed through an object.</td><td>Accessed through the class name (or an object).</td></tr></tbody></table></div>"},{"id":"h2uxbv7","l":"l6","t":"Instance vs local variables","v":"medium","q":"Differentiate between an instance variable and a local variable.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Instance variable</th><th>Local variable</th></tr></thead><tbody><tr><td>Declared in the class, outside all methods.</td><td>Declared inside a method, constructor or block.</td></tr><tr><td>Gets a default value automatically.</td><td>Has no default value; must be initialised.</td></tr><tr><td>Exists as long as the object exists.</td><td>Exists only while the method/block runs.</td></tr></tbody></table></div>"},{"id":"hlg0im1","l":"l6","t":"this keyword","v":"easy","q":"What is the use of the keyword this? Explain with a short example.","a":"<p><b>this</b> refers to the current object. It is used to distinguish an instance variable from a parameter or local variable having the same name.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Book {\n    int pages;\n    void setPages(int pages) {\n        this.pages = pages;   // left: instance variable, right: parameter\n    }\n}</code></pre></div>"},{"id":"h1hypacf","l":"l6","t":"new operator","v":"easy","q":"What is the function of the new operator? What does the statement Student s; (without new) create?","a":"<p>The <b>new</b> operator allocates memory for the object, calls the constructor and returns the reference (address) of the object.</p><p>Student s; only declares a reference variable which holds <b>null</b>; no object exists until it is assigned with new.</p>"},{"id":"hpdp6ru","l":"l6","t":"Passing objects","v":"medium","q":"What is passed to a method when an object is given as an argument? What happens to the original object if the method changes its data members?","a":"<ul><li>The <b>reference</b> (address) of the object is passed, not a separate copy of the object.</li><li>The formal parameter and the actual argument therefore refer to the same object.</li><li>Changes made to the data members inside the method are reflected in the original object (call by reference).</li></ul>"},{"id":"he8hjkl","l":"l6","t":"null and NullPointerException","v":"medium","q":"What is meant by a null reference? What error occurs if a method is invoked using a null reference?","a":"<p><b>null</b> is the value of a reference variable that does not refer to any object. Calling a method or accessing a data member through such a reference throws a <b>NullPointerException</b> at run time.</p>"},{"id":"h1c9w8i9","l":"l7","t":"Constructor","v":"easy","q":"What is a constructor? State any two characteristics of a constructor.","a":"<p>A <b>constructor</b> is a special member method that is called automatically when an object is created, and is used to initialise the data members of the object.</p><ul><li>Its name is the same as the class name.</li><li>It has no return type (not even void).</li></ul>"},{"id":"hhm9hgh","l":"l7","t":"Constructor vs method","v":"medium","q":"Differentiate between a constructor and a method.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Constructor</th><th>Method</th></tr></thead><tbody><tr><td>Name is the same as the class name.</td><td>Any valid identifier name.</td></tr><tr><td>Has no return type, not even void.</td><td>Must have a return type (void or a type).</td></tr><tr><td>Called automatically when an object is created.</td><td>Called explicitly using an object (or class name).</td></tr></tbody></table></div>"},{"id":"h12r5ztb","l":"l7","t":"Default constructor","v":"easy","q":"What is a default constructor? When does the compiler supply it?","a":"<p>A <b>default constructor</b> is a constructor with no parameters. If a class has no constructor of its own, the compiler automatically supplies one that initialises data members with default values (0, 0.0, false, null). Once the programmer writes any constructor, the compiler does not supply it.</p>"},{"id":"h1vno1x8","l":"l7","t":"Constructor overloading","v":"medium","q":"What is constructor overloading? Illustrate with a class having two constructors.","a":"<p><b>Constructor overloading</b> means having more than one constructor in a class, each with a different parameter list; the constructor to run is selected by the arguments given in new.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Point {\n    int x, y;\n    Point() { x = 0; y = 0; }\n    Point(int a, int b) { x = a; y = b; }\n}\n// new Point() and new Point(3, 4)</code></pre></div>"},{"id":"hj0p62e","l":"l7","t":"this() chaining","v":"medium","q":"Explain the use of this() in a constructor with an example. State where it must be written.","a":"<p><b>this(...)</b> calls another constructor of the same class (constructor chaining), avoiding repeated code. It must be the <b>first statement</b> of the constructor.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Acc {\n    double bal;\n    Acc() { this(1000); }\n    Acc(double b) { bal = b; }\n}</code></pre></div>"},{"id":"h558y5x","l":"l7","t":"Copy constructor concept","v":"hard","q":"Explain the concept of a copy constructor and write one for a class Time with data members hr and min.","a":"<p>A <b>copy constructor</b> creates a new object by copying the data members of an existing object of the same class, which is passed as the argument. Java does not provide it automatically; the programmer writes it.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Time {\n    int hr, min;\n    Time(Time t) {\n        hr = t.hr;\n        min = t.min;\n    }\n}</code></pre></div><p>The new object is independent of the original, unlike Time t2 = t1; which only copies the reference.</p>"},{"id":"h10x9sg4","l":"l7","t":"No default constructor","v":"medium","q":"A class Student has only the constructor Student(int roll). What happens when the statement Student s = new Student(); is compiled? How can it be corrected?","a":"<p>A <b>compile-time error</b> occurs because the compiler does not supply a default constructor when another constructor is present, so no constructor with no parameters exists.</p><p>It can be corrected by writing a no-argument constructor Student() { } in the class (overloading), or by calling new Student(5).</p>"},{"id":"hbdl5dz","l":"l7","t":"Object creation","v":"medium","q":"State what happens, step by step, when the statement Box b = new Box(5); is executed.","a":"<ol><li>Memory is allocated for the object of class Box; its instance variables get default values.</li><li>The matching constructor Box(int) is called and its body initialises the data members.</li><li>The address of the new object is stored in the reference variable b.</li></ol>"},{"id":"h1vs4ny1","l":"r9","t":"Dry Run","v":"medium","q":"Dry run the following code using a trace table and state the output.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>i</th><th>j</th><th>s = s + j</th></tr></thead><tbody><tr><td>1</td><td>1</td><td>1</td></tr><tr><td>1</td><td>2</td><td>3</td></tr><tr><td>1</td><td>3</td><td>6</td></tr><tr><td>2</td><td>2</td><td>8</td></tr><tr><td>2</td><td>3</td><td>11</td></tr><tr><td>3</td><td>3</td><td>14</td></tr></tbody></table></div><p><b>Output:</b> 14</p><p>The inner loop starts from the current value of i, so it runs 3, 2 and 1 times.</p>","qc":"int s = 0;\nfor (int i = 1; i <= 3; i++) {\n    for (int j = i; j <= 3; j++) {\n        s = s + j;\n    }\n}\nSystem.out.println(s);"},{"id":"h1t556kq","l":"r9","t":"Pattern Printing","v":"medium","q":"Write the nested loop that prints the following pattern and explain the role of the outer loop and the inner loop.","a":"<div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>for (int i = 1; i &lt;= 4; i++) {\n    for (int j = 1; j &lt;= i; j++) {\n        System.out.print(i + \" \");\n    }\n    System.out.println();\n}</code></pre></div><ul><li><b>Outer loop (i):</b> runs 4 times and controls the <b>rows</b>; its value i is also the number printed in that row.</li><li><b>Inner loop (j):</b> runs i times in row i and controls how many numbers (columns) are printed in that row.</li><li><b>println():</b> after the inner loop finishes, it moves the cursor to the next row.</li></ul>","qc":"1\n2 2\n3 3 3\n4 4 4 4"},{"id":"h12xtc2p","l":"r9","t":"break and continue","v":"hard","q":"Explain the effect of break and continue when used inside the inner loop of a nested loop. Give the output of the following two fragments.","a":"<ul><li><b>break</b> ends only the inner loop; the outer loop goes on to its next iteration.</li><li><b>continue</b> skips the rest of the current inner iteration and goes to the next value of j; neither loop is ended.</li></ul><p><b>(a)</b> 11 21 31<br><b>(b)</b> 11 13 21 23 31 33</p>","qc":"(a) for (int i = 1; i <= 3; i++)\n        for (int j = 1; j <= 3; j++) {\n            if (j == 2) break;\n            System.out.print(i + \"\" + j + \" \");\n        }\n(b) for (int i = 1; i <= 3; i++)\n        for (int j = 1; j <= 3; j++) {\n            if (j == 2) continue;\n            System.out.print(i + \"\" + j + \" \");\n        }"},{"id":"h17msq73","l":"r9","t":"Error Finding","v":"medium","q":"The following fragment is meant to print a 3 x 3 block of stars. Find the error, state its type and correct it. Also state what would be printed if a semicolon were placed just after the inner for statement.","a":"<ul><li><b>Error:</b> the counter i is declared again in the inner loop while the outer i is still in scope. This is a <b>compile-time (syntax) error</b>: variable i is already defined.</li><li><b>Correction:</b> use a different variable, e.g. <code>for (int j = 1; j &lt;= 3; j++)</code>.</li><li><b>With a semicolon after the inner for:</b> the inner loop gets an empty body, so only one * is printed per row (inner loop spins silently 3 times), giving three lines of a single *.</li></ul>","qc":"for (int i = 1; i <= 3; i++) {\n    for (int i = 1; i <= 3; i++)\n        System.out.print(\"*\");\n    System.out.println();\n}"},{"id":"hbs9co3","l":"r5b","t":"Scanner Statements","v":"medium","q":"Write Java statements, including the required import, to accept: a full name (with spaces), an age (int), the marks (double) and a grade (char) from the keyboard.","a":"<div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>import java.util.Scanner;\n...\nScanner sc = new Scanner(System.in);\nString name = sc.nextLine();\nint age = sc.nextInt();\ndouble marks = sc.nextDouble();\nchar grade = sc.next().charAt(0);</code></pre></div><ul><li>nextLine() reads the full name including spaces (it is placed first to avoid the leftover-newline problem).</li><li>nextInt() and nextDouble() read the numbers.</li><li>The grade is read as a word with next() and its first character is taken with charAt(0).</li></ul>"},{"id":"h32kz0z","l":"r5b","t":"Input Methods","v":"medium","q":"In BlueJ, a value can be given to a method either through a Scanner object or through a parameter. Differentiate between the two ways of giving input.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Scanner</th><th>Method parameter</th></tr></thead><tbody><tr><td>Value is typed in the Terminal Window while the program runs.</td><td>Value is typed in the BlueJ dialog box when the method is called.</td></tr><tr><td>Needs import java.util.* and a Scanner object.</td><td>No import or Scanner object is needed.</td></tr><tr><td>The method can ask for many values, one after another.</td><td>Values must be listed in the method header, e.g. void area(int l, int b).</td></tr></tbody></table></div>"},{"id":"hpqiekt","l":"r5b","t":"Scanner Basics","v":"easy","q":"Explain the statement Scanner sc = new Scanner(System.in);. What does System.in represent?","a":"<ul><li><b>Scanner</b> is the class; <b>sc</b> is the object (reference variable) created with <b>new</b>.</li><li><b>System.in</b> is the standard input stream, i.e. the keyboard. Passing it tells the Scanner object to read the characters typed by the user and convert them into int, double, String etc. using methods such as nextInt() and nextLine().</li></ul>"},{"id":"h1lrlc32","l":"l4","t":"substring","v":"medium","q":"Differentiate between substring(int) and substring(int, int) with an example each.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>substring(int begin)</th><th>substring(int begin, int end)</th></tr></thead><tbody><tr><td>Returns characters from index <b>begin</b> up to the <b>end of the string</b>.</td><td>Returns characters from index <b>begin</b> up to <b>end - 1</b> (end is excluded).</td></tr><tr><td><code>\"COMPUTER\".substring(3)</code> gives <b>PUTER</b></td><td><code>\"COMPUTER\".substring(2, 5)</code> gives <b>MPU</b></td></tr></tbody></table></div>"},{"id":"hrkju3o","l":"l4","t":"String Methods","v":"easy","q":"Differentiate between charAt() and indexOf(). Give an example with the string \"JAVA\".","a":"<ul><li><b>charAt(int i)</b> takes a position and returns the <b>character</b> there (return type char): <code>\"JAVA\".charAt(1)</code> is 'A'.</li><li><b>indexOf(char/String)</b> takes a character or string and returns its <b>position</b> (return type int): <code>\"JAVA\".indexOf('A')</code> is 1 (first occurrence; -1 if absent).</li></ul>"},{"id":"h17kck7g","l":"l4","t":"equals","v":"easy","q":"Differentiate between equals() and equalsIgnoreCase().","a":"<ul><li><b>equals()</b> is case-sensitive: <code>\"Java\".equals(\"JAVA\")</code> is false.</li><li><b>equalsIgnoreCase()</b> ignores case: <code>\"Java\".equalsIgnoreCase(\"JAVA\")</code> is true.</li><li>Both return a boolean and compare the contents of the strings, not their references.</li></ul>"},{"id":"hly4e47","l":"l4","t":"String Methods","v":"medium","q":"A String variable s holds a word. Write Java expressions to: (i) obtain its first character, (ii) obtain its last character, (iii) check whether it ends with \"ing\", (iv) convert it to lower case, (v) replace every letter 'a' by 'e'.","a":"<ol><li><code>s.charAt(0)</code></li><li><code>s.charAt(s.length() - 1)</code></li><li><code>s.endsWith(\"ing\")</code></li><li><code>s.toLowerCase()</code></li><li><code>s.replace('a', 'e')</code></li></ol><p>Results of (iv) and (v) must be stored (for example <code>s = s.toLowerCase();</code>) because strings are immutable.</p>"},{"id":"hufnyhw","l":"l4","t":"Immutability","v":"medium","q":"Name the String methods trim(), toUpperCase(), replace() and concat() and state what each does. Why must their result be assigned to a variable if the change is to be kept?","a":"<ul><li><b>trim()</b> removes leading and trailing spaces.</li><li><b>toUpperCase()</b> converts every letter to upper case.</li><li><b>replace(old, new)</b> replaces every occurrence of a character (or string) by another.</li><li><b>concat(str)</b> joins str at the end of the string.</li></ul><p>A String object cannot be modified once created (it is <b>immutable</b>). Each method builds and returns a <b>new</b> String and leaves the original untouched, so the result must be stored: <code>s = s.trim();</code></p>"},{"id":"h15n90ai","l":"l4","t":"String Methods","v":"medium","q":"Let s = \"Information Technology\". Give the output of: (i) s.length() (ii) s.indexOf('o') (iii) s.lastIndexOf('o') (iv) s.substring(12, 16) (v) s.endsWith(\"gy\").","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Expression</th><th>Output</th></tr></thead><tbody><tr><td>s.length()</td><td>22</td></tr><tr><td>s.indexOf('o')</td><td>3</td></tr><tr><td>s.lastIndexOf('o')</td><td>19</td></tr><tr><td>s.substring(12, 16)</td><td>Tech</td></tr><tr><td>s.endsWith(\"gy\")</td><td>true</td></tr></tbody></table></div><p>\"Information\" occupies indexes 0 to 10, the space is index 11 and \"Technology\" occupies 12 to 21.</p>"},{"id":"hrqhj71","l":"l3","t":"Binary Search","v":"medium","q":"Perform a binary search for the key 31 in the sorted array {5, 9, 14, 23, 31, 40, 52} (index 0 to 6). Show the values of low, high and mid at each step.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Step</th><th>low</th><th>high</th><th>mid = (low+high)/2</th><th>a[mid]</th><th>Action</th></tr></thead><tbody><tr><td>1</td><td>0</td><td>6</td><td>3</td><td>23</td><td>23 &lt; 31, so low = mid + 1 = 4</td></tr><tr><td>2</td><td>4</td><td>6</td><td>5</td><td>40</td><td>40 &gt; 31, so high = mid - 1 = 4</td></tr><tr><td>3</td><td>4</td><td>4</td><td>4</td><td>31</td><td>Found</td></tr></tbody></table></div><p>The key 31 is found at index 4 in 3 comparisons.</p>"},{"id":"ht2j73n","l":"l3","t":"2D Arrays","v":"medium","q":"Write a code fragment to find and print the sum of the elements of the main (left) diagonal of a square matrix m[][] of order n.","a":"<div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int sum = 0;\nfor (int i = 0; i &lt; n; i++) {\n    sum = sum + m[i][i];     // row number = column number\n}\nSystem.out.println(\"Diagonal sum = \" + sum);</code></pre></div><p>The diagonal elements have equal row and column indexes, so a single loop is enough.</p>"},{"id":"hgu947q","l":"l3","t":"Sorting","v":"medium","q":"Differentiate between Bubble Sort and Selection Sort.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Bubble Sort</th><th>Selection Sort</th></tr></thead><tbody><tr><td>Compares adjacent elements and swaps them if they are out of order.</td><td>Finds the smallest (or largest) element of the unsorted part and places it in its correct position.</td></tr><tr><td>May make many swaps in one pass.</td><td>Makes at most one swap per pass.</td></tr><tr><td>After each pass the largest remaining value reaches the end.</td><td>After each pass the smallest remaining value reaches the front.</td></tr></tbody></table></div>"},{"id":"h1tzavbn","l":"l3","t":"Exceptions","v":"easy","q":"What is an ArrayIndexOutOfBoundsException? When does it occur? Give an example.","a":"<p>It is a run-time error (exception) that occurs when a program uses an index that is negative or not less than the length of the array.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int a[] = new int[5];     // valid indexes 0 to 4\na[5] = 10;                // index 5 does not exist: exception</code></pre></div><p>The program compiles correctly but stops while running.</p>"},{"id":"hf1onjz","l":"l3","t":"Selection Sort","v":"hard","q":"Show, pass by pass, how Selection Sort arranges {7, 3, 9, 1, 5} in ascending order.","a":"<div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Pass</th><th>Smallest in unsorted part</th><th>Action</th><th>Array after the pass</th></tr></thead><tbody><tr><td>1</td><td>1 (index 3)</td><td>swap with index 0</td><td>1 3 9 7 5</td></tr><tr><td>2</td><td>3 (index 1)</td><td>already in place</td><td>1 3 9 7 5</td></tr><tr><td>3</td><td>5 (index 4)</td><td>swap with index 2</td><td>1 3 5 7 9</td></tr><tr><td>4</td><td>7 (index 3)</td><td>already in place</td><td>1 3 5 7 9</td></tr></tbody></table></div><p>n - 1 = 4 passes are needed for 5 elements.</p>"},{"id":"h4xha7z","l":"l3","t":"Array as Parameter","v":"medium","q":"How is an array passed to a method in Java? Explain with a short example and state its effect on the original array.","a":"<p>An array is passed by <b>reference</b>: the method receives the address of the same array object, not a copy of its elements. So changes made inside the method affect the original array.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>void doubleAll(int x[]) {\n    for (int i = 0; i &lt; x.length; i++)\n        x[i] = x[i] * 2;\n}\n// call: int a[] = {1, 2, 3};  doubleAll(a);\n// now a holds 2 4 6</code></pre></div>"},{"id":"hu8mfu1","l":"l6","t":"Class & Object","v":"hard","q":"Differentiate between a Class and an Object.","a":"<p><b>Class:</b> A class is a user-defined data type. It acts as a blueprint (template) that describes the <b>data members</b> (variables) and the <b>member methods</b> (functions) common to all objects of one kind. A class is a logical entity — merely declaring it does not reserve memory for its data.</p>\n<p><b>Object:</b> An object is an <b>instance</b> of a class. It is a real, run-time entity that owns a separate copy of the instance variables and can use the methods of the class. Memory is allocated when the object is created with the <b>new</b> operator.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Class</th><th>Object</th></tr></thead><tbody><tr><td>Nature</td><td>Blueprint / template (logical entity)</td><td>Instance of the class (physical entity)</td></tr><tr><td>Memory</td><td>No memory for data until an object exists</td><td>Memory is allocated when it is created</td></tr><tr><td>Creation</td><td>Declared using the keyword <code class=\"inline\">class</code></td><td>Created using the <code class=\"inline\">new</code> operator</td></tr><tr><td>Number</td><td>Defined only once</td><td>Any number of objects can be made from one class</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Student {          // Student is the class\n    int roll;\n    String name;\n}\n\nStudent s1 = new Student();   // s1 is an object\nStudent s2 = new Student();   // s2 is another object</code></pre></div><p><b>Note:</b> In <code class=\"inline\">Game cricket = new Game();</code>, <i>Game</i> is the class and <i>cricket</i> is the object (reference variable).</p>"},{"id":"h16y958x","l":"l5","t":"Method Overloading","v":"hard","q":"What is method overloading? State its rules with an example.","a":"<p><b>Definition:</b> Method overloading is the process of defining <b>two or more methods with the same name in the same class, but with different parameter lists</b>. When a method is called, the compiler decides which version to run by matching the arguments supplied with the parameter lists (this is decided at compile time).</p>\n<p><b>Rules of method overloading:</b></p>\n<ul>\n<li>The method name must be the same and all the methods must be in the same class.</li>\n<li>The parameter lists must differ in at least one of these: the <b>number</b> of parameters, the <b>data types</b> of parameters, or the <b>order</b> of the parameter types.</li>\n<li>Changing only the <b>return type</b>, only the <b>parameter names</b> or only the <b>access specifier</b> does NOT create a valid overload — the program will not compile.</li>\n</ul><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Calculator {\n    int add(int a, int b)         { return a + b; }\n    int add(int a, int b, int c)  { return a + b + c; }     // different number\n    double add(double a, double b){ return a + b; }         // different type\n}</code></pre></div><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Call</th><th>Version executed</th></tr></thead><tbody><tr><td><code class=\"inline\">add(3, 4)</code></td><td><code class=\"inline\">add(int, int)</code> → 7</td></tr><tr><td><code class=\"inline\">add(1, 2, 3)</code></td><td><code class=\"inline\">add(int, int, int)</code> → 6</td></tr><tr><td><code class=\"inline\">add(2.5, 1.5)</code></td><td><code class=\"inline\">add(double, double)</code> → 4.0</td></tr></tbody></table></div><p><b>Advantage:</b> One meaningful name is used for closely related tasks, which makes the program easier to read and remember.</p>"},{"id":"h12vm6gm","l":"l7","t":"Constructors","v":"hard","q":"Differentiate between a Constructor and a Method.","a":"<p>A <b>constructor</b> is a special member function that is automatically executed when an object is created and is used to initialise the instance variables of that object. A <b>method</b> is a named block of code that performs a specific task and runs only when it is called.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Constructor</th><th>Method</th></tr></thead><tbody><tr><td>Name</td><td>Same as the class name</td><td>Any valid identifier (usually different from the class name)</td></tr><tr><td>Return type</td><td>None — not even void</td><td>Must have a return type (or void)</td></tr><tr><td>Purpose</td><td>Initialises the object's data members</td><td>Performs an action / computation</td></tr><tr><td>Calling</td><td>Called automatically when the object is created using <code class=\"inline\">new</code></td><td>Called explicitly using the object, e.g. <code class=\"inline\">obj.show()</code></td></tr><tr><td>Compiler-provided</td><td>A default constructor is supplied if none is written</td><td>Never supplied automatically</td></tr><tr><td>Number of calls</td><td>Once per object creation</td><td>Any number of times</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Box {\n    int side;\n    Box(int s) { side = s; }        // constructor\n    int area() { return side * side; }   // method\n}</code></pre></div>"},{"id":"ht29wwo","l":"l7","t":"Constructors","v":"hard","q":"What is constructor overloading? Why is it used?","a":"<p><b>Definition:</b> Constructor overloading means writing <b>more than one constructor in the same class</b>, all having the class name but with <b>different parameter lists</b> (different number, type or order of parameters). Java decides which constructor to run from the arguments given in the <code class=\"inline\">new</code> statement.</p>\n<p><b>Why it is used:</b> It allows objects of the same class to be created and initialised in different ways, depending on how much information is available at the time.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Student {\n    String name;\n    int age;\n\n    Student() {                       // no information\n        name = \"Unknown\";  age = 0;\n    }\n    Student(String n) {               // only name\n        name = n;  age = 0;\n    }\n    Student(String n, int a) {        // name and age\n        name = n;  age = a;\n    }\n}\n\nStudent s1 = new Student();\nStudent s2 = new Student(\"Anu\");\nStudent s3 = new Student(\"Anu\", 20);</code></pre></div><p>Here <code class=\"inline\">s1</code>, <code class=\"inline\">s2</code> and <code class=\"inline\">s3</code> are created by three different constructors. <b>Exam tip:</b> the return type is never written for a constructor, and overloaded constructors must differ in their parameters.</p>"},{"id":"h44zpo1","l":"l7","t":"Constructors","v":"hard","q":"What is a default constructor? When does the compiler provide it?","a":"<p><b>Definition:</b> A default constructor is a constructor that takes <b>no parameters</b>. If the programmer does not write any constructor in a class, the Java compiler automatically supplies one. It gives the instance variables their default values: <b>0</b> for numeric types, <b>false</b> for boolean, <b>'\\u0000'</b> for char and <b>null</b> for objects/Strings.</p>\n<p><b>The trap:</b> The compiler supplies the default constructor <b>only when the class has no constructor at all</b>. The moment you write even one constructor (for example a parameterised one), the compiler stops providing the default one.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Box {\n    int side;\n    Box(int s) { side = s; }\n}\n\nBox b1 = new Box(5);   // OK\nBox b2 = new Box();    // Compile-time error: no Box() constructor exists</code></pre></div><p><b>Remedy:</b> Write a no-argument constructor <code class=\"inline\">Box() { side = 0; }</code> yourself if you need it.</p>"},{"id":"hquawlq","l":"r3","t":"Data Types","v":"hard","q":"What is type casting? Differentiate between implicit and explicit type conversion.","a":"<p><b>Definition:</b> Type casting (type conversion) is the process of converting a value of one data type into another data type.</p>\n<p><b>Implicit conversion (widening):</b> Done automatically by the compiler when a smaller type is assigned to a larger type. No data is lost. Order: <i>byte → short → int → long → float → double</i>.</p>\n<p><b>Explicit conversion (narrowing):</b> Done manually by the programmer by writing the target type in brackets. A larger type is forced into a smaller one, so data may be lost.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Implicit</th><th>Explicit</th></tr></thead><tbody><tr><td>Done by</td><td>Compiler (automatic)</td><td>Programmer (using (type))</td></tr><tr><td>Direction</td><td>Smaller → larger type</td><td>Larger → smaller type</td></tr><tr><td>Data loss</td><td>No</td><td>Possible</td></tr><tr><td>Example</td><td><code class=\"inline\">double d = 5;</code> → 5.0</td><td><code class=\"inline\">int x = (int) 9.8;</code> → 9</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int a = 7, b = 2;\nSystem.out.println(a / b);            // 3    (integer division)\nSystem.out.println((double) a / b);   // 3.5  (a is cast to double first)\nint x = (int) 9.8;                    // 9  — decimal part is TRUNCATED, not rounded</code></pre></div><p><b>Note:</b> Explicit casting of a decimal to int always removes the fractional part; it never rounds.</p>"},{"id":"h7p16su","l":"l5","t":"Methods","v":"hard","q":"Differentiate between Actual parameters and Formal parameters.","a":"<p><b>Actual parameters</b> (arguments) are the values or variables written inside the brackets when a method is <b>called</b>. <b>Formal parameters</b> are the variables declared in the parentheses of the method <b>definition</b>; they receive the values of the actual parameters.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Actual parameters</th><th>Formal parameters</th></tr></thead><tbody><tr><td>Where written</td><td>In the method call</td><td>In the method definition (header)</td></tr><tr><td>Contains</td><td>Constants, values, expressions or variables</td><td>Only variable declarations with data types</td></tr><tr><td>Purpose</td><td>Send values to the method</td><td>Receive the values sent</td></tr><tr><td>Data type written?</td><td>No</td><td>Yes</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>void area(int l, int b) {          // l and b are FORMAL parameters\n    System.out.println(l * b);\n}\n...\nobj.area(5, 10);                      // 5 and 10 are ACTUAL parameters</code></pre></div><p>The number, order and types of actual parameters must match the formal parameters.</p>"},{"id":"h1i7cgwx","l":"r5a","t":"Keywords","v":"hard","q":"What is the use of the 'this' keyword? Explain with an example.","a":"<p><b>Definition:</b> <code class=\"inline\">this</code> is a keyword that refers to the <b>current object</b> — the object through which a method or constructor is being executed.</p>\n<p><b>Main use:</b> When a parameter (or local variable) has the same name as an instance variable, the local name hides the instance variable. Writing <code class=\"inline\">this.variable</code> tells Java that the instance variable of the current object is meant.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Student {\n    String name;\n    int age;\n\n    Student(String name, int age) {\n        this.name = name;   // this.name = instance variable, name = parameter\n        this.age  = age;\n    }\n}</code></pre></div><p>Without <code class=\"inline\">this</code>, the statement <code class=\"inline\">name = name;</code> would simply assign the parameter to itself and the instance variable would remain unchanged.</p>\n<p><b>Note:</b> <code class=\"inline\">this</code> cannot be used inside a static method, because a static method does not belong to any particular object.</p>"},{"id":"hboff0z","l":"l2","t":"Wrapper Classes","v":"hard","q":"What are Wrapper classes? Why are they needed? Name the wrapper class of each primitive type.","a":"<p><b>Definition:</b> A wrapper class is a class that <b>wraps (encloses) a primitive value inside an object</b>. Every primitive data type has a corresponding wrapper class in the <code class=\"inline\">java.lang</code> package.</p>\n<p><b>Need / uses:</b></p>\n<ul>\n<li>To convert a primitive value into an object and back.</li>\n<li>To convert a number stored in a String into a numeric value, e.g. <code class=\"inline\">Integer.parseInt(\"25\")</code> or <code class=\"inline\">Double.parseDouble(\"2.5\")</code>.</li>\n<li>They supply useful methods, e.g. <code class=\"inline\">Character.isDigit(ch)</code>.</li>\n</ul><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Primitive</th><th>byte</th><th>short</th><th>int</th><th>long</th><th>float</th><th>double</th><th>char</th><th>boolean</th></tr></thead><tbody><tr><td>Wrapper</td><td>Byte</td><td>Short</td><td>Integer</td><td>Long</td><td>Float</td><td>Double</td><td>Character</td><td>Boolean</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int n = Integer.parseInt(\"123\");         // String → int\ndouble d = Double.parseDouble(\"45.6\");    // String → double\nboolean b = Character.isDigit('7');       // true</code></pre></div><p><b>Note:</b> The parameter of <code class=\"inline\">parseInt()</code> and <code class=\"inline\">parseDouble()</code> must be a <b>String</b>, and the method names are case-sensitive.</p>"},{"id":"h1kay13j","l":"l2","t":"Wrapper Classes","v":"medium","q":"What is autoboxing and unboxing?","a":"<p><b>Autoboxing:</b> The automatic conversion of a primitive value into an object of its wrapper class by the Java compiler.</p>\n<p><b>Unboxing:</b> The automatic conversion of a wrapper class object back into its primitive value.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int a = 10;\nInteger obj = a;      // Autoboxing : int → Integer (automatic)\nint b = obj;          // Unboxing   : Integer → int (automatic)\n\nDouble d = 5.5;       // autoboxing of double\ndouble x = d;         // unboxing</code></pre></div><p>Both conversions happen automatically, so the programmer does not have to call methods such as <code class=\"inline\">Integer.valueOf()</code> or <code class=\"inline\">intValue()</code> explicitly.</p>"},{"id":"h1v5lmjg","l":"r5a","t":"Errors","v":"hard","q":"Name the three types of errors in Java. Explain each with an example.","a":"<p>An error (bug) is a mistake in a program that stops it from working correctly. There are three types:</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Type</th><th>When it occurs / detected by</th><th>Example</th></tr></thead><tbody><tr><td><b>Syntax error</b></td><td>Breaks the grammar rules of Java; detected by the compiler and the program will not compile.</td><td>Missing semicolon, misspelt keyword, using an undeclared or uninitialised variable.</td></tr><tr><td><b>Runtime error</b></td><td>Program compiles but stops abnormally while running; detected by the JVM.</td><td>Dividing an int by zero, accessing <code class=\"inline\">arr[5]</code> in an array of size 5, <code class=\"inline\">Integer.parseInt(\"abc\")</code>.</td></tr><tr><td><b>Logical error</b></td><td>Program compiles and runs but gives wrong output; no message is shown. Found only by testing.</td><td>Using <code class=\"inline\">f = 0</code> instead of <code class=\"inline\">f = 1</code> in a factorial program, or wrong formula.</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int f = 0;\nfor(int p = 5; p &gt; 0; p--)\n    f *= p;                // Logical error: prints 0 instead of 120</code></pre></div><p><b>Correction:</b> initialise <code class=\"inline\">int f = 1;</code>. Exam questions usually ask you to <i>name the type of error</i> and rewrite the corrected statement.</p>"},{"id":"hwgky4d","l":"l8","t":"Access Specifiers","v":"hard","q":"What are access specifiers? List them with their scope.","a":"<p><b>Definition:</b> Access specifiers (access modifiers) are keywords that decide <b>which parts of a program are allowed to use</b> a class, variable or method. They control the visibility of members.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Specifier</th><th>Visible / accessible from</th><th>Restriction level</th></tr></thead><tbody><tr><td><code class=\"inline\">private</code></td><td>Only inside the same class</td><td>Most restrictive</td></tr><tr><td><i>default</i> (no keyword)</td><td>Any class in the same package</td><td>Restrictive</td></tr><tr><td><code class=\"inline\">protected</code></td><td>Same package, and subclasses of other packages</td><td>Less restrictive</td></tr><tr><td><code class=\"inline\">public</code></td><td>Every class, everywhere</td><td>No restriction</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Account {\n    private double balance;              // hidden from other classes\n    public void show() {                 // can be called from anywhere\n        System.out.println(balance);\n    }\n}</code></pre></div><p><b>Note:</b> Using <code class=\"inline\">private</code> for data members protects them from accidental changes by other classes. <b>'package' is NOT an access specifier</b> — it is only used to declare a package.</p>"},{"id":"h1rudqwz","l":"r4","t":"Operators","v":"medium","q":"Differentiate between the operators '=' and '=='.","a":"<p>The symbol <code class=\"inline\">=</code> is the <b>assignment operator</b>, whereas <code class=\"inline\">==</code> is the <b>relational (equality) operator</b>.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>=</th><th>==</th></tr></thead><tbody><tr><td>Type</td><td>Assignment operator</td><td>Relational (comparison) operator</td></tr><tr><td>Function</td><td>Stores the value on the right into the variable on the left</td><td>Compares two values for equality</td></tr><tr><td>Result</td><td>Value assigned</td><td>Boolean value — true or false</td></tr><tr><td>Example</td><td><code class=\"inline\">x = 5;</code> (x becomes 5)</td><td><code class=\"inline\">x == 5</code> (true if x holds 5)</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int x = 5;\nif (x == 5)      // comparison — correct\n    System.out.println(\"Five\");\n\nif (x = 5)       // Compile-time error in Java: int cannot be used as a condition</code></pre></div><p>For objects such as Strings, <code class=\"inline\">==</code> compares <i>references</i> (addresses), not content — use <code class=\"inline\">equals()</code> to compare content.</p>"},{"id":"h1wzw2df","l":"r3","t":"Variables","v":"hard","q":"Differentiate between local, instance and static (class) variables.","a":"<p>Variables are classified according to <b>where they are declared</b> and how long they live.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Local variable</th><th>Instance variable</th><th>Static (class) variable</th></tr></thead><tbody><tr><td>Declared</td><td>Inside a method, constructor or block</td><td>Inside the class, outside all methods</td><td>Inside the class using <code class=\"inline\">static</code></td></tr><tr><td>Scope / life</td><td>Only within that method or block; destroyed when it ends</td><td>As long as the object exists</td><td>As long as the program (class) exists</td></tr><tr><td>Copies</td><td>One for each method call</td><td>A separate copy for every object</td><td>Only one copy shared by all objects</td></tr><tr><td>Default value</td><td>None — must be initialised before use</td><td>Yes (0, 0.0, false, null)</td><td>Yes (0, 0.0, false, null)</td></tr><tr><td>Accessed by</td><td>Within its own block only</td><td>Object name / this</td><td>Class name or object</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Demo {\n    int a;                 // instance variable\n    static int count;      // static variable\n\n    void show() {\n        int x = 10;        // local variable\n        System.out.println(x + a);\n    }\n}</code></pre></div>"},{"id":"h1mkmk3o","l":"r8","t":"Loops","v":"medium","q":"What is iteration? Name the loops available in Java.","a":"<p><b>Definition:</b> Iteration (looping) is the process of <b>repeating a statement or a block of statements</b> as long as a given condition remains true. It avoids writing the same code again and again.</p>\n<p>Every loop has four parts: <b>initialisation</b>, <b>test condition</b>, <b>update (increment/decrement)</b> and the <b>body</b>.</p>\n<p>Java provides three loops:</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>for (int i = 1; i &lt;= 5; i++)        // for loop — number of repetitions known\n    System.out.println(i);\n\nint j = 1;\nwhile (j &lt;= 5) {                     // while loop — entry-controlled\n    System.out.println(j);\n    j++;\n}\n\nint k = 1;\ndo {                                 // do-while loop — exit-controlled\n    System.out.println(k);\n    k++;\n} while (k &lt;= 5);</code></pre></div><p><b>Entry-controlled loops:</b> for, while (condition tested first). <b>Exit-controlled loop:</b> do-while (condition tested after the body).</p>"},{"id":"h4c6e5f","l":"r8","t":"Loops","v":"medium","q":"Differentiate between the 'break' and 'continue' statements.","a":"<p>Both are <b>jump statements</b> used inside loops, but they behave differently.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>break</th><th>continue</th></tr></thead><tbody><tr><td>Action</td><td>Terminates the loop (or switch) completely</td><td>Skips the remaining statements of the current iteration only</td></tr><tr><td>Control passes to</td><td>The statement after the loop</td><td>The next iteration (update / condition check)</td></tr><tr><td>Can be used in</td><td>Loops and switch</td><td>Loops only</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>for (int i = 1; i &lt;= 5; i++) {\n    if (i == 3) break;\n    System.out.print(i + \" \");\n}\n// Output: 1 2\n\nfor (int i = 1; i &lt;= 5; i++) {\n    if (i == 3) continue;\n    System.out.print(i + \" \");\n}\n// Output: 1 2 4 5</code></pre></div>"},{"id":"hj8n52w","l":"r8","t":"Loops","v":"medium","q":"Differentiate between the 'while' loop and the 'do-while' loop.","a":"<p>The <b>while</b> loop is an <b>entry-controlled</b> loop: the condition is checked first, so if it is false in the beginning the body never executes. The <b>do-while</b> loop is an <b>exit-controlled</b> loop: the body executes first and the condition is checked afterwards, so it executes <b>at least once</b>.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>while</th><th>do-while</th></tr></thead><tbody><tr><td>Type</td><td>Entry-controlled</td><td>Exit-controlled</td></tr><tr><td>Condition tested</td><td>Before the body</td><td>After the body</td></tr><tr><td>Minimum executions</td><td>Zero</td><td>One</td></tr><tr><td>Semicolon</td><td>Not required after the condition</td><td>Required: <code class=\"inline\">while(condition);</code></td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int n = 10;\nwhile (n &lt; 5) {\n    System.out.println(\"while\");      // never printed\n}\n\ndo {\n    System.out.println(\"do-while\");   // printed once\n} while (n &lt; 5);</code></pre></div>"},{"id":"hqwc7wp","l":"r8","t":"Loops","v":"medium","q":"What is an infinite loop? How can it occur? Give an example.","a":"<p><b>Definition:</b> An infinite loop is a loop whose <b>test condition never becomes false</b>, so the loop never terminates on its own.</p>\n<p><b>Common causes:</b></p>\n<ul>\n<li>The condition is always true, e.g. <code class=\"inline\">while(true)</code>.</li>\n<li>The update statement is missing (the loop variable is never changed).</li>\n<li>The update moves the variable in the wrong direction or jumps over the terminating value.</li>\n</ul><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>for (int i = 2; i != 0; i -= 3)   // i = 2, -1, -4, -7 ... never equals 0\n    System.out.println(i);\n\nint k = 1;\nwhile (k &lt;= 5) {\n    System.out.println(k);            // k++ is missing — infinite loop\n}</code></pre></div><p>A stray semicolon such as <code class=\"inline\">for(p = 4; p &gt; 0; p -= 2);</code> does not make the loop infinite — it only gives it an empty body.</p>"},{"id":"h6phnp6","l":"l2","t":"Library Classes","v":"medium","q":"What is a library class / package? Name any two packages with the classes they contain.","a":"<p><b>Library class:</b> A predefined class supplied with Java that contains ready-made methods, so that programmers do not have to write them again. <b>Package:</b> A collection (folder) of related classes.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Package</th><th>Important classes</th><th>Import needed?</th></tr></thead><tbody><tr><td><code class=\"inline\">java.lang</code></td><td>Math, String, Character, Integer, Double, System</td><td>No — imported automatically</td></tr><tr><td><code class=\"inline\">java.util</code></td><td>Scanner, ArrayList</td><td>Yes</td></tr><tr><td><code class=\"inline\">java.io</code></td><td>BufferedReader, InputStreamReader</td><td>Yes</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>import java.util.Scanner;     // needed for Scanner\n// no import needed for Math or String (java.lang)</code></pre></div>"},{"id":"hrje92f","l":"r6","t":"Math Library","v":"hard","q":"Name any six Math class methods with their purpose and return type.","a":"<p>The <code class=\"inline\">Math</code> class belongs to the <code class=\"inline\">java.lang</code> package. Its methods are <b>static</b>, so they are called as <code class=\"inline\">Math.methodName()</code>.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Method</th><th>Purpose</th><th>Example → Result</th></tr></thead><tbody><tr><td><code class=\"inline\">sqrt(x)</code></td><td>Square root (double)</td><td><code class=\"inline\">Math.sqrt(25)</code> → 5.0</td></tr><tr><td><code class=\"inline\">cbrt(x)</code></td><td>Cube root (double)</td><td><code class=\"inline\">Math.cbrt(-8)</code> → -2.0</td></tr><tr><td><code class=\"inline\">pow(x, y)</code></td><td>x raised to the power y (double)</td><td><code class=\"inline\">Math.pow(2, 3)</code> → 8.0</td></tr><tr><td><code class=\"inline\">abs(x)</code></td><td>Absolute value (same type as x)</td><td><code class=\"inline\">Math.abs(-7)</code> → 7</td></tr><tr><td><code class=\"inline\">ceil(x)</code></td><td>Smallest whole number ≥ x (double)</td><td><code class=\"inline\">Math.ceil(-4.2)</code> → -4.0</td></tr><tr><td><code class=\"inline\">floor(x)</code></td><td>Largest whole number ≤ x (double)</td><td><code class=\"inline\">Math.floor(-7.5)</code> → -8.0</td></tr><tr><td><code class=\"inline\">round(x)</code></td><td>Nearest whole number (long)</td><td><code class=\"inline\">Math.round(4.5)</code> → 5,  <code class=\"inline\">Math.round(-4.5)</code> → -4</td></tr><tr><td><code class=\"inline\">max(a, b)</code></td><td>Larger of two values</td><td><code class=\"inline\">Math.max(4, 9)</code> → 9</td></tr><tr><td><code class=\"inline\">min(a, b)</code></td><td>Smaller of two values</td><td><code class=\"inline\">Math.min(4, 9)</code> → 4</td></tr><tr><td><code class=\"inline\">random()</code></td><td>Random double, 0.0 ≤ r < 1.0</td><td><code class=\"inline\">Math.random()</code> → e.g. 0.37</td></tr></tbody></table></div><p><b>Traps:</b> <code class=\"inline\">Math.sqrt(-4)</code> gives <i>NaN</i>; <code class=\"inline\">Math.pow(36, 6/5)</code> evaluates 6/5 as integer division (=1) and returns 36.0.</p>"},{"id":"h3ns5f9","l":"l3","t":"Searching","v":"hard","q":"Differentiate between Linear Search and Binary Search.","a":"<p><b>Linear (sequential) search</b> compares the key with every element one by one from the beginning until it is found or the array ends. <b>Binary search</b> repeatedly divides a <b>sorted</b> array into halves and compares the key with the middle element, discarding one half each time.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Linear Search</th><th>Binary Search</th></tr></thead><tbody><tr><td>Array must be sorted?</td><td>No — works on any array</td><td>Yes — only on a sorted array</td></tr><tr><td>Method</td><td>Checks elements one after another</td><td>Compares with middle element and halves the range</td></tr><tr><td>Speed</td><td>Slow for large arrays</td><td>Very fast for large arrays</td></tr><tr><td>Comparisons (n elements)</td><td>Up to n</td><td>About log₂ n</td></tr><tr><td>Programming</td><td>Simple</td><td>Slightly complex</td></tr></tbody></table></div><p><b>Steps of binary search:</b> (1) low = 0, high = n − 1. (2) mid = (low + high) / 2. (3) If a[mid] = key → found. (4) If key &lt; a[mid], set high = mid − 1; otherwise low = mid + 1. (5) Repeat while low ≤ high; if low &gt; high the key is absent.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int low = 0, high = a.length - 1, mid;\nwhile (low &lt;= high) {\n    mid = (low + high) / 2;\n    if (key == a[mid]) break;\n    else if (key &lt; a[mid]) high = mid - 1;\n    else low = mid + 1;\n}</code></pre></div>"},{"id":"h18esiun","l":"l3","t":"Searching","v":"medium","q":"What are the best case and worst case of a Linear Search?","a":"<p>The efficiency of a search is measured by the <b>number of comparisons</b> required.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Case</th><th>Situation</th><th>Comparisons (n elements)</th></tr></thead><tbody><tr><td><b>Best case</b></td><td>Key is found at the very first position</td><td>1</td></tr><tr><td><b>Worst case</b></td><td>Key is at the last position or is not present at all</td><td>n</td></tr><tr><td><b>Average case</b></td><td>Key is somewhere in the middle</td><td>About n / 2</td></tr></tbody></table></div><p><b>Example:</b> In the array {5, 8, 3, 9}, searching for 5 needs 1 comparison (best case); searching for 9 needs 4 comparisons, and searching for 100 also needs 4 comparisons before concluding that it is absent (worst case).</p>"},{"id":"h1o5mjc5","l":"l3","t":"Sorting","v":"medium","q":"Explain the working of Bubble Sort with an example.","a":"<p><b>Definition:</b> Bubble sort is a sorting technique in which <b>adjacent elements are compared and swapped</b> if they are in the wrong order. In each pass the largest remaining element moves (\"bubbles\") to its correct position at the end. For n elements, n − 1 passes are needed.</p>\n<p><b>Example (ascending) on {5, 1, 4, 2}:</b></p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Pass</th><th>Comparisons and swaps</th><th>Array after the pass</th></tr></thead><tbody><tr><td>1</td><td>5↔1, 5↔4, 5↔2</td><td>1 4 2 5</td></tr><tr><td>2</td><td>1,4 ok; 4↔2</td><td>1 2 4 5</td></tr><tr><td>3</td><td>1,2 ok</td><td>1 2 4 5 (sorted)</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>for (int i = 0; i &lt; n - 1; i++) {             // passes\n    for (int j = 0; j &lt; n - 1 - i; j++) {     // comparisons\n        if (a[j] &gt; a[j + 1]) {                // wrong order → swap\n            int t = a[j];\n            a[j] = a[j + 1];\n            a[j + 1] = t;\n        }\n    }\n}</code></pre></div><p><b>Note:</b> After pass 1 the array is <i>not</i> fully sorted — only the largest element is in place.</p>"},{"id":"hqfgvrz","l":"l3","t":"Sorting","v":"hard","q":"Explain the working of Selection Sort with an example.","a":"<p><b>Definition:</b> In selection sort, the <b>smallest element of the unsorted part is selected</b> in each pass and <b>exchanged with the element at the first position of that part</b>. The sorted portion grows by one element every pass.</p>\n<p><b>Example (ascending) on {29, 10, 14, 37, 13}:</b></p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Pass</th><th>Smallest chosen</th><th>Array after the pass</th></tr></thead><tbody><tr><td>1</td><td>10 (swap with 29)</td><td>10 29 14 37 13</td></tr><tr><td>2</td><td>13 (swap with 29)</td><td>10 13 14 37 29</td></tr><tr><td>3</td><td>14 (already in place)</td><td>10 13 14 37 29</td></tr><tr><td>4</td><td>29 (swap with 37)</td><td>10 13 14 29 37</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>for (int i = 0; i &lt; n - 1; i++) {\n    int min = i;\n    for (int j = i + 1; j &lt; n; j++)\n        if (a[j] &lt; a[min]) min = j;      // find position of smallest\n    int t = a[i];  a[i] = a[min];  a[min] = t;   // swap once per pass\n}</code></pre></div><p><b>Difference from bubble sort:</b> Selection sort makes at most one swap per pass, whereas bubble sort may swap many adjacent pairs.</p>"},{"id":"h1cudull","l":"l5","t":"Methods","v":"medium","q":"What is a method signature?","a":"<p><b>Definition:</b> The signature of a method is made up of its <b>name and the list of parameter types</b> (their number, data types and order). The <b>return type is NOT a part of the signature</b>, and neither are the names of the parameters.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Method header</th><th>Signature</th></tr></thead><tbody><tr><td><code class=\"inline\">int add(int a, int b)</code></td><td><code class=\"inline\">add(int, int)</code></td></tr><tr><td><code class=\"inline\">double add(int a, int b)</code></td><td><code class=\"inline\">add(int, int)</code> (same as above → cannot both exist)</td></tr><tr><td><code class=\"inline\">void show(String s, int n)</code></td><td><code class=\"inline\">show(String, int)</code></td></tr><tr><td><code class=\"inline\">void show(int n, String s)</code></td><td><code class=\"inline\">show(int, String)</code> (different order → valid overload)</td></tr></tbody></table></div><p>Every method in a class must have a unique signature. Two methods with the same name are valid overloads only if their signatures are different — that is why <b>return type alone cannot overload a method</b>.</p>"},{"id":"h1qqtspa","l":"r5a","t":"Java Basics","v":"medium","q":"What is a token? Explain the different types of tokens with examples.","a":"<p><b>Definition:</b> A token is the <b>smallest individual unit</b> of a Java program that has a meaning for the compiler. The compiler breaks the source code into tokens while compiling.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Token</th><th>Meaning</th><th>Examples</th></tr></thead><tbody><tr><td>Keywords</td><td>Reserved words with a fixed meaning</td><td><code class=\"inline\">int</code>, <code class=\"inline\">class</code>, <code class=\"inline\">static</code>, <code class=\"inline\">if</code></td></tr><tr><td>Identifiers</td><td>Names given to variables, classes, methods</td><td>total, Student, calcArea</td></tr><tr><td>Literals</td><td>Constant values written in the program</td><td>25, 3.14, 'A', \"Java\", true</td></tr><tr><td>Operators</td><td>Symbols that perform operations</td><td><code class=\"inline\">+</code> <code class=\"inline\">-</code> <code class=\"inline\">*</code> <code class=\"inline\">&amp;&amp;</code> <code class=\"inline\">==</code></td></tr><tr><td>Separators (punctuators)</td><td>Symbols that separate or group code</td><td><code class=\"inline\">( ) { } [ ] ; ,</code></td></tr></tbody></table></div><p><b>Example:</b> The statement <code class=\"inline\">int sum = a + 10;</code> has the tokens: <i>int</i> (keyword), <i>sum</i> (identifier), <i>=</i> (operator), <i>a</i> (identifier), <i>+</i> (operator), <i>10</i> (literal), <i>;</i> (separator).</p>"},{"id":"h6h6bbe","l":"r5a","t":"Java Basics","v":"medium","q":"Differentiate between a Keyword and an Identifier.","a":"<p>A <b>keyword</b> is a reserved word whose meaning is already defined by the Java language. An <b>identifier</b> is a name chosen by the programmer for a variable, class, method or array.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Keyword</th><th>Identifier</th></tr></thead><tbody><tr><td>Defined by</td><td>Java language (reserved)</td><td>Programmer</td></tr><tr><td>Can be used as a variable name?</td><td>No</td><td>Yes</td></tr><tr><td>Number</td><td>Fixed set of words</td><td>Unlimited</td></tr><tr><td>Examples</td><td><code class=\"inline\">int</code>, <code class=\"inline\">void</code>, <code class=\"inline\">new</code>, <code class=\"inline\">static</code></td><td>salary, Student, calcTotal</td></tr></tbody></table></div><p>Identifiers cannot be keywords, cannot start with a digit, cannot contain spaces or special characters (other than <b>_</b> and <b>$</b>), and are case-sensitive.</p>"},{"id":"hbnrsg4","l":"l6","t":"Static","v":"hard","q":"What is the use of the 'static' keyword? Explain static variables and static methods.","a":"<p><b>Definition:</b> <code class=\"inline\">static</code> declares a member that belongs to the <b>class itself rather than to any individual object</b>. It can be accessed using the class name without creating an object.</p>\n<ul>\n<li><b>Static variable (class variable):</b> only one copy exists in memory and it is <b>shared by all objects</b>. A change made through one object is visible to all.</li>\n<li><b>Static method:</b> can be called without an object and can directly access only static members. It cannot use <code class=\"inline\">this</code> or directly use instance variables.</li>\n</ul><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Counter {\n    static int count = 0;          // shared by all objects\n    Counter() { count++; }\n    static void show() {           // called as Counter.show()\n        System.out.println(count);\n    }\n}\n// After creating 3 objects: Counter.show() prints 3</code></pre></div><p>The <code class=\"inline\">main()</code> method is declared <code class=\"inline\">static</code> so the JVM can call it before any object exists.</p>"},{"id":"hrn0hzv","l":"r5b","t":"Output","v":"medium","q":"Differentiate between System.out.print() and System.out.println().","a":"<p>Both statements display output on the screen. The difference is in what happens to the cursor afterwards.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>print()</th><th>println()</th></tr></thead><tbody><tr><td>Cursor</td><td>Stays on the same line after printing</td><td>Moves to the next line after printing</td></tr><tr><td>Next output</td><td>Continues on the same line</td><td>Starts on a new line</td></tr><tr><td>Without argument</td><td>Not allowed</td><td>Allowed — prints a blank line</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>System.out.print(\"Hello \");\nSystem.out.print(\"World\");\nSystem.out.println(\"!\");\nSystem.out.println(\"Java\");\n// Output:\n// Hello World!\n// Java</code></pre></div>"},{"id":"h1bqfd0","l":"l6","t":"Memory","v":"medium","q":"What is garbage collection in Java?","a":"<p><b>Definition:</b> Garbage collection is the <b>automatic process by which the JVM frees the memory occupied by objects that are no longer in use</b> (no reference variable points to them). The part of the JVM that does this is called the garbage collector.</p>\n<p>An object becomes eligible for garbage collection when its reference is reassigned or set to <code class=\"inline\">null</code>, or when the reference variable goes out of scope.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>Student s = new Student();   // object created\ns = null;                     // no reference remains → eligible for garbage collection</code></pre></div><p><b>Advantage:</b> The programmer need not release memory manually (unlike languages such as C/C++), which prevents memory leaks. The programmer cannot force the exact moment of collection.</p>"},{"id":"httb23q","l":"l3","t":"Arrays","v":"medium","q":"Differentiate between a one-dimensional and a two-dimensional array.","a":"<p>An array is a collection of variables of the <b>same data type</b> stored under one name. Its elements are accessed with a subscript (index) that starts from 0.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>1-D array</th><th>2-D array</th></tr></thead><tbody><tr><td>Structure</td><td>A single row (list) of elements</td><td>A table of rows and columns (matrix)</td></tr><tr><td>Subscripts</td><td>One: <code class=\"inline\">a[i]</code></td><td>Two: <code class=\"inline\">a[i][j]</code></td></tr><tr><td>Declaration</td><td><code class=\"inline\">int a[] = new int[5];</code></td><td><code class=\"inline\">int a[][] = new int[3][4];</code></td></tr><tr><td>Elements</td><td>5</td><td>3 × 4 = 12</td></tr><tr><td>Traversal</td><td>One loop</td><td>Nested loops</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int a[][] = new int[3][4];\nfor (int i = 0; i &lt; a.length; i++)          // rows    → a.length\n    for (int j = 0; j &lt; a[0].length; j++)   // columns → a[0].length\n        System.out.print(a[i][j] + \" \");</code></pre></div>"},{"id":"hx03vdo","l":"l4","t":"Strings","v":"medium","q":"Why are Strings in Java called immutable?","a":"<p><b>Immutable</b> means <b>cannot be changed</b>. Once a String object has been created, its contents can never be modified. Methods such as <code class=\"inline\">toUpperCase()</code>, <code class=\"inline\">substring()</code>, <code class=\"inline\">replace()</code> and <code class=\"inline\">concat()</code> do not change the original String — they <b>return a new String</b>.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>String s = \"Hello\";\ns.concat(\" World\");            // result is created but thrown away\nSystem.out.println(s);         // Hello  (original unchanged)\n\ns = s.concat(\" World\");        // store the new String back\nSystem.out.println(s);         // Hello World</code></pre></div><p><b>Exam tip:</b> If a question asks for the output after calling a String method without storing its result, the original value is printed.</p>"},{"id":"h9gpnr2","l":"l3","t":"Arrays & Strings","v":"medium","q":"Differentiate between length and length().","a":"<p>Both give a size, but they are used with different things.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>length</th><th>length()</th></tr></thead><tbody><tr><td>Kind</td><td>Property (data member)</td><td>Method</td></tr><tr><td>Used with</td><td>Arrays</td><td><code class=\"inline\">String</code> objects</td></tr><tr><td>Brackets</td><td>Not written</td><td>Written</td></tr><tr><td>Returns</td><td>Number of elements in the array</td><td>Number of characters in the string</td></tr><tr><td>Example</td><td><code class=\"inline\">arr.length</code></td><td><code class=\"inline\">s.length()</code></td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int arr[] = {4, 8, 1};\nString s = \"Java\";\nSystem.out.println(arr.length);   // 3\nSystem.out.println(s.length());   // 4\n// last index of array = arr.length - 1\n// last character     = s.charAt(s.length() - 1)</code></pre></div><p>For a 2-D array <code class=\"inline\">a</code>: <code class=\"inline\">a.length</code> = number of rows, <code class=\"inline\">a[0].length</code> = number of columns.</p>"},{"id":"hpaeznu","l":"l4","t":"Strings","v":"medium","q":"Differentiate between '==' and equals() when comparing Strings.","a":"<p><code class=\"inline\">==</code> compares the <b>references (memory addresses)</b> of two objects, while <code class=\"inline\">equals()</code> compares the <b>actual characters</b> (contents) of the Strings.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>==</th><th>equals()</th></tr></thead><tbody><tr><td>Type</td><td>Operator</td><td>Method of the String class</td></tr><tr><td>Compares</td><td>Address / reference</td><td>Content of the strings</td></tr><tr><td>Returns</td><td>true / false</td><td>true / false</td></tr><tr><td>Case</td><td>—</td><td>Case-sensitive (use <code class=\"inline\">equalsIgnoreCase()</code> to ignore case)</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>String a = \"Java\";\nString b = new String(\"Java\");\nSystem.out.println(a == b);        // false  (different objects)\nSystem.out.println(a.equals(b));   // true   (same content)</code></pre></div><p><b>Rule:</b> Always use <code class=\"inline\">equals()</code> to compare the content of Strings.</p>"},{"id":"h11vjug1","l":"l4","t":"Strings","v":"medium","q":"Differentiate between equals() and compareTo().","a":"<p>Both compare the contents of two Strings, but the type and meaning of the result are different.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>equals()</th><th>compareTo()</th></tr></thead><tbody><tr><td>Return type</td><td>boolean</td><td>int</td></tr><tr><td>Result</td><td>true if the strings are identical, otherwise false</td><td>0 if equal; negative if the calling string is smaller; positive if larger</td></tr><tr><td>Purpose</td><td>Test equality</td><td>Compare alphabetically (lexicographic order) — used in sorting</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>\"ANGER\".compareTo(\"ANGEL\")   // 'R' - 'L' = 82 - 76 = 6\n\"Apple\".compareTo(\"Banana\")   // 'A' - 'B' = 65 - 66 = -1\n\"Java\".compareTo(\"Java\")      // 0</code></pre></div><p>The value returned by <code class=\"inline\">compareTo()</code> is the difference between the Unicode values of the first unequal characters (or the difference in lengths if one string is a prefix of the other).</p>"},{"id":"ht3k3xp","l":"l5","t":"Methods","v":"medium","q":"Differentiate between pure and impure methods.","a":"<p>A <b>pure method</b> does not change the state of the object — it does not modify the instance variables; it only uses its arguments to compute and return a result. An <b>impure (mutator) method</b> changes the value of one or more instance variables of the object.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Pure method</th><th>Impure method</th></tr></thead><tbody><tr><td>Effect on object</td><td>Leaves instance variables unchanged</td><td>Changes instance variables</td></tr><tr><td>Typical use</td><td>Calculating and returning values</td><td>Setting / updating data</td></tr><tr><td>Side effects</td><td>None</td><td>Yes</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>class Student {\n    int marks;\n\n    int square(int n) {          // pure: only uses its argument\n        return n * n;\n    }\n    void setMarks(int m) {       // impure: changes an instance variable\n        marks = m;\n    }\n}</code></pre></div>"},{"id":"hf9svtx","l":"l5","t":"Methods","v":"medium","q":"Differentiate between call by value and call by reference.","a":"<p>These are two ways of passing arguments to a method.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Call by value</th><th>Call by reference</th></tr></thead><tbody><tr><td>What is passed</td><td>A copy of the value</td><td>The reference (address) of the object / array</td></tr><tr><td>Used for</td><td>Primitive data types (int, double, char…)</td><td>Objects and arrays</td></tr><tr><td>Effect of changes inside the method</td><td>Original variable is NOT changed</td><td>Original object / array IS changed</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>void change(int n)   { n = n * 2; }     // works on a copy\nvoid change(int a[]) { a[0] = 99; }       // works on the same array\n\nint x = 5;   change(x);        // x is still 5\nint arr[] = {1, 2, 3};   change(arr);     // arr[0] is now 99</code></pre></div>"},{"id":"hhg8ka0","l":"r3","t":"Data Types","v":"medium","q":"Differentiate between primitive and non-primitive (reference) data types.","a":"<p><b>Primitive data types</b> are the basic built-in types of Java that store a single simple value directly. <b>Non-primitive (reference) data types</b> are created by the programmer or supplied as classes and store the <b>address (reference)</b> of an object.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Primitive</th><th>Non-primitive</th></tr></thead><tbody><tr><td>Examples</td><td>byte, short, int, long, float, double, char, boolean</td><td>String, arrays, classes, objects</td></tr><tr><td>Stores</td><td>The actual value</td><td>Reference to the object</td></tr><tr><td>Defined by</td><td>Java (built-in)</td><td>User / class library</td></tr><tr><td>Default value</td><td>0, 0.0, false…</td><td>null</td></tr><tr><td>Methods</td><td>Have no methods</td><td>Can have methods</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int n = 10;                  // primitive\nString s = \"Java\";           // non-primitive (object of String class)\nint a[] = {1, 2, 3};         // non-primitive (array)</code></pre></div>"},{"id":"h13wsuhu","l":"r4","t":"Operators","v":"medium","q":"What is the ternary operator? Explain with an example.","a":"<p><b>Definition:</b> The ternary (conditional) operator <code class=\"inline\">? :</code> is the only Java operator that takes <b>three operands</b>. It is a short form of the if-else statement.</p>\n<p><b>Syntax:</b> <code class=\"inline\">variable = condition ? value_if_true : value_if_false;</code></p>\n<p>If the condition is true the expression before the colon is evaluated; otherwise the expression after the colon is used.</p><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>// if-else version\nif (a &gt; b) z = 25;\nelse       z = 35;\n\n// ternary version\nz = a &gt; b ? 25 : 35;\n\nString idStatus = (age &gt; 10) ? \"Eligible\" : \"Not Eligible\";\nSystem.out.println(idStatus);</code></pre></div><p><b>Nested ternary:</b> <code class=\"inline\">c = a &gt; b ? a : b &gt; 8 ? 100 : 200;</code> — if a &gt; b is false, the second ternary is evaluated.</p>"},{"id":"h16h7k45","l":"r4","t":"Operators","v":"medium","q":"Differentiate between prefix and postfix increment/decrement operators.","a":"<p>Both <code class=\"inline\">++</code> and <code class=\"inline\">--</code> can be written before (prefix) or after (postfix) the variable. The difference is in <b>when</b> the value changes relative to its use in the expression.</p><div class=\"tablewrap\"><table class=\"ref\"><thead><tr><th>Basis</th><th>Prefix (++a, --a)</th><th>Postfix (a++, a--)</th></tr></thead><tbody><tr><td>Order</td><td>Changes the value first, then uses it</td><td>Uses the current value first, then changes it</td></tr><tr><td>Value in expression</td><td>New value</td><td>Old value</td></tr></tbody></table></div><div class=\"codeblock\"><div class=\"cb-head\"><span>JAVA</span><button class=\"copy-btn\" type=\"button\">Copy</button></div><pre><code>int a = 5;\nint b = ++a;     // a becomes 6 first → b = 6, a =
